     （places / rules 就踩过这个坑，已从 staticFileFor 移除。）

   ★ 兜底：静态读失败（文件没传上去 / 签名过期 / 离线）自动回落 CF，
     页面不会因为静默切源而变空白。

   配置方式（三选一）：
     1. ?static=https://xxx.cos.ap-guangzhou.myqcloud.com/dashboard   强制指定
     2. 页面里 STATIC_API 常量（构建时可由脚本写入签名 URL 前缀）
     3. ?static=off  显式关闭，全走 CF（排查用）
   ========================================================= */
const STATIC_API = "https://steward-1492368302.cos.ap-guangzhou.myqcloud.com/dashboard";   // ← 部署后由 build/deploy 写入，或在 ?static= 里传
const STATIC_BASE = (() => {
  if (window.SHARE_CFG) return String(window.SHARE_CFG.staticBase || "").replace(/\/$/, "");
  const s = QS.get("static");
  if (s === "off" || s === "0") return "";            // 显式关闭
  if (s) return s.replace(/\/$/, "");                  // URL 指定（优先级最高）
  return (STATIC_API || "").replace(/\/$/, "");        // 页面常量
})();
/* 本地打开且没显式指定 ?static= 时，不用静态源 —— 本地 API 本来就是本机、
   又快又全（还带写操作），没必要绕去云端静态。但要允许显式 ?static= 覆盖，
   否则在宿舍想单独测静态源都测不了。 */
const STATIC_FORCED = !!QS.get("static") && QS.get("static") !== "off" && QS.get("static") !== "0";
const USE_STATIC = !!STATIC_BASE && !MOCK;

/* 只读接口 → 静态文件路径。返回 null 表示"这个不走静态"（走 CF）。
   ★★ 2026-09-20 修：**places / rules 曾经也在这里 —— 那是错的，已移除。**
   它们是**用户会改的数据**（给地点改名、改分类、改显示名、隐藏应用），
   一改就写进 D1/KV；而静态 JSON 只有跑 build_static.py 才重算。
   于是「改完立刻回读」读到的是**上一版静态文件** → 用户看到「我改了宿舍，
   它自己变回学校」。真源是对的、显示是旧的，这就是那个 bug 的全部。
   规矩（写进文档）：**能被用户写的数据，读取一律走 CF；静态层只放纯只读。**
   places/rules 两个包都很小（几 KB），走 CF 的延迟代价可以忽略。 */
function staticFileFor(qs) {
  const api = qs.get("api");
  const d = qs.get("d");
  const todayStr = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
  // ★ 铁规矩：当天数据随时都在变化（称重录入、拍餐记账、手环步数），绝不走静态死文件，必须直连云端
  if (api === "day") {
    if (d && d >= todayStr) return null;
    return "day/" + d + ".json";
  }
  if (api === "trend") return "trend.json";
  if (api === "sessions") return "sessions.json";
  if (api === "apps") return "apps.json";
  /* ★ 分享快照（2026-09-22）：rules / places / 日报在快照里是**冻结的文件**，
     读取直接走静态 —— 分享页没有可用的 k，CF 那条路整个不通（apiGet 有硬拦截）。
     正式看板维持原规矩（能被用户写的数据走 CF）：快照无所谓，
     它没有"改完立刻回读"，读到冻结版恰恰是想要的。 */
  if (SHARE) {
    if (api === "rules") return "rules.json";
    if (api === "places") return "places.json";
    if (api === "report") return "report/" + qs.get("d") + ".json";
  }
  return null;   // places / rules / report / count / ask / 写操作 … 一律走 CF
}

/* 统一取数入口。静态优先，失败回落 CF —— 保证功能不变。
   ★ 分享模式下**硬拦截**：绝不回落 CF。分享页的 k 缺省值虽然是真 key，
   但那也绝不能让朋友的浏览器拿着它说话 —— 覆盖不到的接口一律就地返回错误。 */
async function apiGet(qs, opt = {}) {
  const forceFresh = !!(opt && opt.forceFresh);
  const rel = (USE_STATIC && !forceFresh) ? staticFileFor(qs) : null;
  const api = qs && typeof qs.get === "function" ? qs.get("api") : null;
  const d = qs && typeof qs.get === "function" ? qs.get("d") : null;
  const todayStr = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
  // ★ 2026-10-03 (v0.20.1) 读配额防御：
  // 历史日期（d < today）与长周期趋势/会话属于已固化数据，放开浏览器与 CDN 缓存（cache: "default"）；
  // 当天数据、记忆全量、规则修改等可变接口严格保持 cache: "no-store" 保证实时性。
  const isCacheable = !forceFresh && ((api === "day" && d && d < todayStr) || api === "sessions");
  const fetchOpt = isCacheable ? { cache: "default" } : { cache: "no-store" };
  if (rel) {
    try {
      /* ★ 分享模式：make_share 注入的 staticBase 已以 "&f=" 结尾，直接拼 rel，
         不用再加斜杠（否则变成 &f=/day/… 让 worker 查不到）。非分享模式仍是普通路径拼接。 */
      const staticUrl = STATIC_BASE + (SHARE ? "" : "/") + rel;
      const r = await fetchWithTimeout(staticUrl, fetchOpt, 3500);
      if (r.ok) return await r.json();
      console.warn("[static] " + rel + " -> HTTP " + r.status + "，回落云端活跃通道");
    } catch (e) {
      console.warn("[static] " + rel + " 读取失败，回落云端活跃通道：" + (e ? e.message : e));
    }
  }
  if (SHARE) return { error: "share" };   // ★ 分享页红线：一个字节都不许流向 CF

  // 双轨通道容灾重试逻辑
  const primaryLane = BASE;
  const alternateLane = (primaryLane === SCF_API) ? CLOUD_API : SCF_API;
  const candidateLanes = QS.get("base") ? [primaryLane] : [primaryLane, alternateLane];

  let lastErr = null;
  for (let i = 0; i < candidateLanes.length; i++) {
    const lane = candidateLanes[i];
    const url = lane + "/?" + qs;
    try {
      const r = await fetchWithTimeout(url, fetchOpt, 3500);
      if (r.status === 403) {
        if (api !== "telemetry") {
          showKeyBanner("口令不对或已更换 —— 看板读不到数据。"
            + "用最新那条带 ?k= 的链接打开一次就会记住，之后正常。");
        }
      }
      if (!r.ok) {
        if (r.status >= 500 || r.status === 408) {
          throw new Error("HTTP " + r.status + " from " + lane);
        }
        return await r.json();
      }
      const data = await r.json();
      if (lane !== BASE) {
        console.info("[failover] 自动切换优选通道 -> " + lane);
        updateActiveLane(lane);
      }
      return data;
    } catch (err) {
      lastErr = err;
      console.warn("[apiGet] 通道请求失败 (" + lane + "):", err ? err.message : err);
    }
  }
  throw lastErr || new Error("All lanes failed");
}

function roundMacro(n) {

function formatBeijingTime(val) {
  if (!val) return "暂无上报";
  const s = String(val).trim();
  if (/^\d{2}:\d{2}$/.test(s)) return s;
  if (/^\d{2}:\d{2}:\d{2}$/.test(s)) return s.slice(0, 5);
  let d;
  if (!isNaN(Number(s)) && Number(s) > 1e9) {
    d = new Date(Number(s) > 1e11 ? Number(s) : Number(s) * 1000);
  } else if (s.includes("T") || s.endsWith("Z")) {
    d = new Date(s);
  } else if (s.includes(" ")) {
    d = new Date(s.replace(" ", "T") + "+08:00");
  } else {
    d = new Date(s);
  }
  if (isNaN(d.getTime())) return s;
  const bjMs = d.getTime() + (d.getTimezoneOffset() * 60 * 1000) + (8 * 3600 * 1000);
  const bj = new Date(bjMs);
  const hh = String(bj.getHours()).padStart(2, "0");
  const mm = String(bj.getMinutes()).padStart(2, "0");
  return `${hh}:${mm}`;
}
window.formatBeijingTime = formatBeijingTime;

/* ------------------ 分类规则：读 / 存 ------------------
   存两处：
     · 服务端（本地 rules.json / 云端 KV）—— 手机和电脑共用同一份
     · localStorage —— 服务端读不到时的兜底（静态打开的页面也能用你上次保存的）
   读的顺序：服务端 → localStorage → 内置默认。 */
const RULES_LS = "steward.rules.v1";
/* ★ 2026-09-19 晚新增（用户：「每次的设置（比如对于 msedge 的改名）确保上云保存，
   现在额度不够可能没有效果，以后有额度的时候有用的」）。
   `RULES_DIRTY` = 「本地这份比云端新，还没推上去」。

   ⚠️ 为什么必须有它：`loadRules()` 原来是**无条件**用服务端的数据 applyRules 覆盖本地。
   于是——保存失败（网络断 / 服务端 500）时，本地已经改了，
   可**下一次打开页面，服务端的旧数据把本地覆盖回去**，用户的改动**静默消失**。
   旧注释里写「已存在本机浏览器里，本机照常生效」是**错的**，它只活到下次刷新为止。

   现在的语义：只要 dirty 没清掉，就**以本地为准**，并且每次打开都试着往云端推一次
   —— 于是「今天没额度、明天有额度」这种情况，明天一打开就自动补上了。 */
const RULES_DIRTY = "steward.rules.dirty";
function markDirty(on) {
  try {
    if (on) localStorage.setItem(RULES_DIRTY, "1");
    else localStorage.removeItem(RULES_DIRTY);
  } catch (e) {}
}
function isDirty() {
  try { return localStorage.getItem(RULES_DIRTY) === "1"; } catch (e) { return false; }
}

/* ★ 2026-09-20：通用「写队列」。用户原话：「我可以忍受写的慢但是要保证能写」。
   背景：写操作一律走 CF（跨境，慢且会抖）。`rules` 早就有「本地优先+脏标记+重推」，
   但 place / place_del / fact_del 是**裸 fetch**——失败就丢，只弹一句提示，不重试，
   用户以为存上了其实没有。这里补上统一机制：

     · 发请求 → 成功就完事
     · 失败（没网/超时/5xx/服务端整理）→ 把这笔写**原样入队**（localStorage 持久化）
     · 每次「页面变可见」+ 每 3 分钟，把队列里的 job 依次重推，成功一个出队一个

   ⚠️ 幂等性：三个服务端接口都是幂等的（namePlace 是 UPSERT；两个 DELETE 重复执行结果一致），
      所以重推安全。**唯一要小心的是「删除成功后响应丢了」**——重推时服务端会说
      `ok:false`（因为已经没得删了）。这种情况必须**当成成功**，否则这笔写永远卡在队列里
      每 3 分钟空转一次。判据见 `isDeleteDone()`。 */
const WQ_LS = "steward.writeq.v1";
function wqLoad() {
  try { const t = localStorage.getItem(WQ_LS); const a = t ? JSON.parse(t) : []; return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function wqSave(list) {
  /* ★ 2026-10-31：保留**最新**的 50 条。原来 slice(0, 50) 留的是最老的 50 条，
     等于「队列一满，用户最新的写反而被丢掉」，与「保证能写」的初衷正好相反。 */
  try { localStorage.setItem(WQ_LS, JSON.stringify(list.slice(-50))); } catch (e) {}
}
function wqCount() { return wqLoad().length; }
/* 入队去重：同一发**同一份 body** 只留一笔（用户连点两下不该变成两条记忆/两次删除）。
   key = api + 规范化后的 body。 */
function wqPush(api, body) {
  const list = wqLoad();
  const k = api + "|" + JSON.stringify(body || {});
  if (!list.some((x) => (x.api + "|" + JSON.stringify(x.body || {})) === k)) {
    /* ★ 2026-10-31：入队必须带**唯一 id**。
       原来 push 的是 { api, body, ts } —— 没有 id，于是 `wqDrop(job.id)` 收到 undefined，
       `filter(x => x.id !== id)` 变成 `filter(x => x.id !== undefined)`：
       成功一笔就把**所有无 id 的 job 一起删光**；失败那笔反而被 wqSave 整表写回，
       整批「复活」。id 用 ts + 随机后缀，保证同一毫秒内连推两笔也唯一。 */
    list.push({ id: "j" + Date.now() + "_" + Math.random().toString(36).slice(2, 8), api: api, body: body || {}, ts: Date.now() });
    wqSave(list);
  }
  wqBadge();
}
function wqDrop(id) {
  wqSave(wqLoad().filter((x) => x.id !== id));
  wqBadge();
}
/* 页脚那个「待同步 N」小提示。计数为 0 时整条隐藏，不打扰。 */
function wqBadge() {
  const n = wqCount();
  const el = document.getElementById("wqBadge");
  const sep = document.getElementById("wqSep");
  if (!el) return;
  if (n > 0) {
    el.textContent = "待同步 " + n;
    el.style.display = "";
    if (sep) sep.style.display = "";
  } else {
    el.style.display = "none";
    if (sep) sep.style.display = "none";
  }
}
/* 删除类操作「其实已经成功」的判据：
   job 重推 ≥2 次（说明上次那条可能已经落了），此时服务端说 ok:false = 没得删 = 目标达成。
   第一次失败（重试次数 0）时的 ok:false 有可能是权限/参数问题，**不能**当成功。 */
function isDeleteDone(job, j) {
  return (job.retry || 0) >= 1 && !(j && j.ok);
}
/* ★ 2026-10-31：wqFlush 的 in-flight 闸门（风格同 fetchTelemetry 的 _telemetryFetching）。
   ⚠️ 为什么必须有：三个调用点（08_gestures.js 的启动、visibilitychange、3 分钟定时器）
   可能并发进来，各自 wqLoad 快照、各自 wqSave 整表 —— 后写覆盖前写，
   已经出队的 job 会被别的流程的旧快照写回队列（复活），或刚推成功的那笔被抹掉。
   串行化之后同一时刻只有一轮在跑，其余直接返回；下一轮由定时器/事件自然触发。 */
let _wqFlushing = false;
async function wqFlush() {
  if (_wqFlushing) return;
  _wqFlushing = true;
  try {
    const list = wqLoad();
    if (!list.length) return;
    for (const job of list) {
      let ok = false, done = false, j = null;
      try {
        const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=" + job.api, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(job.body),
        });
        j = await r.json().catch(() => ({}));
        ok = !!(j && (j.ok || j.msg));
        done = ok || (job.api === "place_del" || job.api === "fact_del") && isDeleteDone(job, j);
      } catch (e) { ok = false; done = false; }
      if (done) { wqDrop(job.id); continue; }
      job.retry = (job.retry || 0) + 1;
      wqSave(list);        // 保守：这笔先留着，下轮再试
    }
  } finally {
    _wqFlushing = false;
  }
}
/* 补号：老版本入队的 job 可能没有 id（用 ts 兜底），保证 wqDrop 能唯一命中 */
function wqNormalize() {
  const list = wqLoad();
  let changed = false;
  list.forEach((x, i) => { if (!x.id) { x.id = "j" + (x.ts || Date.now()) + "_" + i; changed = true; } });
  if (changed) wqSave(list);
}

function loadRulesLocal() {
  try {
    const t = localStorage.getItem(RULES_LS);
    if (t) { applyRules(JSON.parse(t)); return true; }   // 返回"本地有没有存过规则"
  } catch (e) { /* 忽略 */ }
  return false;
}
function applyRules(obj) {
  if (!obj || typeof obj !== "object") return;
  RULES = {
    cats: obj.cats && typeof obj.cats === "object" ? obj.cats : {},
    names: obj.names && typeof obj.names === "object" ? obj.names : {},
    hidden: Array.isArray(obj.hidden) ? obj.hidden : NOISE_DEFAULT.slice(),
    colors: obj.colors && typeof obj.colors === "object" ? obj.colors : {},
    extra: Array.isArray(obj.extra) ? obj.extra : [],
    del: Array.isArray(obj.del) ? obj.del : [],
    show: obj.show && typeof obj.show === "object" ? obj.show : {},
    // 足迹页（9-19）：placeColors 自定义地点色，placeHide 要忘掉的未知位置（存坐标，
    // 300m 内匹配 —— 簇心会随新数据漂移，存坐标比存索引抗漂移）
    placeColors: obj.placeColors && typeof obj.placeColors === "object" ? obj.placeColors : {},
    placeHide: Array.isArray(obj.placeHide) ? obj.placeHide : [],
  };
}
async function loadRules() {
  const hadLocal = loadRulesLocal();      // 先用缓存渲染，别让页面空着
  /* ★ 分享模式：读取顺序翻转 —— **他的 localStorage 优先**。
     他第一次打开（本地还没有）才用快照里的规则（你的分类/配色）打底；
     之后他自己改过的颜色、隐藏的图层，绝不能被快照刷回去。 */
  if (SHARE) {
    if (hadLocal) return;
    try {
      const j = await apiGet(new URLSearchParams({ k: KEY, api: "rules" }));
      if (j && !j.error && Object.keys(j).length) applyRules(j);
    } catch (e) { /* 快照里没有就算了 */ }
    return;
  }
  // ★ 本地有未推上去的改动 → **以本地为准**，并先把本地推上云端（成功才清 dirty）。
  if (isDirty()) {
    saveRules().catch(() => {});
    return;
  }
  const syncCloudRules = async () => {
    try {
      const j = await apiGet(new URLSearchParams({ k: KEY, api: "rules" }));
      if (j && !j.error && Object.keys(j).length) {
        applyRules(j);
        try { localStorage.setItem(RULES_LS, JSON.stringify(RULES)); } catch (e) {}
      }
    } catch (e) { /* 服务端读不到就用缓存 */ }
  };
  // ★ 2026-10-07 (v0.28.0) 极速开屏：若本地已有规则（绝大多数正常打开情况），
  // 在后台异步静默校验，不阻塞首屏渲染与开屏动画撤销！
  if (hadLocal) {
    syncCloudRules();
    return;
  }
  await syncCloudRules();
}
async function saveRules() {
  try { localStorage.setItem(RULES_LS, JSON.stringify(RULES)); } catch (e) {}
  /* ★ 分享模式：只写他的本机，一个字节都不同步 —— 交互照常，云端与他无关。 */
  if (SHARE) return "分享模式：改动只保存在这台设备上";
  // 先标脏：**在发请求之前**。万一请求发出去就断网（catch 都进不去），
  // 标记也已经落下了，不会出现「改了但既没推上去、又没标脏」的漏网情况。
  markDirty(true);
  try {
    const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=rules", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },   // 简单请求，避免 OPTIONS 预检
      body: JSON.stringify(RULES),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) {
      return "存到服务端失败：" + (j.error || ("HTTP " + r.status))
        + "（已存在本机，不会丢；下次打开会自动重试上云）";
    }
    markDirty(false);          // 真推上去了才敢清
    return "已保存";
  } catch (e) {
    return "存到服务端失败：" + e.message + "（已存在本机，不会丢；下次打开会自动重试上云）";
  }
}

/* ------------------ 分类页：应用清单 + 交互 ------------------ */
let APPLIST = null;      // 出现过、按时长排序的应用清单
let catQuery = "";       // 分类页的搜索词（单独存，免得重渲染时丢）

async function loadApps() {
  if (APPLIST) return APPLIST;
  try {
    const j = await apiGet(new URLSearchParams({ k: KEY, api: "apps", n: 150 }));
    APPLIST = (j && j.apps) || [];
  } catch (e) {
    APPLIST = [];
  }
  return APPLIST;
}

/* 改完之后的收尾：**一律自动保存**（防抖 400ms）。

   ★★ 2026-09-21 修 —— 这里原来按场景分两条路：
        · 快捷设置弹层（catScope === "pop"）→ 自动保存
        · 时间线里的分类面板（catScope === "page"）→ 只 render()，留给最底下的「保存」按钮
      后果：**页面面板里改什么都不保存，一个请求都不发**。真浏览器实测：改完颜色
      `RULES.colors` 在内存里确实变了，但 `api=rules` 的 POST 次数 = **0**；点一下保存才变 1。
      而那个「保存」按钮在面板**最底部** —— 实测离第一个色块 **7599 像素**
      （中间夹着最多 150 行应用清单），用户根本找不到它，于是感受就是
      「颜色设了没法保存，一刷新就复原」。
      这一处收尾被 **4 个入口共用**（改颜色 / 改类别 / 显隐开关 / 改显示名），
      所以 4 个全都中招 —— 这不是颜色独有的毛病。

   ★ 还有一层：**「按 catScope 判」这个判据本身就是坏的**。`render()` 结尾会把
     catScope 重置成 "page"（见时间线页那段），而 afterCatChange() 又会调 render()
     —— 于是弹层里改**第二下**就不走自动保存那条路了。变量会被别人改掉，不能当判据。
     现在改成看 **DOM 状态**（`#pop` 有没有 `.on`），那才是「弹层开着吗」的唯一真相。

   改完就存，不需要用户去找按钮。「保存」按钮保留（手动立即存 + 状态显示），
   但已不再是「不点就丢」的坑。 */
let popKey = null, saveTimer = null;

function afterCatChange() {
  // 弹层开着时，弹层内容也就地刷新一遍（判 DOM，不判变量）
  const pop = $("#pop");
  if (pop && pop.classList.contains("on") && popKey) openAppEdit(popKey);
  scheduleSave();               // 改完就存（防抖）—— 页面上 / 弹层里一视同仁
  render();                     // 页面（时间线）也跟着变，能立刻看到效果
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setCatMsg("保存中…");
  saveTimer = setTimeout(async () => {
    const msg = await saveRules();
    setCatMsg(/已保存/.test(msg) ? "已保存" : msg);
  }, 400);
}

/* 状态文字。页面面板和弹层里各有一个 id="catmsg"（可能同时存在），
   所以**全部**都写上，别只改 `$("#catmsg")` 抓到的第一个。 */
function setCatMsg(t) {
  document.querySelectorAll("#catmsg").forEach((el) => { el.textContent = t; });
}

/* 分类面板的 HTML（挂在时间线页里，不再是独立 tab）。
   `filterKey` 非空时只列这一个应用（点时间线上的块会用这个）。 */
async function catsPanelHTML(filterKey) {
  const all = await loadApps();
  let rows = all;
  if (filterKey) {
    rows = all.filter((x) => x.key === filterKey);
    if (!rows.length) rows = [{ key: filterKey, sec: 0, n: 0, src: "—", only: true }];
  } else {
    const q = (catQuery || "").trim().toLowerCase();
    if (q) rows = rows.filter((x) => x.key.toLowerCase().indexOf(q) >= 0);
  }
  const hiddenN = all.filter((x) => isNoise(x.key)).length;

  // 反馈 15: 应用分类下的应用列表按最近使用排序（lastActive / lastUsed / 屏幕事件最新时间倒序）
  if (!filterKey && rows.length > 1) {
    const appLastActiveMap = new Map();
    try {
      const checkDays = [];
      if (typeof SESS !== "undefined" && SESS && SESS.sessions) {
        checkDays.push(...Object.keys(SESS.sessions));
      }
      if (typeof _dayCache !== "undefined" && _dayCache) {
        if (_dayCache instanceof Map) {
          for (const k of _dayCache.keys()) checkDays.push(k);
        } else {
          checkDays.push(...Object.keys(_dayCache));
        }
      }
      if (typeof series === "function") {
        const sList = series(30) || [];
        sList.forEach(item => { if (item && item.day) checkDays.push(item.day); });
      }
      const uniqueDays = Array.from(new Set(checkDays)).sort();
      for (const day of uniqueDays) {
        const s = (typeof sessOf === "function") ? sessOf(day) : null;
        if (!s) continue;
        const segs = [].concat(s.pc || [], s.phone || []);
        for (const seg of segs) {
          if (!seg || !seg.app) continue;
          let timeVal = 0;
          try {
            const dMs = new Date(day + "T00:00:00").getTime();
            const hourMs = Math.round((Number(seg.b) || Number(seg.to) || 0) * 3600 * 1000);
            timeVal = dMs + hourMs;
          } catch (_) {}
          const prev = appLastActiveMap.get(seg.app) || 0;
          if (timeVal > prev) appLastActiveMap.set(seg.app, timeVal);
        }
      }
    } catch (e) {
      console.warn("[catsPanelHTML] 提取应用活跃时间异常:", e);
    }

    rows.sort((a, b) => {
      const getScore = (x) => {
        let t = appLastActiveMap.get(x.key) || 0;
        if (x.lastActive) {
          const ms = new Date(x.lastActive).getTime();
          if (!isNaN(ms) && ms > t) t = ms;
        }
        if (x.lastUsed) {
          const ms = new Date(x.lastUsed).getTime();
          if (!isNaN(ms) && ms > t) t = ms;
        }
        return t;
      };
      const tA = getScore(a);
      const tB = getScore(b);
      if (tA !== tB) return tB - tA;
      return (b.sec || 0) - (a.sec || 0);
    });
  }

  // 反馈 13, 14, 16: 移除 3 处冗余 em 提示文案
  const head = filterKey
    ? `<span><b>快捷设置</b></span><em>${esc(filterKey)}</em>`
    : `<span><b>分类设置</b></span>`;
  // ★ 2026-09-21：保存栏从面板**最底部**挪到**顶部**。原来它离第一个色块 7599px
  //   （中间夹着最多 150 行应用清单），用户改完颜色根本看不到它 —— 这是"以为没法保存"
  //   的直接原因。现在改完自动存，这里同时起「状态显示 + 手动立即存」的作用，放最上面立刻可见。
  //   ⚠️ 说明写在模板**外面**：写进模板内部 HTML 不认 C 注释，会整段印在页面上（v0.15.1 踩过）。
  return `
    <div class="cap">${head}</div>
    <div class="cat-save">
      <button id="catsave">保存</button>
      ${filterKey ? '<button id="catclose">收起</button>' : '<button id="catreset">恢复默认</button>'}
      <span class="msg" id="catmsg">改完自动保存</span>
    </div>
    ${filterKey ? "" : `
    <div class="cap" style="margin-top:2px"><span><b>类别</b></span></div>
    <div class="cat-colors">
      ${allCats().map((c) => {
        const clr = catColor(c);
        return `<span class="ccw">
        <span class="cc${c === "其他" ? " fixed" : ""}" data-c="${esc(c)}" title="点击修改「${esc(c)}」颜色" style="border-color:${clr}55;background:${clr}15;color:${clr}">
          <span>${esc(c)}</span>
        </span>
        ${c === "其他" ? "" : `<button class="cdel" data-d="${esc(c)}"
          title="删掉「${esc(c)}」，它下面的事件归入「其他」">×</button>`}
      </span>`;
      }).join("")}
      <button class="cadd" id="catadd">+ 新增类别</button>
    </div>
    <div class="cap" style="margin-top:2px"><span><b>应用分类</b></span></div>
    <div class="cat-bar">
      <input type="text" id="catq" placeholder="搜应用名…" value="${esc(catQuery || "")}">
      <span class="cnt">显示 ${rows.length} / ${all.length}</span>
    </div>`}
    <div class="cat-list" id="catlist">
      ${rows.length ? rows.map((x) => {
        const cat = catOf(x.key);
        const off = isNoise(x.key);
        const custom = RULES.cats[x.key] || ruleLookup(RULES.cats, x.key);
        return `<div class="cat-row ${off ? "off" : ""}" data-key="${esc(x.key)}">
          <div class="nm">${esc(x.key)}
            <i>${x.only ? "还没在数据里出现过，改了也先存着"
                        : `${esc(x.src)} · ${dur(x.sec / 60)} · ${x.n} 条`}${custom ? " · 自定义" : ""}</i></div>
          <select data-k="${esc(x.key)}" title="类别">
            ${allCats().map((c) => `<option value="${c}" ${c === cat ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <div class="sw"><button data-h="${esc(x.key)}" class="${off ? "" : "on"}"
            >${off ? "已隐藏" : "显示中"}</button></div>
          <input type="text" class="rn" data-n="${esc(x.key)}"
            placeholder="${esc(showName(x.key))}" value="${esc(RULES.names[x.key] || "")}">
        </div>`;
      }).join("") : `<div class="empty">${all.length

/* 某天的使用段（真假模式统一入口） */
function sessOf(day) {
  if (MOCK) return WEEK_SESS[day] || null;
  return (SESS && SESS.sessions && SESS.sessions[day]) || null;
}

const _dayCache = new Map(); // day -> { data, ts }
const _inFlightDays = new Map(); // day -> Promise<data>
const _revalidatingDays = new Set();
const BOOT_SNAP_KEY = "steward.snapshot.v2";

// 启动时从 sessionStorage 预防水合历史已读日期（保持会话期 0ms 命中）
function hydrateDayCacheFromSession() {
  try {
    if (typeof sessionStorage === "undefined") return;
    for (let i = 0; i < sessionStorage.length; i++) {
      const k = sessionStorage.key(i);
      if (k && k.startsWith("steward_day_")) {
        const d = k.slice(12);
        const raw = sessionStorage.getItem(k);
        if (raw) {
          const parsed = JSON.parse(raw);
          /* ★★ 2026-10-29 修：原来这里把 ts 写成 Date.now()，等于**伪造"刚刚拉过"**。
             后果：页面刷新后从 sessionStorage 恢复旧数据 + 时间戳是"现在" ⇒ 新鲜度判断
             永远认为它是最新的 ⇒ **根本不发请求**，服务端改了数据也永远看不到。
             实测：补了 10-28 的晚餐后，服务端和 SCF 都返回 11 条 1701kcal，
             但浏览器死活显示 9 条，连"禁用缓存"都救不了（因为请求没发出去）。

             新格式存 {data, ts}，恢复时用真实 ts；旧格式（纯 data）按 ts=0 处理，
             让它立即被判定为过期并在后台重验（前台仍先渲染旧数据，不阻塞）。 */
          let data = parsed, ts = 0;
          if (parsed && parsed.data && typeof parsed.ts === "number") {
            data = parsed.data;
            ts = parsed.ts;
          }
          if (data && !_dayCache.has(d)) {
            _dayCache.set(d, { data: data, ts: ts });
          }
        }
      }
    }
  } catch (e) {}
}
hydrateDayCacheFromSession();

function cacheDayData(day, data) {
  if (!day || !data) return;
  const ts = Date.now();
  _dayCache.set(day, { data: data, ts: ts });
  try {
    if (typeof sessionStorage !== "undefined") {
      // 存真实时间戳，刷新后才能判断"是不是该重验了"（见 hydrateDayCacheFromSession 的说明）
      sessionStorage.setItem("steward_day_" + day, JSON.stringify({ data: data, ts: ts }));
    }
  } catch (e) {}
}

/* =========================================================
   StewardIDB: 本地时序大仓库封装 (IndexedDB)
   - 数据库名：steward_idb_v1，表：days (key: day)
   - 异步非阻塞读写，容量达数百 MB，彻底解决 localStorage 5MB 上限与主线程卡顿
   - 优雅降级：若环境禁用/不支持 IDB，透明回退至 localStorage
   ========================================================= */
const StewardIDB = {
  dbName: "steward_idb_v1",
  storeName: "days",
  _db: null,

  async getDB() {
    if (this._db) return this._db;
    if (typeof indexedDB === "undefined") return null;
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(this.dbName, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(this.storeName)) {
            db.createObjectStore(this.storeName, { keyPath: "day" });
          }
        };
        req.onsuccess = (e) => {
          this._db = e.target.result;
          resolve(this._db);
        };
        req.onerror = () => resolve(null);
      } catch (err) {
        resolve(null);
      }
    });
  },

  async get(day) {
    if (!day) return null;
    try {
      const db = await this.getDB();
      if (!db) {
        // 优雅降级回退至 localStorage
        if (typeof localStorage !== "undefined") {
          const raw = localStorage.getItem(HIST_CACHE_PREFIX + day);
          return raw ? JSON.parse(raw) : null;
        }
        return null;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readonly");
          const store = tx.objectStore(this.storeName);
          const req = store.get(day);
          req.onsuccess = () => {
            const res = req.result;
            resolve(res ? (res.data || res) : null);
          };
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    } catch (e) {
      return null;
    }
  },

  /* ★ 2026-10-31：只读方法 —— 连**真实写入时间戳**一起返回 { data, ts }。
     set() 存的是 { day, data, ts }，但 get() 只把 data 交出去，时间戳被丢掉；
     上层拿不到 ts，就只能伪造 Date.now()（见 fetchDayData 里命中 IDB 的那段），
     于是 TTL 永不成立、重验永不触发。这里补一个旁路读取，**不改 get() 的返回结构**
     —— 08_gestures.js 等处依赖「get() 拿到的就是 data 本体」。 */
  async getRecord(day) {
    if (!day) return null;
    try {
      const db = await this.getDB();
      if (!db) {
        // 优雅降级：localStorage 里存的是裸 JSON（没有 ts）→ ts 记 0，按「过期」处理
        if (typeof localStorage !== "undefined") {
          const raw = localStorage.getItem(HIST_CACHE_PREFIX + day);
          return raw ? { data: JSON.parse(raw), ts: 0 } : null;
        }
        return null;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readonly");
          const store = tx.objectStore(this.storeName);
          const req = store.get(day);
          req.onsuccess = () => {
            const res = req.result;
            if (!res) return resolve(null);
            resolve({
              data: res.data || res,
              ts: typeof res.ts === "number" ? res.ts : 0,   // 老记录没有 ts → 0，自然过期
            });
          };
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    } catch (e) {
      return null;
    }
  },

  async set(day, data) {
    if (!day || !data) return false;
    try {
      const db = await this.getDB();
      if (!db) {
        // 优雅降级回退至 localStorage
        if (typeof localStorage !== "undefined" && typeof saveHistoricalDayCache === "function") {
          saveHistoricalDayCache(day, data);
        }
        return false;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readwrite");
          const store = tx.objectStore(this.storeName);
          const record = { day: day, data: data, ts: Date.now() };
          const req = store.put(record);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    } catch (e) {
      return false;
    }
  },

  async delete(day) {
    if (!day) return false;
    try {
      const db = await this.getDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readwrite");
          const store = tx.objectStore(this.storeName);
          const req = store.delete(day);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    } catch (e) {
      return false;
    }
  },

  async clear() {
    try {
      const db = await this.getDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readwrite");
          const store = tx.objectStore(this.storeName);
          const req = store.clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    } catch (e) {
      return false;
    }
  }
};
if (typeof window !== "undefined") {
  window.StewardIDB = StewardIDB;
}

const HIST_CACHE_PREFIX = "steward.cache.day.";
const HIST_CACHE_MAX_DAYS = 30;

function saveHistoricalDayCache(day, jsonObj) {
  if (!day || !jsonObj) return;
  try {
    if (typeof localStorage === "undefined") return;
    localStorage.setItem(HIST_CACHE_PREFIX + day, JSON.stringify(jsonObj));

    // LRU 清理：收集所有 steward.cache.day. 开头的键，保留最近 30 天，其余淘汰
    const dayKeys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(HIST_CACHE_PREFIX)) {
        dayKeys.push(k.slice(HIST_CACHE_PREFIX.length));
      }
    }
    if (dayKeys.length > HIST_CACHE_MAX_DAYS) {
      dayKeys.sort(); // 升序，最旧的在前面
      const removeCount = dayKeys.length - HIST_CACHE_MAX_DAYS;
      for (let i = 0; i < removeCount; i++) {
        localStorage.removeItem(HIST_CACHE_PREFIX + dayKeys[i]);
      }
    }
  } catch (e) {
    console.warn("[cache] saveHistoricalDayCache 写入失败或存储已满:", e);
  }
}

function invalidateDayCache(targetDay) {
  if (!targetDay) return;
  if (typeof _dayCache !== "undefined" && _dayCache) {
    _dayCache.delete(targetDay);
  }
  if (typeof StewardIDB !== "undefined" && StewardIDB && StewardIDB.delete) {
    StewardIDB.delete(targetDay).catch(() => {});
  }
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.removeItem(HIST_CACHE_PREFIX + targetDay);
    }
    if (typeof sessionStorage !== "undefined") {
      sessionStorage.removeItem("steward_day_" + targetDay);
    }
  } catch (e) {}
}
if (typeof window !== "undefined") {
  window.invalidateDayCache = invalidateDayCache;
}

function hasCachedDay(day) {
  if (MOCK) return true;
  return _dayCache.has(day);
}

function prefetchDay(day) {
  if (!day || MOCK || SHARE) return;
  if (_dayCache.has(day) || _inFlightDays.has(day)) return;
  getDay(day, false).catch(() => {});
}

/* 核心：预加载目标日期的相邻日期（前一天、后一天） */
function prefetchAdjacentDays(targetDay) {
  if (!targetDay || !Array.isArray(DAYS) || !DAYS.length || MOCK || SHARE) return;
  const idx = DAYS.indexOf(targetDay);
  if (idx === -1) return;

  const toFetch = [];
  // 前一天（历史方向）
  if (idx > 0) toFetch.push(DAYS[idx - 1]);
  // 后一天（未来方向）
  if (idx < DAYS.length - 1) toFetch.push(DAYS[idx + 1]);

  const runner = () => {
    toFetch.forEach(d => prefetchDay(d));
  };
  if (typeof requestIdleCallback === "function") {
    requestIdleCallback(runner, { timeout: 2500 });
  } else {
    setTimeout(runner, 250);
  }
}

function saveBootSnapshot(day, dayData) {
  try {
    if (!day || !dayData) return;
    // 仅针对当天保存启动快照，避免被预加载的历史日期覆盖冷启动入口
    if (typeof TODAY !== "undefined" && day !== TODAY) return;
    const snap = {
      day: day,
      dayData: dayData,
      trend: TREND,
      ts: Date.now()
    };
    localStorage.setItem(BOOT_SNAP_KEY, JSON.stringify(snap));
  } catch (e) {}
}

function loadBootSnapshot() {
  try {
    const raw = localStorage.getItem(BOOT_SNAP_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

async function bgRevalidateDay(day) {
  if (_revalidatingDays.has(day) || MOCK) return;
  _revalidatingDays.add(day);
  try {
    // forceFresh：绕开 IDB 与静态首屏，直接问云端 —— 否则会读到同一份旧快照，白跑一圈
    const res = await fetchDayData(day, { forceFresh: true });
    if (res) {
      cacheDayData(day, res);
      if (day === TODAY) saveBootSnapshot(day, res);
      if (curDay === day) {
        CUR_DAY_DATA = res.d;
        render();
      }
    }
  } catch (e) {
  } finally {
    _revalidatingDays.delete(day);
  }
}

async function getDay(day, force = false) {
  if (MOCK) {
    const i = DAYS.indexOf(day);
    return {
      d: MOCK_DAYS[i] || MOCK_DAYS[MOCK_DAYS.length - 1],
      ses: SESSIONS[day] || null, notes: MOCK_NOTES[day] || null,
      flow: MOCK_FLOW[day] || null, notifies: NOTIFIES[day] || null,
      report: MOCK_REPORT[day] || null, traces: null,
    };
  }

  // 1. 优先命中本地内存缓存：0ms 直出
  const cached = _dayCache.get(day);
  const now = Date.now();
  if (cached && !force) {
    const yest = (typeof YESTERDAY !== "undefined" && YESTERDAY)
      ? YESTERDAY
      : (typeof DAYS !== "undefined" && Array.isArray(DAYS) && DAYS.length >= 2)
        ? DAYS[DAYS.length - 2]
        : new Date(Date.now() + 8 * 3600e3 - 86400e3).toISOString().slice(0, 10);
    /* SWR 策略：缓存过期就在后台静默重验，不阻塞前台渲染。
       ★ 2026-10-29 补历史日 TTL：原来只判断「今天 >90s」和「昨天」，
       更早的日期一旦进了缓存就**永不刷新** —— 服务端修了历史数据，页面永远看不到。
       实测踩到：补了 10-28（前天）的晚餐后，页面死活显示旧数据，连禁用缓存都没用。
       现在历史日也给 6 小时 TTL：数据不会被频繁改，但改了最多半天一定能看到。 */
    const HISTORY_TTL = 6 * 3600e3;
    if ((day === TODAY && (now - cached.ts > 90000)) ||
        day === yest ||
        (now - cached.ts > HISTORY_TTL)) {
      bgRevalidateDay(day);
    }
    // 如果切到首页且是历史日期之前没拉过 report，后台静默拉取 report 并补齐
    if (tab === "home" && day !== TODAY && !cached.data.report && !SHARE) {
      fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "report", d: day }), { cache: "no-store" })
        .then(r => r.ok ? r.json() : null)
        .then(j2 => {
          if (j2 && j2.report && j2.report.body) {
            cached.data.report = j2.report;
            if (tab === "home" && curDay === day) render();
          }
        }).catch(() => {});
    }
    return cached.data;
  }

  // 2. 复用后台预加载或正在进行的请求，防止重复发包
  if (_inFlightDays.has(day)) {
    return _inFlightDays.get(day);
  }

  const p = (async () => {
    try {
      const res = await fetchDayData(day, force ? { forceFresh: true } : {});
      cacheDayData(day, res);
      if (day === TODAY) saveBootSnapshot(day, res);
      return res;
    } finally {
      _inFlightDays.delete(day);
    }
  })();

  _inFlightDays.set(day, p);
  return p;
}

async function fetchDayData(day, opt = {}) {
  // P2/P3 缓存体系：严格收窄绝对不可变缓存范围至 2 天前（day < YESTERDAY）
  // 昨天（day === YESTERDAY）晚间可能新增运动或睡眠，绝不可完全阻断向云端校验：
  // 1. 若带 opt.forceFresh，无条件击穿本地 IDB 与内存缓存，直取云端最新数据；
  // 2. 若不带 opt.forceFresh 且本地命中 IDB，先以缓存秒开直出，同时在后台静默发起一次云端重验（SWR），
  //    彻底消除前日晚间新增运动（如乒乓球、跑步）被旧快照死锁的问题。
  const yest = (typeof YESTERDAY !== "undefined" && YESTERDAY)
    ? YESTERDAY
    : (typeof DAYS !== "undefined" && Array.isArray(DAYS) && DAYS.length >= 2)
      ? DAYS[DAYS.length - 2]
      : new Date(Date.now() + 8 * 3600e3 - 86400e3).toISOString().slice(0, 10);
  const isImmutableHistory = Boolean(day && yest && day < yest);
  const isYesterday = Boolean(day && yest && day === yest);

  if (!opt.forceFresh) {
    try {
      /* ★ 2026-10-31：命中 IDB 时把**真实写入 ts** 一起取回来（getRecord）。
         拿不到 ts（老记录 / localStorage 降级）就退化为 0 = 「一定过期」，
         绝不再用 Date.now() 伪造「刚校验过」。 */
      let cachedJson = null, idbTs = 0;
      if (typeof StewardIDB !== "undefined" && StewardIDB.get) {
        if (typeof StewardIDB.getRecord === "function") {
          const rec = await StewardIDB.getRecord(day);
          if (rec) { cachedJson = rec.data; idbTs = rec.ts || 0; }
        } else {
          cachedJson = await StewardIDB.get(day);
        }
      }
      if (cachedJson && typeof cachedJson === "object") {
        const dObj = cachedJson.d ? cachedJson.d : (typeof normDay === "function" ? normDay(cachedJson) : cachedJson);
        const resData = {
          d: dObj,
          ses: cachedJson.ses || cachedJson.sessions || null,
          notes: cachedJson.notes || null,
          flow: cachedJson.flow || null,
          notifies: (cachedJson.notifies || []).filter((n) => typeof isNoise === "function" ? !isNoise(n.app) : true),
          report: cachedJson.report || null,
          traces: cachedJson.traces || [],
        };
        _dayCache.set(day, { data: resData, ts: idbTs });

        // ★★ 2026-10-29：历史日（前天及更早）也必须后台重验。
        // 原来这里只有 isYesterday 才 bgRevalidateDay —— 历史日命中 IDB 后**直接 return，
        // 永不刷新**；而且上面刚把 _dayCache 的 ts 写成 Date.now()（伪造"刚校验过"），
        // 于是 getDay 里那层「历史日 6 小时 TTL」也被完全绕过。
        // 这就是「补了 10-28 的晚餐，服务端三处都对，页面却永远是 9 条」的最后一层。
        // ★★ 2026-10-31：上面那条「伪造 ts」的坑当时只补了昨天/更早，**今天没修**。
        //   今天既不是 isYesterday 也不是历史日 → 两个条件都不满足 → 一条请求都不发，
        //   今天的数据要等整页刷新才更新。现在：
        //     a) ts 用 IDB 里的真实写入时间（idbTs），TTL 判断自然生效；
        //     b) 今天也纳入重验，但用「真实 ts + 90s TTL」限流，且 _revalidatingDays
        //        未占用时才排队 —— 避免每次 render 都打一次跨境请求（同 getDay 里今天的 90s 口径）。
        const isToday = Boolean(day && typeof TODAY !== "undefined" && day === TODAY);
        const staleToday = isToday && (Date.now() - idbTs > 90000);
        if ((isYesterday || isImmutableHistory || staleToday) &&
            typeof bgRevalidateDay === "function" && !_revalidatingDays.has(day)) {
          setTimeout(() => bgRevalidateDay(day), 50);
        }

        return resData;
      }
    } catch (e) {
      console.warn("[cache] 读取 IDB/历史缓存失败:", e);
    }
  }

  const q = new URLSearchParams({ k: KEY, api: "day", d: day });
  const needReport = SHARE || (tab === "home" && day !== TODAY);
  const pReport = !needReport ? null
    : SHARE
      ? apiGet(new URLSearchParams({ k: KEY, api: "report", d: day })).catch(() => null)
      : fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "report", d: day }), { cache: "no-store" })
          .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // 当天实时饮食流水需与云端对齐；历史日期饮食已固化在静态数据中
  const pDiet = (SHARE || day !== TODAY) ? null
    : fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "diet", d: day }), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null)).catch(() => null);

  // ★ 2026-10-19：云端读失败不许把 render() 带崩，也不许白屏。
  //   实测 SCF 跨境这一跳 1/3 概率超时，单次要 47s；冷启动（无本地缓存）时
  //   一次失败就是整页空白。所以三级降级：CF/SCF(12s) → 当天静态 COS 文件 → 本地快照。
  //   当天静态文件最多差 30 分钟（build_static 每轮重算），远好过白屏。
  // ★★ 2026-10-19：当天也先用 COS 静态文件出首屏（国内 ~1 秒），云端在后台校准。
  //   背景：v0.36.5（10-14）为修「体脂秤新数据被旧静态挡住」，立了铁律"当天必须走云端"，
  //   结果把当天读取整体推回跨境（10-17 又变 8 跳，单次最坏 40 秒 + 502）。
  //   这里改成 static-first：先用至多 30 分钟前的快照把页面画出来，再静默换新 ——
  //   快和准同时拿到。本地改过的数据不受影响：normDay 里 isDietModified 脏标记优先。
  let j = null;
  let seededFromStatic = false;
  if (!opt.forceFresh && typeof USE_STATIC !== "undefined" && USE_STATIC && typeof STATIC_BASE !== "undefined" && STATIC_BASE) {
    try {
      const rs = await Promise.race([
        fetch(STATIC_BASE + "/day/" + day + ".json", { cache: "default" }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("静态首屏 2.5s 未返回")), 2500)),
      ]);
      if (rs && rs.ok) {
        j = await rs.json();
        seededFromStatic = true;
      }
    } catch (e) {
      console.warn("[api] 当天静态首屏未命中，改走云端:", e && e.message);
    }
  }
  if (!j) {
    try {
      j = await Promise.race([
        apiGet(q, opt),
        new Promise((_, rej) => setTimeout(() => rej(new Error("day 读取超时 12000ms")), 12000)),
      ]);
    } catch (err) {
      console.warn("[api] day 读取失败，尝试静态文件:", err && err.message);
    }
  }
  if (!j && STATIC_BASE) {
    try {
      const r = await fetch(STATIC_BASE + "/day/" + day + ".json", { cache: "default" });
      if (r.ok) {
        j = await r.json();
        console.warn("[api] 已用静态文件兜底：" + day + "（可能滞后至多 30 分钟）");
      }
    } catch (e) {
      console.warn("[api] 静态兜底也失败:", e && e.message);
    }
  }
  if (!j) {
    const cached = _dayCache.get(day);
    if (cached && cached.data) return cached.data;
    const snap = loadBootSnapshot();
    if (snap && snap.d && (!snap.d.day || snap.d.day === day)) return snap;
    throw new Error("day 取数失败（云端、静态层与本地均不可用）");
  }
  if (j.error) throw new Error(j.error);

  // 成功获取数据后异步存入 IDB 时序大仓库，若环境不支持透明回退至 localStorage
  if (typeof StewardIDB !== "undefined" && StewardIDB.set) {
    StewardIDB.set(day, j).catch(() => {});
  }
  if (isImmutableHistory) {
    saveHistoricalDayCache(day, j);
  }

  let stored = null;
  if (pReport) {
    try {
      // 竞态 250ms：若日报已就绪则一起带回，若迟滞则转入后台静默补齐，绝不拖累主数据秒级呈现
      const j2 = await Promise.race([
        pReport,
        new Promise(resolve => setTimeout(() => resolve(null), 250))
      ]);
      if (j2 && j2.report && j2.report.body) {
        stored = j2.report;
      } else {
        // 后台静默等待其到达并补充挂载至缓存
        pReport.then(rj => {
          if (rj && rj.report && rj.report.body) {
            const entry = _dayCache.get(day);
            if (entry && entry.data) {
              entry.data.report = rj.report;
              if (curDay === day && tab === "home" && typeof render === "function") render();
            }
          }
        }).catch(() => {});
      }
    } catch (e) { /* 没有已存日报是正常情况 */ }
  }

  const dObj = normDay(j);
  if (pDiet) {
    try {
      const jd = await Promise.race([
        pDiet,
        new Promise(resolve => setTimeout(() => resolve(null), 250))
      ]);
      const applyDietData = (dietJson, targetObj) => {
        if (!dietJson || !dietJson.ok || !dietJson.diet || !Array.isArray(dietJson.diet.meals)) return false;
        const localD = loadDayDietLocal(day);
        // ★ 核心防线：若本地存在用户近期（30秒内）修改/删除或脏标记，绝不被云端旧缓存反向覆盖
        const isRecentModified = localD && localD._userModified && (
          typeof localD._userModified === "number"
            ? (Date.now() - localD._userModified < 30000)
            : true
        );
        if (isRecentModified || isDietModified(day)) {
          return false;
        }
        const suppMap = {};
        if (localD && Array.isArray(localD.supplements)) {
          localD.supplements.forEach(s => { if (s && s.name) suppMap[s.name] = s; });
        }
        if (Array.isArray(dietJson.diet.supplements)) {
          dietJson.diet.supplements.forEach(s => {
            if (s && s.name) suppMap[s.name] = s;
          });
        }
        dietJson.diet.supplements = Object.values(suppMap);
        const cleanDiet = dedupDietObj(dietJson.diet);
        saveDayDietLocal(day, cleanDiet);
        if (cleanDiet.meals.length > 0 || (cleanDiet.totalKcal || 0) > 0 || cleanDiet.supplements.length > 0) {
          targetObj.diet = cleanDiet;
        }
        return true;
      };

      if (jd && applyDietData(jd, dObj)) {
        // 成功在 250ms 内带回
      } else {
        // 关键修复：跨境网络耗时 >250ms 时后台等待返回，响应到达后立即写入缓存并局部刷新
        pDiet.then(lateJd => {
          if (lateJd && lateJd.ok && lateJd.diet) {
            const entry = _dayCache.get(day);
            const target = (entry && entry.data && entry.data.d) ? entry.data.d : dObj;
            if (applyDietData(lateJd, target)) {
              if (curDay === day && typeof render === "function") render();
            }
          }
        }).catch(() => {});
      }
    } catch (e) {}
  }
  const resData = {
    d: dObj, ses: j.sessions || null, notes: j.notes || null,
    flow: j.flow || null,
    notifies: j.notifies ? j.notifies.filter((n) => !isNoise(n.app)) : null,
    report: stored, traces: j.traces || [],
  };
  if (day === TODAY) saveBootSnapshot(day, resData);
  // 首屏已经用静态快照画出来了 → 后台去要云端最新值（forceFresh 绕开静态层，
  // 否则会再读到同一份旧快照，形成自我循环）。拿到了会静默重绘，拿不到就继续用快照。
  if (seededFromStatic && typeof bgRevalidateDay === "function") {
    setTimeout(() => { try { bgRevalidateDay(day); } catch (_) {} }, 30);
  }
  return resData;
}


/* 饮食对象防呆去重与营养素自愈校准函数 */
function dedupDietObj(diet) {
  if (!diet || typeof diet !== "object") return diet;
  if (!Array.isArray(diet.meals) || diet.meals.length === 0) return diet;
  const seen = new Set();
  const cleanMeals = [];
  let totCal = 0, p = 0, c = 0, f = 0;
  for (const m of diet.meals) {
    if (!m) continue;
    const stdStamp = (() => {
      try {
        const ms = new Date(m.stamp || m.time).getTime();
        return isNaN(ms) ? String(m.stamp || m.time || "") : String(ms);
      } catch (_) {
        return String(m.stamp || m.time || "");
      }
    })();
    const dish = String(m.dish || "").trim();
    const cal = Math.round(Number(m.calories) || 0);
    const k = `${stdStamp}|${dish}|${cal}`;
    if (seen.has(k)) continue;
    seen.add(k);
    cleanMeals.push(m);
    totCal += cal;
    p += Number(m.protein) || 0;
    c += Number(m.carbs) || 0;
    f += Number(m.fat) || 0;
  }
  return {
    ...diet,
    totalKcal: totCal,
    macros: {
      protein: (typeof roundMacro === "function" ? roundMacro(p) : Math.round(p * 10) / 10),
      carbs: (typeof roundMacro === "function" ? roundMacro(c) : Math.round(c * 10) / 10),
      fat: (typeof roundMacro === "function" ? roundMacro(f) : Math.round(f * 10) / 10)
    },
    meals: cleanMeals
  };
}

const DIET_DIRTY_PREFIX = "steward.diet.dirty.";
const DIET_DIRTY_TTL_MS = 300000;
/* 存时间戳而不是 "1"：脏标记是"刚改过"的短期信号，写成常量就永远真，
   normDay 会一直拿本地旧副本，云端后来新增的餐食永远进不来 */
function markDietModified(day) {
  try { if (day) localStorage.setItem(DIET_DIRTY_PREFIX + day, String(Date.now())); } catch (_) {}
}
/* 只认 5 分钟内的数字时间戳；读到 "1"/"true"/解析不出的一律当过期并顺手删掉，
   这一步负责自愈用户手机上已经写坏的存量标记 */
function isDietModified(day) {
  if (!day) return false;
  try {
    const raw = localStorage.getItem(DIET_DIRTY_PREFIX + day);
    if (!raw) return false;
    const ts = Number(raw);
    if (!Number.isFinite(ts) || ts < 1e12 || Date.now() - ts >= DIET_DIRTY_TTL_MS) {
      try { localStorage.removeItem(DIET_DIRTY_PREFIX + day); } catch (_) {}
      return false;
    }
    return true;
  } catch (_) { return false; }
}

/* 本地饮食持久化与云端校准层（防静态 COS 覆盖、实现 0ms 瞬间点击与断网离线呈现） */
function loadDayDietLocal(day) {
  if (!day) return null;
  try {
    const raw = localStorage.getItem("steward.diet." + day);
    if (!raw) return null;
    let obj = JSON.parse(raw);
    if (obj && typeof obj === "object" && ((obj.totalKcal || 0) > 0 || (Array.isArray(obj.meals) && obj.meals.length > 0))) {
      const cleanObj = dedupDietObj(obj);
      if (cleanObj !== obj) {
        try { localStorage.setItem("steward.diet." + day, JSON.stringify(cleanObj)); } catch (_) {}
      }
      return cleanObj;
    }
  } catch (e) {}
  return null;
}

function saveDayDietLocal(day, diet) {
  if (!day || !diet) return;
  diet = dedupDietObj(diet);
  try {
    localStorage.setItem("steward.diet." + day, JSON.stringify(diet));
  } catch (e) {}
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day === day) {
    CUR_DAY_DATA.diet = diet;
  }
  const c = _dayCache.get(day);
  if (c && c.data && c.data.d) {
    c.data.d.diet = diet;
    saveBootSnapshot(day, c.data);
  }
}

let _syncDietRunning = false;
async function syncDayDietFromCloud(day) {
  if (!day || _syncDietRunning || SHARE) return;
  // 若有在途的快速记账请求，直接跳过本次同步，由最后一个请求在 finally 中触发最新同步
  // ⚠️ 只读 window 上的计数器：局部 `let _inFlightQuickLogs` 在 09_modals.js 里声明，
  //    而本函数会被 08_gestures.js 在**顶层**先调一次 —— 那时 09 还没执行，
  //    局部变量处于 TDZ，`typeof` 会抛 ReferenceError（v0.39.0 实测整页渲染被截断）。
  if (typeof window !== "undefined" && window._inFlightQuickLogs > 0) return;
  _syncDietRunning = true;
  try {
    const r = await fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "diet", d: day }), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.ok && j.diet) {
      const cloudDiet = dedupDietObj(j.diet);
      if (Array.isArray(cloudDiet.meals)) {
        const localD = loadDayDietLocal(day);
        const isRecentModified = localD && localD._userModified && (
          typeof localD._userModified === "number"
            ? (Date.now() - localD._userModified < 30000)
            : true
        );
        if (isRecentModified || isDietModified(day)) {
          return;
        }
        const curMeals = (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day === day && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals))
          ? CUR_DAY_DATA.diet.meals
          : ((localD && Array.isArray(localD.meals)) ? localD.meals : []);
        const curLen = curMeals.length;
        const cloudLen = cloudDiet.meals.length;

        // ★ 保底安全机制：若本地 meals 数量大于云端返回数量，说明本地有最新单品或正在乐观更新，绝不覆盖冲掉本地单品
        if (curLen > cloudLen) {
          return;
        }

        const suppMap = {};
        if (localD && Array.isArray(localD.supplements)) {
          localD.supplements.forEach(s => { if (s && s.name) suppMap[s.name] = s; });
        }
        if (Array.isArray(cloudDiet.supplements)) {
          cloudDiet.supplements.forEach(s => { if (s && s.name) suppMap[s.name] = s; });
        }
        cloudDiet.supplements = Object.values(suppMap);
        saveDayDietLocal(day, cloudDiet);
        if (typeof curDay !== "undefined" && curDay === day && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
          const curKcal = (CUR_DAY_DATA.diet && CUR_DAY_DATA.diet.totalKcal) || 0;
          const cloudKcal = cloudDiet.totalKcal || 0;
          if (cloudLen !== curLen || cloudKcal !== curKcal) {
            CUR_DAY_DATA.diet = cloudDiet;
            if (typeof render === "function") await render();
          }
        }
      }
    }
  } catch (e) {
  } finally {
    _syncDietRunning = false;
  }
}

/* 把 Worker 的嵌套结构拍平成页面用的结构 */
function normDay(j) {
  const b = j.body || {};
  const nz = (v) => (v === null || v === undefined ? null : v);
  const localDiet = loadDayDietLocal(j.day);

function parseIcsToCourseMap(icsText) {

  events.forEach((evText) => {
    const summaryM = evText.match(/SUMMARY:(.*)/);
    const dtstartM = evText.match(/DTSTART.*?:(\d{8}T\d{6})/);
    const dtendM = evText.match(/DTEND.*?:(\d{8}T\d{6})/);
    const locM = evText.match(/LOCATION:(.*)/);
    if (!summaryM || !dtstartM || !dtendM) return;
    const name = summaryM[1].trim();
    const stStr = dtstartM[1];
    const etStr = dtendM[1];
    const loc = locM ? locM[1].trim() : "";
    
    const day = stStr.slice(0, 4) + "-" + stStr.slice(4, 6) + "-" + stStr.slice(6, 8);
    const sh = parseInt(stStr.slice(9, 11), 10) + parseInt(stStr.slice(11, 13), 10) / 60;
    const eh = parseInt(etStr.slice(9, 11), 10) + parseInt(etStr.slice(11, 13), 10) / 60;
    
    // 节假日跳过检查
    if (typeof isHoliday === "function" && isHoliday(day)) return;

    if (!map[day]) map[day] = [];

      ex.name === name && Math.abs(ex.from - sh) < 0.05 && Math.abs(ex.to - eh) < 0.05

  return map;

/* ------------------ 位置聚类（足迹） ------------------ */
function distKm(aLat, aLon, bLat, bLon) {
  const R = 6371, k = Math.PI / 180;
  const dLat = (bLat - aLat) * k, dLon = (bLon - aLon) * k;
  const x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(aLat * k) * Math.cos(bLat * k) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
/* ------------------ 聚类与轨迹持久内存缓存 (0ms 瞬间直出) ------------------ */
const _clusterCache = new Map();
const _tracesCache = {};                 // day -> [trace, …]
const _weekTracesCache = new Map();       // "day1,day2,..." -> traces[][]
const _inFlightTraces = new Map();        // day -> Promise

function _makeClusterKey(traces, radiusKm) {
  if (!traces || !traces.length) return "";
  const len = traces.length;
  const p0 = traces[0];
  const pm = traces[Math.floor(len / 2)];
  const p1 = traces[len - 1];
  const k0 = p0 ? `${(p0.lat || 0).toFixed(4)},${(p0.lon || 0).toFixed(4)},${p0.t || p0.h || ""}` : "";
  const km = pm ? `${(pm.lat || 0).toFixed(4)},${(pm.lon || 0).toFixed(4)},${pm.t || pm.h || ""}` : "";
  const k1 = p1 ? `${(p1.lat || 0).toFixed(4)},${(p1.lon || 0).toFixed(4)},${p1.t || p1.h || ""}` : "";
  return `${len}:${radiusKm}:${k0}:${km}:${k1}`;
}

function clusterTraces(traces, radiusKm) {
  if (!traces || !traces.length) return [];
  const key = _makeClusterKey(traces, radiusKm);
  if (key && _clusterCache.has(key)) {
    return _clusterCache.get(key);
  }
  const cs = [];
  traces.forEach((p) => {
    let hit = null;
    for (const c of cs) { if (distKm(c.lat, c.lon, p.lat, p.lon) <= radiusKm) { hit = c; break; } }
    if (hit) {
      hit.lat = (hit.lat * hit.n + p.lat) / (hit.n + 1);
      hit.lon = (hit.lon * hit.n + p.lon) / (hit.n + 1);
      hit.n++; hit.pts.push(p);
    } else {
      cs.push({ lat: p.lat, lon: p.lon, n: 1, pts: [p] });
    }
  });
  const res = cs.sort((a, b) => b.n - a.n);
  if (key) {
    if (_clusterCache.size >= 100) {
      const firstKey = _clusterCache.keys().next().value;
      _clusterCache.delete(firstKey);
    }
    _clusterCache.set(key, res);
  }
  return res;
}

/* 当天轨迹的**唯一权威来源**：和日视图同源（日视图 traces 来自 getDay → _dayCache，
   那边有 90s SWR 后台重验）。周视图若自己另存一份，两条缓存必然各存一份、各自过期 ——
   用户看到的「同一天日/周不一致、周视图更新更迟」就是这么来的。
   _tracesCache 只当兜底（纯周视图、日视图尚未载入时）。 */

  //    日视图那边 _dayCache 刷新了，周视图也永远拿不回来。

    }

  }

  // 2. 同步全命中检测：若 7 天全部存在于 _tracesCache 或 _dayCache，0ms 纯内存同步直出！
  let allHit = true;
  for (const day of days) {
    if (day > TODAY) {
      _tracesCache[day] = [];
    } else if (day === TODAY) {
      // 当天以 _dayCache 为准（日视图同源），拿到就同步过来 —— 别让两条缓存分叉
      const live = todayTracesLive();
      if (Array.isArray(live)) _tracesCache[day] = live;
      else allHit = false;
    } else if (_tracesCache[day] === undefined) {
      if (typeof _dayCache !== "undefined" && _dayCache.has(day)) {
        const c = _dayCache.get(day);
        /* ★ 2026-11-07：只认**非空** traces。_dayCache 里的空数组有两处假来源：
           getDay 从 IDB 恢复时的 `traces: cachedJson.traces || []`（IDB 缺字段就兜出空），
           以及额度爆掉那晚存进去的残缺快照。拿它当命中 = 把假值固化进周视图。 */
        if (c && c.data && Array.isArray(c.data.traces) && c.data.traces.length) {
          _tracesCache[day] = c.data.traces;
        } else {
          allHit = false;
        }
      } else {
        allHit = false;
      }
    }
  }

  if (allHit) {
    const res = days.map((day) => _tracesCache[day] || []);
    _weekTracesCache.set(weekKey, res);
    return res;
  }

  // 3. 异步并发获取缺失日期，当天数据支持 SWR 乐观直出
  await Promise.all(days.map(async (day) => {
    if (day > TODAY) { _tracesCache[day] = []; return; }
    if (_tracesCache[day] && day !== TODAY) return;
    // 如果当天已在 _tracesCache 中，先复用，后台静默刷新
    if (_tracesCache[day] && day === TODAY) {
      if (!_inFlightTraces.has(day)) {
        const p = apiGet(new URLSearchParams({ k: KEY, api: "day", d: day }))
          .then((j) => { if (j && Array.isArray(j.traces)) _tracesCache[day] = j.traces; })
          .catch(() => {})
          .finally(() => _inFlightTraces.delete(day));
        _inFlightTraces.set(day, p);
      }
      return;
    }
    // 未缓存日期：发起请求或复用现有 inFlight Promise
    if (_inFlightTraces.has(day)) {
      await _inFlightTraces.get(day);
      return;
    }
    const p = (async () => {
      try {
        const j = await apiGet(new URLSearchParams({ k: KEY, api: "day", d: day }));
        /* ★ 2026-11-07：只有后端**明确给了数组**才落缓存（空数组也算明确 —— 那天真没轨迹）。
           拿不到数组（error 响应 / 半截响应 / 额度超限）就保持 undefined，留给下一轮重试。 */
        if (j && Array.isArray(j.traces)) _tracesCache[day] = j.traces;
        else delete _tracesCache[day];
      } catch (e) {
        /* ★★ 2026-11-07：失败**不许**写空数组。
           写了就等于把一次网络抖动永久记成"这天没有轨迹" —— 上面第 122 行的
           `if (_tracesCache[day] && ...)` 对 `[]` 判真，于是再也不会重拉。
           11-06 那行空白就是这个坑。delete 掉才能让下一轮重新尝试。 */
        delete _tracesCache[day];
      }
    })();
    _inFlightTraces.set(day, p);
    await p;
    _inFlightTraces.delete(day);
  }));

  const res = days.map((day) => (day === TODAY ? (todayTracesLive() || []) : (_tracesCache[day] || [])));
  _weekTracesCache.set(weekKey, res);
  return res;
}
function guessPlaceName(c) {
  const night = c.pts.filter((p) => p.h < 6 || p.h >= 23).length / c.n;
  const noon = c.pts.filter((p) => p.h >= 11 && p.h < 13).length / c.n;
  const dayT = c.pts.filter((p) => p.h >= 8 && p.h < 18).length / c.n;
  if (night > 0.3) return "宿舍";
  if (noon > 0.28) return "食堂";
  if (dayT > 0.55) return "教学楼 / 图书馆";
  return "其他地点";
}

async function loadPlaces() {
  /* ★ 2026-09-22：CF 取不到时**别把点位清空** —— 用本机上次成功的那份兜底。
     背景（用户实测"足迹瘫痪了"）：D1 读额度爆掉时 `api=places` 报 500，
     原实现直接把 PLACE_MEM 清成空 → 足迹整页地点变灰、名字全没（"没法分辨位置"）。
     而**位置原始数据其实好好的**（静态层 day.json 里坐标一条没少）。
     ⚠️ 只有 CF 失败才回落本机缓存，正常情况仍以 CF 为准 —— 所以不会拿旧名字糊弄。 */
  try {
    const j = await apiGet(new URLSearchParams({ k: KEY, api: "places" }));
    if (j && j.named) {
      // ★ 2026-10-04 (v0.20.5)：严格剔除已经被命名的未知点，防止历史残留
      const namedPts = j.named || [];
      j.unknown = (j.unknown || []).filter((u) => !namedPts.some((m) => distKm(m.lat, m.lon, u.lat, u.lon) <= 0.3));
      PLACE_MEM = j;
      try { localStorage.setItem(PLACES_LS, JSON.stringify(j)); } catch (e) { /* 存不下就算了 */ }
    }
  } catch (e) {
    if (!PLACE_MEM.named.length) {                 // 本次会话还没拿到过 → 读本机缓存
      try {
        const t = localStorage.getItem(PLACES_LS);
        if (t) {
          const j2 = JSON.parse(t);
          if (j2 && j2.named) {
            const namedPts = j2.named || [];
            j2.unknown = (j2.unknown || []).filter((u) => !namedPts.some((m) => distKm(m.lat, m.lon, u.lat, u.lon) <= 0.3));
            PLACE_MEM = j2;
          }
        }
      } catch (e2) { /* 缓存坏了就当没有 */ }
    }
  }
  return PLACE_MEM;
}

async function savePlace(name, lat, lon) {
  // 乐观：先把这条塞进本地的 named，界面马上能看到，不等网络；并立即从 unknown 剔除
  try {
    if (!(PLACE_MEM.named || []).some((m) => m.name === name)) {

    }
    PLACE_MEM.unknown = (PLACE_MEM.unknown || []).filter((u) => distKm(u.lat, u.lon, lat, lon) > 0.3);
    try { localStorage.setItem(PLACES_LS, JSON.stringify(PLACE_MEM)); } catch (e) {}
  } catch (e) {}
  const body = { name: name, lat: lat, lon: lon };
  try {
    const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=place", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },   // 简单请求，避免 OPTIONS 预检
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    /* ★★ 2026-09-30：成功后**不再 `await loadPlaces()`**（原来会）。
       为什么：① 慢 —— 又一次跨境往返（实测 4s），而 `savePlace` 的返回值
                 被 `commit` 用来判断成败，一等就是 8s，手机上像"卡住了"；
               ② 更坏的是**会读到旧缓存** —— `api=places` 有 6h KV 缓存，
                  刚写完时那次重算可能赶上 D1 的可见性窗口，把**旧列表写回缓存**
                  ⇒ 新名字当场上消失 ⇒ 前端判 `ok=false` ⇒ 显示"没存上"
                  （用户看到的是"改了没反应/没生效"）。
       现在：写成功后**乐观状态就是权威状态**（名字已在 `PLACE_MEM` 里，是刚写进去的），
       直接 `render()` 显示；服务端 `j.msg` 原样返回给调用方显示。 */
    if (j && j.ok) { render(); bgRefreshPlaces(); return j.msg || "已记住"; }
    // 服务端明确拒了（名字太长/坐标不对）→ 不入队，这种重试也不会成功
    if (j && j.msg && !j.ok) { bgRefreshPlaces(); return j.msg; }
    wqPush("place", body);                         // 网络层失败 → 入队
    render();
    return "已记在本机，联网后自动同步";
  } catch (e) {
    wqPush("place", body);
    render();
    return "已记在本机，联网后自动同步";
  }
}
/* ★ 2026-09-30：写成功后的**后台**对账（不阻塞、不覆盖乐观状态）。
   为什么不能直接 `loadPlaces()`：见 `savePlace` 的注释（读到旧缓存会把新名字抹掉）。
   这里等 3 秒（让 D1 可见性 + KV 失效都落定）再拉一次，
   而且**只在服务端列表里没有本地已知的名字时才怀疑**，不无脑覆盖。 */

}

/* 足迹地点调色板（2026-09-30 由 6 色扩到 12 色）：
   起因：用户报「有好多相同颜色的位置」——一屏 6 个地点时，6 色循环必然出现两两撞色，
   列表里三组颜色各出现两次，根本对不上图上哪个块是哪个。
   这 12 色是**色相等分**（起点 = 原主蓝 #4a9eff 的 212.2°，步长 29.5°），
   实测最小色相距离 29.0° —— 比"随手挑 12 个好看的颜色"靠谱得多
   （第一版随手挑的，最小间距只有 0.4°，等于两个同色）。
   ⚠️ 再加色的话，继续按 360/12 的等分思路往中间插，别随便挑；
      判据是**跑脚本算两两色相距离**，不是肉眼看。 */
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to255 = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
  return `#${to255(f(0))}${to255(f(8))}${to255(f(4))}`;
}

  for (let i = 0; i < arr0.length; i++) {
    if (!isNoise(arr0[i].app)) arr.push(arr0[i]);
    else if (secOf(arr0[i]) <= 600) noise.push(arr0[i]);
  }

  // ① 先丢碎片。必须放在合并之前：
  //    「微信 → 桌面(3秒) → 微信」这种情况，桌面会把两段微信隔开；
  //    先把它丢掉，两段微信才相邻，才能在下一步合并成一段。
  //    注意：碎片的时间不能凭空扔 —— 一天里几十个 1–3 分钟的脉冲，
  //    全丢掉会让时间轴严重缩水（实测 126 分钟只剩 44 分钟）。
  //    所以丢之前先把它交给**最近的、且间隔 ≤ GAP 的**保留段。
  const kept = [], dropped = noise;
  for (let i = 0; i < arr.length; i++) {
    const s = arr[i];
    if (secOf(s) >= MIN) kept.push({ a: s.a, b: s.b, app: s.app, sec: secOf(s) });
    else dropped.push(s);
  }
  dropped.forEach((d) => {
    let best = null, bestGap = Infinity;
    for (let k = 0; k < kept.length; k++) {
      const K = kept[k];
      const gap = d.a >= K.b ? (d.a - K.b) * 3600 : (K.a >= d.b ? (K.a - d.b) * 3600 : 0);
      if (gap <= GAP && gap < bestGap) { best = K; bestGap = gap; }
    }
    if (best) { best.a = Math.min(best.a, d.a); best.b = Math.max(best.b, d.b); best.sec += secOf(d); }
  });

  // ② 再合并「同一应用且间隔 ≤ GAP」的相邻段
  //    ⚠️ 这里必须是**应用**，不是类别（2026-09-19 用户纠正）。
  //    按类别合会把「微信 → QQ → 微信」揉成一块写着"社交"的假数据；
  //    用户要的是同一个 app 的连续使用才合并。
  const out = [];
  for (let i = 0; i < kept.length; i++) {
    const s = kept[i], last = out[out.length - 1];
    if (last && sameApp(last.app, s.app) && (s.a - last.b) * 3600 <= GAP) {
      if (s.b - s.a > last.b - last.a) last.app = s.app;   // 先用较长的那个应用名（比较要在扩展之前做）
      last.sec += s.sec;
      if (s.b > last.b) last.b = s.b;
    } else {
      out.push({ a: s.a, b: s.b, app: s.app, sec: s.sec });
    }
  }

  // ③ 吸收「夹心」短段 —— 这就是「玩一会切出去又立刻回来」的聚合。
  //    三个条件缺一不可（早期版本漏了第 3 条，导致 00:12 的微信一路吞到 11:37）：
  //      1. 中间那段不长（≤ INTERRUPT）
  //      2. 前一段和后一段是**同一个应用**（原来写的是"同一类"，2026-09-19 改）
  //      3. 前一段和后一段在时间上真的挨着（间隔 ≤ GAP）—— 否则中间隔了几小时空闲，
  //         并起来就是凭空造出一大块假数据
  //    做法：前面的块延伸到后面那块的结束，中间两段并掉。反复扫到稳定。
  const INTERRUPT = 600;      // 10 分钟以内算「打断」
  let arr2 = out, again = true;
  while (again && arr2.length > 2) {
    again = false;
    for (let i = 1; i < arr2.length - 1; i++) {
      const p = arr2[i - 1], c = arr2[i], n = arr2[i + 1];
      if ((c.b - c.a) * 3600 <= INTERRUPT &&
          (n.a - p.b) * 3600 <= GAP &&
          sameApp(p.app, n.app)) {
        p.b = Math.max(p.b, n.b);
        p.sec += c.sec + n.sec;
        arr2.splice(i, 2);
        again = true;
        break;
      }
    }
  }

/* 块上的悬停说明。「跨度」和「实际用时」是两回事，别混：

     实际用时 —— 里面真正有记录的秒数（中间可能夹着别的 app，也可能有闲置）

/* ★ 下钻条形图名称归位（2026-09-22，用户要求完整应用名）。

function fixDrillNames() {

function isDisplacementActivity(text) {

  const nonDispRegex = /(?:strength|free_training|power|weight|lift|yoga|stretch|core|pilates|力量|徒手|自由训练|瑜伽|拉伸|器械|健美)/i;

function resolveSportCN(raw) {
  if (!raw) return "运动";
  const s = String(raw).trim().toLowerCase().replace(/[\s\-]+/g, "_");
  if (WORK_CN[s]) return WORK_CN[s];
  for (const prefix of ["outdoor_", "indoor_", "virtual_", "cross_"]) {
    if (s.startsWith(prefix)) {
      const sub = s.slice(prefix.length);
      if (WORK_CN[sub]) return WORK_CN[sub];
    }
  }
  if (s.includes("walk")) return "健走";
  if (s.includes("run") || s.includes("treadmill") || s.includes("jog")) return "跑步";
  if (s.includes("cycl") || s.includes("bik") || s.includes("rid") || s.includes("spin")) return "骑行";
  if (s.includes("swim")) return "游泳";
  if (s.includes("ellip")) return "椭圆";
  if (s.includes("row")) return "划船";
  if (s.includes("strength") || s.includes("lift") || s.includes("free_train")) return "力量";
  if (s.includes("fitness") || s.includes("gym") || s.includes("train") || s.includes("core")) return "健身";
  if (s.includes("ball")) return "球类";
  if (/^[a-zA-Z_\s]+$/.test(s)) return "运动";
  return raw;
}

function translateActivityName(str) {
  if (!str) return str;
  const trimmed = String(str).trim();
  if (WORK_CN[trimmed]) return WORK_CN[trimmed];
  if (/^[a-zA-Z_\-\s]+$/.test(trimmed)) {
    return resolveSportCN(trimmed);
  }
  return String(str).replace(/^([a-zA-Z]+(?:[_\-\s]+[a-zA-Z]+)*)(.*)$/, (match, words, rest) => {
    const hit = resolveSportCN(words);
    const suffix = rest || "";
    if (/^\s+/.test(suffix)) {
      return hit + " " + suffix.trim();
    }
    return hit + suffix;
  });
}

function workLine(w) {

/* ---- 悬停提示：鼠标靠近图表就显示这天的具体数字 ----

let tipEl = null;
function tipMove(e) {

  const scrub = e.target && e.target.closest ? e.target.closest(".scrub") : null;
  if (scrub) {

function sleepCols(rows, o) {

     以前只按 sleepMin 量 —— 于是"全天只有小睡"的那天（实测 8-18 = 176 分、
     9-05 = 40 分）sleepMin 是 0，柱子矮到贴地、图上什么都读不出来

      if (hasStages) {

          <i style="height:${pc(r.light || 0)}%;background:var(--light)"></i>
          <i style="height:${pc(r.deep)}%;background:var(--deep)"></i>`;

      }
