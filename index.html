        // 日到周：今日列静止，其他 6 列从左边平滑滑入（360ms）
        if (isDayToWeek) {
          _tlAnim = "d2w";
          await performUpdate();
          setTimeout(() => {
            const ntc = document.querySelector("#view .gv-scroll");
            if (ntc) ntc.classList.remove("tl-switch-d2w");
            _tlAnim = null;
            _tlSwitchBusy = false;
          }, 360);
          return;
        }

        // 月视图等其他视图切换：平滑过渡
        if (typeof document !== "undefined" && typeof document.startViewTransition === "function") {
          const tc = document.querySelector("#view .gv-scroll, #view .mv-wrap") || document.querySelector("#view .sec > .card");
          if (tc) tc.style.viewTransitionName = "tl-timeline-view";
          try {
            const transition = document.startViewTransition(async () => {
              await performUpdate();
              const ntc = document.querySelector("#view .gv-scroll, #view .mv-wrap") || document.querySelector("#view .sec > .card");
              if (ntc) ntc.style.viewTransitionName = "tl-timeline-view";
            });
            await transition.finished;
          } catch (_) {
          } finally {
            const finalTc = document.querySelector("#view .gv-scroll, #view .mv-wrap") || document.querySelector("#view .sec > .card");
            if (finalTc) finalTc.style.viewTransitionName = "";
            _tlSwitchBusy = false;
          }
          return;
        }

        // 降级处理：无 startViewTransition 时，同步淡出淡入，消灭异步等待造成的瞬移
        const targetContainer = document.querySelector("#view .gv-scroll, #view .mv-wrap") || document.querySelector("#view .sec > .card");
        if (targetContainer) {
          targetContainer.classList.add("tl-view-morph-out");
          await new Promise((r) => setTimeout(r, 100));
        }
        await performUpdate();
        const newTargetContainer = document.querySelector("#view .gv-scroll, #view .mv-wrap") || document.querySelector("#view .sec > .card");
        if (newTargetContainer) {
          newTargetContainer.classList.remove("tl-view-morph-out");
          newTargetContainer.classList.add("tl-view-morph-in");
          setTimeout(() => {
            newTargetContainer.classList.remove("tl-view-morph-in");
            _tlSwitchBusy = false;
          }, 180);
        } else {
          _tlSwitchBusy = false;
        }
      };
    });
    document.querySelectorAll(".mv-d, .mv-hbar-row").forEach((el) => {
      el.onclick = () => openDay(el.dataset.day);
    });
    const zin = $("#zin"), zout = $("#zout"), zrst = $("#zrst");
    if (zin) zin.onclick = () => zoomGV(1.2);
    if (zout) zout.onclick = () => zoomGV(1 / 1.2);
    if (zrst) zrst.onclick = () => {
      gvH = gvDefault(tlView, tlView === "week" ? 7 : 1);
      render();
      viewSave();        // B5
    };
    const ct = $("#cattog");
    if (ct) ct.onclick = () => {
      showCats = !showCats;
      catFocusPending = showCats;   // 只在"展开"时把焦点交给搜索框
      render();
    };
    // 图例 → 点一下隐藏该层、再点一下显示。先本地立即翻转重绘（不等云端往返），
    // 再异步 saveRules() 同步过去；存不上也只是换台设备不生效，不影响这一台。
    document.querySelectorAll(".gv-legend .lg").forEach((el) => {
      el.onclick = () => { toggleLayer(el.dataset.layer); render(); saveRules(); };
    });
    // 饼图：点扇形 / 图例行 → 下钻；点「返回总览」（中心或条形图上方）→ 收回。
    // 事件委托挂在卡片上（扇形 g、图例行、返回按钮都在 #piecard 里）。
    const pcard = $("#piecard");
    if (pcard) fixDrillNames();   // ★ 下钻条形图的名称归位（要在插入 DOM 后实测，见函数注释）
    // ★ 点下钻条形图的一行 → 这个进程的详情框（2026-09-22 用户要求）：
    //   这一周/今天（取决于视图）它每次使用的时段 + 在哪个设备 + 类别修改。
    //   防误触同色块（拖动横向滚动后抬手也会发 click，位移 >6px 不算）。
    //   「其他 N 个应用」没有原始键（data-raw=null）→ 不弹，它本来就不是单个进程。
    document.querySelectorAll(".pie-drill .pd-row").forEach((el) => {
      let dx = 0, dy = 0, sx = 0, sy = 0;
      el.onmousedown = (e) => { sx = e.clientX; sy = e.clientY; };
      el.onmouseup = (e) => { dx = Math.abs(e.clientX - sx); dy = Math.abs(e.clientY - sy); };
      el.style.cursor = "pointer";
      el.onclick = () => {
        if (dx + dy > 6) return;
        let raws = null;
        try { raws = JSON.parse(el.dataset.raw || "null"); } catch (e) { raws = null; }
        if (!raws || !raws.length) return;
        /* ⚠️ srcRow 里是**行对象**（x.day 才是日期），饼图收的就是映射后的日期串 ——
           这里必须同样映射，否则 sessOf(对象) 查不到、时段清单永远是空的
           （2026-09-22 实测踩到：弹层能开、类别能改，就是清单空白）。 */
        openAppEdit(raws[0].app, {
          apps: raws.map((r) => r.app),
          spans: spansForRaws(srcRow.map((x) => x.day), raws),
        });
      };
    });
    if (pcard) pcard.onclick = (ev) => {
      const t = ev.target.closest("[data-cat], [data-pieback]");
      if (!t) return;
      if (t.dataset.pieback != null) pieDrill = null;
      else pieDrill = t.dataset.cat;
      render();
    };
    const lgr = $("#lgreset");
    if (lgr) lgr.onclick = () => { showAllLayers(); render(); saveRules(); };
    popKey = null;                         // 退出弹层模式（判据是 #pop 的 .on，这里只是清引用）
    if (catPanel) bindCats();
    // 点色块 → 快捷设置。
    // 要防误触：时间轴可以横向拖，拖完抬手也会发一次 click —— 位移超过 6px 就不算点击。
    document.querySelectorAll(".gv-blk[data-app]").forEach((el) => {
      let dx = 0, dy = 0, sx = 0, sy = 0;
      el.onmousedown = (e) => { sx = e.clientX; sy = e.clientY; };
      el.onmouseup = (e) => { dx = Math.abs(e.clientX - sx); dy = Math.abs(e.clientY - sy); };
      // ★ 2026-09-21 晚：把这一块自己的「设备 + 起止 + 时长」一起带进弹层
      //   （用户要求：「点击色块详情的时候显示开始和结束的时间，和显示是手机还是电脑」）。
      //   块上已经不印时间了，信息全部搬到弹层里 —— 所以这四个 data-* 是**唯一来源**，
      //   改 gridView 里的 blk.push 时要一起改。
      el.onclick = () => { if (dx + dy <= 6) openAppEdit(el.dataset.app, {
        dev: el.dataset.dev, ta: el.dataset.ta, tb: el.dataset.tb, span: el.dataset.span,
      }); };
    });

    // 底色块（睡眠、运动、课程）及左侧标签点击 → 弹出结构化详情抽屉 (阻断冒泡，防误触)
    document.querySelectorAll(".gv-blk[data-tid], .gv-tag[data-tid]").forEach((el) => {
      let dx = 0, dy = 0, sx = 0, sy = 0;
      el.onmousedown = (e) => { sx = e.clientX; sy = e.clientY; };
      el.onmouseup = (e) => { dx = Math.abs(e.clientX - sx); dy = Math.abs(e.clientY - sy); };
      el.onclick = (e) => {
        e.stopPropagation();
        if (dx + dy <= 8) {
          const tid = el.dataset.tid;
          if (tid && window._tlItems && window._tlItems.has(tid)) {
            const it = window._tlItems.get(tid);
            if (typeof showTimelineUnderDetail === "function") {
              showTimelineUnderDetail(it);
            }
          }
        }
      };
    });
  }

  else if (tab === "foot") {
    if (tab !== "foot") return;
    await renderFootprint(v, traces, isTabSwitch);
    if (tab !== "foot") return;
  }

  else if (tab === "me") {
    renderMeTab(v, isTabSwitch);
  }


  /* ★ 量一下时间线容器**真实可用宽度**，供刻度自适应（见 gridView 里那份注释）。
     必须在 v.innerHTML 之后 —— 量的是布局算完的宽度，不是声明值。
     首次进入时 gvW 还是初值 900，量出来若和实际差得多，就自己再渲染一次
     —— 只重绘一次（gvMeasured 标记），不会循环。
     ⚠️ 一定要 requestAnimationFrame：render 里 v.innerHTML 刚设完，
        同一帧内 layout 还没跑，此时读 clientWidth 拿到的是 0。 */
  requestAnimationFrame(() => {
    const box = document.querySelector("#view .gv-scroll") ||
                document.querySelector("#view .card");
    if (!box) return;
    const w = Math.round(box.clientWidth || 0);
    if (w > 0 && Math.abs(w - gvW) > 24) {
      gvW = w;
      if (!gvMeasured) { gvMeasured = true; render(); }
    }
  });
  } catch (renderError) {
    console.error("[ErrorBoundary] render() 全局容灾拦截:", renderError);
    const v = $("#view");
    if (v) {
      v.innerHTML = `
        <div class="sec" style="padding: 24px 16px; text-align: center;">
          <div class="card error-boundary-card" style="border: 1px dashed rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.04); padding: 24px; border-radius: 16px; max-width: 480px; margin: 0 auto;">
            <div style="color: #f87171; font-size: 16px; font-weight: 700; margin-bottom: 8px;">看板渲染遇到非预期异常</div>
            <div style="color: var(--dim); font-size: 12.5px; line-height: 1.5; margin-bottom: 16px;">
              当前日期或板块数据解析中断。您可以尝试刷新视图或重新同步。
            </div>
            <div style="display:flex;justify-content:center;gap:10px;">
              <button class="mini-btn" onclick="render()" style="padding:6px 16px;font-size:12px;">重试渲染</button>
              <button class="mini-btn" onclick="clearLocalSnapshotCache()" style="padding:6px 16px;font-size:12px;">清除缓存重试</button>
            </div>
          </div>
        </div>
      `;
    }
  }
}
/* 窗口尺寸变了 → 刻度步长可能要换档。这里刻意**不**立刻重绘（拖窗口会重绘几十次），
   只更新 gvW；真正的重绘等下一次交互。想立刻看到效果就切一下日/周/月。
   ⚠️ 也不能用 debounce 之后重绘：render() 是 async 且会打接口，
      拖一次窗口打几十次接口不值得。 */
window.addEventListener("resize", () => {
  const box = document.querySelector("#view .gv-scroll") || document.querySelector("#view .card");
  const w = box ? Math.round(box.clientWidth || 0) : 0;
  if (w > 0) gvW = w;
});

function getDaysInRange(startDate, endDate) {
  if (!startDate || !endDate) return [];
  const days = [];
  const curr = new Date(startDate + "T00:00:00Z");
  const end = new Date(endDate + "T00:00:00Z");
  if (isNaN(curr.getTime()) || isNaN(end.getTime()) || curr > end) return days;
  while (curr <= end) {
    days.push(curr.toISOString().slice(0, 10));
    curr.setUTCDate(curr.getUTCDate() + 1);
  }
  return days;
}

function downloadBlob(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1000);
}

async function exportFullBackupJSON(startDate, endDate) {
  showToast("正在导出全量备份 JSON…");
  const cachedData = {};
  if (typeof _dayCache !== "undefined" && _dayCache && _dayCache instanceof Map) {
    _dayCache.forEach((val, k) => {
      if (!startDate || !endDate || (k >= startDate && k <= endDate)) {
        cachedData[k] = val;
      }
    });
  }

  if (startDate && endDate) {
    const rangeDays = getDaysInRange(startDate, endDate);
    if (rangeDays.length <= 31) {
      const missing = rangeDays.filter(d => !cachedData[d]);
      if (missing.length > 0) {
        await Promise.all(missing.map(async (d) => {
          if (d === curDay && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
            cachedData[d] = CUR_DAY_DATA.d || CUR_DAY_DATA;
            return;
          }
          try {
            const fetched = await apiGet(new URLSearchParams({ k: KEY, api: "day", d }));
            if (fetched) cachedData[d] = fetched;
          } catch (_) {}
        }));
      }
    }
  }

  let trendsData = (typeof TREND !== "undefined" && TREND) ? TREND : [];
  if (startDate && endDate && TREND && Array.isArray(TREND.full)) {
    const indices = [];
    TREND.full.forEach((d, idx) => {
      if (d >= startDate && d <= endDate) indices.push(idx);
    });
    const filteredTrend = { ...TREND };
    Object.keys(filteredTrend).forEach(key => {
      if (Array.isArray(filteredTrend[key]) && filteredTrend[key].length === TREND.full.length) {
        filteredTrend[key] = indices.map(i => filteredTrend[key][i]);
      }
    });
    trendsData = filteredTrend;
  }

  const fullBackup = {
    backupVersion: typeof VERSION !== "undefined" ? VERSION : "1.0",
    exportedAt: new Date().toISOString(),
    filterRange: (startDate && endDate) ? { startDate, endDate } : "all",
    profile: (currentRoutineCfg && currentRoutineCfg.profile) || (typeof DEFAULT_USER_PROFILE !== "undefined" ? DEFAULT_USER_PROFILE : {}),
    routineConfig: currentRoutineCfg || {},
    rules: (typeof RULES !== "undefined") ? RULES : {},
    places: (typeof PLACE_MEM !== "undefined") ? PLACE_MEM : {},
    memories: (typeof MEM !== "undefined") ? MEM : [],
    trends: trendsData,
    dayCache: cachedData,
    currentDay: curDay
  };
  const jsonContent = JSON.stringify(fullBackup, null, 2);
  const fname = (startDate && endDate) ? `steward-backup-${startDate}_${endDate}.json` : `steward-backup-${curDay || "full"}.json`;
  downloadBlob(jsonContent, fname, "application/json;charset=utf-8");
  showToast("全量备份 JSON 已导出");
}

async function exportDietCSV(startDate, endDate) {
  showToast("正在导出就餐明细…");
  const rows = [["日期", "时间", "餐次", "菜品名称", "规格", "热量(kcal)", "蛋白质(g)", "碳水化合物(g)", "脂肪(g)", "单价(元)", "备注"]];
  let targetDays = [];
  if (startDate && endDate) {
    const rangeDays = getDaysInRange(startDate, endDate);
    rangeDays.forEach(day => {
      if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
        const idx = TREND.full.indexOf(day);
        if (idx >= 0) {
          const kcal = (TREND.dietKcal && TREND.dietKcal[idx]) || 0;
          if (kcal > 0) targetDays.push(day);
          return;
        }
      }
      if (rangeDays.length <= 45) {
        targetDays.push(day);
      }
    });
  } else {
    if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
      TREND.full.forEach((day, i) => {
        const kcal = (TREND.dietKcal && TREND.dietKcal[i]) || 0;
        if (kcal > 0) targetDays.push(day);
      });
    }
  }

  if (curDay && (!startDate || curDay >= startDate) && (!endDate || curDay <= endDate) && !targetDays.includes(curDay)) {
    targetDays.push(curDay);
  }
  if (typeof TODAY !== "undefined" && TODAY && (!startDate || TODAY >= startDate) && (!endDate || TODAY <= endDate) && !targetDays.includes(TODAY)) {
    targetDays.push(TODAY);
  }

  targetDays = Array.from(new Set(targetDays)).sort();

  const dayDataMap = new Map();
  for (let i = 0; i < targetDays.length; i += 8) {
    const chunk = targetDays.slice(i, i + 8);
    await Promise.all(chunk.map(async (day) => {
      if (day === curDay && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
        dayDataMap.set(day, CUR_DAY_DATA.d || CUR_DAY_DATA);
        return;
      }
      if (typeof _dayCache !== "undefined" && _dayCache && _dayCache instanceof Map && _dayCache.has(day)) {
        const c = _dayCache.get(day);
        dayDataMap.set(day, c && c.data ? c.data : c);
        return;
      }
      try {
        const fetched = await apiGet(new URLSearchParams({ k: KEY, api: "day", d: day }));
        if (fetched) dayDataMap.set(day, fetched);
      } catch (e) {}
    }));
  }

  const sortedDays = Array.from(dayDataMap.keys()).sort();
  sortedDays.forEach(day => {
    const d = dayDataMap.get(day);
    if (!d || !d.diet || !Array.isArray(d.diet.meals)) return;
    d.diet.meals.forEach(m => {
      const tm = (typeof formatToBeijingHHMM === "function")
        ? formatToBeijingHHMM(m.stamp, m.time)
        : (m.time || (m.stamp ? m.stamp.slice(11, 16) : ""));
      const cat = m.cat || m.meal || "正餐";
      const dish = (m.dish || m.name || "").replace(/"/g, '""');
      const spec = (m.spec || "").replace(/"/g, '""');
      const cal = m.calories || m.kcal || 0;
      const p = m.protein || 0;
      const c = m.carbs || 0;
      const f = m.fat || 0;
      const price = m.price != null ? m.price : "";
      const note = (m.note || "").replace(/"/g, '""');
      rows.push([`"${day}"`, `"${tm}"`, `"${cat}"`, `"${dish}"`, `"${spec}"`, cal, p, c, f, price, `"${note}"`]);
    });
  });

  if (rows.length === 1) {
    showToast("选定时间范围内暂无可导出的就餐明细");
    return;
  }
  const csvContent = "\uFEFF" + rows.map(r => r.join(",")).join("\r\n");
  const fname = (startDate && endDate) ? `steward-diet-${startDate}_${endDate}.csv` : `steward-diet-${curDay || "records"}.csv`;
  downloadBlob(csvContent, fname, "text/csv;charset=utf-8");
  showToast(`就餐明细 CSV 已导出（共 ${rows.length - 1} 笔流水）`);
}

async function exportBiometricsCSV(startDate, endDate) {

  if (days.length === 0) {
    showToast("所选时间范围无效");
    return;
  }

  if (days.length <= 31) {
    const missingDays = days.filter(day => {
      const inCache = (typeof _dayCache !== "undefined" && _dayCache && _dayCache instanceof Map && _dayCache.has(day));
      const inCur = (day === curDay && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA);
      const inTrend = (TREND && Array.isArray(TREND.full) && TREND.full.includes(day));
      return !inCache && !inCur && !inTrend;
    });
    if (missingDays.length > 0) {

        }));
      }

  }

  days.forEach((day) => {

    if (typeof _dayCache !== "undefined" && _dayCache && _dayCache instanceof Map && _dayCache.has(day)) {
      const c = _dayCache.get(day);
      d = c && c.data ? c.data : c;
    }
    if (!d && day === curDay && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {

    const light = (d && d.light) || (trendIdx >= 0 && TREND.light && TREND.light[trendIdx]) || 0;
    const rem = (d && d.rem) || (trendIdx >= 0 && TREND.rem && TREND.rem[trendIdx]) || 0;
    const nap = (d && d.napMin) || (trendIdx >= 0 && TREND.napMin && TREND.napMin[trendIdx]) || 0;
    const w = (d && d.body && (d.body.weight || d.body.weight_kg)) || (trendIdx >= 0 && TREND.weight && TREND.weight[trendIdx]) || prof.weight || "";
    const bmr = (typeof calculateUserBmr === "function") ? calculateUserBmr(prof, day) : "";
    const diet = (d && d.diet && d.diet.totalKcal) || (trendIdx >= 0 && TREND.dietKcal && TREND.dietKcal[trendIdx]) || 0;
    rows.push([`"${day}"`, steps, active, rhr, sleep, deep, light, rem, nap, w, bmr, diet]);

}

async function exportTimelineCSV(startDate, endDate) {
  showToast("正在导出时间线明细…");
  const rows = [["日期", "开始时刻", "结束时刻", "时长(分钟)", "类别", "应用名称", "设备"]];
  let targetDays = [];
  if (startDate && endDate) {
    targetDays = getDaysInRange(startDate, endDate);
  } else {
    targetDays = (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full))
      ? TREND.full.slice(-7)
      : [curDay || new Date().toISOString().slice(0, 10)];
    if (curDay && !targetDays.includes(curDay)) targetDays.push(curDay);
  }

  if (targetDays.length === 0) {
    showToast("所选时间范围无效");
    return;
  }

  const dayDataMap = new Map();
  for (let i = 0; i < targetDays.length; i += 8) {
    const chunk = targetDays.slice(i, i + 8);
    await Promise.all(chunk.map(async (day) => {
      if (day === curDay && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
        dayDataMap.set(day, CUR_DAY_DATA.d || CUR_DAY_DATA);
        return;
      }
      if (typeof _dayCache !== "undefined" && _dayCache && _dayCache instanceof Map && _dayCache.has(day)) {
        const c = _dayCache.get(day);
        dayDataMap.set(day, c && c.data ? c.data : c);
        return;
      }
      try {
        const fetched = await apiGet(new URLSearchParams({ k: KEY, api: "day", d: day }));
        if (fetched) dayDataMap.set(day, fetched);
      } catch (e) {}
    }));
  }

  const sortedDays = Array.from(dayDataMap.keys()).sort();
  sortedDays.forEach(day => {
    const d = dayDataMap.get(day);
    let items = [];
    if (d && Array.isArray(d.timeline)) {
      items = d.timeline;
    } else {
      const sess = (d && (d.sessions || d.ses)) || (typeof sessOf === "function" ? sessOf(day) : null);
      if (sess) {
        if (Array.isArray(sess.pc)) {
          sess.pc.forEach(s => items.push({ ...s, ph: false }));
        }
        if (Array.isArray(sess.phone)) {
          sess.phone.forEach(s => items.push({ ...s, ph: true }));
        }
      }
    }
    if (!items.length) return;
    items.sort((x, y) => (x.a || 0) - (y.a || 0));
    items.forEach(item => {
      const startT = (typeof hm === "function" && item.a != null) ? hm(item.a) : (item.a || "");
      const endT = (typeof hm === "function" && item.b != null) ? hm(item.b) : (item.b || "");
      const durMin = item.sec != null ? Math.round(item.sec / 60) : Math.round(((item.b - item.a) || 0) * 60);
      const cat = (item.cat || (typeof catOf === "function" ? catOf(item.app) : "") || "").replace(/"/g, '""');
      const app = (item.app || "").replace(/"/g, '""');
      const device = item.ph ? "手机" : "电脑";
      rows.push([`"${day}"`, `"${startT}"`, `"${endT}"`, durMin, `"${cat}"`, `"${app}"`, `"${device}"`]);
    });

/* ★★ 2026-10-31 修：「清除缓存重试」原来清不掉真正的权威层。
   踩过的坑：只清了 _dayCache / steward.snapshot.v2 / steward_day_*，而 fetchDayData
   真正的第一命中点是 IndexedDB（steward_idb_v1 / days），其次是 localStorage 的
   steward.cache.day.* 与 steward.diet.*。内存清完立刻又被 IDB 的旧数据填回来，
   用户看到的就是「清了缓存还是旧数据」。现在按「易失 → 持久」顺序全清。
   ⚠️ 清洁工守则：
     1) 不许用 localStorage.clear() —— steward.key 口令也在里面，清掉等于把用户踢下线。
        （steward.diet.dirty.* 属于 steward.diet. 前缀，会被一并清掉，这是「回到干净状态」的应有之义，
          代价见下。）
     2) 每一步独立 try/catch，任何一步失败都不能阻断后面的步骤，更不能让错误边界再次翻车。
     3) IDB 清理必须带超时兜底：StewardIDB.getDB() 的 open 没有 onblocked 回调，
        多标签页占着旧连接时 Promise 可能永不 resolve —— 不加 race 就会卡在这里，
        render() 永远不执行，按钮点下去像死了一样。
   后果告知（清 steward.diet.* 的代价）：localStorage 里的
   steward.diet.dirty.<day> 脏标记会一起消失，syncDayDietFromCloud 因此失去
   「本地改过、还没同步成功」的保护 —— 若此刻真有未上报的饮食改动，下一次云端同步
   可能用云端数据覆盖它。用户按这个按钮的语义就是「我要回到干净状态、以云端为准」，
   所以这里保留清理，但要知道它是有损的。 */
async function clearLocalSnapshotCache() {
  if (!confirm("确定清除本地缓存快照并重新拉取最新云端数据？")) return;

  // 1. 内存层
  try {
    if (typeof _dayCache !== "undefined" && _dayCache && _dayCache instanceof Map) {
      _dayCache.clear();
    }
  } catch (e) {}

  // 1.5 足迹轨迹的按天/按周双层缓存（04_footprint_core.js）
  //     它们是**独立于 _dayCache** 的一套内存缓存，上面清掉 _dayCache 不会带着它们走：
  //     不清的话「清除缓存重试」之后，周视图仍会用旧轨迹画历史行（按天缓存无 TTL）。
  try {
    if (typeof _tracesCache !== "undefined" && _tracesCache) {
      Object.keys(_tracesCache).forEach((k) => { delete _tracesCache[k]; });
    }
    if (typeof _weekTracesCache !== "undefined" && _weekTracesCache && _weekTracesCache.clear) {
      _weekTracesCache.clear();
    }
  } catch (e) {}

  // 2. 启动快照（老格式，留一个移除兜底）
  try { localStorage.removeItem("steward.snapshot.v2"); } catch(e) {}

  // 3. sessionStorage 的按日缓存（steward_day_<day>）
  try {
    if (typeof sessionStorage !== "undefined") {
      for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const k = sessionStorage.key(i);
        if (k && k.startsWith("steward_day_")) sessionStorage.removeItem(k);
      }
    }
  } catch (e) {}

  // 4. localStorage 的按日权威缓存与饮食本地层
  //    steward.cache.day.<day>  → saveHistoricalDayCache（IDB 不可用时的降级落点）
  //    steward.diet.<day>       → loadDayDietLocal / saveDayDietLocal
  //    steward.diet.dirty.<day> → isDietModified 脏标记（一并清，见上方后果告知）
  try {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith("steward.cache.day.") || k.startsWith("steward.diet."))) doomed.push(k);
    }
    for (const k of doomed) {
      try { localStorage.removeItem(k); } catch (e) {}
    }
  } catch (e) {}

  // 5. IndexedDB（真正让「旧数据复活」的一层）
  try {
    if (typeof StewardIDB !== "undefined" && StewardIDB && typeof StewardIDB.clear === "function") {
      const p = Promise.resolve(StewardIDB.clear()).catch(() => false);
      await Promise.race([p, new Promise((r) => setTimeout(() => r(false), 1500))]);
    }
  } catch (e) {
    console.warn("[clearCache] IndexedDB 清理失败，已跳过:", e);
  }

  showToast("本地缓存已清理，正在重新拉取...");
  render();
}

/* 把遥测里的 ISO 时间转成北京时间 "YYYY-MM-DD HH:MM"。
   顶层函数声明（不是 const）—— renderMeTab 和 manualRefreshTelemetry 都要用，
   放在 renderMeTab 内部时后者够不着（2026-11-07 踩到）。 */
function formatTelemetryTime(raw) {
  if (!raw) return "";
  try {
    const d = new Date(raw);
    if (isNaN(d.getTime())) return String(raw).slice(0, 16);
    const beijingMs = d.getTime() + (d.getTimezoneOffset() + 480) * 60000;
    const bDate = new Date(beijingMs);
    const y = bDate.getFullYear();
    const m = String(bDate.getMonth() + 1).padStart(2, "0");
    const day = String(bDate.getDate()).padStart(2, "0");
    const h = String(bDate.getHours()).padStart(2, "0");
    const min = String(bDate.getMinutes()).padStart(2, "0");
    return `${y}-${m}-${day} ${h}:${min}`;
  } catch (e) {
    return String(raw).slice(0, 16);
  }
}

async function manualRefreshTelemetry(btn) {
  if (btn) {
    btn.disabled = true;
    const svg = btn.querySelector("svg");
    if (svg) svg.classList.add("sk-spin");
  }
  try {
    if (typeof fetchTelemetry === "function") {
      /* ★★ 2026-11-07：以前这里无条件弹「D1 遥测已同步刷新」，
         而 fetchTelemetry 内部把异常全吞了 —— 网络失败、口令错误、云端没响应，
         用户看到的都是"刷新成功 + 数据没变"。用户原话「他说一刷新可是还是旧的数据」。
         现在按真实结果分三种话术，第三种是常态：遥测由电脑端每 20 分钟上报一次，
         刷新只能读到最近一次的值，绝不能谎称"刚刚的"。 */
      const prevAt = TELEMETRY && TELEMETRY.updatedAt;
      await fetchTelemetry(true);
      const t = TELEMETRY || {};
      const at = formatTelemetryTime(t.updatedAt) || "未知";
      if (typeof _telemetryOk !== "undefined" && !_telemetryOk) {
        if (typeof showToast === "function") showToast("刷新失败：读不到云端遥测，稍后再试");
      } else if (t.updatedAt && t.updatedAt !== prevAt) {
        if (typeof showToast === "function") showToast("已刷新，遥测更新于 " + at);
      } else {
        if (typeof showToast === "function") {
          showToast("云端遥测仍是 " + at + "（电脑端每 20 分钟同步一轮）");
        }
      }
    }
  } catch (e) {
    if (typeof showToast === "function") showToast("刷新遥测失败: " + e.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      const svg = btn.querySelector("svg");
      if (svg) svg.classList.remove("sk-spin");
    }
  }
}


function copyText(t, btn) {
  const done = () => {
    if (!btn) return;
    const o = btn.textContent;
    btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = o; }, 1200);
  };
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) { if (btn) btn.textContent = "复制失败，长按选中吧"; }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, fallback);
      return;
    }
  } catch (e) { /* 落到下面 */ }
  fallback();
}

/* Ctrl + 滚轮 缩放时间轴：以鼠标指针正对的时间刻度为绝对物理锚点 */
document.addEventListener("wheel", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const t = e.target;
  if (!t || typeof t.closest !== "function") return;
  const pop = document.getElementById("pop");
  const inPop = (pop && pop.classList.contains("on") && t.closest("#pop")) ? pop : null;
  const targetTL = inPop ? inPop.querySelector(".gv") : t.closest(".gv, .gv-scroll");
  if (!inPop && !targetTL) return;

  // 1. 精确获取承载 00:00~24:00 真实高度的时间网格 .gv-grid
  const grid = inPop ? inPop.querySelector(".gv-grid") : document.querySelector(".gv-grid");
  if (!grid) return;
  const gridRect = grid.getBoundingClientRect();
  if (gridRect.height <= 0) return;

  // 精确计算鼠标指针在时间线网格内部的比例：const ratio = (e.clientY - gridRect.top) / gridRect.height;
  const ratio = Math.max(0, Math.min(1, (e.clientY - gridRect.top) / gridRect.height));
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  if (inPop) zoomPop(factor, ratio);
  else zoomGV(factor, ratio);

    }
  }

  if (!_sw || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - _sw.x, dy = t.clientY - _sw.y;
  if (!_sw.on) {
    if (Math.abs(dx) < 10) return;
    if (Math.abs(dx) < Math.abs(dy) * 1.3) { _sw = null; return; }   // 纵向意图 → 放行滚动
    /* ★ 时间线 / 月视图的横向滚动容器：这个方向上**还能滚**就让给它滚（不接管）；
       已经滚到边了才由我们接管切板块 —— 这正是"滑到边再滑一下＝翻页"的手感。
       ⚠️ 窄屏下 .gv-scroll 的 .gv 是 min-width:0（不溢出），room≈0 → 直接就能切板块。 */
    if (_sw.sc) {
      const room = _sw.sc.scrollWidth - _sw.sc.clientWidth;
      const toRight = dx < 0;                     // 手指左滑 = 想看右边的内容
      const canScroll = room > 1 &&
        (toRight ? _sw.sc.scrollLeft < room - 1 : _sw.sc.scrollLeft > 1);
      if (canScroll) { _sw = null; return; }
    }
    _sw.on = true;
    const v = $("#view");
    if (v) { v.style.transition = "none"; v.style.willChange = "transform"; }
  }
  e.preventDefault();                              // 接管：别让页面横滑 / 触发返回手势
  _sw.raw = dx;                                    // 原始位移（松手时按它判要不要切）
  const i = TAB_ORDER.indexOf(tab);
  const j = swipeNext(dx, i, TAB_ORDER.length);
  _sw.dx = dx * (j === -1 ? 0.28 : 0.55);          // 跟手位移：到边界加阻尼（滑不动的手感）
  const v = $("#view");
  if (v) v.style.transform = "translateX(" + _sw.dx + "px)";
}, { passive: false });

function _swEnd(allowSwitch) {
  const v = $("#view");
  const raw = _sw ? _sw.raw : 0;
  const i = TAB_ORDER.indexOf(tab);
  const j = swipeNext(raw, i, TAB_ORDER.length);
  const th = Math.min(90, innerWidth * 0.22);      // 阈值：22% 宽（封顶 90px），按**原始位移**判
  const act = !!(_sw && _sw.on && allowSwitch && j !== -1 && Math.abs(raw) >= th);
  _sw = null;
  if (!v) return;
  if (act) {
    const dir = raw < 0 ? 1 : -1;                   // 左滑 = 下一个板块
    /* ① 旧内容**快速淡出** —— 不能让它在原地等：否则"滑过去看到的还是旧板块"
       （用户实测："像有两个时间线板块"）。 */
    v.style.transition = "transform .13s ease-in,opacity .13s ease-in";
    v.style.transform = "translateX(" + (-dir * 30) + "px)";
    v.style.opacity = "0";
    /* ② 等**新内容真画好**再滑入 —— render() 是 async，原来用固定 150ms 定时器，
       滑进来的其实还是旧 DOM，一两秒后才"突变"成新板块。现在改成渲染完成回调。 */
    switchTab(TAB_ORDER[j]).then((ok) => {
      if (!ok) return;                              // 已被更新的一次切走 → 不做这次入场
      v.style.transition = "none";
      v.style.transform = "translateX(" + (dir * 34) + "px)";   // 新板块从对侧滑入
      void v.offsetWidth;                           // 强制 reflow，让下一帧的过渡生效
      v.style.transition = "transform .2s cubic-bezier(.2,.7,.3,1),opacity .2s ease-out";
      v.style.transform = "translateX(0)";
      v.style.opacity = "1";
      setTimeout(() => { v.style.willChange = ""; }, 280);
    });
  } else {
    v.style.transition = "transform .2s ease-out";
    v.style.transform = "translateX(0)";
    v.style.opacity = "1";
    setTimeout(() => { v.style.willChange = ""; }, 280);
  }
}
document.addEventListener("touchend", (e) => {
  if (_pinch) {
    if (!e.touches || e.touches.length < 2) {
      _pinchEnd();
    }
    return;
  }
  if (_touchStartY != null) {
    const endT = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]);
    if (endT) {
      const downDist = endT.clientY - _touchStartY;
      if (downDist > 12) {
        const sY = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
        if (sY > 20) {
          updateStickyDateStrip(sY, -downDist);
        }
      }
    }
  }
  if (_pull && _pull.top <= 8) {
    const endT = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]);
    if (endT) {
      const pdy = endT.clientY - _pull.y;
      const pdx = endT.clientX - _pull.x;
      if (pdy > 70 && Math.abs(pdy) > Math.abs(pdx) * 1.5) {

              invalidateDayCache(curDay);
            }
          }
          triggerOnDemandBandSync({ force: true });
        }
      }
    }
  }
  _pull = null;
  _touchStartY = null;
  _touchLastY = null;
  if (!_sw) return;
  if (e.touches && e.touches.length) return;       // 还有别的手指按着 → 不算抬手
  _swEnd(true);
}, { passive: true });
document.addEventListener("touchcancel", () => {
  if (_pinch) _pinchEnd();
  if (_sw) _swEnd(false);
  _pull = null;
  _touchStartY = null;
  _touchLastY = null;
}, { passive: true });

document.addEventListener("gesturestart", (e) => {

async function saveRoutineConfigSilently() {
  if (!currentRoutineCfg) currentRoutineCfg = {};
  const gEl = document.getElementById("cfg-profile-gender");
  const bEl = document.getElementById("cfg-profile-birth");
  if (gEl && bEl) {
    currentRoutineCfg.profile = {
      gender: gEl.value || "male",
      birth: bEl.value || "2008-04-28",
      height: 181,
      weight: (typeof getLatestScaleWeight === "function") ? getLatestScaleWeight() : 80.4
    };
  }
  if (currentRoutineCfg.routineBreakfast) delete currentRoutineCfg.routineBreakfast;
  persistRoutineConfigLocally();
  try {
    await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=routine_config", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(currentRoutineCfg)
    });
  } catch (e) {
    console.error("静默保存失败", e);
  }
}

function editRoutineSupp(idx) {
  if (!currentRoutineCfg || !Array.isArray(currentRoutineCfg.supplements)) return;
  const oldName = currentRoutineCfg.supplements[idx];
  if (!oldName) return;
  const newName = prompt("修改补剂名称与规格：", oldName);
  if (newName === null) return;
  const trimmed = newName.trim();
  if (!trimmed) {
    alert("补剂名称不能为空");
    return;
  }
  if (trimmed === oldName) return;

  currentRoutineCfg.supplements[idx] = trimmed;
  persistRoutineConfigLocally();
  saveRoutineConfigSilently();

  // 若今日打卡记录中有该补剂，级联更新名称
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.supplements)) {

    }
  }

  renderRoutineModal();
  render();
  showToast(`已更新补剂：${trimmed}`);
}

function saveEditQuickFoodPreset() {
  if (editQuickFoodIndex === null || !currentRoutineCfg || !Array.isArray(currentRoutineCfg.quickFoods)) return;
  const nameInp = document.getElementById("edit-qf-name");
  if (!nameInp) return;
  const name = nameInp.value.trim();
  if (!name) {
    alert("单品名称不能为空");
    return;
  }
  const specInp = document.getElementById("edit-qf-spec");
  const calInp = document.getElementById("edit-qf-cal");
  const priceInp = document.getElementById("edit-qf-price");
  const pInp = document.getElementById("edit-qf-p");
  const cInp = document.getElementById("edit-qf-c");
  const fInp = document.getElementById("edit-qf-f");

  const spec = specInp ? specInp.value.trim() : "";
  const cal = Number(calInp ? calInp.value : 0) || 0;
  const priceVal = priceInp ? priceInp.value.trim() : "";
  const price = priceVal !== "" ? parseFloat(priceVal) : null;
  const p = typeof roundMacro === "function" ? roundMacro(pInp ? pInp.value : 0) : (Number(pInp ? pInp.value : 0) || 0);
  const c = typeof roundMacro === "function" ? roundMacro(cInp ? cInp.value : 0) : (Number(cInp ? cInp.value : 0) || 0);
  const f = typeof roundMacro === "function" ? roundMacro(fInp ? fInp.value : 0) : (Number(fInp ? fInp.value : 0) || 0);

  const oldItem = currentRoutineCfg.quickFoods[editQuickFoodIndex];
  const oldName = oldItem ? oldItem.name : "";

  currentRoutineCfg.quickFoods[editQuickFoodIndex] = {
    name: name,
    spec: spec,
    calories: cal,
    price: price,
    protein: p,
    carbs: c,
    fat: f
  };

  persistRoutineConfigLocally();

  // 级联同步更新今日就餐流水中已记录的该单品条目
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals)) {
    let touched = false;
    CUR_DAY_DATA.diet.meals.forEach(m => {
      // 匹配单品名称（包含原名或新名）
      if (m.dish && (m.dish === oldName || m.dish.startsWith(oldName + " ") || m.dish.startsWith(oldName + "(") || m.dish === name || m.dish.startsWith(name + " "))) {
        m.dish = `${name}${spec ? ` (${spec})` : ""}`;
        m.calories = cal;
        if (price !== null) m.price = price;
        m.protein = p;
        m.carbs = c;
        m.fat = f;
        touched = true;
        // 异步更新后端
        fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_edit", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            stamp: m.stamp,
            dish: m.dish,
            calories: m.calories,
            price: m.price,
            protein: m.protein,
            carbs: m.carbs,
            fat: m.fat
          })
        }).catch(() => {});
      }
    });
    if (touched) {
      CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.calories || 0), 0);
      CUR_DAY_DATA.diet.macros = {
        protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.protein || 0), 0),
        carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.carbs || 0), 0),
        fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.fat || 0), 0)
      };
      // ★ 改了今日餐次的热量/宏量却不标 dirty，刷新后 normDay 会拿云端旧值把热量改回去。
      if (typeof markDietModified === "function") markDietModified(CUR_DAY_DATA.day || curDay);
      saveDayDietLocal(CUR_DAY_DATA.day || curDay, CUR_DAY_DATA.diet);
    }
  }

  closeEditQuickFoodPreset();
  renderRoutineModal();
  saveRoutineConfigSilently();
  render();
  showToast(`已更新单品：${name} 并同步今日记录`);
}

async function saveRoutineConfig() {
  if (!currentRoutineCfg) currentRoutineCfg = {};
  const gEl = document.getElementById("cfg-profile-gender");
  const bEl = document.getElementById("cfg-profile-birth");
  if (gEl && bEl) {
    currentRoutineCfg.profile = {

      birth: bEl.value || "2008-04-28",
      height: 181,
      weight: (typeof getLatestScaleWeight === "function") ? getLatestScaleWeight() : 80.4
    };
  }
  if (currentRoutineCfg.routineBreakfast) delete currentRoutineCfg.routineBreakfast;
  persistRoutineConfigLocally();
  render();
  try {
    await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=routine_config", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(currentRoutineCfg)
    });
    showToast("常规预设已保存并同步");
    closeRoutineModal();
  } catch (e) {
    showToast("已保存在本地 (云端: " + e.message + ")");
    closeRoutineModal();
  }

// 快捷单品记账并发在途计数器，防止并发点击时早返回的请求拉取旧云端数据覆盖本地乐观更新
let _inFlightQuickLogs = 0;
if (typeof window !== "undefined") window._inFlightQuickLogs = 0;

// 快捷单品记账：0ms 瞬间反馈 + 乐观 UI + 本地即时累加 + 后台静默上行
async function addQuickFoodLog(day, qidx, btnEl) {
  const btn = btnEl || (typeof event !== "undefined" ? (event.currentTarget || event.target) : null);
  if (btn) {
    btn.style.transform = "scale(0.92)";
    btn.style.transition = "transform 0.12s ease";
    setTimeout(() => {
      btn.style.transform = "";
    }, 120);
  }

  const list = getEffectiveQuickFoods(CUR_DAY_DATA);
  const q = list[qidx];
  if (!q) return;

  const dishName = `${q.name}${q.spec ? ` (${q.spec})` : ""}`;
  const price = (q.price != null && !isNaN(q.price)) ? Number(q.price) : null;
  // 保证连续极速点击时时间戳单调递增，杜绝被去重逻辑误杀
  let nowMs = Date.now();
  if (typeof window._lastFoodLogMs !== "undefined" && nowMs <= window._lastFoodLogMs) {
    nowMs = window._lastFoodLogMs + 1000;
  }
  window._lastFoodLogMs = nowMs;
  const now = new Date(nowMs);
  const nowH = now.getHours();
  // ★ 2026-11-05：与后端统一（4-11 早餐 / 11-16 午餐 / 16-21 晚餐 / 其余夜宵）。
  //   原来这里用 10/14/17 且会出现“下午茶”，而餐次选项里并没有下午茶，
  //   导致 10 点多的早饭在弹窗里默认成午餐。
  const mType = nowH < 11 ? "早餐" : (nowH < 16 ? "午餐" : (nowH < 21 ? "晚餐" : "夜宵"));
  const nowStamp = now.toISOString();
  const nowTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const uniqueUid = "fl_" + nowMs + "_" + Math.random().toString(36).slice(2, 6);

  // 1. 0ms 瞬间 Toast 弹出与即时响应 (Zero-Emoji)
  showToast(`已记录 ${dishName} +${q.calories} kcal`);

  // 2. 0ms 瞬间累加内存模型并保存本地
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
    if (!CUR_DAY_DATA.diet) CUR_DAY_DATA.diet = { totalKcal: 0, macros: { protein: 0, carbs: 0, fat: 0 }, meals: [], supplements: [] };
    if (!Array.isArray(CUR_DAY_DATA.diet.meals)) CUR_DAY_DATA.diet.meals = [];
    if (!CUR_DAY_DATA.diet.macros) CUR_DAY_DATA.diet.macros = { protein: 0, carbs: 0, fat: 0 };

    // 每一个食物单品独立记录，不合并字符串
    CUR_DAY_DATA.diet.meals.unshift({
      uid: uniqueUid,
      stamp: nowStamp,
      time: nowTime,
      meal: mType,
      dish: dishName,
      calories: q.calories,
      protein: q.protein || 0,
      carbs: q.carbs || 0,
      fat: q.fat || 0,
      price: price
    });

    CUR_DAY_DATA.diet.totalKcal = (CUR_DAY_DATA.diet.totalKcal || 0) + (q.calories || 0);
    const prevP = CUR_DAY_DATA.diet.macros.protein || 0;
    const prevC = CUR_DAY_DATA.diet.macros.carbs || 0;
    const prevF = CUR_DAY_DATA.diet.macros.fat || 0;
    CUR_DAY_DATA.diet.macros.protein = typeof roundMacro === "function" ? roundMacro(prevP + (Number(q.protein) || 0)) : (prevP + (q.protein || 0));
    CUR_DAY_DATA.diet.macros.carbs = typeof roundMacro === "function" ? roundMacro(prevC + (Number(q.carbs) || 0)) : (prevC + (q.carbs || 0));
    CUR_DAY_DATA.diet.macros.fat = typeof roundMacro === "function" ? roundMacro(prevF + (Number(q.fat) || 0)) : (prevF + (q.fat || 0));
    CUR_DAY_DATA.diet._userModified = Date.now();

    if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
      const tidx = TREND.full.indexOf(day);
      if (tidx >= 0 && Array.isArray(TREND.dietKcal)) {
        TREND.dietKcal[tidx] = CUR_DAY_DATA.diet.totalKcal;
      }
    }

    saveDayDietLocal(day, CUR_DAY_DATA.diet);

    const cc = (typeof _dayCache !== "undefined" && _dayCache) ? _dayCache.get(day) : null;
    if (cc && cc.data && cc.data.d) {
      cc.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
      if (typeof saveBootSnapshot === "function") saveBootSnapshot(day, cc.data);
    }

    // ★ 局部微更新 (Targeted Patching)：就地更新热量/宏量数字与进度条，DOM直接追加食物节点，绝不全量 render()
    try {
      const kcalEl = document.querySelector("#m-diet-kcal .v");
      if (kcalEl) kcalEl.innerHTML = `${CUR_DAY_DATA.diet.totalKcal}<u> kcal</u>`;
      const pEl = document.querySelector("#m-diet-p .v");
      if (pEl) pEl.innerHTML = `${CUR_DAY_DATA.diet.macros.protein}<u> g</u>`;
      const cEl = document.querySelector("#m-diet-c .v");
      if (cEl) cEl.innerHTML = `${CUR_DAY_DATA.diet.macros.carbs}<u> g</u>`;
      const fEl = document.querySelector("#m-diet-f .v");
      if (fEl) fEl.innerHTML = `${CUR_DAY_DATA.diet.macros.fat}<u> g</u>`;

      // 进度条就地刷新 (DRI: P 130g, C 160g, F 60g)
      const hbars = document.querySelectorAll(".hbars .hb");
      if (hbars.length >= 3) {
        const curP = CUR_DAY_DATA.diet.macros.protein || 0;
        const curC = CUR_DAY_DATA.diet.macros.carbs || 0;
        const curF = CUR_DAY_DATA.diet.macros.fat || 0;
        const pPct = Math.round((curP / 130) * 100);
        const cPct = Math.round((curC / 160) * 100);
        const fPct = Math.round((curF / 60) * 100);

        const macroUpdates = [
          { el: hbars[0], gTxt: `${curP}g / 130g`, pct: pPct, isOver: pPct > 100 },
          { el: hbars[1], gTxt: `${curC}g / 160g`, pct: cPct, isOver: cPct > 100 },
          { el: hbars[2], gTxt: `${curF}g / 60g`, pct: fPct, isOver: fPct > 100 },
        ];
        macroUpdates.forEach(({ el, gTxt, pct, isOver }) => {
          const firstI = el.querySelector("i");
          if (firstI) firstI.style.width = Math.min(100, pct) + "%";
          const uEl = el.querySelector("u");
          if (uEl) uEl.innerHTML = `${gTxt}<em>${pct}%</em>`;
        });
      }

      // 食物列表置顶追加新单品节点 container.appendChild(newRow)
      let container = document.getElementById("diet-meals-list");
      if (!container) {
        const emptyEl = document.querySelector(".empty");
        if (emptyEl && emptyEl.closest(".card")) {
          const parentCard = emptyEl.parentElement;
          emptyEl.remove();
          container = document.createElement("div");
          container.id = "diet-meals-list";
          parentCard.appendChild(container);
        }
      }

      if (container) {
        const mChar = mType.charAt(0);

// 补剂打卡 / 取消：局部微更新 classList.toggle('done')，不重绘整张就餐卡片
async function toggleSupplement(day, name, btnEl) {
  if (typeof invalidateDayCache === "function") {
    invalidateDayCache(day);
  }
  let isDone = false;
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
    if (!CUR_DAY_DATA.diet) CUR_DAY_DATA.diet = { meals: [], macros: {}, supplements: [] };
    if (!Array.isArray(CUR_DAY_DATA.diet.supplements)) CUR_DAY_DATA.diet.supplements = [];
    let it = CUR_DAY_DATA.diet.supplements.find(s => s.name === name);
    if (!it) {
      it = { name: name, done: false, time: null };
      CUR_DAY_DATA.diet.supplements.push(it);
    }
    it.done = !it.done;
    it.time = null;
    isDone = it.done;
    showToast(it.done ? `${name} 已打卡` : `已取消打卡：${name}`);
    // ★ 补剂打卡不改变 meals 条数，syncDayDietFromCloud 的 curLen > cloudLen 守卫会漏判，
    //   所以必须自己打 dirty + 近期修改时间戳，否则刷新时云端旧值会把打卡状态覆盖回去。
    //   ⚠️ _userModified 必须写时间戳：03_api 的判据是 number ? 差值<30000 : true，
    //   写 true 等于"永久刚刚改过"，那就是 F-07 的成因。
    CUR_DAY_DATA.diet._userModified = Date.now();
    if (typeof markDietModified === "function") markDietModified(day);
    saveDayDietLocal(day, CUR_DAY_DATA.diet);

    // ★ 局部微更新：直接使用 classList.toggle('done') 更新药丸高亮与指示灯，绝不重绘整张卡片
    const targetEl = btnEl || document.querySelector(`[data-supp-name="${name}"]`);
    if (targetEl) {
      targetEl.classList.toggle("done", isDone);
      targetEl.title = isDone ? "已服，点击取消" : "未服，点击打卡";
    }

    const allBtn = document.getElementById("btn-toggle-all-supps") || document.querySelector(".btn-toggle-all-supps");
    if (allBtn) {
      const effSupps = (typeof getEffectiveSupplements === "function") ? getEffectiveSupplements(CUR_DAY_DATA) : [];
      const allDone = effSupps.length > 0 && effSupps.every(s => s.done);
      if (allDone) {
        allBtn.textContent = "已全服";
        allBtn.disabled = true;
        allBtn.style.opacity = "0.6";
        allBtn.style.pointerEvents = "none";
      } else {
        allBtn.textContent = "一键全服";
        allBtn.disabled = false;
        allBtn.style.opacity = "1";
        allBtn.style.pointerEvents = "auto";
      }
    }
  }
  try {
    await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=supplement_toggle", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ day: day, name: name })
    });
  } catch (e) {
    console.error("补剂打卡失败", e);
  }
}

// 一键全部补剂打卡（局部微更新药丸高亮与状态灯）
async function toggleAllSupplements(day) {
  const activeSuppNames = (currentRoutineCfg && Array.isArray(currentRoutineCfg.supplements) && currentRoutineCfg.supplements.length > 0)
    ? currentRoutineCfg.supplements
    : ((typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && CUR_DAY_DATA.diet.routineConfig && Array.isArray(CUR_DAY_DATA.diet.routineConfig.supplements) && CUR_DAY_DATA.diet.routineConfig.supplements.length > 0)
        ? CUR_DAY_DATA.diet.routineConfig.supplements
        : (typeof DEFAULT_SUPPLEMENTS !== "undefined" ? DEFAULT_SUPPLEMENTS : ["维生素C 100mg", "维生素B 100mg", "维生素D 250mg"]));

  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
    if (!CUR_DAY_DATA.diet) CUR_DAY_DATA.diet = { meals: [], macros: {}, supplements: [] };
    if (!Array.isArray(CUR_DAY_DATA.diet.supplements)) CUR_DAY_DATA.diet.supplements = [];
    
    // 防呆守卫：如果所有常规补剂均已打卡完成，直接拦截并提示，防止重复触发
    const existingMap = {};
    CUR_DAY_DATA.diet.supplements.forEach(s => { existingMap[s.name] = s; });
    const allAlreadyDone = activeSuppNames.length > 0 && activeSuppNames.every(name => existingMap[name] && existingMap[name].done);
    if (allAlreadyDone) {
      showToast("今日补剂已全服打卡，无需重复点击");
      return;
    }

    if (typeof invalidateDayCache === "function") {
      invalidateDayCache(day);
    }

    activeSuppNames.forEach(name => {
      if (existingMap[name]) {
        existingMap[name].done = true;
        existingMap[name].time = null;
      } else {
        CUR_DAY_DATA.diet.supplements.push({ name: name, done: true, time: null });
      }
    });
    showToast("今日补剂已一键全服");
    // ★ 同 toggleSupplement：补剂状态变更不增删 meals，必须自带 dirty + 时间戳，
    //   否则云端旧值会把"已全服"覆盖回未打卡。
    CUR_DAY_DATA.diet._userModified = Date.now();
    if (typeof markDietModified === "function") markDietModified(day);
    saveDayDietLocal(day, CUR_DAY_DATA.diet);

    // ★ 局部微更新：批量添加 .done 类并更新状态，绝不调用全量 render()
    document.querySelectorAll(".supp-capsule").forEach(el => {
      el.classList.add("done");
      el.title = "已服，点击取消";
    });
    const allBtn = document.getElementById("btn-toggle-all-supps") || document.querySelector(".btn-toggle-all-supps");
    if (allBtn) {
      allBtn.textContent = "已全服";
      allBtn.disabled = true;
      allBtn.style.opacity = "0.6";
      allBtn.style.pointerEvents = "none";
    }
  }
  try {
    await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=supplement_toggle", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ day: day, all: true, names: activeSuppNames })
    });
  } catch (e) {
    console.error("一键全服打卡失败", e);
  }
}

let dietEditStamp = null;
let dietEditBaseNutr = null;

function applyDietPortionRatio(ratio, label) {
  if (!dietEditBaseNutr) return;
  const calEl = document.getElementById("edit-diet-cal");
  const pEl = document.getElementById("edit-diet-p");
  const cEl = document.getElementById("edit-diet-c");
  const fEl = document.getElementById("edit-diet-f");
  const labelEl = document.getElementById("diet-edit-ratio-label");
  const btnsEl = document.getElementById("diet-edit-ratio-btns");

  if (calEl) calEl.value = Math.round(dietEditBaseNutr.cal * ratio);
  if (pEl) pEl.value = Math.round(dietEditBaseNutr.p * ratio * 10) / 10;
  if (cEl) cEl.value = Math.round(dietEditBaseNutr.c * ratio * 10) / 10;
  if (fEl) fEl.value = Math.round(dietEditBaseNutr.f * ratio * 10) / 10;

  if (labelEl) {
    const pct = Math.round(ratio * 100);
    labelEl.textContent = `${pct}% (${label.replace(/.*?\(/, '').replace(')', '') || label})`;
  }

  if (btnsEl) {
    btnsEl.querySelectorAll("button").forEach(btn => {
      const match = btn.textContent.trim() === label.trim();
      btn.style.background = match ? 'var(--health,#10b981)' : 'rgba(255,255,255,0.06)';
      btn.style.color = match ? '#000' : 'var(--fg)';
    });
  }
}

              <input type="number" step="0.1" id="edit-diet-p" value="${currentItem.protein || 0}" style="width:100%;padding:5px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:4px;color:var(--fg);box-sizing:border-box">

            </div>
            <div>
              <span style="font-size:10px;color:var(--dim)">脂肪 (g)</span>
              <input type="number" step="0.1" id="edit-diet-f" value="${currentItem.fat || 0}" style="width:100%;padding:5px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:4px;color:var(--fg);box-sizing:border-box">

          <button type="button" onclick="promptAddNewDishToMeal()" style="background:none;border:1px dashed var(--border);color:var(--flow,#38bdf8);border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px">+ 增加单品</button>

            <button onclick="saveDietEdit()" style="padding:6px 16px;background:var(--health, #10b981);border:none;color:#000;font-weight:600;border-radius:6px;font-size:12px;cursor:pointer">保存修改</button>
          </div>
        </div>

  `;
}

function closeDietEditModal() {
  dietEditStamp = null;
  dietEditSubIndex = null;
  dietEditAllocated = null;
  const root = document.getElementById("diet-edit-modal-root");
  if (root) root.innerHTML = "";
}

function promptAddNewDishToMeal() {
  const dishName = prompt("请输入要追加的新增单品名称（如：煎蛋、酸奶）：");
  if (!dishName || !dishName.trim()) return;
  const cleanName = dishName.trim();
  const kcalStr = prompt(`请输入「${cleanName}」的大致热量 (kcal，默认 100)：`, "100");
  const cal = Math.max(1, Math.round(Number(kcalStr) || 100));

  if (!dietEditAllocated) {
    const dishEl = document.getElementById("edit-diet-dish");
    const curDish = dishEl ? dishEl.value.trim() : "主菜";
    const calEl = document.getElementById("edit-diet-cal");
    const curCal = calEl ? (Number(calEl.value) || 300) : 300;
    const pEl = document.getElementById("edit-diet-p");
    const cEl = document.getElementById("edit-diet-c");
    const fEl = document.getElementById("edit-diet-f");
    dietEditAllocated = [
      { name: curDish, calories: curCal, protein: Number(pEl ? pEl.value : 0), carbs: Number(cEl ? cEl.value : 0), fat: Number(fEl ? fEl.value : 0) }
    ];
    dietEditSubIndex = 0;
  }

  dietEditAllocated.push({
    name: cleanName,
    calories: cal,
    protein: Math.round(cal * 0.05),
    carbs: Math.round(cal * 0.1),
    fat: Math.round(cal * 0.03)
  });
  if (typeof showToast === "function") showToast(`已追加单品「${cleanName}」，点保存即拆分入库`);
}

async function saveDietEdit() {
  if (!dietEditStamp) return;
  const timeInp = document.getElementById("edit-diet-time");
  const newTime = timeInp ? timeInp.value : null;
  const meal = document.getElementById("edit-diet-meal").value;
  const dish = document.getElementById("edit-diet-dish").value.trim();
  const cal = Number(document.getElementById("edit-diet-cal").value) || 0;
  const priceVal = document.getElementById("edit-diet-price").value.trim();
  const price = priceVal !== "" ? parseFloat(priceVal) : null;
  const p = typeof roundMacro === "function" ? roundMacro(document.getElementById("edit-diet-p").value) : (Number(document.getElementById("edit-diet-p").value) || 0);
  const c = typeof roundMacro === "function" ? roundMacro(document.getElementById("edit-diet-c").value) : (Number(document.getElementById("edit-diet-c").value) || 0);
  const f = typeof roundMacro === "function" ? roundMacro(document.getElementById("edit-diet-f").value) : (Number(document.getElementById("edit-diet-f").value) || 0);

  let newStamp = dietEditStamp;
  let newTimeStr = null;
  if (newTime && /^\d{2}:\d{2}/.test(newTime)) {
    const baseDay = dietEditStamp.includes("T") ? dietEditStamp.split("T")[0] : (CUR_DAY_DATA && CUR_DAY_DATA.day ? CUR_DAY_DATA.day : curDay);
    try {
      const dt = new Date(`${baseDay}T${newTime}:00+08:00`);
      newStamp = !isNaN(dt.getTime()) ? dt.toISOString() : `${baseDay}T${newTime}:00Z`;
    } catch (_) {
      newStamp = `${baseDay}T${newTime}:00Z`;
    }
    newTimeStr = newTime;
  }

  const oldStamp = dietEditStamp;
  const theDay = (CUR_DAY_DATA && CUR_DAY_DATA.day) || curDay;
  const isMultiMode = dietEditAllocated && dietEditAllocated.length > 1;

  if (isMultiMode && dietEditSubIndex != null) {
    // 触发原子化分裂保存：将原复合记录拆分为多条独立记录
    dietEditAllocated[dietEditSubIndex] = {
      name: dish,
      calories: cal,
      protein: p,
      carbs: c,
      fat: f
    };

    const baseMs = new Date(newStamp).getTime();
    const splitItems = dietEditAllocated.map((it, idx) => {
      const itStamp = (idx === 0) ? newStamp : new Date(baseMs - idx * 1000).toISOString();
      return {
        stamp: itStamp,
        meal: meal,
        dish: it.name,
        calories: it.calories,
        protein: it.protein,
        carbs: it.carbs,
        fat: it.fat,
        price: (idx === 0 && price != null) ? price : null,
        isMealPrice: idx === 0 && price != null
      };
    });

    // 1. 本地乐观替换原记录为分裂出来的多条单品
    if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals)) {
      CUR_DAY_DATA.diet.meals = CUR_DAY_DATA.diet.meals.filter(x => x.stamp !== oldStamp);
      for (const sit of splitItems) {
        CUR_DAY_DATA.diet.meals.push(sit);
      }
      CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));
      CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.calories || 0), 0);
      CUR_DAY_DATA.diet.macros = {
        protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.protein || 0), 0),
        carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.carbs || 0), 0),
        fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.fat || 0), 0)
      };
      // 必须写时间戳：normDay 只认 30 秒内的数字，写布尔 true 等于"永久刚改过"，本地旧副本会压死云端
      CUR_DAY_DATA.diet._userModified = Date.now();
      if (typeof markDietModified === "function") markDietModified(theDay);
      if (typeof saveDayDietLocal === "function") saveDayDietLocal(theDay, CUR_DAY_DATA.diet);
      const cc = _dayCache.get(theDay);
      if (cc && cc.data && cc.data.d) {
        cc.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, cc.data);
      }
    }

    closeDietEditModal();
    try { await render(); } catch (_) {}

    // 2. 后台原子化分裂入库
    try {
      const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_split", {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          old_stamp: oldStamp,
          day: theDay,
          items: splitItems
        })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (typeof syncDayDietFromCloud === "function") syncDayDietFromCloud(theDay);
    } catch (e) {
      console.warn("[saveDietEdit:split] 后台分裂上报失败，本地已分裂生效:", e);
      if (typeof showToast === "function") showToast("菜品拆分已存本机，未同步到云端");
    }
    return;
  }

  // 单项常规更新
  const isMealPrice = dietEditBaseNutr ? !!dietEditBaseNutr.isMealPrice : false;
  const note = (dietEditBaseNutr && dietEditBaseNutr.note) || "";

  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals)) {
    const target = CUR_DAY_DATA.diet.meals.find(x => x.stamp === oldStamp);
    if (target) {
      target.stamp = newStamp;
      if (newTimeStr) target.time = newTimeStr;
      target.meal = meal;
      target.dish = dish;
      target.calories = cal;
      target.price = price;
      target.isMealPrice = isMealPrice;
      target.note = note;
      target.protein = p;
      target.carbs = c;
      target.fat = f;
      CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));
      CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.calories || 0), 0);
      CUR_DAY_DATA.diet.macros = {
        protein: CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.protein || 0), 0),
        carbs: CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.carbs || 0), 0),
        fat: CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.fat || 0), 0)
      };
      // 必须写时间戳：normDay 只认 30 秒内的数字，写布尔 true 等于"永久刚改过"，本地旧副本会压死云端
      CUR_DAY_DATA.diet._userModified = Date.now();
      if (typeof markDietModified === "function") markDietModified(theDay);
      if (typeof saveDayDietLocal === "function") saveDayDietLocal(theDay, CUR_DAY_DATA.diet);
      const cc = _dayCache.get(theDay);
      if (cc && cc.data && cc.data.d) {
        cc.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, cc.data);
      }
    }
  }
  closeDietEditModal();
  try { await render(); } catch (_) {}

  try {
    const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_edit", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        stamp: oldStamp,
        new_stamp: (newStamp !== oldStamp) ? newStamp : undefined,
        meal: meal,
        dish: dish,
        calories: cal,
        price: price,
        is_meal_price: isMealPrice,
        note: note,
        protein: p,
        carbs: c,
        fat: f
      })
    });
    const jj = await r.json().catch(() => null);
    if (!r.ok || (jj && jj.ok === false)) throw new Error((jj && jj.error) || ("HTTP " + r.status));
    if (typeof syncDayDietFromCloud === "function") syncDayDietFromCloud(theDay);
  } catch (e) {
    console.warn("[saveDietEdit] 后台上报失败，本地已保留:", e);
    if (typeof showToast === "function") showToast("修改已存本机，未同步到云端");
  }
}

async function commitPendingDietDelete() {
  if (!window._pendingDietUndo) return;
  const pending = window._pendingDietUndo;
  window._pendingDietUndo = null;
  if (pending.timer) {
    clearTimeout(pending.timer);
    pending.timer = null;
  }
  if (pending.toastEl) {
    pending.toastEl.classList.add("toast-exit");
    const el = pending.toastEl;
    setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 200);
  }
  if (typeof pending.commit === "function") {
    try {
      await pending.commit();
    } catch (e) {
      console.warn("[pendingDietUndo:commit error]:", e);
    }
  }
}
window.commitPendingDietDelete = commitPendingDietDelete;

if (typeof window !== "undefined" && typeof window.addEventListener === "function" && !window._dietUndoUnloadBound) {
  window._dietUndoUnloadBound = true;
  window.addEventListener("beforeunload", () => {
    if (window._pendingDietUndo && typeof window._pendingDietUndo.commit === "function") {
      window._pendingDietUndo.commit();
      window._pendingDietUndo = null;
    }
  });
}

async function deleteDietItem(stamp, subIndex = null) {
  const theDay = (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day) ? CUR_DAY_DATA.day : curDay;

  const targetMs = new Date(stamp).getTime();
  const m = (CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals))
    ? CUR_DAY_DATA.diet.meals.find(x => x.stamp === stamp || (!isNaN(targetMs) && new Date(x.stamp).getTime() === targetMs))
    : null;

  if (!m) {
    console.warn("[deleteDietItem] 未找到对应的就餐记录:", stamp);
    return;
  }

  const subItems = (typeof splitDishIntoItems === "function") ? splitDishIntoItems(m.dish) : [];

  // 保存删除前的完整餐次快照以备撤回
  const prevMeals = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet.meals));
  const prevTotalKcal = CUR_DAY_DATA.diet.totalKcal;
  const prevMacros = CUR_DAY_DATA.diet.macros ? JSON.parse(JSON.stringify(CUR_DAY_DATA.diet.macros)) : null;
  const prevUserModified = CUR_DAY_DATA.diet._userModified;

  let dishDisplayName = "";
  let commitFn = null;
  let restoreFn = null;

  if (subIndex != null && subItems.length > 1 && typeof estimateSubItemNutrition === "function") {
    // 场景 A：多单品中的单项删除
    const allocated = estimateSubItemNutrition(subItems, m.calories || 0, m.protein || 0, m.carbs || 0, m.fat || 0);
    const targetSub = allocated[subIndex];
    dishDisplayName = targetSub ? targetSub.name : "菜品";

    const remaining = allocated.filter((_, idx) => idx !== subIndex);
    const baseMs = new Date(m.stamp || stamp).getTime();
    const splitItems = remaining.map((it, idx) => ({
      stamp: (idx === 0) ? (m.stamp || stamp) : new Date(baseMs - idx * 1000).toISOString(),
      meal: m.meal,
      dish: it.name,
      calories: it.calories,
      protein: it.protein,
      carbs: it.carbs,
      fat: it.fat,
      price: (idx === 0 && m.price != null) ? m.price : null,
      isMealPrice: idx === 0 && m.price != null
    }));

    CUR_DAY_DATA.diet.meals = CUR_DAY_DATA.diet.meals.filter(x => x.stamp !== (m.stamp || stamp));
    for (const sit of splitItems) CUR_DAY_DATA.diet.meals.push(sit);
    CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));

    commitFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_split", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ old_stamp: m.stamp || stamp, day: theDay, items: splitItems })
        });
      } catch (e) {
        console.warn("[deleteDietItem:sub] 后台分裂删除同步中:", e);
      }
    };

    restoreFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_split", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ old_stamp: m.stamp || stamp, day: theDay, items: prevMeals.filter(x => x.meal === m.meal) })
        });
      } catch (e) {
        console.warn("[deleteDietItem:restore:sub] 撤回恢复同步中:", e);
      }
    };
  } else {
    // 场景 B：整条就餐记录删除
    dishDisplayName = m.dish || "饮食记录";

    CUR_DAY_DATA.diet.meals = CUR_DAY_DATA.diet.meals.filter(x => {
      if (x.stamp === stamp || x.stamp === m.stamp) return false;
      if (!isNaN(targetMs) && new Date(x.stamp).getTime() === targetMs) return false;
      return true;
    });

    commitFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_del", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ stamp: m.stamp || stamp, day: theDay })
        });
      } catch (e) {
        console.warn("后端删除请求在后台处理中:", e);
      }
    };

    restoreFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=quick_food_log", {
          method: "POST",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: JSON.stringify({
            day: theDay,
            stamp: m.stamp || stamp,
            dish: m.dish,
            calories: m.calories,
            price: m.price,
            protein: m.protein,
            carbs: m.carbs,
            fat: m.fat,
            meal: m.meal,
            idempotency_key: "undo_" + Date.now(),
            uid: m.uid || ("undo_" + Date.now())
          })
        });
      } catch (e) {
        console.warn("后端撤回恢复请求在后台处理中:", e);
      }
    };
  }

  // 乐观更新宏量营养素与总热量
  CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.calories || 0), 0);
  CUR_DAY_DATA.diet.macros = {
    protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (Number(x.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.protein || 0), 0),
    carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (Number(x.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.carbs || 0), 0),
    fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (Number(x.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.fat || 0), 0)
  };
  CUR_DAY_DATA.diet._userModified = Date.now();
  const cleanD = (typeof dedupDietObj === "function") ? dedupDietObj(CUR_DAY_DATA.diet) : CUR_DAY_DATA.diet;
  CUR_DAY_DATA.diet = cleanD;

  if (typeof markDietModified === "function") markDietModified(theDay);
  saveDayDietLocal(theDay, cleanD);
  const c = (typeof _dayCache !== "undefined" && _dayCache) ? _dayCache.get(theDay) : null;
  if (c && c.data && c.data.d) {
    c.data.d.diet = JSON.parse(JSON.stringify(cleanD));
    if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, c.data);
  } else if (typeof _dayCache !== "undefined" && _dayCache && typeof _dayCache.set === "function") {
    _dayCache.set(theDay, { data: { ok: true, d: { diet: JSON.parse(JSON.stringify(cleanD)) } }, ts: Date.now() });
  }

  // 立即刷新列表（0ms 命中 _dayCache 内存瞬时重绘，菜品立刻消失）
  await render();

  /* ★ 2026-11-02：请求只"发出"，不 await —— 撤回浮窗必须立刻弹出来。
     原来这里是 await commitFn() 之后才画浮窗，手机上请求走 Worker→SCF 三级降级，
     一次 POST 几百毫秒到几秒，用户删完菜盯着屏幕等提示，像卡死。
     语义没变：请求立刻在途（不留等待期给云端旧缓存把它覆盖复活），只是不再挡 UI。
     撤回时 rollbackFn 会 await 这个 promise，保证"先删后恢复"的顺序，
     不会出现恢复被晚到的 diet_del 冲掉。 */
  const commitPromise = (typeof commitFn === "function")
    ? Promise.resolve().then(commitFn).catch((err) => {
        console.warn("[deleteDietItem] 即时物理删除调用:", err);
      })
    : Promise.resolve();

  // 创建 5 秒撤回 Toast 浮窗
  const oldToast = document.getElementById("diet-undo-toast");
  if (oldToast && oldToast.parentNode) oldToast.parentNode.removeChild(oldToast);

  const toast = document.createElement("div");
  toast.id = "diet-undo-toast";
  toast.setAttribute("role", "alert");
  toast.setAttribute("aria-live", "assertive");

  const cleanName = (typeof esc === "function") ? esc(dishDisplayName) : dishDisplayName;
  toast.innerHTML = `
    <div class="diet-toast-msg-wrap">
      <span class="diet-toast-msg-text">已删除「<b>${cleanName}</b>」</span>
    </div>
    <button type="button" class="diet-toast-undo-btn" id="diet-undo-btn">撤回</button>
    <div class="toast-progress-bar"></div>
  `;
  document.body.appendChild(toast);

  // 撤回恢复函数
  const rollbackFn = async () => {
    if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet) {
      CUR_DAY_DATA.diet.meals = prevMeals;
      CUR_DAY_DATA.diet.totalKcal = prevTotalKcal;
      CUR_DAY_DATA.diet.macros = prevMacros;
      CUR_DAY_DATA.diet._userModified = Date.now();
      saveDayDietLocal(theDay, CUR_DAY_DATA.diet);
      const cacheObj = (typeof _dayCache !== "undefined" && _dayCache) ? _dayCache.get(theDay) : null;
      if (cacheObj && cacheObj.data && cacheObj.data.d) {
        cacheObj.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, cacheObj.data);
      }
    }
    await render();
    if (typeof restoreFn === "function") {
      // 等那条删除请求落地再恢复，否则晚到的 diet_del 会把刚恢复的记录又删一次
      await commitPromise;
      await restoreFn();
    }
  };

  const timer = setTimeout(() => {
    if (window._pendingDietUndo && window._pendingDietUndo.timer === timer) {
      window._pendingDietUndo = null;
      if (toast && toast.parentNode) {
        toast.classList.add("toast-exit");
        setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
      }
    }
  }, 5000);

  window._pendingDietUndo = {
    timer: timer,
    toastEl: toast,
    theDay: theDay,
    dishName: dishDisplayName,
    rollback: rollbackFn,
    // 指向已经发出的那条删除请求：commitPendingDietDelete / beforeunload 靠它兜底，
    // 指向同一个 promise 也保证不会重复发一次 diet_del
    commit: () => commitPromise
  };

  const undoBtn = toast.querySelector("#diet-undo-btn");
  if (undoBtn) {
    undoBtn.onclick = async (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      if (!window._pendingDietUndo) return;
      clearTimeout(window._pendingDietUndo.timer);
      window._pendingDietUndo = null;
      toast.classList.add("toast-exit");
      setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
      /* ★ 2026-11-02：本地回滚是同步的，提示立刻给；云端恢复（restoreFn）还在后台跑，
         不能让用户为了"已撤回"三个字再等一次网络往返。 */
      rollbackFn().catch((e) => console.warn("[deleteDietItem:rollback]", e));
      if (typeof showToast === "function") showToast(`已撤回删除「${dishDisplayName}」`);
    };
  }
}

/* ---------------- 补记一餐（忘记拍照的补救入口） ----------------
   ★ 2026-10-18：只做前端，复用后端已有的 `api=quick_food_log`。
     那个接口本来就接受任意 dish / calories / protein / carbs / fat / price / meal，
     没有"必须是预设单品"的限制 —— 所以补一餐不需要新增接口，
     也就不会碰上 worker.js 与 scf 两份实现漂移那个坑。 */

function _mealAddDefaultMeal(day) {
  const today = (typeof TODAY !== "undefined" && TODAY)
    ? TODAY
    : new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  if (day !== today) return "午餐";
  const h = new Date().getHours();
  // ★ 2026-11-05：与后端统一（4-11 早餐 / 11-16 午餐 / 16-21 晚餐 / 其余夜宵）
  if (h < 11) return "早餐";
  if (h < 16) return "午餐";
  if (h < 21) return "晚餐";
  return "夜宵";
}

function applyQuickFoodToMealAdd(idx) {
  const list = (typeof getEffectiveQuickFoods === "function") ? (getEffectiveQuickFoods(CUR_DAY_DATA) || []) : [];
  const q = list[idx];
  if (!q) return;
  const dishEl = document.getElementById("meal-add-dish");
  const calEl = document.getElementById("meal-add-cal");
  const pEl = document.getElementById("meal-add-p");
  const cEl = document.getElementById("meal-add-c");
  const fEl = document.getElementById("meal-add-f");
  const priceEl = document.getElementById("meal-add-price");
  if (dishEl) dishEl.value = `${q.name}${q.spec ? ` (${q.spec})` : ""}`;
  if (calEl) calEl.value = q.calories || 0;
  if (pEl) pEl.value = q.protein || 0;
  if (cEl) cEl.value = q.carbs || 0;
  if (fEl) fEl.value = q.fat || 0;
  if (priceEl) priceEl.value = (q.price != null && !isNaN(q.price)) ? q.price : "";
}

function closeMealAddModal() {
