if (typeof window !== "undefined" && !window._nowIndicatorInterval) {
  window._nowIndicatorInterval = setInterval(() => {
    if (typeof document !== "undefined" && !document.hidden) {
      updateCurrentTimeIndicator();
    }
  }, 30000);
  if (typeof document !== "undefined") {
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateCurrentTimeIndicator();
    });
  }
}

function getNextDayStr(dayStr) {
  if (!dayStr) return "";
  const dt = new Date(dayStr + "T00:00:00Z");
  dt.setUTCDate(dt.getUTCDate() + 1);
  return dt.toISOString().slice(0, 10);
}

function getSleepsForDay(dayStr, daysContext) {
  if (!dayStr) return [];
  if (Array.isArray(daysContext)) {
    const found = daysContext.find((x) => {
      const d = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
      return d === dayStr;
    });
    if (found) {
      if (found.sleeps && found.sleeps.length) return found.sleeps;
      if (found.sleepMin > 0) return [{ from: found.sleepFrom, to: found.sleepTo, min: found.sleepMin, nap: false }];
    }
  }
  if (typeof _dayCache !== "undefined" && _dayCache && _dayCache.has(dayStr)) {
    const c = _dayCache.get(dayStr);
    const cb = c && c.data && c.data.d;
    if (cb && cb.body && cb.body.sleeps && cb.body.sleeps.length) return cb.body.sleeps;
    if (cb && cb.sleeps && cb.sleeps.length) return cb.sleeps;
    if (cb && cb.sleepMin > 0) return [{ from: cb.sleepFrom, to: cb.sleepTo, min: cb.sleepMin, nap: false }];
  }
  if (typeof TREND !== "undefined" && TREND && TREND.sleepsByDay && TREND.sleepsByDay[dayStr]) {
    const ss = TREND.sleepsByDay[dayStr];
    if (Array.isArray(ss) && ss.length) return ss;
  }
  return [];
}

/* 日/周 竖向网格：每天一列，时间从上往下（谷歌日历式） */
function gridView(days, o) {
  o = o || {};
  const H = o.h || 520, N = days.length;
  /* ⚠️ o.tags：要不要在左边那条窄栏里写项目名（睡眠 / 步行）。
     日视图开（只 1 列，宽裕），周/月视图关 —— 7 列挤在一起，每列总共才一两百像素，
     再切掉 26px 给名字栏，色块就没地方画了。
     （用户 9-18 明确：周时间线不要同步，只留色块不要汉字。）*/
  const showTags = o.tags !== false;
  /* ★ 2026-09-19 新增：色块定位统一走这两个函数。
     为什么需要 —— 色块是绝对定位 + 百分比，而 CSS 里 .gv-blk 有
     min-height（12px，窄屏 10px）。当一条记录落在 23:5x（top 接近 100%）时，
     它按百分比算出来的高度可能只有 3px，但 min-height 会把它撑到 12px
     → top 518px + 12px = 530px > 列高 523px → 被 .gv-col{overflow:hidden}
     切掉。实测「9/18 那天 23:14 / 23:30 / 23:40 三条记录整条看不见」就是这个。

     ★★ 2026-09-20 改：**place() 现在会把过短的块"长高"到 MINBLK**（原来只压 top、不改 h）。

     为什么必须改 —— 用户这次的要求是「默认就能显示一行汉字」，而原来这套几何里
     `MINBLK` 只是**防挤压的下限**：`h` 永远按真实时长算，短记录就是矮块。
     实测（390px 真浏览器，日视图）：一个 8.6 分钟的记录高度 0.6% × 1056 = 6px，
     被 CSS 的 min-height 兜到 10px —— **仍然装不下一行 11px 的字**。
     于是"默认高度拉到 1056"这件事白做了：屏幕上 10 条记录里有 7 条还是纯色块。
     也就是说 **光调默认高度解决不了"默认看得见字"，必须让矮块本身变高。**

     代价与取舍：长高会让块比真实时长多占几个像素（最多 MINBLK 上下）。
     这在时间线上是**看不见的失真**（11px 换一行可读的字），
     而反过来"块画对了但没字"是用户明确不要的。所以这个交换成立。
     真正的长时长块不受影响（它们的 h 远大于 minPct），时间轴整体依旧准确。
     ⚠️ 长高之后底部可能越过列底 → 所以"按 minPct 压 top"这一步**必须保留**。

     ★★ 2026-09-20 深夜（v0.15.0）：**长高机制整个关掉了**（`o.raw`）。

     用户原话：「我宁可丢掉此数据块也不要高度失真」+「色块的起始和终止要清晰可辨」。
     长高的代价在日视图（1 列、一列几十条）里是"11px 换一行字"，划算；
     但在**周视图**里它把时间轴变成了等高的色带 —— 实测：
       2 分钟 → 真实 1.3px，被撑到 10px（7.7 倍）
       5 分钟 → 真实 3.3px，被撑到 10px（3 倍）
      10 分钟 → 真实 6.7px，被撑到 10px（1.5 倍）
     15 分钟以下的活动**全都一样高**，而且越靠底部 top 还会被压 → 起点也跟着偏。
     于是"哪个块长、哪个块短、几点开始"三件事全丢了 —— 这正是用户说的"起止不可辨"。

     所以现在分两档：
       · `o.raw === true`（周视图 + 月视图弹层）：**严格按真实比例**，绝不长高。
         短块就是矮块，靠 caps 边界线（CSS ::before/::after）表达"这是一条有始有终的记录"，
         而不是靠撑高。真实高度 < 4px 的直接**不画**（见下 dropPx）——
         宁可留白，也不要一根看不出起止的头发丝。
       · 默认（日视图 / 收藏页）：保持原长高行为 —— 那里一列几十条，
         不长高就全是色卡，用户 9-20 白天的要求还成立。

     ★ 为什么用"两条路径"而不是"把 MINBLK 调小"：MINBLK 同时是
       「最小可见高度」和「能写字的门槛」两个语义，调小任何一个都会伤到另一个。
       raw 模式把"几何真实性"和"可读性兜底"彻底解耦，两边各自自洽。 */
  const MINBLK = o.minBlk || 12;                      // 同时是「最小可见高度」和「能写字的门槛」
  const minPct = Math.min(20, (MINBLK / H) * 100);    // 换算成百分比（封顶 20%）
  const RAW = o.raw === true;                         // ★ 严格真实几何，不长高
  /* 真实高度低于这个像素值就**不画**。只在 raw 模式下生效。
     4px 的来由：caps 线各 1px + 中间 2px 色体 —— 再矮就看不出"有始有终"，
     不如留白（用户明确接受"宁可丢掉"）。 */
  const DROP_PX = 4;
  /* 返回 {top, h}（都是带 % 的字符串），或 **null 表示"这个块该丢掉"**。
     ⚠️ `h` 是**最终落地的百分比高度**，调用方（如 showTxt 的判断）要拿它算像素，
        不能再拿 `(b-a)/24*100` 那个原始值 —— 那个没算长高（raw 模式下两者相等）。
     ⚠️ raw 模式下调用方**必须判 null**，否则会渲染出 `top:null;height:null` 的鬼块。 */
  const place = (a, b) => {
    const real = (b - a) / 24 * 100;                   // 按真实时长算
    if (RAW) {
      const px = real / 100 * H;
      if (px < DROP_PX) return null;                   // ★ 太矮 → 丢掉（宁可留白）
    }
    const raw = Math.max(0.6, real);                   // 非 raw 时保留 0.6% 老兜底
    let top = a / 24 * 100;
    let h = RAW ? real : Math.max(raw, minPct);        // ★ raw：绝不长高
    if (top + h > 100) {                               // 越底就压 top（不是砍 h）
      top = Math.max(0, 100 - h);
    }
    return { top: top.toFixed(2) + "%", h: h.toFixed(2) + "%" };
  };
  const isEnteringWeek = typeof _tlEnteringWeek !== "undefined" && !!_tlEnteringWeek;
  let targetColIdx = days.findIndex((x) => {
    const colDay = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
    return (typeof curDay !== "undefined" && curDay && colDay === curDay);
  });
  if (targetColIdx < 0) {
    targetColIdx = days.findIndex((x) => {
      const colDay = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
      return isDayToday(colDay);
    });
  }
  if (targetColIdx < 0) targetColIdx = days.length - 1;

  const heads = days.map((x, idx) => {
    const colDay = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
    const wd = WD[new Date(colDay + "T00:00:00Z").getUTCDay()];
    const isHoliday = (typeof isHolidayDay === "function") ? isHolidayDay(colDay) : ([0, 6].indexOf(new Date(colDay + "T00:00:00Z").getUTCDay()) >= 0);
    const isTodayCol = isDayToday(colDay);
    const animCls = isEnteringWeek ? (idx === targetColIdx ? " hd-expand-day" : " hd-slide-exit") : "";
    return `<div class="hd ${isHoliday ? "wk" : "work"} ${isTodayCol ? "today" : ""}${animCls}" data-day="${esc(colDay)}">${colDay.slice(5).replace("-", "/")}<b>周${wd}</b></div>`;
  }).join("");
  const cols = days.map((x, idx) => {
    const colDay = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
    const seg = sessOf(colDay) || { pc: [], phone: [] };
    const isWk = (typeof x === "object" && x && typeof x.wk === "boolean") ? x.wk : ((typeof isHolidayDay === "function") ? isHolidayDay(colDay) : ([0, 6].indexOf(new Date(colDay + "T00:00:00Z").getUTCDay()) >= 0));
    const isTodayCol = isDayToday(colDay);
    // ⚠️ 顺序就是层级：底色块先 push，app 块后 push。
    //    同为 z-index:0 时按 DOM 顺序叠 → 后画的压在上面，
    //    所以「睡眠 → 运动 → app」这个次序保证了
    //    ① 运动盖住睡眠（早上在睡梦里运动，以实测的运动为准）
    //    ② app 盖住两者（运动时在用什么 app 照样看得见）
    const under = [];   // 底色层（睡眠 / 运动）
    const blk = [];     // 前景层（手机 / 电脑）
    const tags = [];    // 左边那条竖栏里的项目名（见 .gv-tag）

    /* 睡眠：画**真实的**起止时刻（sleepFrom → sleepTo），不再从 0 点往下按
       "睡了多久"去估。估出来的入睡时刻经常落在当天上午，会画出一大块蓝条，
       看起来像"睡了一整天"，而且和 body 里那句"睡到 XX:XX"对不上。
       两个端点都是本地小时（带小数），后端 spanH() 和我们同一套口径。
       ★ 2026-09-19 修：后端现在给的 sleepTo **可能 > 24**（跨 0 点的睡眠，
         例 22:50 睡 → 次日 06:08 醒 = from 22.83 / to 30.13）。
         老代码直接 b0<=a0 兜底成 22.83→24，一整晚只剩最底下一小条，
         用户看到的就是"睡眠数据没了"。现在按 24 切开画两段。 */
    /* ★ 2026-09-24：一天可能有**多段**睡眠（夜里的主睡眠 + 白天的小睡）。
       以前这里只画 x.sleepFrom→x.sleepTo 那**一段**，第二段（小睡）根本画不出来
       —— 用户 9-24 报"下午的小睡看不到"就是它。
       现在优先用后端新增的 x.sleeps（每段带 nap 标记）；
       老数据（没有 sleeps 字段）自动退回"单段"逻辑，向后兼容。
       小睡 = 更浅的蓝 + 标签写「小睡」（样式见 .gv-blk.sl.nap）。 */
    /* ★ 2026-10-31：`_tlItems` 记的条目**必须有上限**，否则只增不减 → 内存泄漏。
       为什么不改成"渲染入口 clear()" —— 弹层 openDay() 会**再调一次 gridView**
       往同一个 Map 里塞条目，而主视图的 DOM 这时候并没有销毁；一旦在 gridView
       入口清空，主视图那些 data-tid 立刻变成悬空引用（关掉弹层后点睡眠 / 运动 /
       课程块就没反应了，因为消费点 1541 与 07_views.js:2132 都是 has() 判空后静默跳过）。
       所以改成**超过上限就淘汰最老的**：Map 保持插入序，从最早插入的开始删。
       上限 240 ≈ 7 次全量渲染（周视图 28~35 条/次），控住的是"永不回收"，
       同时保证"最近几次渲染"的条目一定还在，跨渲染点击不会断。
       ⚠️ 不要改回 clear()，也不要把上限调到 1~2 次渲染的量级 —— 都会踩上面这个坑。 */
    const TL_ITEMS_MAX = 240;
    if (typeof window !== "undefined" && !window._tlItems) window._tlItems = new Map();
    const regItem = (payload) => {
      const id = "tli_" + Math.random().toString(36).slice(2, 9);
      if (typeof window !== "undefined" && window._tlItems) {
        const m = window._tlItems;
        m.set(id, payload);
        while (m.size > TL_ITEMS_MAX) {
          const oldest = m.keys().next();
          if (oldest.done) break;
          m.delete(oldest.value);
        }
      }
      return id;
    };

    if (layerOn("sleep")) {
      // 1. 唤醒日在本列 (colDay) 的睡眠段（包含晨起睡眠与日间小睡，过滤掉跨夜前夜部分）
      const SS = (x.sleeps && x.sleeps.length)
        ? x.sleeps
        : (x.sleepMin > 0 ? [{ from: x.sleepFrom, to: x.sleepTo, min: x.sleepMin, nap: false }] : []);
      SS.forEach((S) => {
        const isNap = !!S.nap;
        const lab = isNap ? "小睡" : "睡眠";
        const cls = isNap ? "sl nap" : "sl";
        const itemId = regItem({
          type: "sleep",
          day: colDay,
          isNap: isNap,
          from: S.from,
          to: S.to,
          min: S.min,
          raw: S,
          dayData: x,
        });
        sleepSpans(S.from, S.to, S.min).forEach((sg) => {
          // ★ 跨夜边界切片：若该切片属于跨夜前夜部分（crossEve），由前一天深夜负责渲染，严禁绘制在醒来日！
          if (sg.crossEve) return;
          const P = place(sg.a, sg.b);
          if (!P) return;
          under.push(`<span class="gv-blk ${cls}" data-key="${colDay}_sleep_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S.min)} · ${hm(S.from)}–${hm(S.to)}"></span>`);
          tags.push(`<span class="gv-tag ${cls}" data-key="${colDay}_tag_sleep_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S.min)} · ${hm(S.from)}–${hm(S.to)}"><span>${lab}</span></span>`);
        });
      });

      // 2. 本列 (colDay) 深夜入睡段（跨 0 点睡眠从当天 22:xx 睡到次日醒来，其前夜切片精确落入本列底部）
      const nextDayStr = getNextDayStr(colDay);
      const nextSleeps = getSleepsForDay(nextDayStr, days);
      nextSleeps.forEach((S_next) => {
        if (!S_next) return;
        const isNap = !!S_next.nap;
        const lab = isNap ? "小睡" : "睡眠";
        const cls = isNap ? "sl nap" : "sl";
        const itemId = regItem({
          type: "sleep",
          day: colDay,
          isNap: isNap,
          from: S_next.from,
          to: S_next.to,
          min: S_next.min,
          raw: S_next,
          dayData: x,
        });
        sleepSpans(S_next.from, S_next.to, S_next.min).forEach((sg) => {
          // ★ 仅将跨夜前夜部分（crossEve，如 22:xx~24:00）作为本列深夜睡眠渲染
          if (!sg.crossEve) return;
          const P = place(sg.a, sg.b);
          if (!P) return;
          under.push(`<span class="gv-blk ${cls}" data-key="${colDay}_sleep_eve_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S_next.min)} · ${hm(S_next.from)}–${hm(S_next.to)}"></span>`);
          tags.push(`<span class="gv-tag ${cls}" data-key="${colDay}_tag_sleep_eve_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S_next.min)} · ${hm(S_next.from)}–${hm(S_next.to)}"><span>${lab}</span></span>`);
        });
      });
    }
    // 运动（手环记的）：有 t0 才画 —— 只知道"练了多久"画不到时间线上。
    // **做成和睡眠一样的底色**（见 .gv-blk.wk 的注释）：文字不画在块里
    // （会被上面的 app 块截断），全部放 title；名字走左边那条竖栏。
    if (layerOn("workout")) (x.workouts || []).forEach((w) => {
      // 周视图的 trend 已经给了本地小时 h；日视图给的是 UTC 的 t0，现算。
      const a = (w.h != null) ? Number(w.h) : tsHour(w.t0);
      if (a == null || isNaN(a)) return;
      const sec = Number(w.sec) || 0;
      const b = Math.min(24, a + sec / 3600);
      if (b <= a) return;
      const P = place(a, b);                // ★ 统一走 place()
      if (!P) return;                       // ★ raw 模式太矮 → 丢掉
      const itemId = regItem({
        type: "workout",
        day: colDay,
        from: a,
        to: b,
        sec: sec,
        w: w,
        dayData: x,
      });
      under.push(`<span class="gv-blk wk" data-key="${colDay}_workout_${a}_${b}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="${esc(workLine(w))} · ${hm(a)}–${hm(b)}"></span>`);
      tags.push(`<span class="gv-tag wk" data-key="${colDay}_tag_workout_${a}_${b}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="${esc(workLine(w))} · ${hm(a)}–${hm(b)}"><span>${esc(workCN(w))}</span></span>`);
    });

    // 上课（课表日程）：与睡眠、运动同一层级，作为底色层渲染
    // ★ 遇到法定节假日自动跳过（放假不上课）
    if (layerOn("course")) (getCoursesForDay(x.day) || []).forEach((c) => {
      const P = place(c.from, c.to);
      if (!P) return;
      const tag = c.shortName || "上课";
      const itemId = regItem({
        type: "course",
        day: colDay,
        course: c,
        dayData: x,
      });
      under.push(`<span class="gv-blk cs" data-key="${colDay}_course_${c.from}_${c.to}_${esc(c.name)}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="上课: ${esc(c.name)} · ${hm(c.from)}–${hm(c.to)} @ ${esc(c.loc)} (${esc(c.teacher || '')})"></span>`);
      tags.push(`<span class="gv-tag cs" data-key="${colDay}_tag_course_${c.from}_${c.to}_${esc(c.name)}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="上课: ${esc(c.name)} · ${hm(c.from)}–${hm(c.to)} @ ${esc(c.loc)} (${esc(c.teacher || '')})"><span>${esc(tag)}</span></span>`);
    });

    /* 返回值 = 这块**真的画出来了没有**（调用方用它决定要不要把这块算进
       "已画的块"参与后续覆盖判定 —— 见下面 drawn 那段）。
       `cvd` = 被覆盖深度（压着它的块数），>0 时右缘按 `min(深度×8px, 18%)` 缩进
       —— 用 margin-right 而不是改 right：宽屏手机块的 right 是 `calc(50%+1px)`，
       内联 right 会把左右分栏整个破坏；margin-right 对两种定位方式都安全。 */
    const pushApp = (s, ph, ov, cvd) => {
      const cat = catOf(s.app);
      if (!layerOn("app:" + cat)) return false;           // 图例里点掉了这个类别
      /* ★★ 2026-09-20 深夜（v0.15.0）：**15 分钟硬门槛**。
         用户原话：「我可以接受 15min 以下的时间的丢掉」。

         为什么加在这一层（pushApp）而不是 refineSegs：
           refineSegs 里的 120s/180s 是**清理**碎片，而且带一个 GAP=300 秒的
           「间隔不超过 5 分钟就算还在做同一件事」的**合并**逻辑。
           如果直接在那边把门槛提到 900 秒，5 分钟一跳的微信片段会被**合并成一大段**
           —— 那是凭空造出不存在的连续使用时长，比丢掉更糟。
           所以：清理层不动，只在**绘制**这一层加一道取舍。
         为什么是 15 分钟：窄屏周视图默认列高 960px（见 NARROW_MIN_H.week），
           960 / 1440 × 15 = 10px = 一行 7.5px 汉字的高（TXT_H.weekNarrow）。
           也就是说 15 分钟正好是"默认高度下刚好能写一行名字"的门槛 ——
           比它更短的活动，即使画出来也写不下名字，只是一根看不清起止的细线。
           与其在时间轴上留一堆鬼影，不如丢掉（用户明确选了这个取舍）。
         ⚠️ 只在 raw 模式（周视图 / 弹层）生效 —— 日视图的默认高度是 1056/620，
            门槛应该跟着 H 走，不能写死 15 分钟，否则宽屏日视图会丢太多。 */
      if (!keep(s)) return false;      // 真实时长 < 15 分钟 → 不画（判据见上面的 keep()）
      const P = place(s.a, s.b);                          // ★ 统一走 place()
      if (!P) return false;                               // ★ raw 模式太矮 → 丢掉
      /* ★ 2026-09-19：块太矮就别写名字。
         弹层里一天的记录有二十来条，很多只持续几分钟 → 块高 5–10px，
         而一行 8px 字至少要 11px 高。文字从块里溢出去，和上下邻居的文字
         叠在一起 —— 截图 2 里"左侧名字糊成一片"就是这个，不是布局错。
         阈值默认 14px：够一行字 + 上下各 2px 余量；不够就只留色块，靠悬停/点击看。
         高度用像素判断（P.h 是百分比，乘以列高 H 换算回来）。

         ★ 2026-09-19 晚：阈值改成可由调用方给（`o.namePx`）。
           窄屏周视图的字号是 7.5px（比默认 9px 小），所以 10px 就够放下，
           再用 14px 会把大批 20 分钟上下的活动挡在门外 —— 而那些正是
           用户想看到名字的（用户明确要求周视图**要显示进程名**）。 */
      /* ★ 2026-09-20：阈值改成跟**落地高度**比（`P.h`），不再拿原始比例反推。
         因为 place() 现在会把矮块长高到 MINBLK —— 如果还按原始比例算，
         一个"真实 8 分钟、落地 11px"的块会被算成 6px 从而判成"写不下"，
         明明屏幕上已经够高了。**量什么就得跟什么比，别拿中间量当结论。**
         （实测：改前 390px 屏 10 个块只有 3 个有字；改后 8 分钟以上的都有。）
         ★ raw 模式下两者相等（P.h 就是真实比例），这个判断照样成立，
           而且更诚实：块高不够就是不够，不会再被长高"骗"过去。 */
      const pxH = parseFloat(P.h) / 100 * H;
      const showTxt = pxH >= (o.namePx || 14) - 0.5;   // 减 0.5 容掉百分比四舍五入的零头
      /* ★★★ 时刻不上块 —— 这条经历过两步，别再往回改：
         ① 2026-09-20（v0.15.0）：raw 模式（周视图）先删掉时刻。那是被真浏览器
            逼出来的 —— 1280px 周视图 74 个块里 28 个文字纵向溢出块底 5~9px，
            根因是块里塞了两行（名字 9px + 时刻 8.5px ≈ 22px），而 raw 块严格按
            真实时长（15 分钟 = 8.75px），两行必然撑破。当时用户原话：
            「我甚至不需要把时间标到色块上」。
         ② 2026-09-21 晚：用户明确要求「把时间线的**色块上的时间**删掉」——
            于是日视图那行 `.t2` 也一起去掉了，**所有视图统一只写应用名**。
         怎么还看得到时刻（信息不丢）：
           · 鼠标悬停 → title（blkTitle：「电脑 Edge 13:02–13:26（24 分钟）」）
           · 点击色块 → 弹层顶部的 gv-meta（设备 + 起止 + 时长，见 openAppEdit）
         ⚠️ 别把 `.t2` 加回来。`.rt` 这个类只是"raw 模式"的标记（管 min-height 下限），
            和文字行数无关了。 */
      blk.push(`<span class="gv-blk ${ph ? "ph" : ""}${ov ? " ov" : ""}${RAW ? " rt" : ""}" data-key="${colDay}_app_${ph ? 'ph' : 'pc'}_${s.a}_${s.b}_${esc(s.app)}" style="top:${P.top};height:${P.h};background:${appColor(s.app)}${cvd ? `;margin-right:min(${cvd * 8}px, 18%)` : ""}"
        data-app="${esc(s.app)}" data-dev="${ph ? "手机" : "电脑"}"
        data-ta="${hm(s.a)}" data-tb="${hm(s.b)}" data-span="${esc(segSpan(s))}"
        title="${blkTitle(ph ? "手机" : "电脑", s)}"
        >${showTxt ? `<span>${esc(shortApp(s.app))}</span>` : ""}</span>`);
      return true;
    };
    /* ★★ 2026-09-21 晚（用户要求：「如果合并的时候没有任何重合就不做透明效果，
       如果有重合就做透明效果」）—— 窄屏叠放（= 合并）时，手机块只在
       **真的压着电脑块**的那一刻才半透明，否则原样不透明。

       怎么算"重合"：两台设备的绘制段（refineSegs 之后、且过了 RAW 的 15 分钟门槛）
       做一次区间相交判断。计算机和手机共用一个判据 `ovl()`。
       ⚠️ 门槛条件抽成 keep() 让两边共用 —— 否则"被丢掉的短块"会被算成重合，
          出现"没有任何重叠却透明"的假象（这正是用户报的那种问题）。 */
    /* ★ 2026-10-21 (v0.40.6 Feedback 1): 对齐周视图与日视图精度，去除 < 15 分钟过滤截断 */
    const keep = (s) => true;
    /* ★ 覆盖要有**最小宽度**：重合不足 1 分钟不算"覆盖"。
       为什么：时间戳精度高于分钟（refineSegs 的原始段是秒级），
       前后两个应用"恰好相接"时真实边界常叠上几秒，显示成 08:17–08:22 接 08:22–08:29 ——
       按严格相交算它们"重合"了，但那几秒的被盖尾巴**肉眼根本不存在**，
       却会让上层块白白变透明（2026-09-22 实测 4 天里 6 例全是这种）。
       1 分钟 = 全天的 0.07%，本来就是看不见的量级。 */
    const OV_EPS = 1 / 60;
    const ovl = (x, y) => Math.min(x.b, y.b) - Math.max(x.a, y.a) > OV_EPS;
    const pcL = refineSegs(seg.pc, 120).filter(keep);
    const phL = refineSegs(seg.phone, 180).filter(keep);
    /* ★★ 2026-09-22 早（用户报「Mindustry 盖住了 WorkBuddy」，并给规则）：
       覆盖关系改成**设备平权** —— 只看几何，不看谁是手机谁是电脑。

       旧逻辑：电脑全部先画、手机全部后画（手机永远在上），且只有手机块
       会因重合变透明。结果：**电脑块盖电脑块**（同一段开了两个应用）、
       或**电脑块盖手机块**时，上面那块是实心的 —— 下面块的结尾被整个吃掉
       （截图里 Mindustry 压住 WorkBuddy 的尾部，就是这个）。

       新规则（用户原话：「结束部分被覆盖的色块保持不透明，覆盖他的色块
       换成透明，手机电脑平权，只看有没有覆盖」）：
         1. 两台设备的块**混在一起，按开始时间排序**（谁后开始谁后画 = 在上层，
            它盖住的正好是先开始那块的**结尾** —— 和"结束部分被覆盖"对应）；
         2. 每个块只要和**任何一个已画的块**相交 → 自己标 `.ov`（半透明），
            被盖的那块永远不透明；
         3. 不相交就原样实色（这条沿用 9-21 的"没有重合就不透明"）。
       `.ov` 的 CSS 也从窄屏那张表挪到了**全局** —— 宽屏分栏下同设备两块
       重叠时同样会发生覆盖，规则必须一致。 */
    const drawList = pcL.map((s) => ({ s: s, ph: false }))
      .concat(phL.map((s) => ({ s: s, ph: true })))
      .sort((x, y) => x.s.a - y.s.a);
    /* ⚠️ `drawn` 只收**真的画出来**的块：pushApp 里有三道"丢块"的关卡
       （图例里隐藏的类别 / raw 的 15 分钟门槛 / place() 判太矮），
       被丢的块不该参与"盖住别人"的判定 —— 否则会出现
       「一个看不见的块让可见的块变透明」的假透明（2026-09-22 实测 6 例）。 */
    const drawn = [];
    /* ★★ 2026-09-22（用户要求「被覆盖的色块右边界向左缩几个像素」+ 解决连续覆盖）：
       在透明之外再加**深度阶梯**通道 —— 一个块被多少个块压住，右缘就缩进多少格：
       `margin-right = min(深度 × 8px, 18%)`。
       为什么安全：合并（窄屏）模式下 X 轴本来**没有语义**（色块全宽只是画布）；
       宽屏下 X 只编码左右半 —— 缩进不破坏任何既有编码，只新增"叠了几层"这个通道。
       右缘的楼梯让"这里叠了 3 层"一眼可数，连续覆盖不再糊成一坨。
       ⚠️ 深度只数**真的会画出来**的块（survives = 图例没隐藏 + 过 15 分钟门槛 +
       place() 判得出高度）—— 和 drawn 同一个口径，看不见的块不许挤歪可见的块。
       ⚠️ 18% 的上限是给窄屏周视图兜底的（一列才 41px，8px×5 会吃掉整列）。 */
    const survives = (s) => layerOn("app:" + catOf(s.app)) && keep(s) && !!place(s.a, s.b);
    /* ★ 宽屏（>700px）下电脑与手机本就在左右独立分栏（左手机 50%、右电脑 50%），
       两者空间天然隔离，绝不存在相互遮挡或挤压！因此只有同设备内的块重叠才需要
       半透明（ov）与右缘缩进台阶（depth/margin-right）。窄屏（≤700px）双端合并同列时才跨端判定。
       这样杜绝了 WorkBuddy / Antigravity 等电脑软件在无同端遮挡时右缘被手机活动错误缩进！ */
    const isNarrow = typeof window !== "undefined" && window.innerWidth <= 700;
    const sameLane = (a, b) => isNarrow || (a.ph === b.ph);
    const depth = drawList.map((it, i) =>
      drawList.slice(i + 1).filter((o) => survives(o.s) && sameLane(it, o) && ovl(it.s, o.s)).length);
    drawList.forEach((it, i) => {
      const ov = drawn.some((o) => sameLane(it, o) && ovl(it.s, o.s));   // 宽屏分栏下仅同设备才计覆盖，窄屏合并才跨设备计
      if (pushApp(it.s, it.ph, ov, depth[i])) drawn.push(it);
    });

    // tags 也要排好：同列里多个项目名若都挤在同一段，重叠就看不清。
    // 按 top 排一遍，短的在前（长条在后 = 长条被压住时还能看见短的那个开头）。
    tags.sort((p, q) => p.length - q.length);
    // 项目名栏跟着一起位移：底色 / app 色块都用 CSS 变量 --tagname 让出了左边，
    // 关掉名字栏时把它归零，整列立刻恢复满宽（周视图就靠这个）。
    const tn = showTags ? "" : " style=\"--tagname:0px\"";

    // 当前时间指示红线（仅在当前日期列渲染，遵循极简纯粹设计，无文字气泡）
    let nowIndicatorHTML = "";
    if (o.indicator !== false && isTodayCol) {
      const curH = Math.max(0, Math.min(24, getNowHourFloat()));
      const topPct = (curH / 24) * 100;
      const timeStr = getNowTimeStr();
      nowIndicatorHTML = `<div class="gv-now-line" style="top:${topPct.toFixed(3)}%" title="当前时间 ${timeStr}"><span class="gv-now-dot"></span></div>`;
    }

    const animCls = isEnteringWeek ? (idx === targetColIdx ? " gv-col-expand-day" : " gv-col-slide-exit") : "";
    return `<div class="gv-col ${isWk ? "wk" : ""} ${isTodayCol ? "today" : ""}${animCls}"${tn} data-day="${esc(colDay)}">${showTags ? tags.join("") : ""}${under.join("")}${blk.join("")}${nowIndicatorHTML}</div>`;
  }).join("");
  /* ★ 时间刻度：步长**按可用高度自适应**（原来写死 3 小时一档）。
     参照的是日视图那一列的宽高 —— 用户 9-18：「步长可以随可用空间灵活调整」。
        · 纵向：列高 H 决定一档能占多少像素，>66px 才敢标数字（两个刻度挨太近会糊）。
        · 横向：单列宽 <110px（窄屏周视图）连「00:00」都写不下 → 改标整点「0」「6」
          并把半刻度收掉，保证不溢出。
     最后一定要把 24 兜回列表里：没有它，最后一个整点到底部之间会空一大截。
  /* ★ 时间刻度：
     统一日时间线与周时间线的纵坐标刻度体验（反馈 13），统一沿用 00:00, 00:30, 01:00... 完整时间刻度。
     步长按可用高度 H 自适应，确保整点与半点刻度等宽垂直对齐，排布舒适无重叠。
     最后一定要把 24 兜回列表里：没有它，最后一个整点到底部之间会空一大截。
     ⚠️ 列表去重 + 升序。 */
  const wideTick = true;
  const step = H >= 1900 ? 1 : H >= 1150 ? 2 : H >= 760 ? 3 : H >= 520 ? 4 : H >= 340 ? 6 : 12;
  const floors = [0.5, 1, 2, 3, 4, 6];
  const minHalf = H >= 2000 ? 240 : H >= 1400 ? 300 : H >= 900 ? 450 : 900;
  const useHalf = floors.indexOf(step) >= 0 && H / step >= minHalf;
  const ticks = [];
  for (let h = 0; h <= 24; h += step) ticks.push(h);
  if (useHalf) for (let h = 0; h <= 24; h += step) {
    if (h + step / 2 < 24) ticks.push(h + step / 2);
  }
  if (ticks.indexOf(24) < 0) ticks.push(24);
  const hours = ticks.sort((a, b) => a - b).map((h) => {
    const half = !Number.isInteger(h);
    const label = String(Math.floor(h)).padStart(2, "0") + ":" + (half ? "30" : "00");
    return `<span class="${half ? "hf" : ""}" style="top:${(h / 24 * 100).toFixed(2)}%">${label}</span>`;
  }).join("");
  // 每一列下面再标一行「手机｜电脑」，说明左半边和右半边分别是谁
  const split = `<div class="gv-split" style="grid-template-columns:repeat(${N},1fr)">` +
    days.map((x, idx) => {
      const colDay = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
      const animCls = isEnteringWeek ? ` class="${idx === targetColIdx ? "split-expand-day" : "split-slide-exit"}"` : "";
      return `<span${animCls} data-day="${esc(colDay)}"><i>手机</i><i>电脑</i></span>`;
    }).join("") + "</div>";
  return `<div class="gv" style="--gvh:${H}px">
    <div></div>
    <div class="gv-head" style="grid-template-columns:repeat(${N},1fr)">${heads}</div>
    <div></div>
    ${split}
    <div class="gv-hours">${hours}</div>
    <div class="gv-grid" style="grid-template-columns:repeat(${N},1fr)">${cols}</div>
  </div>`;
}
/* 某一天的全部记录项（月视图 + 弹层共用）。时间点 = 开始时间

   ★★ 2026-09-20 深夜（v0.15.0）：加了**和时间线一致的 15 分钟门槛**。
   用户原话：「记得月视图的每日详情记得也改掉」。
   为什么必须一起改：dayItems 和时间线是**同一天的两种呈现**（一个是列表、一个是图）。
   如果时间线丢了 <15 分钟的段、列表里还留着，就会出现
   「图上没有、列表里有」的矛盾 —— 用户会以为时间线画错了。
   **同一份数据的两处呈现，口径必须一处真理。**
   ⚠️ 只加在绘制/输出这一层，不动 refineSegs（理由同 pushApp 里那段注释：
      它的 GAP=300 合并逻辑不能碰，否则会凭空造出不存在的连续时长）。 */
const DAY_MIN_SEC = 15 * 60;      // 与时间线的 15 分钟门槛同源；改这里两处一起变
function dayItems(day) {
  const d = series(30).find((x) => x.day === day) || MOCK_DAYS.find((x) => x.day === day);
  if (!d) return [];
  const seg = sessOf(day) || { pc: [], phone: [] };
  const out = [];
  if (d.sleepMin > 0)
    out.push({ t: "夜间", k: "睡眠", c: "#2c4bb0",
      m: `昨夜睡眠 ${hhmm(d.sleepMin)}${d.wake ? " · 睡到 " + hm(d.wake) : ""}` });
  // ★ 2026-09-24：小睡也列一条（用户：「小睡也值得放进趋势图」——
  //   这个列表是"当天发生了什么"的另一种呈现，同样不能漏）。
  //   ⚠️ 判据用 napMin，不用 sleepMin —— "全天只有小睡"的那天 sleepMin 是 0。
  //   颜色 #4a6dc4 = CSS 变量 --nap（这里要字面值：其他条目也都是字面色，保持一致）。
  const napList = (d.sleeps || []).filter((s) => s.nap);
  if ((d.napMin || 0) > 0)
    out.push({ t: "小睡", k: "小睡", c: "#4a6dc4",
      m: `小睡 ${hhmm(d.napMin)}${napList.length
        ? " · " + napList.map((s) => hm(s.from) + "–" + hm(s.to)).join("、") : ""}` });
  const keep = (s) => (s.b - s.a) * 3600 >= DAY_MIN_SEC;   // < 15 分钟不列（同时间线）
  refineSegs(seg.pc, 120).filter(keep).forEach((s) => out.push({ t: hm(s.a), k: shortApp(s.app), c: appColor(s.app),
    m: `电脑 · ${hm(s.a)}–${hm(s.b)}（${segSpan(s)}）` }));
  refineSegs(seg.phone, 180).filter(keep).forEach((s) => out.push({ t: hm(s.a), k: shortApp(s.app), c: appColor(s.app),
    m: `手机 · ${hm(s.a)}–${hm(s.b)}（${segSpan(s)}）` }));
  (d.workouts || []).forEach((w) => out.push({ t: "运动", k: workLabel(w), c: "#3dd68c",
    m: workLine(w) }));
  return out;
}
/* 某一天各「类别」的总时长（秒）。
   月视图用它 —— 逐条罗列没可读性，按类别汇总才看得出一天长什么样。

   ★ 2026-09-18 用户定：「月视图不要折叠了，全部展现，0min 的也展现，其他分类不展现」。
   解读（按实际数据校准过，不是猜的）：
     · **不折叠**：原来 `cats.slice(0, MV_MAX)` 只摆前 3 个、剩下折成「另外 N 项」，
       现在全部摆完。
     · **不做「只列出现过的」**：所有**已知类别**都列一行，当天没用到的显示 0m。
       为什么：只列出现过的，你看不出「今天没玩游戏」——那恰恰是重要信息。
       全列出来，一眼扫过去就知道哪几项是空的。
       ⚠️ 实测确认过：`refineSegs` 会把 <120s 的碎片并进邻居，
          所以「时长恰好为 0 的类别」在**数据层根本到不了这里** ——
          「0min」只可能来自「这个类别当天没被用到」，所以下面直接补零行。
     · **「其他」不列**：那是个兜底桶（认不出类别的 app 都落这儿），
       条目杂、名字说明不了什么，列出来只是占地方。
     · **「睡眠」不列**：它不是"在用什么"，而且时间线上已经有底色条了。

   返回：[[类别名, 秒数], ...]，**按时长降序**，0 秒的排在最后（彼此按名字排，保持稳定）。 */
function dayCatSecs(day) {
  const s = sessOf(day);
  if (!s) return [];
  const acc = {};
  let any = 0;          // 这天到底有没有"真记录"（非噪音、非其他）
  [].concat(s.pc || [], s.phone || []).forEach((x) => {
    if (!x || !x.app || isNoise(x.app)) return;
    const sec = Math.max(0, (x.sec != null) ? x.sec : (x.b - x.a) * 3600);
    const c = catOf(x.app);
    if (c === "睡眠" || c === "其他") return;
    acc[c] = (acc[c] || 0) + sec;
    any += sec;
  });
  /* ⚠️ 这天一条记录都没有（比如 8 月还没开始采集）→ 返回**空数组**，
     让月视图走「这天没有记录」那条分支。
     不能一视同仁地补 10 行 0m —— 实测 30 天里有 17 天是全空的，
     10 行 0m 糊满整格，看着像"数据全坏"，反而盖住了真正有数据的那几天。 */
  if (!(any > 0) && !Object.keys(acc).length) return [];
  /* 把**所有已知类别**都摆出来（allCats() 排除「其他」），没用到的记 0。
     顺序：有量的按时长降序在前，0 的在后（按名字排，免得每次重绘顺序乱跳）。 */
  const names = allCats().filter((c) => c !== "其他" && c !== "睡眠");
  const rows = names.map((c) => [c, acc[c] || 0]);
  return rows.sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]));
}

/* ==================== 类别占比环形图（时间线页图例正下方） ====================
   用户定的框架（2026-09-21）：周/日时间线底部加环形图，点扇形下钻看该类别下
   每个 App 的时长（条形图）。已拍板的细节：
     · PC + 手机都算（两路合并，同一类别相加）；
     · 第一层跟图例开关联动：图例隐藏的类别**不画扇形**，但分母不变 ——
       百分比仍是「占总 app 时间」的百分比（用户明确要求）；
     · 大扇形内嵌名称+百分比，中扇形只放序号（图例行对应），太小的省略 ——
       判据用**弧长**（能放下多少字的物理长度），不是拍脑袋的角度；
     · 下钻条形图 Top 8 +「其他 N 个应用」合并，名称内嵌条内，**颜色统一**；
     · 数据与时间线**同源**：同样吃 sessOf 的原始分段（不经绘制层的 15 分钟门槛），
       同一个 isNoise / catOf / 睡眠排除 —— 饼图数字必须能和时间线对上。
   数据口径与 dayCatSecs 一致（PC+手机合并、滤噪音、排除睡眠/其他），
   但多天求和（周视图 = 7 天合计）且只返回**有量的**类别。 */
function pieCatSecs(dayList) {
  const acc = {};
  let total = 0;
  dayList.forEach((day) => {
    const s = sessOf(day);
    if (!s) return;
    [].concat(s.pc || [], s.phone || []).forEach((x) => {
      if (!x || !x.app || isNoise(x.app)) return;
      const sec = Math.max(0, (x.sec != null) ? x.sec : (x.b - x.a) * 3600);
      const c = catOf(x.app);
      if (c === "睡眠" || c === "其他") return;
      acc[c] = (acc[c] || 0) + sec;
      total += sec;
    });
  });
  const rows = Object.entries(acc).filter((p) => p[1] > 0).sort((a, b) => b[1] - a[1]);
  return { rows: rows, total: total };
}
/* 下钻：某类别下各 App 的时长（同样口径）。返回 [[显示名, sec], ...] 降序。
   ★ 2026-09-21：PC 和手机可能都有"同一个应用"——但两路的 key 字符串不一样
   （PC 是原始进程名 msedge.exe，手机是显示名 Edge），直接按字符串比同名永远比不出来。
   所以：显示名统一走 showName()（你在分类页设的显示名映射），后缀判定也按**显示名**
   分组 —— 两台设备的显示名相同才加「（电脑）/（手机）」，只有一台在用保持原名。 */
function pieAppSecs(dayList, cat) {
  const acc = {};       // key = 原始app + "\u0001" + dev
  dayList.forEach((day) => {
    const s = sessOf(day);
    if (!s) return;
    const walk = (arr, dev) => [].concat(arr || []).forEach((x) => {
      if (!x || !x.app || isNoise(x.app)) return;
      if (catOf(x.app) !== cat) return;
      const sec = Math.max(0, (x.sec != null) ? x.sec : (x.b - x.a) * 3600);
      if (sec > 0) {
        const k = x.app + "\u0001" + dev;
        acc[k] = (acc[k] || 0) + sec;
      }
    });
    walk(s.pc, "电脑");
    walk(s.phone, "手机");
  });
  // 冲突检测按**显示名**：同名出现在两台设备 → 加后缀
  const byLabel = {};
  Object.keys(acc).forEach((k) => {
    const label = showName(k.split("\u0001")[0]);
    byLabel[label] = (byLabel[label] || 0) + 1;
  });
  return Object.entries(acc)
    .map(([k, sec]) => {
      const [app, dev] = k.split("\u0001");
      const label = showName(app);
      /* ★ 2026-09-22：把**原始键**一并带回（raws）—— 下钻行的详情框要拿它去
         查使用时段、改类别；同名跨设备的行（label+"（设备）"）可能对应多个键。 */
      const raws = [];
      Object.keys(acc).forEach((k2) => {
        const [a2, d2] = k2.split("\u0001");
        if (showName(a2) === label) raws.push({ app: a2, dev: d2 });
      });
      return [byLabel[label] > 1 ? label + "（" + dev + "）" : label, sec, raws];
    })
    .sort((a, b) => b[1] - a[1]);
}

/* 收集若干**原始键**（app+设备）在给定若干天里的全部使用时段（2026-09-22，
   下钻行详情框用）。口径和时间线一致：refineSegs(pc,120)/(phone,180)
   （清碎片 + ≤5 分钟合并），但**不做** 15 分钟绘制门槛 —— 详情要完整。
   返回 [{day, dev, ta, tb, span}]，按 天 → 时刻 排好。 */
function spansForRaws(days, raws) {
  const out = [];
  (days || []).forEach((d) => {
    const s = sessOf(d);
    if (!s) return;
    (raws || []).forEach(({ app, dev }) => {
      const k = dev === "电脑" ? "pc" : "phone";
      refineSegs(s[k] || [], k === "pc" ? 120 : 180).forEach((seg) => {
        if (seg.app !== app) return;
        const spanMin = Math.max(0, (seg.b - seg.a) * 60);
        out.push({ day: d, dev: dev, ta: hm(seg.a), tb: hm(seg.b),
          span: dur(Math.round((seg.sec != null ? seg.sec : spanMin * 60) / 60)) });
      });
    });
  });
  out.sort((x, y) => (x.day + x.ta).localeCompare(y.day + y.ta));
  return out;
}

/* 环形图卡片（含下钻条形图）。drill = 当前下钻的类别名或 null。 */
let pieDrill = null;

function pieCardHTML(dayList) {
  const { rows, total } = pieCatSecs(dayList);
  if (!(total > 0)) return "";
  const P2 = (n) => String(n).padStart(2, "0");
  const spanTxt = dayList.length > 1
    ? `最近 ${dayList.length} 天 · 共 ${dur(total / 60)}`
    : `共 ${dur(total / 60)}`;
  const R_OUT = 110, R_IN = 66;
  // 中弧半径（内嵌文字的行走线）：外 110 内 66，两行走 98 / 80
  const R1 = 98, R2 = 80;
  const CX = 120, CY = 120;
  const rad = (a) => (a - 90) * Math.PI / 180;          // 0° 指向 12 点
  const pt = (r, a) => [CX + r * Math.cos(rad(a)), CY + r * Math.sin(rad(a))];
  // 环带扇形 path（外弧顺时针 + 内弧逆时针）
  const slice = (a0, a1) => {
    const [x0, y0] = pt(R_OUT, a0), [x1, y1] = pt(R_OUT, a1);
    const [x2, y2] = pt(R_IN, a1), [x3, y3] = pt(R_IN, a0);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${R_OUT} ${R_OUT} 0 ${large} 1 `
         + `${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} `
         + `A${R_IN} ${R_IN} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
  };
  // 中弧 path（textPath 的行走线）：只走到扇形弧的 88%，留边防溢出
  const midArc = (a0, a1, r) => {
    const pad = (a1 - a0) * 0.06;
    const [x0, y0] = pt(r, a0 + pad), [x1, y1] = pt(r, a1 - pad);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 `
         + `${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  // 内嵌阈值按**弧长**算：中弧一周长 ≈ 2π×98 ≈ 616px，每字（中文）≈ 11px。
  // 名称行需要 名称字数×11 + "xx% · xxm" ≈ 55px，且两行都要放得下。
  const embedMin = (cat) => {
    const need = shortApp(cat).length * 11 + 58 + 20;   // +20 弧两端留边
    return need / (2 * Math.PI * R1) * 360;             // 换算成角度
  };
  const NO_MIN = 9;                                     // 序号也要 ~9° 才放得下
  let a = 0, idx = 0;
  const slices = [], legendRows = [], arcs = [], labels = [];
  rows.forEach(([cat, sec]) => {
    if (!layerOn("app:" + cat)) return;                 // 图例隐藏的类：不画，但分母含它
    const deg = sec / total * 360;
    const a0 = a, a1 = a + deg; a = a1;
    idx += 1;
    const color = catColor(cat);
    const pct = Math.round(sec / total * 100);
    const dimCls = pieDrill ? (pieDrill === cat ? "" : " pl-dim") : "";
    slices.push(`<g class="pl-seg${dimCls}" data-cat="${esc(cat)}">
      <path d="${slice(a0, a1)}" fill="${color}"
        stroke="rgba(0,0,0,.35)" stroke-width="1"></path></g>`);
    // 内嵌（两行 textPath）或序号（中点水平数字）或省略
    const mid = (a0 + a1) / 2;
    if (deg >= embedMin(cat)) {
      arcs.push(`<path id="pa${idx}" d="${midArc(a0, a1, R1)}" fill="none"></path>`
              + `<path id="pb${idx}" d="${midArc(a0, a1, R2)}" fill="none"></path>`);
      labels.push(`<text font-size="11.5" fill="rgba(255,255,255,.95)" font-weight="600"><textPath`
        + ` href="#pa${idx}" startOffset="50%" text-anchor="middle">${esc(shortApp(cat))}</textPath></text>`
        + `<text font-size="10" fill="rgba(255,255,255,.75)"><textPath`
        + ` href="#pb${idx}" startOffset="50%" text-anchor="middle">${pct}% · ${dur(sec / 60)}</textPath></text>`);
    } else if (deg >= NO_MIN) {
      const [tx, ty] = pt((R_IN + R_OUT) / 2, mid);
      labels.push(`<text x="${tx.toFixed(1)}" y="${(ty + 3.5).toFixed(1)}" text-anchor="middle"`
        + ` font-size="10.5" fill="rgba(255,255,255,.95)" font-weight="600">${idx}</text>`);
    }
    legendRows.push(`<div class="pl-row" data-cat="${esc(cat)}">
      <span class="no">${deg >= embedMin(cat) ? "" : (deg >= NO_MIN ? idx : "")}</span>
      <i style="background:${color}"></i><span class="nm">${esc(cat)}</span>
      <span class="pct">${pct}%</span><span class="tm">${dur(sec / 60)}</span></div>`);
  });
  // 下钻：Top 8 + 其他合并。条形宽度相对最大者（排名图比相对总数好读）。
  let drillHTML = "";
  if (pieDrill) {
    const apps = pieAppSecs(dayList, pieDrill);
    const top = apps.slice(0, 8);
    const rest = apps.slice(8);
    const restSec = rest.reduce((s, p) => s + p[1], 0);
    if (rest.length) top.push(["其他 " + rest.length + " 个应用", restSec]);
    const maxSec = top.length ? top[0][1] : 0;
    const catSec = apps.reduce((s, p) => s + p[1], 0);
    const bars = top.map(([name, sec, raws]) => {
      const w = Math.max(6, Math.round(sec / (maxSec || 1) * 100));
      /* ★ 2026-09-22（用户要求「下钻条形图要完整应用名」）：
         名称不再是"塞在条里截断"，而是独立的一层，插 DOM 后由 fixDrillNames()
         实测宽度决定放哪（条内 / 灰区最右 / 左对齐硬塞，见 CSS .pd-nm 三态）。
         ⚠️ 为什么不在字符串阶段算：字体渲染宽度只有浏览器知道，算错就白搭。
         data-raw 带原始键（app+设备，JSON），点行弹详情用；「其他 N 个应用」
         没有单一 app → raws=null，详情对它不生效。
         ⚠️⚠️ 2026-10-31（XSS）：这个属性**必须保持单引号包裹**，安全性完全依赖
         esc() 把 `'` 和 `"` **都**转成实体（见 04_footprint_core.js 的 esc）。
         - 不能换成双引号属性：JSON.stringify 的输出里一定有 `"`，换成 `"..."` 会在
           属性边界上打架（esc 会把它们变成 &quot; 而幸免，但可读性/可维护性极差）。
         - 不要为了"不带 JSON"改成 data-raw-idx + 模块级数组：消费点
           `07_views.js:2086` 是直接 `JSON.parse(el.dataset.raw)` 的，改结构就得同时改
           调用方（本次修复不允许动 07_views.js），影响面远大于收益。
         结论：保持"单引号属性 + esc 同时转义两种引号"这一条不变量即可。 */
      return `<div class="pd-row" data-raw='${esc(JSON.stringify(raws || null))}' title="点看使用时段与设置"><div class="track"><div class="bar" style="width:${w}%"></div>
        <span class="pd-nm">${esc(shortApp(name))}</span></div>
        <span class="tm">${dur(sec / 60)}</span></div>`;
    }).join("");
    drillHTML = `<div class="pie-drill">
      <div class="pd-cap"><span>${esc(pieDrill)} · 合计 ${dur(catSec / 60)}</span></div>
      ${bars || `<div class="empty">这段没有「${esc(pieDrill)}」类别的应用记录。</div>`}
    </div>`;
  }
  const centerTxt = pieDrill
    ? `<g class="pie-center-btn" data-pieback="1">
         <rect x="${CX - 46}" y="${CY - 12}" width="92" height="24" rx="6"></rect>
         <text x="${CX}" y="${CY + 4}" text-anchor="middle">‹ 返回总览</text></g>`
    : `<text x="${CX}" y="${CY - 4}" text-anchor="middle" font-size="11"
         fill="var(--dim2)">手机 + 电脑</text>
       <text x="${CX}" y="${CY + 14}" text-anchor="middle" font-size="13"
         fill="var(--fg)" font-weight="600">${dur(total / 60)}</text>`;
  return `<div class="card" id="piecard">
    <div class="cap"><span><b>类别占比</b></span>
      <em>${esc(spanTxt)}</em></div>
    <div class="pie-wrap">
      <svg width="${CX * 2}" height="${CY * 2}" viewBox="0 0 ${CX * 2} ${CY * 2}" role="img"
        aria-label="类别时长占比">
        <defs>${arcs.join("")}</defs>
        ${slices.join("")}
        ${labels.join("")}
        ${centerTxt}
      </svg>
      ${pieDrill ? drillHTML : `<div class="pie-legend">${legendRows.join("")}</div>`}
    </div>
  </div>`;
}

/* =========================================================
   时间线 30 天月视图（v0.42.0 重构为横向堆叠条形图）：
   类似健康板块趋势图，但柱形图横向放置。
   ① 30 天垂直排布，每天一行；
   ② 左侧日期标签（宽约 85px）：展示如 "10/24 六"，区分工作日/周末，今日高亮；
   ③ 中间横向堆叠柱槽位（自适应宽度，带刻度参考背景）：
      - 柱宽按当天总时长与 30 天中最大总时长比例缩放（totalSec / maxSec * 100%）；
      - 同一天同一类的合并：调用 dayCatSecs(day) 累加；
      - 分类从左到右顺序严格固定为 FIXED_ORDER（跨天垂直对齐，杜绝乱跳）；
      - 各分类切片采用 catColor(cat)，带悬浮 Tooltip；
   ④ 右侧总时长标签（宽约 50px，右对齐）：等宽数字展示当天总时长（如 "7h39m"，无记录显示 "-"）；
   ⑤ 顶部图例栏：固定顺序展示分类名称与色点；
   ⑥ 点击任意一行触发 openDay(day) 打开当日详情。
   ========================================================= */
const TIMELINE_FIXED_CAT_ORDER = [
  "工作", "学习", "社交", "视频", "游戏", "阅读", "工具", "系统", "浏览器", "其他"
];

function monthView(rows) {
  if (!rows || !rows.length) return "";

  // 1. 预先计算每天各分类总时长，并找出 30 天中的最大单日总时长 maxSec
  const dayStats = rows.map((x) => {
    const dayStr = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
    const cats = (typeof dayCatSecs === "function") ? dayCatSecs(dayStr) : [];
    
    // 合并同分类时长到 map 中
    const catMap = {};
    cats.forEach(([c, sec]) => {
      if (sec > 0) catMap[c] = (catMap[c] || 0) + sec;
    });

    const activePairs = Object.entries(catMap);
    const totalSec = activePairs.reduce((acc, [, s]) => acc + s, 0);

    return {
      dayStr,
      catMap,
      totalSec,
      rowObj: x
    };
  });

  // 最大总时长，若全都为 0 则兜底 8 小时 (28800 秒)
  const maxDaySec = Math.max(...dayStats.map((d) => d.totalSec), 0) || (8 * 3600);

  // 2. 统计这 30 天中出现过的分类，保持固定顺序展示在图例中
  const appearedCats = new Set();
  dayStats.forEach((d) => {
    Object.keys(d.catMap).forEach((c) => appearedCats.add(c));
  });

  const legendCats = TIMELINE_FIXED_CAT_ORDER.filter((c) => appearedCats.has(c));
  Array.from(appearedCats).forEach((c) => {
    if (!TIMELINE_FIXED_CAT_ORDER.includes(c)) legendCats.push(c);
  });
  const displayLegendCats = legendCats.length ? legendCats : TIMELINE_FIXED_CAT_ORDER.slice(0, 6);

  const legendHTML = `<div class="mv-hbar-legend">
    ${displayLegendCats.map((c) => {
      const color = (typeof catColor === "function") ? catColor(c) : "#38bdf8";
      return `<span class="mv-hbar-lg-item"><i style="background:${color}"></i><span>${esc(c)}</span></span>`;
    }).join("")}
  </div>`;

  // 3. 构建 30 天每天一行的横向条形图
  const WD_NAMES = ["日", "一", "二", "三", "四", "五", "六"];

  const rowsHTML = dayStats.map((d) => {
    const dayStr = d.dayStr;
    const dateObj = new Date(dayStr + "T00:00:00Z");
    const dow = dateObj.getUTCDay();
    const dowName = WD_NAMES[dow] || "";
    const isWk = (dow === 0 || dow === 6);
    const work = (typeof isWorkday === "function") ? isWorkday(dayStr) : !isWk;
    const isToday = (typeof isDayToday === "function" && isDayToday(dayStr)) || dayStr === TODAY;

    // 日期展示如 "10/24 六"
    const mmdd = dayStr.length >= 10 ? `${dayStr.slice(5, 7)}/${dayStr.slice(8, 10)}` : dayStr;
    const dateLabel = `${mmdd} ${dowName}`;

    // 当日堆叠条形：按 TIMELINE_FIXED_CAT_ORDER 严格从左到右排列
    const sortedCatsForDay = [];
    TIMELINE_FIXED_CAT_ORDER.forEach((c) => {
      if (d.catMap[c] > 0) {
        sortedCatsForDay.push([c, d.catMap[c]]);
      }
    });
    Object.keys(d.catMap).forEach((c) => {
      if (!TIMELINE_FIXED_CAT_ORDER.includes(c) && d.catMap[c] > 0) {
        sortedCatsForDay.push([c, d.catMap[c]]);
      }
    });

    // 条形的总宽度按该日总时长占 30 天中最大时长的百分比缩放
    const barWidthPct = d.totalSec > 0 ? Math.min(100, Math.max(1, (d.totalSec / maxDaySec) * 100)) : 0;

    // 各分类切片宽度占该条形总宽度的百分比
    let segsHTML = "";
    if (d.totalSec > 0) {
      segsHTML = sortedCatsForDay.map(([c, sec]) => {
        const segPct = (sec / d.totalSec) * 100;
        const color = (typeof catColor === "function") ? catColor(c) : "#38bdf8";
        const durText = (typeof dur === "function") ? dur(sec / 60) : `${Math.round(sec / 60)}m`;
        return `<span class="mv-hbar-seg" style="width:${segPct.toFixed(2)}%;background:${color};" title="${esc(c)} ${durText}"></span>`;
      }).join("");
    }

    let durText = "0h";
    if (d.totalSec > 0) {
      const m = Math.round(d.totalSec / 60);
      if (m > 0) {
        durText = (typeof dur === "function") ? dur(m) : `${Math.floor(m / 60)}h${m % 60 ? String(m % 60).padStart(2, "0") : ""}`;
      }
    }

    const tipDetail = sortedCatsForDay.length
      ? sortedCatsForDay.map(([c, s]) => `${c} ${(typeof dur === "function") ? dur(s / 60) : Math.round(s/60)+"m"}`).join(" · ")
      : "无活动记录";
    const rowTitle = `${esc(dayStr)} ${dowName}${d.totalSec > 0 ? " · 总计 " + durText : ""} (${tipDetail})`;

      <div class="mv-hbar-meta">
        <span class="mv-hbar-date">${dateLabel}</span>
        <span class="mv-hbar-dur">${durText}</span>
      </div>
      <div class="mv-hbar-track">

          ${segsHTML}
        </div>
      </div>

  return `<div class="mv-wrap"><div class="mv-hbar-chart">
    ${legendHTML}
    <div class="mv-hbar-axis mv-hbar-header">
      <div class="mv-hbar-header-spacer"></div>
      <div class="mv-hbar-ticks">
        <span>0h</span>
        <span>${(maxDaySec / 3600 * 0.25).toFixed(1).replace(/\.0$/, "")}h</span>
        <span>${(maxDaySec / 3600 * 0.5).toFixed(1).replace(/\.0$/, "")}h</span>
        <span>${(maxDaySec / 3600 * 0.75).toFixed(1).replace(/\.0$/, "")}h</span>
        <span>${(maxDaySec / 3600).toFixed(1).replace(/\.0$/, "")}h</span>
      </div>
    </div>
    <div class="mv-hbar-body">
      ${rowsHTML}
    </div>
  </div></div>`;
}

/* ★ 2026-09-20（用户：「详细地点下面的灰色汉字里『今天』两个字没有任何意义，

/* 一行地点的公共渲染（named / unknown / 折叠区里的路过行都走这里）。

/* ★ 2026-10-13 反馈 8：重构路过地点的聚合/压缩逻辑（Debounce / Grouping / Consecutive Merge）。

   - 对连续路过的相同地点进行合并聚类（例如合并为「教学楼 / 图书馆 × N次」），汇总累计停留时长；
   - 使得路过地点列表具备实际参考与回顾价值。 */
function aggregatePassedPlaces(passedList) {
  if (!passedList || !passedList.length) return [];

  // 1. 过滤极短且没有信息量的瞬时漂移点
  const filtered = passedList.filter((u) => {
    if (isPlaceHidden(u.lat, u.lon)) return true; // 用户主动标记忘掉的点予以保留
    const guess = (u.guess || "").trim();

  if (!filtered.length) return [];

  // 2. 按时间升序排序（保证连续路过的时序性）
  const sorted = filtered.slice().sort((a, b) => {

    if (prev && prev.rawName === rawName) {

      prev.n = (prev.n || 1) + (u.n || 1);
      prev.cum = (prev.cum || 0) + (u.n || 1) * 15;
      if (u.last) prev.last = u.last;
      if (!prev.first && u.first) prev.first = u.first;
      prev.lat = (prev.lat + u.lat) / 2;
      prev.lon = (prev.lon + u.lon) / 2;
      continue;
    }

    merged.push({
      ...u,
      rawName: rawName,
      count: 1,
      cum: (u.n || 1) * 15,
    });
  }

  // 4. 格式化输出为最终渲染对象
  return merged.map((m) => {
    const nm = m.count > 1 ? `${m.rawName} × ${m.count}次` : m.rawName;
    return {
      nm: nm,
      lat: m.lat,
      lon: m.lon,
      un: true,
      dim: true,
      plain: true,
      stays: null,
      cum: m.cum,
      first: m.first,
      last: m.last,
      guess: "",
      count: m.count,
      key: placeKeyC(m.lat, m.lon),
      color: "#3a4453",
    };
  });
}

function myPlacesCard(traces, validKeys, validColors) {
  if (validKeys && !(validKeys instanceof Set) && typeof validKeys === "object" && validColors === undefined) {
    validColors = validKeys;
    validKeys = null;
  }
  const named = PLACE_MEM.named || [], unkAll = PLACE_MEM.unknown || [];
  const unk = fpUnknownList();
  /* ★★ 优先按地点身份 Key（如 n:宿舍 或 c:lat,lon）过滤，兜底按 validColors */
  const keep = (key, color) => {
    if (validKeys && validKeys.size) return validKeys.has(key);
    if (validColors && validColors.size) return validColors.has(color);
    return true;
  };
  // 折叠区：只路过 1 次的 + 被忘掉的（展示出来是为了让你知道「忘掉」生效了）
  const passed = unkAll.filter((u) => u.n < 2 || isPlaceHidden(u.lat, u.lon));
  const mergedPassed = aggregatePassedPlaces(passed);
  if (!named.length && !unk.length && !mergedPassed.length) {
    return `<div class="card"><div class="cap"><span><b>常去地点</b></span></div>
      <div class="empty" style="font-size:11.5px;line-height:1.7">
        还没有地点记录。位置每 15 分钟采一次，攒够数据后这里会列出你去过的地方。</div></div>`;
  }
  /* 取色一律 `placeColor(key)` —— 颜色按**坐标身份**从 `placePalette()` 里查，
     和 `gAt` / 热力格 / 图例是**同一份**。（第二个参数是历史残留的兜底序号，正常不会用到。） */
  const namedRows = named.map((m, i) => ({
    nm: m.name, lat: m.lat, lon: m.lon, un: false,
    stays: traces ? placeStaysToday(traces, m.lat, m.lon) : null,
    cum: m.n > 0 ? m.n * 15 : null, first: m.first,
    guess: "", key: placeKeyN(m.name), color: placeColor(placeKeyN(m.name), i),
  })).filter((o) => keep(o.key, o.color)).map((o) => fpRow(o));

  const unkAllValid = unk.map((u) => {
    const cid = placeKeyC(u.lat, u.lon);
    return { u: u, cid: cid };
  }).filter((x) => {
    const g = gAt(x.u.lat, x.u.lon);
    return !!g && g.k === x.cid;
  });

  const unkRows = unkAllValid.filter((x) => {
    const col = placeColor(x.cid, named.length + x.u.__idx);
    if (validColors && validColors.size && !validColors.has(col)) return false;
    if (validKeys && validKeys.size && !validKeys.has(x.cid)) return false;
    if (!validColors && !validKeys && (!traces || !traces.length)) return false;
    if (traces && traces.length) {
      const stays = placeStaysToday(traces, x.u.lat, x.u.lon);
      if (!stays || stays.length === 0) return false;
    }
    return keep(x.cid, col);
  }).map((x) => {
    const u = x.u;
    return fpRow({
      nm: "未知位置 " + (u.__idx + 1), lat: u.lat, lon: u.lon, un: true,
      stays: traces ? placeStaysToday(traces, u.lat, u.lon) : null,
      cum: u.n * 15, first: u.first, guess: u.guess,
      key: x.cid, color: placeColor(x.cid, named.length + u.__idx),
    });
  });

  const passRows = fpShowPass ? mergedPassed.map((o) => fpRow(o)).join("") : "";
  const hidden = (validKeys || validColors)
    ? (named.length + unk.length - namedRows.length - unkRows.length) : 0;

  return `<div class="card">
    <div class="cap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
      <span><b>常去地点</b></span>
      <em>${namedRows.length} 个已命名 · ${unkRows.length} 个待确认</em>
    </div>
    ${namedRows.length || unkRows.length ? `<div class="fp-places">${namedRows.join("")}${unkRows.join("")}</div>`
      : `<div class="empty" style="font-size:11.5px;line-height:1.7">
          上面这张图里没有已命名的地点（${hidden} 个地点这次没出现）。</div>`}

    ${passRows}
    ${mergedPassed.length ? `
      <button class="fp-pass" type="button" aria-expanded="${fpShowPass}">
        <svg class="fp-pass-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="transform:${fpShowPass ? 'rotate(180deg)' : 'none'}"><path d="M6 9.5l6 6 6-6z"/></svg>
        <span>${fpShowPass ? "收起" : "另有"} ${mergedPassed.length} 个路过地点</span>
      </button>` : ""}
  </div>`;
}

/* 月视图点一格 → 小窗里**渲染当天的时间线**（就是日视图那一列，用户 9-18 明确：
   「以小窗的形式展现日视图的样子，也就是一个小窗形式展现日时间线」）。
   原先是文字流水列表（.pop-list），看不出"一天是怎么铺开的"，换成时间线一眼就懂。
   复用 gridView()，只给它一天 → 单列 + 带项目名栏，和日视图完全一致。 */
function openDay(day, keepZoom) {
  popDay = day;                    // 弹层当前在看哪天（缩放重画要用）
  if (!keepZoom) popH = 0;         // 新开一天：高度回默认；keepZoom=交互后重画，保留用户调过的高度
  const d = series(30).find((x) => x.day === day) || MOCK_DAYS.find((x) => x.day === day) || {};
  const wd = WD[new Date(day + "T00:00:00Z").getUTCDay()];

       所以从月视图点进来的这一列，色块该显示名字的就会显示，
       不会出现"日视图有名字、点进来没了"这种不一致。
       ⚠️ 弹层在手机上几乎占满屏（.pop 的窄屏规则），所以这里要按 isNarrow 分档。 */
  /* ★★ 2026-09-20 深夜（v0.15.0）：弹层**不传 raw** —— 用户特别提醒过
      「修改日视图和周视图的时间线展示逻辑的时候，不要忘了点击月视图详情中
       天的那个日视图的逻辑」。
     结论：弹层保持**日视图的行为**（长高、不丢短活动），和主视图的日视图一致。
     为什么不做成 raw：弹层是"这一天发生了什么"的完整视图，一列宽裕（列宽接近整屏），
     长高在这里的作用是"让 8 分钟的记录也能看见名字"，用户白天的诉求依然成立。
     真正需要"严格几何"的是**周视图**（7 列并排、要横向比较每一天），
     那个已在主视图的调用处传了 raw: true。
     ⚠️ 三处 gridView 调用（主视图日/周 + 弹层）必须语义一致地演进：
        以后改任何一处，先把另外两处想一遍。

     ⚠️⚠️ 这段注释必须留在模板字符串**外面**！曾经写进了 el.innerHTML 的模板里 ——
     HTML 不认 C 风格注释，整段被浏览器当**文本节点**渲染在了弹层上
     （用户截图抓到的 bug：弹层里冒出一大段中文说明）。
     ⚠️ 记一笔：写注释时**别在注释里打出块注释的结束标记** —— 会让注释提前闭合。 */
  const defH = Math.max(420, Math.min(900, Math.round(window.innerHeight * 0.62)));
  const h = popH || defH;
  const popLinePx = isNarrow() ? TXT_H.narrow : TXT_H.wide;
  /* 这天出现过的类别 → 图例。和日视图**同一套开关**（data-layer = sleep/workout/app:类别，
     存进 RULES.show 跟到云端）；gridView 内部本来就吃 layerOn()，
     所以翻转后色块立刻消失，不用改 gridView。 */
  const s = sessOf(day);
  const cats = Array.from(new Set([].concat((s && s.pc) || [], (s && s.phone) || [])
    .map((y) => catOf(y.app))));
  const lg = (k, color, label) =>
    `<span class="lg ${layerOn(k) ? "" : "off"}" data-layer="${esc(k)}"
      title="点一下隐藏「${esc(label)}」，再点一下显示"><b style="background:${color}"></b>${esc(label)}</span>`;
  el.innerHTML = `<div class="pop-in wide pop-box">
    <div class="pop-h">
      <span class="wd">周${wd}</span><b>${Number(day.slice(8))}</b>
      <span class="sum">睡 ${hhmm((d.sleepMin || 0) + (d.napMin || 0))}${(d.napMin || 0) > 0
        ? `（含小睡 ${hhmm(d.napMin)}）` : ""} · 电脑 ${dur(d.pcMin || 0)} · ${(d.steps || 0).toLocaleString()} 步</span>
      <button class="x" id="popx">×</button>
    </div>
    <div class="pop-body">
      <div class="gv-tools">
        <button id="pzin" title="放大">+</button>
        <button id="pzout" title="缩小">−</button>
        <button id="pzrst" class="wide">重置</button>
        <span class="hint">Ctrl + 滚轮 缩放时间轴</span>
      </div>
      <div class="pop-gv">${gridView([d], { h: h, tags: true,

    </div>
    <div class="pop-legend gv-legend">
      ${lg("sleep", "#2c4bb0", "睡眠")}

      ${cats.map((c) => lg("app:" + c, catColor(c), c)).join("")}
      ${hiddenLayers().length ? `<button class="lg-reset" id="poplgreset"
        title="把被隐藏的 ${hiddenLayers().length} 层（${hiddenLayers().map(layerLabel).join("、")}）全部显示出来">
        ⟲ 全部显示</button>` : ""}
      <span class="hint lg-hint only-wide">左半 = 手机 · 右半 = 电脑 · 点色块看详情</span>
      <span class="hint lg-hint only-narrow">描边深 = 电脑 · 描边白 = 手机 · 点色块看详情</span>
    </div>

  el.classList.add("on");
  $("#popx").onclick = () => { el.classList.remove("on"); popDay = null; };
  el.onclick = (ev) => { if (ev.target === el) { el.classList.remove("on"); popDay = null; } };
  /* 图例 → 与日视图同一套语义：先本地翻转重绘，再异步 saveRules() 同步到云端 */
  el.querySelectorAll(".pop-legend .lg").forEach((elm) => {
    elm.onclick = () => { toggleLayer(elm.dataset.layer); openDay(day, true); saveRules(); };
  });
  const plr = $("#poplgreset");
  if (plr) plr.onclick = () => { showAllLayers(); openDay(day, true); saveRules(); };
  const zi = $("#pzin"), zo = $("#pzout"), zr = $("#pzrst");
  if (zi) zi.onclick = () => zoomPop(1.2);
  if (zo) zo.onclick = () => zoomPop(1 / 1.2);
  /* ⚠️ 弹层里的应用色块不再挂「点一下改分类」—— 这里只是看，不该能改到数据。
     应用块改为默认箭头，但睡眠/运动/课程底色块仍支持点击查看详情。 */
  el.querySelectorAll(".gv-blk[data-app]").forEach((b) => { b.style.cursor = "default"; });
  el.querySelectorAll(".gv-blk[data-tid], .gv-tag[data-tid]").forEach((b) => {
    b.style.cursor = "pointer";
    b.onclick = (e) => {
      e.stopPropagation();
      const tid = b.dataset.tid;
      if (tid && window._tlItems && window._tlItems.has(tid)) {
        const it = window._tlItems.get(tid);
        if (typeof showTimelineUnderDetail === "function") {
          showTimelineUnderDetail(it);
        }
      }
    };
  });
}

/* ------------------ 状态 ------------------ */
/* ⚠️ gvH 初始给 0 = "还没定过"，真正的值由首次渲染时 gvDefault() 算。
   不要在这里写 840 —— 那是宽屏日视图的默认值，手机上会偏矮（用户抱怨的正是这个），
   写死就等于把窄屏的默认高度又绕过去了。 */
/* ★ 分享快照模式（2026-09-22）：curDay 默认 = 快照最后一天，而不是朋友本机"今天"。
   快照是冻结副本，只有生成时那天的 report 在 KV 里；朋友在 3 天后打开时本机"今天"
   超出快照范围，请求 report/<今天>.json 必 404。改默认到 lastDay，配合 make_share
   为每个日期都放好 report 文件，彻底消掉这个 404。正式看板不受影响（SHARE 为假）。 */
let curDay = (SHARE && window.SHARE_CFG && window.SHARE_CFG.lastDay) ? window.SHARE_CFG.lastDay : TODAY,
    trendN = 14, tab = "health", chat = [], tlView = "day", gvH = 0,
    /* ★ 2026-09-30：足迹页的日/周切换（和 tlView 并列、互不干扰 —— 时间线的日周月
       和足迹的日/周是两套东西，共用一个变量会互相打架）。 */
    footView = "day";

/* ★★ 2026-09-21（B5 视图持久化）：页签 / 日周月 / 时间线缩放 / 趋势天数，刷新后不再复位。
   以前刷新就回"首页·今天" —— 手机切个 app 回来、或者手滑刷新一下，都得重新点一遍。

   为什么存 localStorage 而不是跟 RULES 一样存云端：
     这纯属"**这台设备**的界面偏好"，手机和电脑的浏览习惯本来就不同（手机爱看健康页、
     电脑爱看时间线），同步过去反而互相打架；而且它丢了也没有任何后果，不值得占额度。
     —— 跟 RULES（分类/显示名，那是**数据的一部分**，必须跨设备一致）不是一回事。

   ⚠️ **日期（curDay）故意不存**：打开就看"今天"才是对的。存了的话，你昨天翻着 9-18 的
      资料、今天打开还停在 9-18，会以为"数据没更新"——那是比"要重新点一下"严重得多的错觉。
   ⚠️ 会话记录（chat）也不存：太长，而且它有自己的云端存法，两套会打架。 */
const VIEW_LS = "steward.view.v1";

function viewSave() {
  try {
    localStorage.setItem(VIEW_LS, JSON.stringify({
      tab: tab, tlView: tlView, gvH: gvH, trendN: trendN, footView: footView,
    }));
  } catch (e) { /* 隐私模式 / 配额满：存不上就算了，不影响用 */ }
}

function viewRestore() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(VIEW_LS) || "{}") || {}; } catch (e) { s = {}; }
  // 只做"类型 + 范围"的粗校验；**页签合不合法交给 renderTabs 判**
  // （那时 DOM 已就绪，能直接问"这个页签还在不在"，比我在这儿抄一份列表可靠）
  if (typeof s.tab === "string" && s.tab) tab = (s.tab === "home") ? "health" : s.tab;
  if (["day", "week", "month"].indexOf(s.tlView) >= 0) tlView = s.tlView;
  if (["day", "week"].indexOf(s.footView) >= 0) footView = s.footView;
  // 范围跟 zoomGV 的夹取一致（240–2600），别恢复出一个离谱的高度
  if (typeof s.gvH === "number" && s.gvH >= 240 && s.gvH <= 2600) gvH = s.gvH;
  if (typeof s.trendN === "number" && s.trendN >= 3 && s.trendN <= 90) trendN = s.trendN;
}
viewRestore();
let showCats = false;      // 时间线页里「分类设置」面板是否展开
/* 「该把焦点给搜索框」的一次性信号（2026-09-19）。
   只有**用户主动展开分类面板**时才置 true，bindCats() 消费一次就清掉。
   别改成常驻：render() 会为图例点击、切视图等一切重绘调用 bindCats()，

let catFocusPending = false;
/* 时间线容器**实际可用宽度**（像素）—— 刻度自适应用它算「一列有多宽」。

   首次渲染时 #view 还没量到宽度（render 里 v.innerHTML 之后才有），

let gvW = 900;
/* 量过真实宽度没有。只允许「量到 → 补渲染一次」，防止来回抖 */
let gvMeasured = false;
/* ★ 2026-09-19 晚：窄屏判定收敛成一处。
   为什么要有它 —— CSS 里的窄屏断点是 `@media(max-width:700px)`，
   而 JS 这边以前好几处各写各的 `innerWidth` 比较（或者干脆不写）。
   两端断点一旦不一致，就会出现"CSS 认为是窄屏、JS 认为是宽屏"的错位，
   表现是阈值/字号对不上、名字该显示的不显示（这一版正是这个毛病）。
   以后要改断点，只改这里 + CSS 那一处。 */
const NARROW_PX = 700;
const isNarrow = () => window.innerWidth <= NARROW_PX;
/* ★★ 2026-09-20 —— 时间线色块的「一行汉字」几何常量（**全站唯一真理，别再散落各处**）。

用户这一年反复为同一件事返工两次，都是同一类错：
  9-19 晚 把窄屏周视图的字**整个藏了**（"7 列才 41px 放不下名字"）→ 用户不接受：
         「没有名字的时间线就是一张色卡」。
  9-20    又只把**字号/阈值**调小，没调**默认高度** → 手机上默认还是太窄，
         色块普遍矮到写不下一个字，仍然是一张色卡。

所以这次不再"调参数"，而是把**目标**写死：
  **一行汉字必须在默认高度下就能显示出来** —— 电脑和手机同一套逻辑，没有"手机特例"。

一行汉字要多少像素（= 字号 × 行高 + 上下内边距），
这是纯几何，不随屏幕变，所以做成常量。字号按 .gv-blk 的 CSS 定义：
  宽屏 9px / 行高 1.28 → 字高 11.52 → +2（padding 1+1）= 13.52 → 取整 14
  窄屏 8px / 行高 1.28 → 字高 10.24 → +0（padding 0）   = 10.24 → 取整 11
  ⚠️ 窄屏周视图另有一条 `[data-cols="7"]` 覆盖成 7.5px → 字高 9.6 → 取整 10。
改字号就必须回来改这三个数；反过来说，把字号写在这里就等于"改字号"必须改这里，
不会再出现"CSS 改了字号、JS 里的阈值忘了跟"的老毛病。 */
const TXT_H = { wide: 14, narrow: 11, weekNarrow: 10 };

/* ===== ① 手机（窄屏）：默认把时间轴拉到"一行汉字装得下" =====

在**给定列数**下，色块高度 = 时长占一天的比例 × 列高，所以列高得先满足：

        列高 ≥ 一行字高 / (最短活动时长 / 24h)

取"最短活动时长 = 15 分钟"（采样粒度就是 15 分钟，比这更短的活动本来也没法看）：
        1440 / 15 × 字高 = 96 × 字高
  · 窄屏**日视图**（1 列，列宽够）      → 96 × 11 = 1056
  · 窄屏**周视图**（7 列平分，窄屏没有项目名栏 → 列宽够）→ 96 × 10 = 960

★ 为什么日/周用同一套，不是巧合：**决定高度的是"一行字要几像素"，不是列宽。**
  周视图的块更窄→名字更容易被 ellipsis 截短，但"装得下**一行**"这件事和列宽无关。
  真正跟列宽有关的是"能显示几个字"，那个交给 overflow 自己裁。
★ 为什么是 15 分钟而不是 30：手机上一部手机 + 一台电脑同时记，一天能到四五十段，
  默认高度再往上抬就变成长卷轴了。15 分钟是"看一眼有意义的记录"的下限，
  和采样粒度也对得上。要更细就点 +（竖向缩放就是干这个的）。
★ 为什么取 max：这是**下限**，不是规定值。宽屏周视图（840）已经比 960 低，
  但宽屏的字号是 9px、列也宽，840 是长期验证过的，不动它。

★★ 但这里有个实测值参与，**改字号/改 .gv-blk 的 min-height 就必须重跑那一测**：

   所以**再短的记录也至少有 12px 高** —— 12px 已经够写一行字了（宽屏 14px 差 2px，
   实际渲染上 12px 高的块 .gv-blk{overflow:hidden} 会把 11.5px 的字**裁掉一点**，
   所以阈值不能只看几何，得看真实渲染）。这就是为什么下面的阈值不写 14、

const NARROW_MIN_H = { day: 96 * TXT_H.narrow, week: 96 * TXT_H.weekNarrow };

· 窄屏周视图：**不能用几何值**。

★ 教训（9-19→9-20 连着两次踩）：**几何算出来的阈值 ≠ 渲染出来的可读性。**
  字号 7.5px 的块在列表里 `line-height` 会被浏览器按最小字号规则抬，

/* 窄屏周视图的名字阈值 —— 就是**一行字的高**，不随列高变。
   ★★ 2026-09-20 修了一个我自己造的量纲错误：原来写成 `H / 96 * TXT_H.weekNarrow`，
      在 H=960 时算出 100px（把"行数"又乘了一遍一行的高）→
      阈值 100px、块最高 276px 里绝大多数够不着 → 实测 227 个块 **0 个**有字。
      正确关系是：`H / 96` = "一天能分几行"，它再乘一行的高**等于 H 自己**，是个恒等式，没有信息量。
      **一行字要几像素就是 TXT_H，跟列高无关** —— 所以这一档和日视图同款：常数。

      而是靠 place() 的长高机制（块至少 minPct 高）+ 阈值本身只有一行字高：
      列高越大，越多短记录的**真实高度**超过一行 → 自然显示。
      这个语义是对的，而且比"抬高阈值"更诚实：阈值从来不该表达"我允不允许写字"。
   ⚠️ 保留这个函数（而不是删掉直接写常量）是为了留一个**可以按列高微调**的挂点，

/* 时间轴的默认高度。

let _gvSaveTimer = null;

  const gridEl = gvEl ? gvEl.querySelector(".gv-grid") : document.querySelector(".gv-grid");

  const oldH = gvH || (gridEl ? gridEl.clientHeight : 840);
  const nextH = Math.max(240, Math.min(2600, Math.round(h)));
  if (nextH === oldH) return;

  const ratio = anchorRatio != null ? anchorRatio : 0.5;

  // 寻找滚动容器
  let scroller = null;
  let cur = gridEl || gvEl;
  while (cur && cur !== document.body && cur !== document.documentElement) {
    const s = window.getComputedStyle(cur);
    if ((s.overflowY === "auto" || s.overflowY === "scroll") && cur.scrollHeight > cur.clientHeight) {
      scroller = cur;
      break;
    }

  const oldScrollY = scroller ? scroller.scrollTop : (window.scrollY || document.documentElement.scrollTop || 0);

  gvH = nextH;

  // 缩放发生瞬间，精确补偿滚动条偏移：targetScrollY = oldScrollY + (newHeight - oldHeight) * ratio

  if (scroller) {
    scroller.scrollTop = targetScrollY;
  } else {
    window.scrollTo({ top: targetScrollY, behavior: "instant" });
  }

  // 防抖持久化视图状态，避免高频写入存储

}

/* =========================================================
   双阶段视口焦点锚定算法 (Dual-Phase Viewport Anchor Locking)
   ========================================================= */

function captureViewportAnchor() {
  const scrollY = (typeof window !== "undefined")
    ? Math.max(0, window.scrollY || document.documentElement.scrollTop || 0)
    : 0;
  if (scrollY <= 20) {
    return { isAtTop: true };
  }

  const vH = (typeof window !== "undefined" && window.innerHeight) ? window.innerHeight : 800;
  const focusY = vH * 0.38;

  const candidates = (typeof document !== "undefined")
    ? Array.from(document.querySelectorAll("#view .card, #view > .sec, #view .sec, #catcard, #piecard, #view .gv-wrap, #view .gv"))
    : [];
  if (!candidates.length) {
    return { isAtTop: false, scrollY, offsetY: null };
  }

  let bestEl = null;
  let bestScore = -Infinity;

  for (const el of candidates) {
    if (typeof el.getBoundingClientRect !== "function") continue;
    const rect = el.getBoundingClientRect();
    if (rect.height < 15 || rect.width < 15) continue;

    const visibleTop = Math.max(0, rect.top);
    const visibleBottom = Math.min(vH, rect.bottom);
    const visibleHeight = Math.max(0, visibleBottom - visibleTop);
    if (visibleHeight <= 0) continue;

    let score = 0;
    const spansFocus = rect.top <= focusY && rect.bottom >= focusY;
    if (spansFocus) {
      score += 100000;
      // 叶子卡片 (.card) 相比外部大容器 (.sec) 具有更高的锚定精度
      if (el.classList && el.classList.contains("card")) score += 20000;
      const dist = Math.abs(rect.top - focusY);
      score -= dist;
    } else {
      score += visibleHeight * 10;
      const center = (rect.top + rect.bottom) / 2;
      score -= Math.abs(center - focusY);
    }

    if (score > bestScore) {
      bestScore = score;
      bestEl = el;
    }
  }

  if (!bestEl) {
    return { isAtTop: false, scrollY, offsetY: null };
  }

  const rect = bestEl.getBoundingClientRect();
  const info = {
    isAtTop: false,
    offsetY: rect.top,
    id: bestEl.id || null,
    capText: null,
    h2Text: null,
    className: bestEl.className || null,
    indexInParent: Array.from(bestEl.parentNode ? bestEl.parentNode.children : []).indexOf(bestEl),
    parentSelector: bestEl.parentElement ? (bestEl.parentElement.id ? "#" + bestEl.parentElement.id : (bestEl.parentElement.className ? "." + String(bestEl.parentElement.className).trim().split(" ")[0] : null)) : null
  };

  const capB = bestEl.querySelector(".cap b, .cap span b");
  if (capB && capB.textContent) {
    info.capText = capB.textContent.trim();
  }
  const h2 = bestEl.querySelector(".sec-h h2, h2");
  if (h2 && h2.textContent) {
    info.h2Text = h2.textContent.trim();
  }

  return info;
}

function restoreViewportAnchor(anchor) {
  if (!anchor || typeof window === "undefined") return;

  const doRestore = () => {
    if (anchor.isAtTop) {
      window.scrollTo({ top: 0, behavior: "instant" });
      if (typeof _lastScrollY !== "undefined") {
        _lastScrollY = 0;
        _accumDown = 0;
        _accumUp = 0;
      }
      return;
    }

    let targetEl = null;
    // 1. 优先按唯一 ID 匹配 (#catcard, #piecard 等)
    if (anchor.id) {
      targetEl = document.getElementById(anchor.id);
    }

    // 2. 按卡片标题语义匹配（如 "饮食与能量"、"睡眠"、"核心指标概览"）
    if (!targetEl && anchor.capText) {
      const caps = document.querySelectorAll("#view .card .cap b, #view .cap span b");
      for (const b of caps) {
        if (b.textContent && b.textContent.trim() === anchor.capText) {
          targetEl = b.closest(".card") || b;
          break;
        }
      }
    }

    // 3. 按大板块 h2 标题语义匹配（如 "健康"、"AI 助手"、"生活规律与因果洞察"）
    if (!targetEl && anchor.h2Text) {
      const h2s = document.querySelectorAll("#view .sec-h h2, #view h2");
      for (const h of h2s) {
        if (h.textContent && h.textContent.trim() === anchor.h2Text) {
          targetEl = h.closest(".sec") || h.closest(".card") || h;
          break;
        }
      }
    }

    // 4. 兜底：按 DOM 结构相对位置匹配
    if (!targetEl && anchor.parentSelector && anchor.indexInParent >= 0) {
      const parent = document.querySelector(anchor.parentSelector);
      if (parent && parent.children[anchor.indexInParent]) {
        targetEl = parent.children[anchor.indexInParent];
      }
    }

    if (targetEl && typeof anchor.offsetY === "number" && typeof targetEl.getBoundingClientRect === "function") {
      const newRect = targetEl.getBoundingClientRect();
      const diff = newRect.top - anchor.offsetY;
      if (Math.abs(diff) > 1) {
        window.scrollBy({ top: diff, behavior: "instant" });
      }
      if (typeof _lastScrollY !== "undefined") {
        _lastScrollY = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
        _accumDown = 0;
        _accumUp = 0;
      }
    }
  };

  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(() => {
      doRestore();
      requestAnimationFrame(() => {
        doRestore();
      });
    });
  } else {
    doRestore();
  }
}

if (typeof window !== "undefined") {
  window.captureViewportAnchor = captureViewportAnchor;
  window.restoreViewportAnchor = restoreViewportAnchor;
}

  return configuredSupps.map(name => {
    if (daySuppMap[name]) {
      return daySuppMap[name];
    }
    return { name: name, done: false, time: null };
  });
}

function getEffectiveQuickFoods(d) {

/* ---------------- 个人体征、基础代谢 (BMR) 与能量收支平衡 (TDEE) ---------------- */
const DEFAULT_USER_PROFILE = {

function getLatestScaleMetrics() {
  // 1. 若当前查看日正好是 TODAY，且有实测数据，可优先取用
  if (typeof TODAY !== "undefined" && typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day === TODAY) {

    for (const dy of sortedDays) {

      if (b && (b.weight || b.weight_kg)) {

function calculateUserBmr(profile, targetDate) {
  const prof = profile || getUserProfile();
  const d = targetDate ? new Date(targetDate) : new Date();
  const birth = new Date(prof.birth || DEFAULT_USER_PROFILE.birth);
  let age = d.getFullYear() - birth.getFullYear();
  const m = d.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && d.getDate() < birth.getDate())) age--;
  if (isNaN(age) || age < 10) age = 18;
  
  // Mifflin-St Jeor 国际公认标准公式
  const w = Number(prof.weight) || 85;
  const h = Number(prof.height) || 181;
  let bmr = 10 * w + 6.25 * h - 5 * age;
  if (prof.gender === "female") bmr -= 161;
  else bmr += 5;
  return Math.round(bmr);
}

/**
 * 体脂秤去水纯脂肪能量动力学与自适应 BMR 计算 (calculateDynamicBmr)
 * 物理原理：
 * 1. 结合体脂秤电极生物电阻抗体脂率，解耦纯脂肪质量：FatMass = weight * (bodyFat / 100)；
 * 2. 纯脂肪组织能量密度恒定：ΔE_fat = ΔFatMass * 7700 kcal，彻底滤除体液水分震荡；
 * 3. 能量平衡闭环：ΔE_fat = Intake - (Adaptive_BMR + ActiveBurn)，反解出真实静态代谢；
 * 4. 安全门禁与平滑加权：数据量少时与 Mifflin-St Jeor 标准公式及硬件直采 BMR（约 1724 kcal）加权平滑；
 * 5. 硬限制偏离度在基线 ±12% 以内；
 * 6. 单向生效保护：仅在 effectiveDate（TODAY 起）生效，绝不逆向污染历史天。
 */
let _cachedDynBmr = null;
let _cachedDynBmrKey = "";

function calculateDynamicBmr(profile, options) {
  options = options || {};
  const prof = profile || getUserProfile();
  const baselineBmr = calculateUserBmr(prof);
  const scaleM = (typeof getLatestScaleMetrics === "function") ? getLatestScaleMetrics() : null;
  const hwBmr = (scaleM && scaleM.bmr) ? Number(scaleM.bmr) : 1724;
  const effectiveDate = "2026-10-15";

  // 1. 提取带体脂率的有效称量记录时序
  const records = [];
  if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full) && Array.isArray(TREND.weight)) {
    TREND.full.forEach((dy, idx) => {
      let w = (TREND.weight[idx] != null && TREND.weight[idx] > 0) ? Number(TREND.weight[idx]) : null;
      let bf = (TREND.bodyFat && TREND.bodyFat[idx] != null && TREND.bodyFat[idx] > 0) ? Number(TREND.bodyFat[idx]) : null;
      let intake = (TREND.dietKcal && TREND.dietKcal[idx] != null) ? Number(TREND.dietKcal[idx]) : 0;
      let active = (TREND.activeBurn && TREND.activeBurn[idx] != null) ? Number(TREND.activeBurn[idx]) : 0;

      // 若当前遍历日为 TODAY，优先取 scaleM 实测
      if (typeof TODAY !== "undefined" && dy === TODAY && scaleM && scaleM.weight) {
        w = scaleM.weight;
        if (scaleM.bodyFat != null) bf = scaleM.bodyFat;
      }

      // 检查 _dayCache 补充
      if (typeof _dayCache !== "undefined" && _dayCache && _dayCache.has(dy)) {
        const c = _dayCache.get(dy);
        const cb = (c && c.data && c.data.d && c.data.d.body) || (c && c.data && c.data.body) || (c && c.d && c.d.body) || (c && c.body);
        if (cb) {
          if (cb.weight || cb.weight_kg) w = Number(cb.weight || cb.weight_kg);
          if (cb.bodyFat != null && Number(cb.bodyFat) > 0) bf = Number(cb.bodyFat);
        }
      }

      if (w != null && w > 0 && bf != null && bf > 0) {
        const fatMass = w * (bf / 100);
        records.push({ day: dy, weight: w, bodyFat: bf, fatMass: fatMass, intake: intake, active: active });
      }
    });
  }

  // 2. 数据量判定与加权平滑
  let rawBmr = baselineBmr;
  let status = "baseline";

  if (records.length >= 2) {
    const first = records[0];
    const last = records[records.length - 1];
    const d0 = new Date(first.day);
    const d1 = new Date(last.day);
    const spanDays = Math.max(1, Math.round((d1 - d0) / 86400000));

    if (spanDays >= 2) {
      const deltaFatKg = last.fatMass - first.fatMass;
      const totalFatEnergy = deltaFatKg * 7700;
      const avgDailyFatSurplus = totalFatEnergy / spanDays;

      let sumIn = 0, sumAct = 0, dietDays = 0;
      records.forEach(r => {
        if (r.intake > 0) {
          sumIn += r.intake;
          sumAct += r.active;
          dietDays++;
        }
      });

      if (dietDays >= 2) {
        const avgIn = sumIn / dietDays;
        const avgAct = sumAct / dietDays;
        const modelBmr = avgIn - avgAct - avgDailyFatSurplus;

        // 根据样本成熟度加权平滑
        const wModel = Math.min(0.40, (dietDays / 20) * 0.40);
        const wHw = 0.45;
        const wBase = Math.max(0, 1.0 - wModel - wHw);

        rawBmr = Math.round(wModel * modelBmr + wHw * hwBmr + wBase * baselineBmr);
        status = "calibrated";
      } else {
        rawBmr = Math.round(0.4 * hwBmr + 0.6 * baselineBmr);
        status = "hybrid";
      }
    } else {
      rawBmr = Math.round(0.4 * hwBmr + 0.6 * baselineBmr);
      status = "hybrid";
    }
  } else {
    rawBmr = Math.round(0.4 * hwBmr + 0.6 * baselineBmr);
    status = "hybrid";
  }

  // 3. 安全限幅门禁：硬限制在基线 ±12%
  const minAllowed = Math.round(baselineBmr * 0.88);
  const maxAllowed = Math.round(baselineBmr * 1.12);
  const clampedBmr = Math.min(maxAllowed, Math.max(minAllowed, rawBmr));
  const delta = clampedBmr - baselineBmr;
  const restingPerHour = Math.round(clampedBmr / 24);

  return {
    bmr: clampedBmr,
    baselineBmr: baselineBmr,
    delta: delta,
    status: status,
    restingPerHour: restingPerHour,
    effectiveDate: effectiveDate
  };
}

/**
 * 长期体重变化与能量收支自适应估算静态消耗 (Adaptive BMR)
 * 物理与代谢动力学原理：ΔEnergy = Intake - Out = Intake - (Adaptive_BMR + ActiveBurn)
 * 1kg 真实人体脂肪组织约蕴含 7700 kcal 能量。
 * 
 * 严格安全与风控门禁（遵循用户指导「现在的数据太少了，要小心一点」）：
 * 1. 样本量门禁：有效称重天数 count < 14 天，或者时间跨度 span < 21 天，绝不启动估算，严格返回标准公式或实测 BMR；
 * 2. 连续性门禁：必须同时具备饮食热量和活动消耗记录；
 * 3. 幅度硬边界：自适应估算值与标准公式 BMR 偏离度严格限制在 ±15% 以内，防止脱水/暴饮暴食带来瞬时剧烈震荡。
 */
function estimateAdaptiveBmr(trendDays, profile) {
  const prof = profile || getUserProfile();
  const baselineBmr = calculateUserBmr(prof);
  if (!Array.isArray(trendDays) || trendDays.length < 14) {
    return {
      status: "insufficient_data",
      bmr: baselineBmr,
      confidence: 0,
      reason: `数据积累中（目前有效 ${trendDays ? trendDays.length : 0}/14 天，跨度不足 21 天，保持物理直采/标准公式）`
    };
  }

  // 提取有效称重日
  const validWeights = [];
  trendDays.forEach((x) => {
    if (x && x.day && x.weight != null && x.weight > 0) {
      validWeights.push({ day: x.day, weight: Number(x.weight), intake: Number(x.dietKcal) || 0, active: Number(x.activeBurn) || 0 });
    }
  });

  if (validWeights.length < 14) {
    return {
      status: "insufficient_data",
      bmr: baselineBmr,
      confidence: Math.round((validWeights.length / 14) * 50),
      reason: `有效称量仅 ${validWeights.length} 天，需至少 14 天长期实测`
    };
  }

  const firstDay = new Date(validWeights[0].day);
  const lastDay = new Date(validWeights[validWeights.length - 1].day);
  const spanDays = Math.max(1, Math.round((lastDay - firstDay) / (1000 * 3600 * 24)));
  if (spanDays < 21) {
    return {
      status: "insufficient_data",
      bmr: baselineBmr,
      confidence: Math.round((spanDays / 21) * 60),
      reason: `时间跨度仅 ${spanDays} 天，需至少 21 天多周时序跨度`
    };
  }

  // 计算体重净变化量（公斤）与日均能量差
  const startWeight = validWeights[0].weight;
  const endWeight = validWeights[validWeights.length - 1].weight;
  const deltaWeightKg = endWeight - startWeight;
  const totalWeightEnergyKcal = deltaWeightKg * 7700; // 7700 kcal / kg
  const avgDailySurplusDeficit = totalWeightEnergyKcal / spanDays;

  // 累计日均摄入与日均活动消耗
  let sumIntake = 0, sumActive = 0, validDaysWithDiet = 0;
  validWeights.forEach((w) => {
    if (w.intake > 0) {
      sumIntake += w.intake;
      sumActive += w.active;
      validDaysWithDiet++;
    }
  });

  if (validDaysWithDiet < 10) {
    return {
      status: "insufficient_diet",
      bmr: baselineBmr,
      confidence: 30,
      reason: "饮食记录天数不足，无法闭环能量天平平衡方程"
    };
  }

  const avgIntake = sumIntake / validDaysWithDiet;
  const avgActive = sumActive / validDaysWithDiet;
  
  // Adaptive_BMR = avgIntake - avgActive - avgDailySurplusDeficit
  const rawAdaptiveBmr = Math.round(avgIntake - avgActive - avgDailySurplusDeficit);

  // 硬核风控：限定在基线 ±15% 范围以内
  const minAllowed = Math.round(baselineBmr * 0.85);
  const maxAllowed = Math.round(baselineBmr * 1.15);
  const clampedBmr = Math.min(maxAllowed, Math.max(minAllowed, rawAdaptiveBmr));

  return {
    status: "active",
    bmr: clampedBmr,
    rawBmr: rawAdaptiveBmr,
    baselineBmr: baselineBmr,
    confidence: Math.min(95, Math.round(60 + (validWeights.length / 30) * 35)),
    spanDays: spanDays,
    weightDiff: deltaWeightKg.toFixed(1),
    clamped: clampedBmr !== rawAdaptiveBmr
  };
}
