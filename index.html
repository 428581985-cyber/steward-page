async function saveMealAdd() {
  const day = (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day) ? CUR_DAY_DATA.day : curDay;
  const dishEl = document.getElementById("meal-add-dish");
  const mealEl = document.getElementById("meal-add-meal");
  const timeEl = document.getElementById("meal-add-time");
  const calEl = document.getElementById("meal-add-cal");
  const priceEl = document.getElementById("meal-add-price");
  const pEl = document.getElementById("meal-add-p");
  const cEl = document.getElementById("meal-add-c");
  const fEl = document.getElementById("meal-add-f");
  if (!dishEl || !mealEl || !timeEl || !calEl) return;

  const dish = dishEl.value.trim();
  if (!dish) {
    if (typeof showToast === "function") showToast("先写一下吃了什么");
    try { dishEl.focus(); } catch (_) {}
    return;
  }
  const cal = Math.round(Number(calEl.value) || 0);
  if (cal <= 0) {
    if (typeof showToast === "function") showToast("热量填一个大概的数");
    try { calEl.focus(); } catch (_) {}
    return;
  }
  const meal = mealEl.value || "加餐";
  const timeStr = /^\d{2}:\d{2}$/.test(timeEl.value) ? timeEl.value : "12:00";
  const priceVal = priceEl ? String(priceEl.value).trim() : "";
  const price = priceVal !== "" ? parseFloat(priceVal) : null;
  const p = Math.round(Number(pEl.value) || 0);
  const c = Math.round(Number(cEl.value) || 0);
  const f = Math.round(Number(fEl.value) || 0);

  // 时间戳按北京时间落在**当前查看的那一天**（补记历史同样成立）
  const stamp = `${day}T${timeStr}:00+08:00`;

  const saveBtn = document.getElementById("meal-add-save");
  if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = "0.6"; }

  if (typeof invalidateDayCache === "function") invalidateDayCache(day);

  const uniqueUid = "ma_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);

  // 1. 本地乐观更新（0ms 出结果，断网也不丢）
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
    if (!CUR_DAY_DATA.diet) CUR_DAY_DATA.diet = { totalKcal: 0, macros: { protein: 0, carbs: 0, fat: 0 }, meals: [], supplements: [] };
    if (!Array.isArray(CUR_DAY_DATA.diet.meals)) CUR_DAY_DATA.diet.meals = [];
    if (!CUR_DAY_DATA.diet.macros) CUR_DAY_DATA.diet.macros = { protein: 0, carbs: 0, fat: 0 };
    CUR_DAY_DATA.diet.meals.push({
      uid: uniqueUid,
      stamp: stamp,
      time: timeStr,
      meal: meal,
      dish: dish,
      calories: cal,
      protein: p,
      carbs: c,
      fat: f,
      price: price
    });
    CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));
    CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.calories || 0), 0);
    CUR_DAY_DATA.diet.macros = {
      protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (Number(m.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.protein || 0), 0),
      carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (Number(m.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.carbs || 0), 0),
      fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (Number(m.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.fat || 0), 0)
    };
    CUR_DAY_DATA.diet._userModified = Date.now();
    if (typeof markDietModified === "function") markDietModified(day);
    if (typeof saveDayDietLocal === "function") saveDayDietLocal(day, CUR_DAY_DATA.diet);

    // ★ 同步刷新当日缓存与开屏快照：render() 是从 _dayCache 重画的，
    //   只改 CUR_DAY_DATA 不改缓存，重绘出来的还是旧的热量和旧的流水。
    //   （deleteDietItem / saveDietEdit 都做了这一步，这里必须同样做）
    try {
      const c = _dayCache.get(day);
      if (c && c.data && c.data.d) {
        c.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(day, c.data);
      }
    } catch (_) {}

    if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
      const tidx = TREND.full.indexOf(day);
      if (tidx >= 0 && Array.isArray(TREND.dietKcal)) TREND.dietKcal[tidx] = CUR_DAY_DATA.diet.totalKcal;
    }
  }

  closeMealAddModal();
  if (typeof showToast === "function") showToast(`已补记 ${meal}：${dish}`);
  try { await render(); } catch (_) {}

  // 2. 后台上报（复用 quick_food_log，meal 显式传，不让服务端按"现在几点"猜；携带幂等键防重）
  const payload = JSON.stringify({
    day: day,
    stamp: stamp,
    meal: meal,
    dish: dish,
    calories: cal,
    price: price,
    protein: p,
    carbs: c,
    fat: f,
    idempotency_key: uniqueUid,
    uid: uniqueUid
  });

  const postMeal = () => fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=quick_food_log", {
    method: "POST",
    headers: { "Content-Type": "text/plain; charset=utf-8" },
    body: payload
  });

  try {
    let r;
    try {
      r = await postMeal();
    } catch (netErr) {
      // 网络层故障（如 TypeError: Failed to fetch），在幂等键保护下静默安全重试 1 次
      console.warn("[saveMealAdd] 首次上报遭遇网络故障，在幂等键保护下静默重试...", netErr);
      await new Promise(res => setTimeout(res, 800));
      r = await postMeal();
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (typeof invalidateDayCache === "function") invalidateDayCache(day);
    if (typeof syncDayDietFromCloud === "function") syncDayDietFromCloud(day);
  } catch (e) {
    console.warn("[saveMealAdd] 后台上报失败，本地已保留:", e);
    if (typeof showToast === "function") showToast("已存本机，未同步到云端");
  }
}


/* ---------------- 原始数据全量导出中心模态框 ---------------- */
let exportModalOpen = false;
let exportModalFocusType = "all";
let exportModalPreset = "30days";
let exportModalStartDate = "";
let exportModalEndDate = "";

function openExportModal(focusType) {
  exportModalFocusType = focusType || "all";
  exportModalOpen = true;
  exportModalPreset = "30days";

  const today = (typeof TODAY !== "undefined" && TODAY) 
    ? TODAY 
    : (curDay || new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10));
  exportModalEndDate = today;
  exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 29 * 86400e3).toISOString().slice(0, 10);

  renderExportModal();
}

function closeExportModal() {
  exportModalOpen = false;
  const root = document.getElementById("export-modal-root");
  if (root) root.innerHTML = "";
}

function setExportDatePreset(preset) {
  exportModalPreset = preset;
  const today = (typeof TODAY !== "undefined" && TODAY) 
    ? TODAY 
    : (curDay || new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10));
  exportModalEndDate = today;

  if (preset === "7days") {
    exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 6 * 86400e3).toISOString().slice(0, 10);
  } else if (preset === "30days") {
    exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 29 * 86400e3).toISOString().slice(0, 10);
  } else if (preset === "90days") {
    exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 89 * 86400e3).toISOString().slice(0, 10);
  } else if (preset === "month") {
    exportModalStartDate = today.slice(0, 7) + "-01";
  } else if (preset === "all") {
    let earliest = "";
    if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full) && TREND.full.length > 0) {
      earliest = TREND.full[0];
    }
    if (!earliest) {
      earliest = new Date(new Date(today + "T00:00:00Z").getTime() - 180 * 86400e3).toISOString().slice(0, 10);
    }
    exportModalStartDate = earliest;
  }

  const sEl = document.getElementById("export-modal-start");
  const eEl = document.getElementById("export-modal-end");
  if (sEl) sEl.value = exportModalStartDate;
  if (eEl) eEl.value = exportModalEndDate;

  const presets = ["all", "7days", "30days", "90days", "month"];
  presets.forEach(p => {
    const btn = document.getElementById(`export-preset-${p}`);
    if (btn) {
      const active = p === preset;
      btn.style.background = active ? "rgba(56,189,248,0.14)" : "rgba(255,255,255,0.035)";
      btn.style.borderColor = active ? "rgba(56,189,248,0.4)" : "rgba(255,255,255,0.08)";
      btn.style.color = active ? "#38bdf8" : "var(--dim)";
      btn.style.fontWeight = active ? "600" : "normal";
    }
  });

  updateExportDateHint();
}

function onExportDateChange() {
  const sEl = document.getElementById("export-modal-start");
  const eEl = document.getElementById("export-modal-end");
  if (sEl) exportModalStartDate = sEl.value;
  if (eEl) exportModalEndDate = eEl.value;
  exportModalPreset = "custom";

  const presets = ["all", "7days", "30days", "90days", "month"];
  presets.forEach(p => {
    const btn = document.getElementById(`export-preset-${p}`);
    if (btn) {
      btn.style.background = "rgba(255,255,255,0.035)";
      btn.style.borderColor = "rgba(255,255,255,0.08)";
      btn.style.color = "var(--dim)";
      btn.style.fontWeight = "normal";
    }
  });

  updateExportDateHint();
}

function updateExportDateHint() {
  const hintEl = document.getElementById("export-modal-range-hint");
  if (!hintEl) return;
  if (!exportModalStartDate || !exportModalEndDate) {
    hintEl.textContent = "请选择起止日期";
    hintEl.style.color = "var(--dim2)";
    return;
  }
  if (exportModalStartDate > exportModalEndDate) {
    hintEl.textContent = "起始日期不能晚于截止日期";
    hintEl.style.color = "var(--alert, #f87171)";
    return;
  }
  const s = new Date(exportModalStartDate + "T00:00:00Z");
  const e = new Date(exportModalEndDate + "T00:00:00Z");
  const days = Math.round((e.getTime() - s.getTime()) / 86400e3) + 1;
  hintEl.textContent = `已选 ${days} 天 (${exportModalStartDate} 至 ${exportModalEndDate})`;
  hintEl.style.color = "var(--dim)";
}

async function triggerModalExport(type) {
  const sEl = document.getElementById("export-modal-start");
  const eEl = document.getElementById("export-modal-end");
  const start = sEl ? sEl.value : exportModalStartDate;
  const end = eEl ? eEl.value : exportModalEndDate;

  if (!start || !end) {
    showToast("请选择起止日期");
    return;
  }
  if (start > end) {
    showToast("起始日期不能晚于截止日期");
    return;
  }

  const btn = document.getElementById(`export-act-btn-${type}`);
  const oldText = btn ? btn.innerHTML : "";
  if (btn) {
    btn.disabled = true;
    btn.style.opacity = "0.7";
    btn.innerHTML = `<span style="font-size:11px">导出中…</span>`;
  }

  try {
    if (type === "json") {
      await exportFullBackupJSON(start, end);
    } else if (type === "diet") {
      await exportDietCSV(start, end);
    } else if (type === "biometrics") {
      await exportBiometricsCSV(start, end);
    } else if (type === "timeline") {
      await exportTimelineCSV(start, end);
    } else if (type === "all") {
      showToast("开始多格式流水导出…");
      await exportFullBackupJSON(start, end);
      await new Promise(r => setTimeout(r, 600));
      await exportDietCSV(start, end);
      await new Promise(r => setTimeout(r, 600));
      await exportBiometricsCSV(start, end);
      await new Promise(r => setTimeout(r, 600));
      await exportTimelineCSV(start, end);
      showToast("全部格式数据导出完成");
    }
  } catch (err) {
    showToast("导出失败: " + (err.message || err));
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.innerHTML = oldText;
    }
  }
}

function closeTimelineUnderModal() {

function showTimelineUnderDetail(item) {
  if (!item) return;
  let root = document.getElementById("timeline-detail-modal-root");
  if (!root) {
    root = document.createElement("div");
    root.id = "timeline-detail-modal-root";
    document.body.appendChild(root);
  }

  let bodyHtml = "";
  const formatHourMin = (hFloat) => {
    if (hFloat == null || isNaN(hFloat)) return "--:--";
    const totalMin = Math.round(Number(hFloat) * 60);
    const mWrap = ((totalMin % 1440) + 1440) % 1440;
    const hh = String(Math.floor(mWrap / 60)).padStart(2, "0");
    const mm = String(mWrap % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  };

  const durStr = (mins) => {
    const m = Math.round(mins || 0);
    const h = Math.floor(m / 60);
    const rem = m % 60;
    if (h > 0 && rem > 0) return `${h}h ${rem}m`;
    if (h > 0) return `${h}h`;
    return `${rem}m`;
  };

  if (item.type === "sleep") {
    const isNap = !!item.isNap;
    const title = isNap ? "小睡记录" : "睡眠分期与详情";
    const fromStr = formatHourMin(item.from);
    const toStr = formatHourMin(item.to);
    const durationMin = item.min || 0;
    const dayData = item.dayData || {};

    let stages = [];
    if (!isNap) {
      const deepMin = dayData.deep || 0;
      const lightMin = dayData.light || 0;
      const remMin = dayData.rem || 0;
      const awakeMin = dayData.awakeMin || 0;
      const tot = (deepMin + lightMin + remMin) || durationMin || 1;
      stages = [
        { label: "深睡眠", min: deepMin, pct: Math.round((deepMin / tot) * 100), color: "#3b82f6" },
        { label: "浅睡眠", min: lightMin, pct: Math.round((lightMin / tot) * 100), color: "#60a5fa" },
        { label: "快速眼动", min: remMin, pct: Math.round((remMin / tot) * 100), color: "#a855f7" },
        { label: "清醒状态", min: awakeMin, pct: Math.round((awakeMin / tot) * 100), color: "#64748b" },
      ];
    }

    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(44,75,176,0.15);border:1px solid rgba(96,165,250,0.25);border-radius:12px">
          <div style="width:36px;height:36px;border-radius:10px;background:rgba(44,75,176,0.25);display:flex;align-items:center;justify-content:center;color:#93c5fd;flex:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
          <div style="min-width:0;flex:1">
            <div style="font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-0.2px">${title}</div>
            <div class="tl-modal-time-sub" style="font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;margin-top:2px">${fromStr} – ${toStr}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:800;color:#93c5fd;font-variant-numeric:tabular-nums">${durStr(durationMin)}</div>
            <div style="font-size:10.5px;color:var(--dim2)">总时长</div>
          </div>
        </div>

        ${!isNap && stages.length ? `
          <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 14px">
            <div style="font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:10px">睡眠分期分布与占比</div>
            <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:rgba(255,255,255,0.05);margin-bottom:12px">
              ${stages.filter(st => st.pct > 0 && st.min > 0).map(st => `<div style="width:${st.pct}%;background:${st.color};border-radius:2px" title="${st.label}: ${durStr(st.min)} (${st.pct}%)"></div>`).join("")}
            </div>
            <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:10px">
              ${stages.map(st => `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="width:7px;height:7px;border-radius:50%;background:${st.color}"></span>
                    <span style="color:var(--dim)">${st.label}</span>
                  </div>
                  <span style="color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums">${durStr(st.min)} <em style="font-style:normal;font-size:10.5px;color:var(--dim2)">(${st.pct}%)</em></span>
                </div>
              `).join("")}
            </div>
          </div>
        ` : ""}
      </div>
    `;
  } else if (item.type === "workout") {
    const w = item.w || {};
    const fromStr = formatHourMin(item.from);
    const toStr = formatHourMin(item.to);
    const sec = item.sec || (w.sec || 0);
    const durM = Math.round(sec / 60) || (w.min || 0);
    const day = item.day || "";
    const fullLine = (typeof workLine === "function" ? workLine(w) : "") || "";

    // 1. 运动项目标题动态提取与中文化门禁
    let candidateName = w.name || w.sport_name || w.sport_type || w.workout_type || w.title || w.t || item.title || item.name || item.sport_name || "";
    if (typeof candidateName === "string") {
      candidateName = candidateName.split(/[｜|]/)[0].trim();
      candidateName = candidateName.replace(/\s*\d+\s*(?:分钟|分|mins?|m)?$/i, "").trim();
    }
    let woTitle = (typeof workCN === "function") ? workCN(w) : "";
    if (!woTitle || woTitle === "运动") {
      if (candidateName && typeof translateActivityName === "function") {
        const trans = translateActivityName(candidateName);
        if (trans && trans !== "运动") woTitle = trans;
      }
    }
    if (!woTitle || /[a-zA-Z_]/.test(woTitle) || woTitle === "运动") {
      woTitle = "健身";
    }

    // 2. 活跃消耗热量提取
    let kcal = (typeof w.kcal === "number" && w.kcal > 0) ? w.kcal : ((typeof w.calories === "number" && w.calories > 0) ? w.calories : 0);
    if (!kcal && typeof fullLine === "string") {
      const mk = fullLine.match(/(\d+)\s*kcal/i);
      if (mk) kcal = parseInt(mk[1], 10);

    // 3. 记录明细正向提取：只要心率和里程（如果有的话），彻底消除运动名称、时长与卡路里冗余

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>

            </div>

          <button class="pnm-close-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--dim,#9ca3af);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all 0.15s" title="取消">

              <line x1="6" y1="6" x2="18" y2="18"></line>

        <div style="font-size:12px;color:var(--dim2, #71717a);line-height:1.5">

          <button type="button" class="pnm-submit-btn" style="background:#2563eb;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:7px 16px;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(37,99,235,0.3)">确认保存</button>

  const cancelBtn = root.querySelector(".pnm-cancel-btn");
  const submitBtn = root.querySelector(".pnm-submit-btn");

  const close = () => {
    root.innerHTML = "";
  };

  const submit = async () => {
    const name = (input.value || "").trim();
    if (!name) {
      if (typeof showToast === "function") showToast("请输入有效的地点名称");
      return;
    }
    close();

    const latNum = Number(lat), lonNum = Number(lon);

    // 1. 查找并继承未命名簇原生属性，剔除未知点并更新 localStorage
    if (typeof PLACE_MEM !== "undefined") {
      const unkIdx = (PLACE_MEM.unknown || []).findIndex((u) => typeof distKm === "function" && distKm(u.lat, u.lon, latNum, lonNum) <= 0.3);
      const unkItem = unkIdx >= 0 ? PLACE_MEM.unknown[unkIdx] : null;
      PLACE_MEM.unknown = (PLACE_MEM.unknown || []).filter((u) => typeof distKm === "function" ? distKm(u.lat, u.lon, latNum, lonNum) > 0.3 : true);

      }

      // 3. 乐观更新 named 列表
      const namedList = (PLACE_MEM.named || []).slice();
      const existIdx = namedList.findIndex((m) => m.name === name || (isRename && m.name === oldName) || (typeof distKm === "function" && distKm(m.lat, m.lon, latNum, lonNum) <= 0.3));
      const newNamedObj = {
        name: name,
        lat: latNum,
        lon: lonNum,
        n: (existIdx >= 0 && namedList[existIdx].n) || (unkItem && unkItem.n) || 1,
        first: (existIdx >= 0 && namedList[existIdx].first) || (unkItem && unkItem.first) || null,
        last: (existIdx >= 0 && namedList[existIdx].last) || (unkItem && unkItem.last) || null,
      };
      if (existIdx >= 0) namedList[existIdx] = newNamedObj;
      else namedList.push(newNamedObj);
      PLACE_MEM.named = namedList;
      if (typeof _palSig !== "undefined") _palSig = null;

      try {
        if (typeof PLACES_LS !== "undefined") localStorage.setItem(PLACES_LS, JSON.stringify(PLACE_MEM));
      } catch (e) {}
    }

    // 4. 立即重绘界面与吐司提示
    if (typeof render === "function") render();
    if (typeof showToast === "function") showToast("地点已命名为 " + name);

    // 5. 后台异步上传
    if (typeof savePlace === "function") {
      try {
        await savePlace(name, latNum, lonNum);
      } catch (e) {
        console.warn("[openPlaceNameModal] savePlace error:", e);
      }
    }
  };

  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  closeBtn.onclick = close;
  cancelBtn.onclick = close;
  submitBtn.onclick = submit;

  root.querySelectorAll(".pnm-tag-btn").forEach((tagBtn) => {
    tagBtn.onclick = () => {
      input.value = tagBtn.dataset.tag || "";
      input.focus();
    };
  });

  input.onfocus = () => { input.style.borderColor = "var(--soft, #38bdf8)"; };
  input.onblur = () => { input.style.borderColor = "rgba(255,255,255,0.16)"; };
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Escape") { e.preventDefault(); close(); }
  };

  setTimeout(() => {
    input.focus();
    input.select();
  }, 20);
}

  const nextColor = typeof getRandomColor === "function" ? getRandomColor(curColor) : "#38bdf8";
  if (!RULES.placeColors) RULES.placeColors = {};
  RULES.placeColors[key] = nextColor;
  if (typeof _palSig !== "undefined") _palSig = null;
  if (typeof saveRules === "function") saveRules();
  if (typeof showToast === "function") showToast("已投色更新地点配色为 " + nextColor);
  if (typeof render === "function") render();
  return nextColor;
}

  if (!RULES.colors) RULES.colors = {};

  if (typeof showToast === "function") showToast("「" + c + "」类别已投色更换为 " + next);

  return next;
}

            </div>
            <div>
              <div style="font-size:15px;font-weight:600;color:var(--fg, #fafafa);letter-spacing:-0.2px">${esc(title)}</div>
            </div>
          </div>
          <button type="button" class="cdm-close-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--dim,#9ca3af);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all 0.15s" title="关闭">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div style="font-size:12px;color:var(--dim2, #71717a);display:flex;align-items:center;gap:6px">
          <span>当前目标：</span>
          <span style="color:var(--fg, #fafafa);font-weight:600;background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08)">${esc(name || key)}</span>
        </div>

        <!-- 当前配色大卡片预览 -->
        <div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px 14px">
          <div class="cdm-dot-preview" style="width:44px;height:44px;border-radius:50%;background:${currentColor};box-shadow:0 0 18px ${currentColor}55;border:2px solid rgba(255,255,255,0.22);flex:none;transition:all 0.25s"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="font-size:11px;color:var(--dim2, #71717a)">当前配色</div>
            <div class="cdm-hex-label" style="font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:14px;font-weight:600;color:var(--fg, #fafafa);letter-spacing:0.5px">${currentColor}</div>
          </div>
        </div>

        <!-- 优雅大号「投掷新颜色」按钮 -->
        <button type="button" class="cdm-roll-btn" style="background:#2563eb;border:1px solid rgba(255,255,255,0.18);border-radius:10px;padding:10px 16px;color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.35);transition:all 0.15s;font-family:inherit">
          <span class="cdm-dice-icon" style="display:inline-flex;align-items:center;transition:transform 0.25s">
            ${typeof diceSvgHtml === "function" ? diceSvgHtml(16) : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>`}
          </span>
          <span>投掷新颜色</span>
        </button>

        <!-- 调色板快速点选 -->
        <div>
          <div style="font-size:11px;color:var(--dim2, #71717a);margin-bottom:8px">或直接点选预设质感配色：</div>
          <div class="cdm-palette-grid" style="display:grid;grid-template-columns:repeat(8, 1fr);gap:7px">
            ${palette.map((hex) => {
              const isSel = hex.toLowerCase() === currentColor;
              const bShadow = isSel ? ("0 0 8px " + hex) : "none";
              const bScale = isSel ? "scale(1.15)" : "scale(1)";
              const bBorder = isSel ? "2px solid #fff" : "1px solid rgba(255,255,255,0.18)";
              return '<button type="button" class="cdm-swatch" data-hex="' + hex + '" style="width:100%;aspect-ratio:1;border-radius:50%;background:' + hex + ';border:' + bBorder + ';box-shadow:' + bShadow + ';cursor:pointer;padding:0;outline:none;transition:all 0.15s;transform:' + bScale + '" title="' + hex + '"></button>';
            }).join("")}
          </div>
        </div>

        <!-- 底部完成栏 -->
        <div style="display:flex;justify-content:flex-end;margin-top:2px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)">
          <button type="button" class="cdm-finish-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:7px 18px;color:var(--fg, #fafafa);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s">完成</button>
        </div>

      </div>
    </div>
  `;

  const overlay = root.querySelector(".cdm-overlay");
  const closeBtn = root.querySelector(".cdm-close-btn");
  const finishBtn = root.querySelector(".cdm-finish-btn");
  const rollBtn = root.querySelector(".cdm-roll-btn");
  const diceIcon = root.querySelector(".cdm-dice-icon");
  const previewDot = root.querySelector(".cdm-dot-preview");
  const hexLabel = root.querySelector(".cdm-hex-label");
  const swatches = root.querySelectorAll(".cdm-swatch");

  const updateUI = (newHex) => {
    currentColor = newHex.toLowerCase();
    if (previewDot) {
      previewDot.style.background = currentColor;
      previewDot.style.boxShadow = "0 0 18px " + currentColor + "55";
    }
    if (hexLabel) {
      hexLabel.textContent = currentColor;
    }
    swatches.forEach((sw) => {
      const isSel = sw.dataset.hex.toLowerCase() === currentColor;
      sw.style.border = isSel ? "2px solid #fff" : "1px solid rgba(255,255,255,0.18)";
      sw.style.boxShadow = isSel ? "0 0 8px " + currentColor : "none";
      sw.style.transform = isSel ? "scale(1.15)" : "scale(1)";
    });
  };

  const applyColor = async (newHex) => {
    updateUI(newHex);
    try {
      await onApplyColor(newHex);
    } catch (e) {
      console.warn("[openColorDiceModal] onApplyColor error:", e);
    }
  };

  rollBtn.onclick = () => {
    if (diceIcon) {
      diceIcon.style.transform = "rotate(180deg) scale(1.2)";
      setTimeout(() => { if (diceIcon) diceIcon.style.transform = "rotate(0deg) scale(1)"; }, 250);
    }
    const next = typeof getRandomColor === "function" ? getRandomColor(currentColor) : palette[Math.floor(Math.random() * palette.length)];
    applyColor(next);
  };

  swatches.forEach((sw) => {
    sw.onclick = () => {
      const hex = sw.dataset.hex;
      if (hex) applyColor(hex);
    };
  });

  const close = () => {
    window.removeEventListener("keydown", onKeyDown);
    root.innerHTML = "";
  };

  const onKeyDown = (e) => {
    if (e.key === "Escape" || e.key === "Enter") {
      e.preventDefault();
      close();
    }
  };
  window.addEventListener("keydown", onKeyDown);

  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  closeBtn.onclick = close;
  finishBtn.onclick = close;
}

  });

function openPlaceColorDiceModal(key, name) {
  if (!key) return;

  openColorDiceModal({
    type: "place",
    key: key,
    name: displayName,
    title: "修改地点配色",
    getCurrentColor: () => (typeof placeColor === "function" ? placeColor(key) : "#38bdf8"),
    onApplyColor: async (newColor) => {

      RULES.placeColors[key] = newColor;

      if (typeof showToast === "function") showToast("「" + displayName + "」地点配色已更新为 " + newColor);
      if (typeof render === "function") render();
    },
  });
}
