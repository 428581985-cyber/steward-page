function getActiveBurnKcal(d, optBmr) {
  if (!d) return 0;
  // 提取静息代谢率以扣除运动段内重复计入的 BMR (每分钟基础代谢 bmrPerMin = fullBmr / 1440)
  let fullBmr = optBmr || (d && d.body && Number(d.body.bmr)) || (d && Number(d.bmr)) || 0;
  if (!fullBmr && typeof getLatestScaleMetrics === "function") {
    const sm = getLatestScaleMetrics();
    if (sm && Number(sm.bmr)) fullBmr = Number(sm.bmr);
  }
  if (!fullBmr && typeof calculateDynamicBmr === "function" && typeof getUserProfile === "function") {
    try {
      const dyn = calculateDynamicBmr(getUserProfile());
      if (dyn && Number(dyn.bmr)) fullBmr = Number(dyn.bmr);
    } catch (e) {}
  }
  if (!fullBmr && typeof calculateUserBmr === "function" && typeof getUserProfile === "function") {
    try { fullBmr = calculateUserBmr(getUserProfile()); } catch (e) {}
  }
  if (!fullBmr) fullBmr = 1726;
  const bmrPerMin = fullBmr / 1440;

  // 1. 锻炼项目净消耗累加（扣除同段重复计入的 BMR，如 walking 5分钟｜431m｜32kcal）
  let woKcal = 0;
  const woList = Array.isArray(d.workouts) ? d.workouts : ((d.body && Array.isArray(d.body.workouts)) ? d.body.workouts : []);
  for (const w of woList) {
    if (!w) continue;
    let rawWoKcal = 0;
    if (typeof w.kcal === "number" && w.kcal > 0) rawWoKcal = w.kcal;
    else if (typeof w.calories === "number" && w.calories > 0) rawWoKcal = w.calories;
    else if (w.title) {
      const km = String(w.title).match(/(\d+(?:\.\d+)?)\s*k(?:cal)?/i);
      if (km) rawWoKcal = Math.round(Number(km[1]));
    }
    let m = Number(w.durMin || w.min || (w.sec ? Math.round(w.sec / 60) : (w.dur || 0))) || 0;
    if (!m && w.title) {
      const dm = String(w.title).match(/(\d+(?:\.\d+)?)\s*(?:分钟|min)/i);
      if (dm) m = Math.round(Number(dm[1]));
    }
    const netWoKcal = Math.max(0, rawWoKcal - Math.round(m * bmrPerMin));
    woKcal += netWoKcal;
  }
  // 2. 步数卡路里提取（优先从 stepsTitle，如 "步数 17530｜8.9km｜1233kcal"，次选 steps * 0.035）
  let stepKcal = 0;
  const sTitle = (d.body && d.body.stepsTitle) || d.stepsTitle || "";
  if (sTitle) {
    const sm = String(sTitle).match(/(\d+(?:\.\d+)?)\s*kcal/i);
    if (sm) stepKcal = Math.round(Number(sm[1]));
  }
  if (!stepKcal) {
    const st = Number(d.steps || (d.body && d.body.steps)) || 0;
    if (st > 0) stepKcal = Math.round(st * 0.035);
  }
  // 3. 手环上报的活动热量或日饮食消耗
  const rawActive = Number(d.activeCalorie) || Number(d.diet && d.diet.burnKcal) || 0;
  // ★ 科学对齐：三者互斥取最大值，严禁相加造成重复计算
  return Math.round(Math.max(rawActive, woKcal, stepKcal));
}

function getEffectiveWeightForDay(day, dayObj, trendItem, fallbackProf) {
  // 1. 本日是否有确切实测体重
  const b = dayObj && (dayObj.body || (dayObj.d && dayObj.d.body) || dayObj);
  if (b && (b.weight || b.weight_kg) && Number(b.weight || b.weight_kg) > 0) {
    return Number(b.weight || b.weight_kg);
  }
  if (dayObj && dayObj.weight && Number(dayObj.weight) > 0) {
    return Number(dayObj.weight);
  }
  // 2. 从 _dayCache 检查
  if (typeof _dayCache !== "undefined" && _dayCache && _dayCache.has(day)) {
    const entry = _dayCache.get(day);
    const cb = (entry && entry.data && entry.data.d && entry.data.d.body) ||
               (entry && entry.data && entry.data.body) ||
               (entry && entry.d && entry.d.body) ||
               (entry && entry.body);
    if (cb && (cb.weight || cb.weight_kg) && Number(cb.weight || cb.weight_kg) > 0) {
      return Number(cb.weight || cb.weight_kg);
    }
  }
  // 3. 从 trendItem 或 TREND 查找（向历史方向查找最近一次称重，绝不借用当前被查看日）
  if (trendItem && trendItem.weight != null && Number(trendItem.weight) > 0) {
    return Number(trendItem.weight);
  }
  if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full) && Array.isArray(TREND.weight)) {
    const idx = TREND.full.indexOf(day);
    if (idx >= 0 && TREND.weight[idx] != null && Number(TREND.weight[idx]) > 0) {
      return Number(TREND.weight[idx]);
    }
    const maxIdx = idx >= 0 ? idx : TREND.full.length - 1;
    for (let i = maxIdx; i >= 0; i--) {
      if (TREND.weight[i] != null && Number(TREND.weight[i]) > 0) {
        return Number(TREND.weight[i]);
      }
    }
    for (let i = Math.max(0, idx); i < TREND.weight.length; i++) {
      if (TREND.weight[i] != null && Number(TREND.weight[i]) > 0) {
        return Number(TREND.weight[i]);
      }
    }
  }
  return (fallbackProf && fallbackProf.weight) || 79.4;
}

function calculateDayCalorieSummary(day, dayObj, trendItem, profile, options) {
  options = options || {};
  const prof = profile || getUserProfile();
  const dayWeight = getEffectiveWeightForDay(day, dayObj, trendItem, prof);
  const staticDayFullBmr = calculateUserBmr({ ...prof, weight: dayWeight }, day);
  
  // ★ 统一优先对齐体脂秤硬件实测 BMR / 动态 BMR，彻底消除 1844 理论公式带来的漂移质问
  const scaleM = (typeof getLatestScaleMetrics === "function") ? getLatestScaleMetrics() : null;
  const dyn = (typeof calculateDynamicBmr === "function") ? calculateDynamicBmr(prof) : null;
  const dayScaleBmr = (dayObj && dayObj.body && dayObj.body.bmr)
    ? Number(dayObj.body.bmr)
    : ((scaleM && scaleM.bmr) ? Number(scaleM.bmr) : null);
  
  const isDynamicApplicable = !!(dyn && dyn.effectiveDate && (day >= dyn.effectiveDate));
  const dayFullBmr = (isDynamicApplicable && dyn && dyn.bmr) || dayScaleBmr || (dyn && dyn.bmr) || staticDayFullBmr;
  
  const isDayToday = (typeof TODAY !== "undefined" ? day === TODAY : false);
  let elapsedRatio = 1.0;
  if (options.elapsedRatio != null) {
    elapsedRatio = options.elapsedRatio;
  } else if (isDayToday) {
    const now = new Date();
    elapsedRatio = Math.min(1.0, Math.max(0.04, (now.getHours() * 60 + now.getMinutes()) / 1440));
  }
  const bmr = isDayToday ? Math.round(dayFullBmr * elapsedRatio) : dayFullBmr;

  // 活动消耗 (统一以 getActiveBurnKcal 为唯一标准，严禁私自截断 clamp)
  let active = 0;
  if (dayObj) {
    active = getActiveBurnKcal(dayObj, dayFullBmr);
  } else if (typeof _dayCache !== "undefined" && _dayCache && _dayCache.has(day)) {
    const c = _dayCache.get(day);
    const cd = (c && c.data && c.data.d) || (c && c.data) || (c && c.d);
    if (cd) active = getActiveBurnKcal(cd, dayFullBmr);
  }
  if (!active && trendItem) {
    active = Number(trendItem.activeBurn) || 0;
  }
  if (!active && typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
    const idx = TREND.full.indexOf(day);
    if (idx >= 0 && Array.isArray(TREND.activeBurn)) {
      active = Number(TREND.activeBurn[idx]) || 0;
    }
  }

  // 饮食摄入 (统一以 dedupDietObj 过滤后的餐食累加或日总计为准)
  let intake = 0;
  let breakdownStr = "";
  let cleanDiet = null;
  if (dayObj && dayObj.diet) {
    cleanDiet = typeof dedupDietObj === "function" ? dedupDietObj(dayObj.diet) : dayObj.diet;
  } else if (typeof _dayCache !== "undefined" && _dayCache && _dayCache.has(day)) {
    const c = _dayCache.get(day);
    const cd = (c && c.data && c.data.d) || (c && c.data) || (c && c.d);
    if (cd && cd.diet) cleanDiet = typeof dedupDietObj === "function" ? dedupDietObj(cd.diet) : cd.diet;
  }
  // ★ v0.42.7: 历史天能量对称性保障。若内存 _dayCache 暂未命中，优先尝试从本地持久化存储中读取 loadDayDietLocal(day)
  if (!cleanDiet && typeof loadDayDietLocal === "function") {
    const ld = loadDayDietLocal(day);
    if (ld && ((ld.totalKcal || 0) > 0 || (Array.isArray(ld.meals) && ld.meals.length > 0))) {
      cleanDiet = typeof dedupDietObj === "function" ? dedupDietObj(ld) : ld;
    }
  }
  
  if (cleanDiet && Array.isArray(cleanDiet.meals) && cleanDiet.meals.length > 0) {
    function getMChar(mType) {
      if (!mType) return "餐";
      const s = String(mType).trim();
      if (s.includes("早")) return "早";
      if (s.includes("午")) return "午";
      if (s.includes("晚")) return "晚";
      if (s.includes("夜")) return "夜";
      if (s.includes("加") || s.includes("茶")) return "加";
      return s.charAt(0);
    }
    const order = ["早", "午", "加", "晚", "夜"];
    const sums = {};
    for (const m of cleanDiet.meals) {
      const mc = getMChar(m.meal);
      const c = Math.round(Number(m.calories) || 0);
      if (c > 0) {
        sums[mc] = (sums[mc] || 0) + c;
        intake += c;
      }
    }
    const orderedList = [];
    for (const oc of order) {
      if (sums[oc]) { orderedList.push(sums[oc]); delete sums[oc]; }
    }
    for (const k of Object.keys(sums)) orderedList.push(sums[k]);
    breakdownStr = orderedList.length ? orderedList.join(" + ") : (intake > 0 ? String(intake) : "0");
  } else if (cleanDiet && Number(cleanDiet.totalKcal) > 0) {
    intake = Number(cleanDiet.totalKcal);
    breakdownStr = String(intake);
  } else if (trendItem && Number(trendItem.dietKcal) > 0) {
    intake = Number(trendItem.dietKcal);
    breakdownStr = String(intake);
  } else if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
    const idx = TREND.full.indexOf(day);
    if (idx >= 0 && Array.isArray(TREND.dietKcal)) {
      intake = Number(TREND.dietKcal[idx]) || 0;
      breakdownStr = intake > 0 ? String(intake) : "";
    }
  }

  const burn = bmr + active;
  const recorded = (intake > 0);
  const diff = recorded ? (intake - burn) : 0;
  const isDeficit = (diff <= 0);

  return {
    day: day,
    intake: intake,
    burn: burn,
    bmr: bmr,
    fullBmr: dayFullBmr,
    active: active,
    diff: diff,
    isDeficit: isDeficit,
    recorded: recorded,
    breakdownStr: breakdownStr,
    weight: dayWeight,
    isToday: isDayToday
  };
}

function renderEnergyBalanceHtml(d, curDay) {

  const prof = getUserProfile();
  
  // 权威纯函数统一计算当前日指标
  const summary = calculateDayCalorieSummary(curDay, d, null, prof);
  const totalIn = summary.intake;
  const mealBreakdownStr = summary.breakdownStr || "0";
  const currentElapsedOut = summary.burn;
  const projectedTdee = summary.fullBmr + summary.active;
  const isDeficit = summary.isDeficit;
  const netAbs = Math.abs(summary.diff);
  const remainingBudget = projectedTdee - totalIn;
  const pctOfTdee = projectedTdee > 0 ? Math.min(150, Math.round((totalIn / projectedTdee) * 100)) : 0;
  const isToday = summary.isToday;

  return `
    <div style="background:linear-gradient(180deg,rgba(255,255,255,0.038) 0%,rgba(255,255,255,0.008) 100%), #131720;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px 15px;margin-bottom:12px;box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.09), 0 6px 20px rgba(0,0,0,0.3)">
      <!-- 头部：标题 + 状态徽章 + 设置微调入口 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:13.5px;font-weight:700;color:var(--fg);letter-spacing:.2px">能量收支平衡 (TDEE)</span>
        </div>
        <div>
          ${isDeficit ? `
            <span style="display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:12px;background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.35);font-size:11.5px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);font-variant-numeric:tabular-nums">
              净赤字 -${netAbs} kcal
            </span>
          ` : `
            <span style="display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:12px;background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.35);font-size:11.5px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);font-variant-numeric:tabular-nums">
              净盈余 +${netAbs} kcal
            </span>
          `}
        </div>
      </div>

      <!-- 核心三栏对冲面板 (Emil Kowalski 凹槽仪器质感) -->
      <div class="bal-grid">
        <!-- 左侧：摄入 In -->
        <div class="bal-col" style="text-align:left">
          <div class="bal-tit">摄入</div>
          <div style="font-size:19px;font-weight:800;color:var(--fg);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0;white-space:nowrap">
            ${totalIn} <span class="unit-kcal"><span class="u-long">kcal</span><span class="u-short">k</span></span>
          </div>
          <div style="font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;white-space:nowrap;overflow:visible">${mealBreakdownStr}</div>
        </div>

        <!-- 中间：对冲平衡进度条 (现代高质感长条描边 + 动态水银微光) -->
        <div class="bal-mid">
          <div style="font-size:11px;color:${remainingBudget >= 0 ? '#34d399' : '#f87171'};font-weight:700;margin-bottom:5px;font-variant-numeric:tabular-nums;white-space:nowrap">
            ${remainingBudget >= 0 ? `剩 ${remainingBudget}` : `超 ${Math.abs(remainingBudget)}`}<span class="unit-kcal"><span class="u-long"> kcal</span><span class="u-short">k</span></span>
          </div>
          <div class="bal-track">
            <div class="bal-fill ${pctOfTdee > 100 ? 'over' : 'norm'}" style="width:${Math.min(100, pctOfTdee)}%"></div>
          </div>
          <div style="font-size:10px;color:var(--dim2);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap">
            ${pctOfTdee}%
          </div>
        </div>

        <!-- 右侧：消耗 Out -->
        <div class="bal-col" style="text-align:right">
          <div class="bal-tit">消耗</div>
          <div style="font-size:19px;font-weight:800;color:var(--fg);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0;white-space:nowrap">
            ${isToday ? currentElapsedOut : projectedTdee} <span class="unit-kcal"><span class="u-long">kcal</span><span class="u-short">k</span></span>
          </div>
          <div style="font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;white-space:nowrap;overflow:visible">
            ${isToday ? summary.bmr : summary.fullBmr} + ${summary.active}
          </div>
        </div>
      </div>

      <!-- 近期历史赤字 / 盈余时序流水 (使用统一 SSOT 纯函数，彻底消除跨天漂移) -->
      ${(() => {
        if (typeof series !== "function") return "";
        const pastList = series(7) || [];
        const prevDays = pastList.filter(x => x && x.day !== curDay && (Number(x.dietKcal) || 0) > 0).slice(-5);
        if (!prevDays.length) return "";
        return `
          <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)">
            <div style="display:grid;grid-template-columns:repeat(${prevDays.length}, 1fr);gap:5px">
              ${prevDays.map(item => {
                const s = calculateDayCalorieSummary(item.day, null, item, prof);
                const isDef = s.isDeficit;
                const dStr = item.day ? item.day.slice(5).replace("-", "/") : "";
                const valStr = isDef ? `-${Math.abs(s.diff)}<span class="diff-unit-kcal"> kcal</span>` : `+${s.diff}<span class="diff-unit-kcal"> kcal</span>`;
                const clr = isDef ? '#34d399' : '#fbbf24';
                const bg = isDef ? 'rgba(16,185,129,0.08)' : 'rgba(245,158,11,0.08)';
                const bdr = isDef ? 'rgba(52,211,153,0.22)' : 'rgba(251,191,36,0.22)';
                return `
                  <div onclick="pickDay('${item.day}')" style="cursor:pointer;background:${bg};border:1px solid ${bdr};border-radius:8px;padding:6px 2px;text-align:center;transition:transform 0.12s ease,border-color 0.12s ease" title="${item.day}: 摄入 ${s.intake} / 消耗 ${s.burn} kcal (基代 ${s.bmr} + 活动 ${s.active})">
                    <div style="font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums;line-height:1;margin-bottom:4px">${dStr}</div>
                    <div style="font-size:10.5px;font-weight:700;color:${clr};font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1.1;white-space:nowrap">${valStr}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      })()}
    </div>
  `;
}

/* =========================================================
   三大旗舰功能 (v0.30.0)
   1. 每日身体精力与恢复力评分 (Recovery / Readiness Score, Whoop & Oura)
   2. 五维平衡雷达与沉浸日签导出 (Five-Dim Balance Radar & Poster Export)
   3. 跨维度生活因果关联引擎 (Correlation Engine, Exist.io)
   ========================================================= */

function calculateReadinessScore(d, T, curDay) {
  // 1. 睡眠评价 (0 ~ 30 分)：入睡时点(15分) + 睡眠总时长(15分)
  const sleepTotMin = ((d && Number(d.sleepMin)) || 0) + ((d && Number(d.napMin)) || 0);
  const deepMin = (d && Number(d.deep)) || 0;
  
  // 提取入睡时刻
  let sleepFromTxt = "";
  let bedtimeHour = null; // 相对 24 点的小时数（如 23:20 -> 23.33; 00:40 -> 24.67）
  if (d && d.sleepFrom) {
    try {
      const raw = String(d.sleepFrom);
      if (raw.includes(":") || raw.includes("T")) {
        const timePart = raw.includes("T") ? raw.split("T")[1] : raw;
        const [hStr, mStr] = timePart.split(":");
        const h = parseInt(hStr, 10);
        const m = parseInt(mStr, 10) || 0;
        if (!isNaN(h)) {
          sleepFromTxt = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
          bedtimeHour = (h < 12) ? (h + 24 + m / 60) : (h + m / 60);
        }
      }
    } catch (e) {}
  }

  // 入睡时间得分 (0 ~ 15 分)
  let sleepTimingPts = 12;
  if (bedtimeHour !== null) {
    if (bedtimeHour >= 22.0 && bedtimeHour <= 23.5) {
      sleepTimingPts = 15; // 22:00 ~ 23:30 黄金作息
    } else if (bedtimeHour > 23.5 && bedtimeHour <= 24.25) {
      sleepTimingPts = 13; // 23:30 ~ 00:15 适中
    } else if (bedtimeHour > 24.25 && bedtimeHour <= 25.0) {
      sleepTimingPts = 9;  // 00:15 ~ 01:00 偏晚
    } else {
      sleepTimingPts = 5;  // 01:00 之后熬夜
    }
  } else if (sleepTotMin > 0) {
    sleepTimingPts = 12;
  } else {
    sleepTimingPts = 8;
  }

  // 睡眠时长得分 (0 ~ 15 分)
  let sleepDurationPts = 10;
  if (sleepTotMin >= 420 && sleepTotMin <= 510) {
    sleepDurationPts = 15; // 7h ~ 8.5h 最优
  } else if ((sleepTotMin >= 390 && sleepTotMin < 420) || (sleepTotMin > 510 && sleepTotMin <= 570)) {
    sleepDurationPts = 13; // 6.5h ~ 7h 或 8.5h ~ 9.5h 良好
  } else if ((sleepTotMin >= 360 && sleepTotMin < 390) || (sleepTotMin > 570 && sleepTotMin <= 600)) {
    sleepDurationPts = 11; // 6h ~ 6.5h 或 9.5h ~ 10h 尚可
  } else if (sleepTotMin >= 300 && sleepTotMin < 360) {
    sleepDurationPts = 8;  // 5h ~ 6h 偏少
  } else if (sleepTotMin > 600) {
    sleepDurationPts = 7;  // > 10h 过长
  } else if (sleepTotMin > 0) {
    sleepDurationPts = 5;  // < 5h 严重不足
  } else {
    sleepDurationPts = 6;  // 缺卡
  }

  const sleepScore = Math.min(30, Math.max(6, sleepTimingPts + sleepDurationPts));

  // 2. 卡路里与饮食控制 (0 ~ 25 分)
  const prof = typeof getUserProfile === "function" ? getUserProfile() : DEFAULT_USER_PROFILE;
  const calSummary = typeof calculateDayCalorieSummary === "function" 
    ? calculateDayCalorieSummary(curDay, d, null, prof)
    : { recorded: false, diff: 0, intake: 0, burn: 0, isDeficit: true };
  
  let dietScore = 18;
  let dietDesc = "未记录";
  if (calSummary.recorded) {
    const diff = calSummary.diff; // diff = intake - burn (负数为赤字)
    if (diff <= -300 && diff >= -1500) {
      dietScore = 25; // 300 ~ 1500 kcal 黄金减脂/健康赤字（自律高分档）
      dietDesc = `净赤字 ${Math.abs(diff)} kcal`;
    } else if (diff < -1500) {
      dietScore = 24; // 超深度减脂赤字（>1500 kcal），仍为减脂好变化，维持 24 分满分档
      dietDesc = `净赤字 ${Math.abs(diff)} kcal`;
    } else if (diff < -100 && diff > -300) {
      dietScore = 23; // 100 ~ 300 kcal 温和赤字
      dietDesc = `净赤字 ${Math.abs(diff)} kcal`;
    } else if (diff >= -100 && diff <= 100) {
      dietScore = 22; // ±100 kcal 动态收支平衡
      dietDesc = `收支基本平衡`;
    } else if (diff > 100 && diff <= 300) {
      dietScore = 19; // 100 ~ 300 kcal 轻度盈余
      dietDesc = `净盈余 ${diff} kcal`;
    } else if (diff > 300 && diff <= 600) {
      dietScore = 15; // 300 ~ 600 kcal 中度盈余
      dietDesc = `净盈余 ${diff} kcal`;
    } else {
      dietScore = 12; // >600 kcal 明显盈余/超标
      dietDesc = `净盈余 ${diff} kcal`;
    }
  } else {
    dietScore = 16; // 饮食未记账，给平稳基准分
    dietDesc = "无就餐记录";
  }

  // 3. 步数达标度 (0 ~ 25 分)
  const steps = (d && Number(d.steps)) || 0;
  let stepScore = 16;
  if (steps >= 10000) {
    stepScore = 25;
  } else if (steps >= 8000) {
    stepScore = 23;
  } else if (steps >= 6000) {
    stepScore = 20;
  } else if (steps >= 4000) {
    stepScore = 16;
  } else if (steps >= 3000) {
    stepScore = 13;
  } else {
    stepScore = 10;
  }

  // 4. 运动与锻炼消耗 (0 ~ 20 分)
  const workouts = (d && Array.isArray(d.workouts)) ? d.workouts : [];
  const workoutMin = workouts.reduce((acc, w) => acc + (Number(w.durMin) || Number(w.dur) || 0), 0);
  const activeKcal = typeof getActiveBurnKcal === "function" ? getActiveBurnKcal(d) : ((d && Number(d.activeKcal)) || 0);

  let workoutScore = 12;
  let workoutDesc = "常规活动";
  if (workoutMin >= 30 || activeKcal >= 300) {
    workoutScore = 20;
    workoutDesc = workoutMin > 0 ? `${workoutMin} 分钟锻炼` : `活跃 ${activeKcal} kcal`;
  } else if (workoutMin >= 20 || activeKcal >= 200) {
    workoutScore = 18;
    workoutDesc = workoutMin > 0 ? `${workoutMin} 分钟锻炼` : `活跃 ${activeKcal} kcal`;
  } else if (workoutMin >= 10 || activeKcal >= 100) {
    workoutScore = 15;
    workoutDesc = workoutMin > 0 ? `${workoutMin} 分钟锻炼` : `活跃 ${activeKcal} kcal`;
  } else if (steps >= 9000) {
    workoutScore = 14;
    workoutDesc = "高步数活动";
  } else {
    workoutScore = 11;
    workoutDesc = "常规活动";
  }

  // 计算总分并校准分布：常态 65~88 分，优秀 90~95 分，杜绝动辄 98 虚高
  const rawScore = sleepScore + dietScore + stepScore + workoutScore;
  let totalScore = Math.round(rawScore);
  if (totalScore >= 96) totalScore = 95;
  totalScore = Math.min(95, Math.max(45, totalScore));

  let statusText = "健康节奏良好";
  let statusBadge = "良好自律";
  let statusColor = "var(--soft, #38bdf8)";
  let batteryLevel = "80%";

  if (totalScore >= 88) {
    statusText = "自律状态极佳";
    statusBadge = "优良自律";
    statusColor = "var(--health, #10b981)";
    batteryLevel = "100%";
  } else if (totalScore >= 76) {
    statusText = "生活稳健良好";
    statusBadge = "稳健良好";
    statusColor = "var(--soft, #38bdf8)";
    batteryLevel = "80%";
  } else if (totalScore >= 65) {
    statusText = "维持常规节奏";
    statusBadge = "常规维持";
    statusColor = "#fbbf24";
    batteryLevel = "60%";
  } else {
    statusText = "需要蓄能调整";
    statusBadge = "需蓄能调整";
    statusColor = "var(--alert, #f59e0b)";
    batteryLevel = "40%";
  }

  // 精炼客观单日「日报」（40~65字，客观事实，严禁专注度、心率等词汇）
  let sleepPart = "";
  if (sleepFromTxt && sleepTotMin > 0) {
    const rTxt = (bedtimeHour !== null && bedtimeHour <= 23.5) ? "，睡眠节律稳健" : (sleepTotMin >= 420 ? "，时长充沛" : "，睡眠偏紧");
    sleepPart = `昨夜 ${sleepFromTxt} 入睡共 ${hhmm(sleepTotMin)}${rTxt}`;
  } else if (sleepTotMin > 0) {
    sleepPart = `昨夜睡眠共 ${hhmm(sleepTotMin)}`;
  } else {
    sleepPart = `昨夜未记录有效睡眠`;
  }

  let actPart = "";
  if (workoutMin > 0) {
    actPart = `；全天步行 ${steps.toLocaleString()} 步并完成 ${workoutMin} 分钟锻炼`;
  } else if (steps >= 8000) {
    actPart = `；全天步行达 ${steps.toLocaleString()} 步，日常活动量充足`;
  } else {
    actPart = `；全天步行 ${steps.toLocaleString()} 步`;
  }

  let dietPart = "";
  if (calSummary.recorded) {
    if (calSummary.isDeficit) {
      dietPart = `；饮食控制良好，形成净赤字 ${Math.abs(calSummary.diff)} kcal。`;
    } else if (Math.abs(calSummary.diff) <= 100) {
      dietPart = `；饮食摄入适中，热量收支动态平衡。`;
    } else {
      dietPart = `；饮食摄入 ${calSummary.intake} kcal，净盈余 ${calSummary.diff} kcal。`;
    }
  } else {
    dietPart = `；饮食未单独记录记账。`;
  }

  const tipText = `${sleepPart}${actPart}${dietPart}`;

  return {
    score: totalScore,
    statusText,
    statusBadge,
    statusColor,
    batteryLevel,
    tipText,
    sleepScore,
    dietScore,
    stepScore,
    workoutScore,
    sleepTotMin,
    sleepFromTxt,
    deepMin,
    steps,
    dietDesc,
    workoutDesc
  };
}

function renderReadinessScoreHtml(d, T, curDay) {

function calculateFiveDimScores(d, T, curDay) {
  // 1. 睡眠 (Sleep)
  const sleepTot = ((d && Number(d.sleepMin)) || 0) + ((d && Number(d.napMin)) || 0);
  const deep = (d && Number(d.deep)) || 0;
  let sleepScore = 0;
  if (sleepTot > 0) {
    const durPct = Math.min(1.0, sleepTot / 450);
    const deepPct = deep > 0 ? Math.min(1.0, deep / 80) : durPct;
    sleepScore = Math.round(durPct * 65 + deepPct * 35);
  } else {
    sleepScore = 70;
  }
  sleepScore = Math.min(100, Math.max(30, sleepScore));

  // 2. 能量代谢 (Energy)
  const prof = getUserProfile();
  const dynamicWeight = (d && d.body && (d.body.weight || d.body.weight_kg)) || prof.weight;
  const dayCalSummary = (typeof calculateDayCalorieSummary === "function") ? calculateDayCalorieSummary(curDay, d) : null;
  const dyn = (typeof calculateDynamicBmr === "function") ? calculateDynamicBmr(prof) : null;
  const scaleM = (typeof getLatestScaleMetrics === "function") ? getLatestScaleMetrics() : null;
  const fullBmr = (dayCalSummary && dayCalSummary.fullBmr) ? dayCalSummary.fullBmr : ((dyn && dyn.bmr) ? dyn.bmr : ((d && d.body && d.body.bmr) ? Number(d.body.bmr) : ((scaleM && scaleM.bmr) ? Number(scaleM.bmr) : calculateUserBmr({ ...prof, weight: dynamicWeight }, curDay))));
  const activeKcal = getActiveBurnKcal(d);
  const totalOut = fullBmr + activeKcal;
  let totalIn = 0;
  if (d && d.diet && d.diet.totalKcal != null) {
    totalIn = Math.round(Number(d.diet.totalKcal) || 0);
  }
  let energyScore = 80;
  if (totalIn > 0 && totalOut > 0) {
    const net = totalIn - totalOut;
    if (net >= -600 && net <= 100) {
      energyScore = 95;
    } else if (net > 100 && net <= 350) {
      energyScore = 88;
    } else if (net >= -900 && net < -600) {
      energyScore = 86;
    } else if (net > 350 && net <= 700) {
      energyScore = 78;
    } else {
      energyScore = 70;
    }
  } else {
    energyScore = 80;
  }

  // 3. 身体活跃 (Activity)
  const steps = (d && Number(d.steps)) || 0;
  let activityScore = 0;
  if (steps > 0) {
    const stepPct = Math.min(1.15, steps / 8000);
    activityScore = Math.round(stepPct * 85 + Math.min(15, (activeKcal / 250) * 15));
  } else {
    activityScore = 60;
  }
  activityScore = Math.min(100, Math.max(30, activityScore));

  // 4. 心血管健康 (Cardio)
  const pastRhr = (T || []).map(x => Number(x.resting) || 0).filter(v => v >= 40 && v <= 110);
  const baselineRhr = pastRhr.length > 0 ? Math.round(pastRhr.reduce((a, b) => a + b, 0) / pastRhr.length) : 62;
  const curRhr = (d && Number(d.resting) > 0) ? Number(d.resting) : baselineRhr;
  let cardioScore = 85;
  if (curRhr >= 50 && curRhr <= 65) {
    cardioScore = 96;
  } else if (curRhr > 65 && curRhr <= 72) {
    cardioScore = 88;
  } else if (curRhr > 72 && curRhr <= 80) {
    cardioScore = 78;
  } else if (curRhr > 80) {
    cardioScore = 68;
  }
  cardioScore = Math.min(100, Math.max(40, cardioScore));

  // 5. 专注与离线 (Focus)
  let deepMin = 0;
  if (d && d.deepMin) deepMin = d.deepMin;
  else if (d && d.focus && d.focus.deepSec) deepMin = Math.round(d.focus.deepSec / 60);
  else if (d && d.deepBlocks) deepMin = d.deepBlocks * 25;
  const scMin = (d && d.screenMin) || (((d && d.pcMin) || 0) + ((d && d.phoneMin) || 0));
  let focusScore = 75;
  if (deepMin > 0) {
    const focusPct = Math.min(1.0, deepMin / 120);
    const screenPenalty = scMin > 480 ? 10 : (scMin > 360 ? 5 : 0);
    focusScore = Math.round(focusPct * 80 + 20 - screenPenalty);
  } else if (scMin > 0 && scMin < 360) {
    focusScore = 82;
  }
  focusScore = Math.min(100, Math.max(40, focusScore));

  const total = Math.round((sleepScore + energyScore + activityScore + cardioScore + focusScore) / 5);

  return {
    total,
    sleep: sleepScore,
    energy: energyScore,
    activity: activityScore,
    cardio: cardioScore,
    focus: focusScore,
    curRhr,
    baselineRhr,
    sleepTot,
    deep,
    steps,
    totalIn,
    totalOut,
    deepMin
  };
}

function renderFiveDimRadarCard(d, T, curDay) {
  const dim = calculateFiveDimScores(d, T, curDay);
  const cx = 120, cy = 105, R = 68;
  const angles = [
    -Math.PI / 2,
    -Math.PI / 2 + 2 * Math.PI / 5,
    -Math.PI / 2 + 4 * Math.PI / 5,
    -Math.PI / 2 + 6 * Math.PI / 5,
    -Math.PI / 2 + 8 * Math.PI / 5
  ];
  const dimVals = [dim.sleep, dim.energy, dim.activity, dim.cardio, dim.focus];
  const dimNames = ["睡眠", "能量", "活跃", "心血管", "专注"];

  // Web rings
  const ringsSvg = [0.25, 0.5, 0.75, 1.0].map(pct => {
    const pts = angles.map(ang => `${(cx + R * pct * Math.cos(ang)).toFixed(1)},${(cy + R * pct * Math.sin(ang)).toFixed(1)}`).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,${pct === 1.0 ? '0.14' : '0.06'})" stroke-width="1"></polygon>`;
  }).join("");

  // Axis lines
  const axesSvg = angles.map(ang => {
    const x = (cx + R * Math.cos(ang)).toFixed(1);
    const y = (cy + R * Math.sin(ang)).toFixed(1);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-width="1"></line>`;
  }).join("");

  // Data polygon points
  const dataPts = angles.map((ang, i) => {
    const p = Math.max(0.18, dimVals[i] / 100);
    return {
      x: cx + R * p * Math.cos(ang),
      y: cy + R * p * Math.sin(ang)
    };
  });
  const dataPtsStr = dataPts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

  // Vertices dots
  const dotsSvg = dataPts.map((p, i) => `
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"></circle>
  `).join("");

  // Labels around polygon
  const labelsSvg = angles.map((ang, i) => {
    const lx = cx + (R + 18) * Math.cos(ang);
    const ly = cy + (R + 18) * Math.sin(ang);
    let anchor = "middle";
    if (Math.abs(Math.cos(ang)) < 0.25) anchor = "middle";
    else if (Math.cos(ang) > 0) anchor = "start";
    else anchor = "end";
    return `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="600" fill="var(--dim)">${dimNames[i]} <tspan fill="#38bdf8" font-weight="700">${dimVals[i]}</tspan></text>`;
  }).join("");

  const radarSvg = `
    <svg viewBox="0 0 240 210" style="width:100%;max-width:240px;height:auto;overflow:visible">
      <defs>
        <radialGradient id="radarFillGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"></stop>
          <stop offset="100%" stop-color="#10b981" stop-opacity="0.15"></stop>
        </radialGradient>
      </defs>
      ${ringsSvg}
      ${axesSvg}
      <polygon points="${dataPtsStr}" fill="url(#radarFillGrad)" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"></polygon>
      ${dotsSvg}
      ${labelsSvg}
      <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="16" font-weight="800" fill="var(--fg)" font-variant-numeric="tabular-nums">${dim.total}</text>
    </svg>
  `;

  const detailsHtml = [
    { name: "睡眠充沛", score: dim.sleep, icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`, val: hhmm(dim.sleepTot), sub: dim.deep ? `深睡 ${dur(dim.deep)}` : "基准" },
    { name: "能量代谢", score: dim.energy, icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`, val: `${dim.totalIn}k`, sub: `出 ${dim.totalOut}k` },
    { name: "身体活跃", score: dim.activity, icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><path d="M10 22l4-7-3-4 3-4"/></svg>`, val: `${dim.steps.toLocaleString()}步`, sub: "日间活动" },
    { name: "心肺健康", score: dim.cardio, icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`, val: `${dim.curRhr} bpm`, sub: `基线 ${dim.baselineRhr}` },
    { name: "专注平衡", score: dim.focus, icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>`, val: `${dim.deepMin || 0}m`, sub: "深度工作" },
  ].map(it => `
    <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04);border-radius:6px;padding:4px 8px;font-size:11px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="display:inline-flex;align-items:center;color:var(--dim)">${it.icon}</span>
        <span style="color:var(--dim);font-weight:500">${it.name}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums">${it.val} · ${it.sub}</span>

      </div>
    </div>
  `).join("");

  return `
    <div class="radar-card">
      <div class="radar-wrap">
        <div style="flex:none;width:230px;display:flex;flex-direction:column;align-items:center;justify-content:center">
          ${radarSvg}
          <div style="font-size:11px;color:var(--dim2);margin-top:2px;font-variant-numeric:tabular-nums">五维综合指数 · <b style="color:var(--soft)">${dim.total >= 85 ? '状态极佳' : (dim.total >= 70 ? '稳态良好' : '适度调整')}</b></div>
        </div>
        <div class="radar-details">
          ${detailsHtml}
        </div>
      </div>
    </div>
  `;
}

function calculateLifestyleCorrelations(T) {
  if (!T || !T.length) return [];
  const list = [];

  // 1. 步数 ➔ 深睡眠 (Steps ➔ Deep Sleep)
  const stepDeepDays = T.filter(x => (x.steps || 0) > 0 && (x.deep || 0) > 0);
  if (stepDeepDays.length >= 3) {
    const high = stepDeepDays.filter(x => x.steps >= 6500);
    const low = stepDeepDays.filter(x => x.steps < 6500);
    if (high.length >= 1 && low.length >= 1) {
      const avgHigh = Math.round(high.reduce((a, b) => a + b.deep, 0) / high.length);
      const avgLow = Math.round(low.reduce((a, b) => a + b.deep, 0) / low.length);
      const diff = avgHigh - avgLow;
      if (diff > 5) {
        const pct = Math.round((diff / Math.max(1, avgLow)) * 100);
        list.push({
          iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
          title: "步数活跃 ➔ 深睡眠质量提升",
          badge: `+${pct}% 正向关联`,
          badgeColor: "var(--health, #10b981)",
          highlight: `高步数日 (≥6500步) 深睡平均 ${dur(avgHigh)}，比久坐日多出 ${diff} 分钟 (+${pct}%)`
        });
      }
    }
  }

  // 2. 屏幕时长 ➔ 身体步数抑制 (Screen Time ➔ Activity Suppression)
  const pcStepDays = T.filter(x => (x.pcMin || 0) > 0 && (x.steps || 0) > 0);
  if (pcStepDays.length >= 3) {
    const highPc = pcStepDays.filter(x => x.pcMin >= 360);
    const lowPc = pcStepDays.filter(x => x.pcMin < 360);
    if (highPc.length >= 1 && lowPc.length >= 1) {
      const avgStepsHigh = Math.round(highPc.reduce((a, b) => a + b.steps, 0) / highPc.length);
      const avgStepsLow = Math.round(lowPc.reduce((a, b) => a + b.steps, 0) / lowPc.length);
      const diff = avgStepsLow - avgStepsHigh;
      if (diff > 500) {
        const pct = Math.round((diff / Math.max(1, avgStepsLow)) * 100);
        list.push({
          iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
          title: "长时间屏幕 ➔ 日常步数抑制",
          badge: `-${pct}% 负向抑制`,
          badgeColor: "var(--alert, #f59e0b)",
          highlight: `电脑使用超 6 小时时，当日步数均值降至 ${avgStepsHigh.toLocaleString()} 步 (-${pct}%)`
        });
      }
    }
  }

  // 3. 充足睡眠 ➔ 认知精力 (Sleep ➔ Focus & Energy)
  const sleepDays = T.filter(x => (x.sleepMin || 0) > 0);
  if (sleepDays.length >= 3) {
    const avgSleep = Math.round(sleepDays.reduce((a, b) => a + b.sleepMin, 0) / sleepDays.length);
    list.push({
      iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
      title: "充足睡眠储备 ➔ 认知专注与抗疲劳",
      badge: "效能基准",
      badgeColor: "var(--flow, #818cf8)",
      highlight: `平均睡眠时长约 ${(avgSleep / 60).toFixed(1)} 小时，节律持续维系`
    });
  }

  return list;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

async function generatePosterCanvas(curDay) {
  const { d } = await getDay(curDay);
  const T = series(30);
  const r = calculateReadinessScore(d, T, curDay);
  const dims = calculateFiveDimScores(d, T, curDay);

  const canvas = document.createElement("canvas");
  const W = 840;
  const H = 1180;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  // 1. 深色精致背景
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#0b0d13");
  grad.addColorStop(0.5, "#10141e");
  grad.addColorStop(1, "#080a0e");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 边框装饰
  ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
  ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, W - 40, H - 40);

  // 内微光光斑
  const radGrad = ctx.createRadialGradient(W / 2, 220, 10, W / 2, 220, 320);
  radGrad.addColorStop(0, "rgba(56, 189, 248, 0.12)");
  radGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, W, 500);

  // 2. 头部 Logo 与日期
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("AI STEWARD · 个人数据管家", W / 2, 70);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  ctx.fillText("每日生活节律与身心平衡日签", W / 2, 98);

  const dowStr = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][new Date(curDay + "T00:00:00Z").getUTCDay()] || "";
  ctx.fillStyle = "#38bdf8";
  ctx.font = "bold 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  ctx.fillText(`${curDay}  ${dowStr}`, W / 2, 132);

  // 3. 核心精力恢复大徽章
  ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.09)";
  ctx.lineWidth = 1.5;
  drawRoundRect(ctx, 60, 160, W - 120, 120, 16);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#94a3b8";
  ctx.font = "13px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("身体精力与恢复力评分 (Whoop Readiness)", 86, 196);

  ctx.fillStyle = r.statusColor === "var(--health, #10b981)" ? "#34d399" : (r.statusColor === "var(--alert, #f59e0b)" ? "#fbbf24" : "#38bdf8");
  ctx.font = "bold 44px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText(`${r.score}`, 86, 252);

  ctx.font = "bold 18px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText(`分 · ${r.statusText}`, 154, 250);

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "13px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(`静息心率 ${r.curRhr} bpm · 深睡 ${dur(r.deepMin)}`, W - 86, 222);
  ctx.fillText(`日行活动 ${r.steps.toLocaleString()} 步 · 恢复就绪`, W - 86, 250);

  // 4. 五维雷达图 (中心绘制)
  const rcx = W / 2;
  const rcy = 500;
  const R = 150;
  const angles = [-Math.PI / 2, -Math.PI / 2 + 2 * Math.PI / 5, -Math.PI / 2 + 4 * Math.PI / 5, -Math.PI / 2 + 6 * Math.PI / 5, -Math.PI / 2 + 8 * Math.PI / 5];
  const dimVals = [dims.sleep, dims.energy, dims.activity, dims.cardio, dims.focus];
  const dimNames = ["睡眠充沛", "能量代谢", "身体活跃", "心血管健康", "专注平衡"];

  // 4 层蛛网同心多边形
  [0.25, 0.5, 0.75, 1.0].forEach(pct => {
    ctx.beginPath();
    angles.forEach((ang, i) => {
      const x = rcx + R * pct * Math.cos(ang);
      const y = rcy + R * pct * Math.sin(ang);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = pct === 1.0 ? "rgba(255, 255, 255, 0.16)" : "rgba(255, 255, 255, 0.06)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
  });

  // 轴线
  angles.forEach(ang => {
    ctx.beginPath();
    ctx.moveTo(rcx, rcy);
    ctx.lineTo(rcx + R * Math.cos(ang), rcy + R * Math.sin(ang));
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.stroke();
  });

  // 雷达数据多边形
  ctx.beginPath();
  angles.forEach((ang, i) => {
    const valPct = Math.max(0.18, dimVals[i] / 100);
    const x = rcx + R * valPct * Math.cos(ang);
    const y = rcy + R * valPct * Math.sin(ang);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = "rgba(56, 189, 248, 0.28)";
  ctx.fill();
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 3;
  ctx.stroke();

  // 顶点小圆点
  angles.forEach((ang, i) => {
    const valPct = Math.max(0.18, dimVals[i] / 100);
    const x = rcx + R * valPct * Math.cos(ang);
    const y = rcy + R * valPct * Math.sin(ang);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#38bdf8";
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // 雷达各维度标签与得分
  angles.forEach((ang, i) => {
    const tx = rcx + (R + 32) * Math.cos(ang);
    const ty = rcy + (R + 32) * Math.sin(ang);
    ctx.font = "bold 14px -apple-system, BlinkMacSystemFont, sans-serif";
    if (Math.abs(Math.cos(ang)) < 0.2) ctx.textAlign = "center";
    else if (Math.cos(ang) > 0) ctx.textAlign = "left";
    else ctx.textAlign = "right";

    ctx.fillStyle = "#e2e8f0";
    ctx.fillText(`${dimNames[i]} ${dimVals[i]}`, tx, ty + 5);
  });

  // 雷达中心综合平衡指数
  ctx.textAlign = "center";
  ctx.fillStyle = "#38bdf8";
  ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText(`${dims.total}`, rcx, rcy - 5);
  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText("平衡指数", rcx, rcy + 15);

  // 5. 底部 4 宫格核心体征快照
  const bentoY = 720;
  const bentoH = 140;
  const colW = (W - 120 - 16) / 2;
  const rowH = (bentoH - 12) / 2;

  const prof = getUserProfile();
  const dynamicWeight = (d && d.body && (d.body.weight || d.body.weight_kg)) || prof.weight;
  const dayCalSummary = (typeof calculateDayCalorieSummary === "function") ? calculateDayCalorieSummary(curDay, d) : null;
  const dyn = (typeof calculateDynamicBmr === "function") ? calculateDynamicBmr(prof) : null;
  const scaleM = (typeof getLatestScaleMetrics === "function") ? getLatestScaleMetrics() : null;
  const fullBmr = (dayCalSummary && dayCalSummary.fullBmr) ? dayCalSummary.fullBmr : ((dyn && dyn.bmr) ? dyn.bmr : ((d && d.body && d.body.bmr) ? Number(d.body.bmr) : ((scaleM && scaleM.bmr) ? Number(scaleM.bmr) : calculateUserBmr({ ...prof, weight: dynamicWeight }, curDay))));
  const activeKcal = getActiveBurnKcal(d);
  const totalOut = fullBmr + activeKcal;
  const totalIn = d && d.diet && d.diet.totalKcal != null ? Math.round(d.diet.totalKcal) : 0;
  const netKcal = totalIn - totalOut;

  const metrics = [
    { label: "睡眠总计", val: hhmm(dims.sleepTot), sub: `深睡眠 ${dur(dims.deep)}` },
    { label: "活动步数", val: `${(d.steps || 0).toLocaleString()} 步`, sub: `消耗 ${activeKcal} kcal` },
    { label: "静息心率", val: `${dims.curRhr} bpm`, sub: `基线 ${dims.baselineRhr} bpm` },
    { label: "能量平衡", val: `${netKcal >= 0 ? '+' : ''}${netKcal} kcal`, sub: `摄入 ${totalIn} / 消耗 ${totalOut}` }
  ];

  metrics.forEach((m, idx) => {
    const rx = 60 + (idx % 2) * (colW + 16);
    const ry = bentoY + Math.floor(idx / 2) * (rowH + 12);
    ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
    drawRoundRect(ctx, rx, ry, colW, rowH, 12);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.fillStyle = "#94a3b8";
    ctx.font = "12px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(m.label, rx + 16, ry + 25);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 17px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(m.val, rx + 16, ry + 50);

    ctx.fillStyle = "#64748b";
    ctx.font = "11.5px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(m.sub, rx + 16, ry + 70);
  });

  // 6. 生活哲学结语
  ctx.fillStyle = "rgba(255, 255, 255, 0.025)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
  drawRoundRect(ctx, 60, 930, W - 120, 110, 14);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "15px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText("“ 日拱一卒，功不唐捐。数据照亮细节，节律塑造自由。 ”", W / 2, 975);

  ctx.fillStyle = "#64748b";
  ctx.font = "12px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText("AI Steward · 个人健康与生活数据操作系统", W / 2, 1010);

  // 7. 最底端水印
  ctx.fillStyle = "#475569";
  ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText("https://steward-3t9.pages.dev · 纯端侧计算无数据外泄", W / 2, 1120);

  return canvas.toDataURL("image/png");
}

let CUR_DAY_DATA = null;
let HERO_METRICS_STATE = { sleep: 0, pc: 0, steps: 0, focus: 0 };

function toggleMetricCard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (navigator.vibrate) try { navigator.vibrate(10); } catch(e) {}
  el.classList.add("swap-out");
  setTimeout(() => {
    const isSec = el.classList.contains("is-sec");
    const vEl = el.querySelector(".v");
    const lEl = el.querySelector(".l");
    if (!isSec) {
      el.classList.add("is-sec");
      if (vEl) vEl.innerHTML = el.getAttribute("data-v2");
      if (lEl) lEl.innerHTML = el.getAttribute("data-l2");
    } else {
      el.classList.remove("is-sec");
      if (vEl) vEl.innerHTML = el.getAttribute("data-v1");
      if (lEl) lEl.innerHTML = el.getAttribute("data-l1");
    }
    el.classList.remove("swap-out");
    el.classList.add("swap-in");
    setTimeout(() => { el.classList.remove("swap-in"); }, 240);
  }, 120);
}
window.toggleMetricCard = toggleMetricCard;

function interactiveMetric(id, v1, l1, v2, l2, cls, customTitle) {
  const v1Html = `${v1}`;
  const l1Html = `${l1}`;

  const l2Html = `${l2}`;

  return `
    <div id="${id}" class="m interactive ${cls || ''}" onclick="toggleMetricCard('${id}')" data-v1="${esc(v1Html)}" data-l1="${esc(l1Html)}" data-v2="${esc(v2Html)}" data-l2="${esc(l2Html)}" ${titleAttr}>
      <span class="m-dot"></span>

      <div class="l">${l1Html}</div>

}

window.toggleHeroMetric = toggleHeroMetric;

function renderInteractiveHeroMetrics(d, T, curDay) {
  const isToday = curDay === (typeof TODAY !== "undefined" ? TODAY : "");
  const bandRaw = (typeof TREND !== "undefined" && TREND && TREND.bandLast) ? String(TREND.bandLast) : "";
  const bandTimeStr = (typeof formatBandTimeStr === "function") ? formatBandTimeStr(bandRaw) : "";
  const isBandStale = isToday && (!d.steps || d.steps === 0) && Boolean(bandRaw);
  // 1. 睡眠：默认总时长，点击替换为最长睡眠时段
  let sleepV1 = hhmm((d.sleepMin || 0) + (d.napMin || 0));
  let sleepL1 = "睡眠";
  let sleepRange = "—";
  let arr = (Array.isArray(d.sleeps) && d.sleeps.length > 0) ? d.sleeps.slice() : [];
  if (!arr.length && d.sleepFrom != null && d.sleepTo != null) {
    arr = [{ from: d.sleepFrom, to: d.sleepTo, min: d.sleepMin || 0 }];
  }
  if (arr.length > 0) {
    arr.sort((a, b) => {
      const ma = Number(a.min) || (a.to != null && a.from != null ? a.to - a.from : 0);
      const mb = Number(b.min) || (b.to != null && b.from != null ? b.to - b.from : 0);
      return mb - ma;
    });
    const top = arr[0];
    if (top.from != null && top.to != null) {
      sleepRange = `${hm(top.from)}~${hm(top.to)}`;
    }
  } else if (d.wake != null) {
    sleepRange = `~${hm(d.wake)}`;
  }
  let sleepV2 = `<span style="font-size:16.5px;letter-spacing:-0.02em">${sleepRange}</span>`;
  let sleepL2 = "最长时段";

  // 2. 电脑：默认使用时长，点击替换为相比一周增减
  let pcV1 = dur(d.pcMin);
  let pcL1 = "电脑";
  const pastT = (T || []).filter(x => x.day !== curDay).slice(-7);
  const poolT = pastT.length > 0 ? pastT : (T || []).slice(-7);
  const avgPc = poolT.length > 0
    ? Math.round(poolT.reduce((s, x) => s + (Number(x.pcMin) || 0), 0) / poolT.length)
    : (d.pcMin || 0);
  const pcDiff = (Number(d.pcMin) || 0) - avgPc;
  let pcDiffStr = "持平";
  if (pcDiff > 0) pcDiffStr = `+${dur(pcDiff)}`;
  else if (pcDiff < 0) pcDiffStr = `-${dur(Math.abs(pcDiff))}`;
  let pcV2 = `<span style="font-size:18px;letter-spacing:-0.02em">${pcDiffStr}</span>`;
  let pcL2 = "较7天均值";

  // 3. 步数：默认总步数，点击替换为相比一周增减
  let stepsV1 = (d.steps || 0).toLocaleString();
  let stepsL1 = "步数";
  const avgSteps = poolT.length > 0
    ? Math.round(poolT.reduce((s, x) => s + (Number(x.steps) || 0), 0) / poolT.length)
    : (d.steps || 0);
  const stepDiff = (Number(d.steps) || 0) - avgSteps;
  let stepDiffStr = "持平";
  if (stepDiff > 0) stepDiffStr = `+${stepDiff.toLocaleString()}`;
  else if (stepDiff < 0) stepDiffStr = `-${Math.abs(stepDiff).toLocaleString()}`;
  let stepsV2 = `<span style="font-size:18px;letter-spacing:-0.02em">${stepDiffStr}</span>`;
  let stepsL2 = isBandStale ? ("手机未上云 · 至 " + bandTimeStr) : "较7天均值";
  let stepsTitle = isBandStale ? `手机数据未上云，手环最新数据至 ${bandTimeStr}。点击尝试同步` : null;

  // 4. 专注块：默认专注段数，点击替换为专注时间
  let focusV1 = `${d.deepBlocks || 0}<u> 段</u>`;
  let focusL1 = "专注块";
  let focusDur = "0m";
  if (d.deepText) focusDur = d.deepText;
  else if (d.deepMin) focusDur = dur(d.deepMin);
  else if (d.focus && d.focus.deepText) focusDur = d.focus.deepText;

/* ===== iOS Segmented Control 胶囊滑块平移动画引擎 (反馈 4) ===== */
function updateSegThumb(segEl, animate = true) {
  if (!segEl) return;
  let thumb = segEl.querySelector(".seg-thumb");
  if (!thumb) {
    thumb = document.createElement("i");
    thumb.className = "seg-thumb";
    thumb.setAttribute("aria-hidden", "true");
    segEl.insertBefore(thumb, segEl.firstChild);
  }
  const activeBtn = segEl.querySelector("button.on");
  if (!activeBtn) return;
  const left = activeBtn.offsetLeft;
  const width = activeBtn.offsetWidth;
  if (!width) {
    requestAnimationFrame(() => updateSegThumb(segEl, false));
    return;
  }
  if (!animate) {
    const prevTrans = thumb.style.transition;
    thumb.style.transition = "none";
    thumb.style.transform = `translateX(${left}px)`;
    thumb.style.width = `${width}px`;
    thumb.style.opacity = "1";
    void thumb.offsetHeight;
    thumb.style.transition = prevTrans;
  } else {
    thumb.style.transform = `translateX(${left}px)`;
    thumb.style.width = `${width}px`;
    thumb.style.opacity = "1";
  }
}

function _getDomKey(node) {
  if (!node || node.nodeType !== 1) return null;
  if (node.id) return `#${node.id}`;
  if (node.dataset && node.dataset.key) return node.dataset.key;
  if (node.dataset && node.dataset.day) return `day:${node.dataset.day}`;
  return null;
}

function _patchAttributes(oldEl, newEl) {
  const oldAttrs = oldEl.attributes;
  const newAttrs = newEl.attributes;

  for (let i = oldAttrs.length - 1; i >= 0; i--) {
    const name = oldAttrs[i].name;
    if (!newEl.hasAttribute(name)) {
      oldEl.removeAttribute(name);
    }
  }

  for (let i = 0; i < newAttrs.length; i++) {
    const name = newAttrs[i].name;
    const value = newAttrs[i].value;
    if (oldEl.getAttribute(name) !== value) {
      oldEl.setAttribute(name, value);
    }
  }

  if (oldEl.tagName === "INPUT" || oldEl.tagName === "TEXTAREA" || oldEl.tagName === "SELECT") {
    if (oldEl !== document.activeElement && newEl.value !== undefined && oldEl.value !== newEl.value) {
      oldEl.value = newEl.value;
    }
  }
  if (oldEl.tagName === "INPUT" && (oldEl.type === "checkbox" || oldEl.type === "radio")) {
    if (oldEl.checked !== newEl.checked) {
      oldEl.checked = newEl.checked;
    }
  }
}

function _patchNode(oldNode, newNode) {
  if (oldNode.nodeType !== newNode.nodeType || oldNode.nodeName !== newNode.nodeName) {
    const clone = newNode.cloneNode(true);
    oldNode.replaceWith(clone);
    return clone;
  }

  if (oldNode.nodeType === 3 || oldNode.nodeType === 8) {
    if (oldNode.nodeValue !== newNode.nodeValue) {
      oldNode.nodeValue = newNode.nodeValue;
    }
    return oldNode;
  }

  if (oldNode.nodeType === 1) {
    _patchAttributes(oldNode, newNode);
    _patchChildren(oldNode, newNode);
    return oldNode;
  }

  return oldNode;
}

function _patchChildren(oldParent, newParent) {
  const oldNodes = Array.from(oldParent.childNodes);
  const newNodes = Array.from(newParent.childNodes);

  const oldKeyMap = new Map();
  oldNodes.forEach((node) => {
    const k = _getDomKey(node);
    if (k) oldKeyMap.set(k, node);
  });

  let newIdx = 0;
  while (newIdx < newNodes.length) {
    const newNode = newNodes[newIdx];
    const currentNode = oldParent.childNodes[newIdx] || null;
    const newKey = _getDomKey(newNode);

    if (newKey) {
      if (oldKeyMap.has(newKey)) {
        const matchedOld = oldKeyMap.get(newKey);
        oldKeyMap.delete(newKey);
        if (matchedOld !== currentNode) {
          oldParent.insertBefore(matchedOld, currentNode);
        }
        _patchNode(matchedOld, newNode);
      } else {
        const clone = newNode.cloneNode(true);
        oldParent.insertBefore(clone, currentNode);
      }
    } else {
      if (currentNode && !_getDomKey(currentNode) && currentNode.nodeType === newNode.nodeType && currentNode.nodeName === newNode.nodeName) {
        _patchNode(currentNode, newNode);
      } else {
        const clone = newNode.cloneNode(true);
        oldParent.insertBefore(clone, currentNode);
      }
    }
    newIdx++;
  }

  while (oldParent.childNodes.length > newNodes.length) {
    oldParent.removeChild(oldParent.lastChild);
  }
}

function updateViewDOM(container, newHTML, isTabSwitch) {
  if (!container) return;

  if (isTabSwitch || !container.firstElementChild) {
    if (typeof clearAllScrubListeners === "function") clearAllScrubListeners();
    container.innerHTML = newHTML;
    return;
  }

  const winScrollY = window.scrollY || document.documentElement.scrollTop;
  const scrollStates = new Map();
  container.querySelectorAll("*").forEach((el) => {
    if (el.scrollLeft > 0 || el.scrollTop > 0) {
      const selector = el.id ? `#${el.id}` : (el.className ? `.${el.className.trim().split(/\s+/).join(".")}` : null);
      if (selector) {
        scrollStates.set(selector, { left: el.scrollLeft, top: el.scrollTop });
      }
    }
  });

  const active = document.activeElement;
  let activeInfo = null;
  if (active && active !== document.body && container.contains(active)) {
    activeInfo = {
      id: active.id || null,
      name: active.getAttribute("name"),
      selectionStart: (active.tagName === "INPUT" || active.tagName === "TEXTAREA") ? active.selectionStart : null,
      selectionEnd: (active.tagName === "INPUT" || active.tagName === "TEXTAREA") ? active.selectionEnd : null,
    };
  }

  try {
    const template = document.createElement("template");
    template.innerHTML = newHTML;
    _patchChildren(container, template.content);
  } catch (diffErr) {
    console.warn("[DOM Diff] 局部更新异常，回退至原生替换:", diffErr);
    container.innerHTML = newHTML;
  }

  if (Math.abs((window.scrollY || document.documentElement.scrollTop) - winScrollY) > 1) {
    window.scrollTo({ top: winScrollY, behavior: "instant" });
  }
  scrollStates.forEach((pos, selector) => {
    const target = container.querySelector(selector);
    if (target) {
      if (pos.left > 0) target.scrollLeft = pos.left;
      if (pos.top > 0) target.scrollTop = pos.top;
    }
  });

  if (activeInfo) {
    let elToFocus = null;
    if (activeInfo.id) {
      try { elToFocus = container.querySelector(`#${CSS.escape(activeInfo.id)}`); } catch (e) {}
    } else if (activeInfo.name) {
      try { elToFocus = container.querySelector(`[name="${CSS.escape(activeInfo.name)}"]`); } catch (e) {}
    }
    if (elToFocus && elToFocus !== document.activeElement) {
      try {
        elToFocus.focus();
        if (activeInfo.selectionStart !== null && activeInfo.selectionEnd !== null && typeof elToFocus.setSelectionRange === "function") {
          elToFocus.setSelectionRange(activeInfo.selectionStart, activeInfo.selectionEnd);
        }
      } catch (e) {}
    }
  }
}

/* ------------------ 足迹视图极速渲染与防竞态会话守卫 ------------------ */
async function renderFootprint(v, traces, isTabSwitch) {
  // ① 入口会话守卫：若用户已切到其他 Tab，立即中断，杜绝竞态覆盖
  if (tab !== "foot") return;

  const weekDays = weekDaysOf(curDay); // 周一起始的 7 天

  let spots = [], hourCells = "", switches = 0, gridRows = "", validColors = null, validKeys = null, cl = null, clColor = null;
  let wTraces = null; // 周视图的 7 天轨迹（日视图为 null）

  if (footView === "week") {
    /* ---------- 周视图：7 行 × 24 列 ---------- */
    // ② 异步拉取周轨迹前守卫
    if (tab !== "foot") return;
    wTraces = MOCK ? weekDays.map((d) => mockTraces(d))
                   : await weekTraces(weekDays);
    // ③ 异步拉取周轨迹后守卫：网络返回后再次校验，若用户切走直接作废
    if (tab !== "foot") return;

    // 全部 7 天的点合起来聚一次类 —— 同一个地点跨 7 天必须是同一个颜色
    const allTr = [];
    wTraces.forEach((ts) => (ts || []).forEach((t) => allTr.push(t)));
    const cl = clusterTraces(allTr, 0.3);
    // 全局匹配拿色（gAt）：一周里同一个地方必须同色 —— 也和日视图同色
    const gAll = cl.map((c) => gAt(c.lat, c.lon));
    const clColor = gAll.map((g) => (g ? placeColor(g.k, g.i) : "#3a4453"));
    validKeys = new Set();
    gAll.forEach((g) => { if (g && g.k) validKeys.add(g.k); });
    // 顶部三个数字里的"停留地点 / 最常待"：周视图按整周算
    spots = cl.slice(0, 6).map((c, i) => ({
      name: gAll[i] ? gAll[i].nm : null,
      guess: guessPlaceName(c),
      color: clColor[i],
      lat: c.lat, lon: c.lon, label: c.n + " 个采样点",
    }));
    // 每天每格取色
    const dayCells = wTraces.map((ts, i) => (weekDays[i] > TODAY ? null
      : hourCellsOf(ts, cl, clColor)));
    validColors = new Set();
    dayCells.forEach((cells) => {
      if (!cells) return;
      colorsInCells(cells).forEach((c) => validColors.add(c));
    });
    const curDayIdx = weekDays.indexOf(curDay);
    const curIdx = curDayIdx >= 0 ? curDayIdx : 4;
    gridRows = weekDays.map((day, i) => {
      const cells = dayCells[i];
      const wd = WD[new Date(day + "T00:00:00Z").getUTCDay()];
      const isCur = (day === curDay);
      const animCls = _footAnim === "d2w" ? " fp-anim-d2w" : "";
      const rowStyle = (isCur && _footAnim === "d2w") ? ` style="--row-idx:${curIdx}"` : "";
      const cls = "fp-grid-row" + (cells === null ? " fp-future" : "")
        + (isCur ? " fp-today" : "") + animCls;
      const inner = cells === null
        ? Array.from({ length: 24 }, () => `<span></span>`).join("")
        : cells.map((c) =>
            `<span style="background:${c.color}"${c.tipHtml ? ` data-tip="${c.tipHtml.replace(/"/g, '&quot;')}"` : ""}></span>`).join("");
      return `<div class="${cls}"${rowStyle}><span class="fp-glab">${wd}</span>`
        + `<div class="fp-gcells">${inner}</div>`
        + `<span class="fp-gd">${day.slice(5)}</span></div>`;
    }).join("");
  } else {
    /* ---------- 日视图 ---------- */
    if (MOCK) {
      const seq = FOOTPRINT[curDay] || [];
      const byPlace = {};
      seq.forEach((s) => { byPlace[s.p] = (byPlace[s.p] || 0) + (s.b - s.a); });
      spots = Object.entries(byPlace).sort((a, b) => b[1] - a[1]).map((pair, i) => ({
        name: pair[0], color: PLACES[pair[0]].c, lat: PLACES[pair[0]].lat, lon: PLACES[pair[0]].lon,
        label: hm(pair[1]),
      }));
      const mc = Array.from({ length: 24 }, (_, h) => {
        const hits = seq.filter((s) => s.a < h + 1 && s.b > h);
        const hitPlaces = [];
        hits.forEach((s) => { if (!hitPlaces.includes(s.p)) hitPlaces.push(s.p); });
        let leadHit = null, maxOverlap = -1;
        for (const s of hits) {
          const overlap = Math.min(h + 1, s.b) - Math.max(h, s.a);
          if (overlap > maxOverlap) { maxOverlap = overlap; leadHit = s; }
        }
        const color = leadHit ? PLACES[leadHit.p].c : "#1a2029";
        const tipHtml = hitPlaces.length > 0
          ? `<div class="fp-tip-places">${hitPlaces.map((p) => `<div class="fp-tip-item">${esc(p)}</div>`).join("")}</div>`
          : "";
        return { color: color, places: hitPlaces, tipHtml: tipHtml };
      });
      hourCells = mc.map((c) =>
        `<span style="background:${c.color}"${c.tipHtml ? ` data-tip="${c.tipHtml.replace(/"/g, '&quot;')}"` : ""}></span>`).join("");
      validColors = colorsInCells(mc);
      switches = Math.max(0, seq.length - 1);
    } else {
      cl = clusterTraces(traces, 0.3); // 300 米内算同一个地点
      const gOf = cl.map((c) => gAt(c.lat, c.lon));
      validKeys = new Set();
      gOf.forEach((g) => { if (g && g.k) validKeys.add(g.k); });
      spots = cl.slice(0, 6).map((c, i) => ({
        name: gOf[i] ? gOf[i].nm : null,
        guess: guessPlaceName(c),
        color: gOf[i] ? placeColor(gOf[i].k, gOf[i].i) : "#3a4453",
        lat: c.lat, lon: c.lon, label: c.n + " 个采样点",
      }));
      clColor = gOf.map((g) => (g ? placeColor(g.k, g.i) : "#3a4453"));
      const cells = hourCellsOf(traces, cl, clColor);
      hourCells = cells.map((c) =>
        `<span style="background:${c.color}"${c.tipHtml ? ` data-tip="${c.tipHtml.replace(/"/g, '&quot;')}"` : ""}></span>`).join("");
      validColors = colorsInCells(cells);
      let s = 0;
      for (let i = 1; i < (traces || []).length; i++) {
        if (distKm(traces[i - 1].lat, traces[i - 1].lon, traces[i].lat, traces[i].lon) > 0.3) s++;
      }
      switches = s;
    }
  }

  const acc = (!MOCK && traces && traces.length) ? Math.round(traces[traces.length - 1].acc) : null;
  const visSpots = (spots || []).filter((s) => !validColors || validColors.has(s.color));
  let switchesShown = switches;
  if (footView === "week") {
    switchesShown = 0;
    (wTraces || []).forEach((ts) => {
      for (let i = 1; i < (ts || []).length; i++) {
        if (distKm(ts[i - 1].lat, ts[i - 1].lon, ts[i].lat, ts[i].lon) > 0.3) switchesShown++;
      }
    });
  }
  const fsw = `<span class="vswitch">${[["day", "日"], ["week", "周"]]
    .map(([k, l]) => `<button class="${footView === k ? "on" : ""}" data-fv="${k}">${l}</button>`).join("")}</span>`;
  const gaxInner = Array.from({ length: 24 }, () => "<i></i>").join("")
    + [0, 6, 12, 18].map((h) =>
        `<b class="${h === 0 ? "beg" : ""}" style="left:${(h / 24 * 100).toFixed(4)}%">${h}</b>`).join("")
    + `<b class="end" style="left:100%">24</b>`;
  const curDayIdx = weekDays.indexOf(curDay);
  const curIdx = curDayIdx >= 0 ? curDayIdx : 4;
  const stripAnimCls = _footAnim === "w2d" ? " fp-anim-w2d" : "";
  const stripStyle = _footAnim === "w2d" ? ` style="--row-idx:${curIdx}"` : "";
  const heatHTML = footView === "week"
    ? `<div class="fp-grid-wrap"><div class="fp-grid">${gridRows}
        <div class="fp-grid-axis"><span class="fp-glab"></span>
          <div class="fp-gax">${gaxInner}</div>
          <span class="fp-gd"></span></div>
      </div></div>`
    : `<div class="fp-grid-wrap fp-day-wrap"><div class="fp-grid">
        <div class="fp-grid-row"><span class="fp-glab"></span>
          <div class="fp-hours fp-strip${stripAnimCls}"${stripStyle}>${hourCells}</div>
          <span class="fp-gd"></span></div>
        <div class="fp-grid-axis"><span class="fp-glab"></span>

/* ★★★ 2026-10-31 修：饮食流水的四个纯函数从 render() 内部 IIFE 提到顶层。
   起因（踩过的坑）：getMealChar / getMealTheme / splitDishIntoItems / estimateSubItemNutrition
   原本定义在 render() 里那段「就餐流水」IIFE 内部，函数声明不出作用域，
   于是 09_modals.js:884 / 1252 的 `typeof splitDishIntoItems === "function"` 恒为 false，
   「编辑餐食按子菜品拆分」「删除多单品里的单项」永远走 fallback —— 功能等于从未生效。
   这四个函数只依赖 Math / 正则 / roundMacro（全局，带 typeof 守卫），没有闭包依赖，
   所以原样搬出来即可，逻辑一行未改。
   ⚠️ 别再把它们塞回 render()/IIFE：一塞回去 09_modals 那两个守卫就又变 false。
   ⚠️ 签名是对外契约：09_modals.js:884 传 (m.dish)；884-886 与 1266 传
      (subItems, kcal, protein, carbs, fat) 共 5 个实参。改参数前先去核对调用方。 */
function getMealChar(mType) {
  if (!mType) return "餐";
  const s = mType.trim();
  if (s.includes("早")) return "早";
  if (s.includes("午")) return "午";
  if (s.includes("晚")) return "晚";
  if (s.includes("夜")) return "夜";
  if (s.includes("加") || s.includes("茶")) return "加";
  return s.charAt(0);
}

function getMealTheme(mc) {
  if (mc === "早") return { color: "var(--soft, #10b981)", bg: "rgba(16,185,129,0.15)" };
  if (mc === "午") return { color: "var(--flow, #38bdf8)", bg: "rgba(56,189,248,0.15)" };
  if (mc === "晚") return { color: "#a855f7", bg: "rgba(168,85,247,0.15)" };
  if (mc === "加") return { color: "var(--warn, #f59e0b)", bg: "rgba(245,158,11,0.15)" };
  if (mc === "夜") return { color: "#ec4899", bg: "rgba(236,72,153,0.15)" };
  return { color: "var(--fg)", bg: "rgba(255,255,255,0.08)" };
}

function splitDishIntoItems(dishStr) {
  if (!dishStr) return [];
  const clean = dishStr.replace(/\(\s*标称精准\)/g, "").replace(/\s*[\(（][^\)）]*[\)）]\s*/g, " ").trim();
  const rawParts = clean.split(/[,，、+＋\n]+|\s{2,}|(?<=[\u4e00-\u9fa5\d])\s+(?=[\u4e00-\u9fa5])/);
  const items = [];
  for (let part of rawParts) {
    part = part.trim();
    if (!part) continue;
    if (part.includes("配") && !part.startsWith("配")) {
      const sub = part.split(/配+/).map(s => s.trim().replace(/^配/, '').trim()).filter(Boolean);
      items.push(...sub);
    } else {
      items.push(part);
    }
  }
  return items.length > 0 ? items : [clean];
}

function estimateSubItemNutrition(subItems, totalKcal, totalP, totalC, totalF) {
  const n = subItems.length;
  if (n <= 1) {
    return [{
      name: subItems[0] || "",
      calories: totalKcal,
      protein: totalP,
      carbs: totalC,
      fat: totalF
    }];
  }

  const items = subItems.map(name => ({ name, cal: 0, p: 0, c: 0, f: 0, fixed: false }));
  let assignedKcal = 0, assignedP = 0, assignedC = 0, assignedF = 0;
  let unassignedCount = n;

  for (const it of items) {
    const s = it.name;
    if (/米饭|白米饭|米白饭|白饭|杂粮饭/.test(s)) {
      const riceKcal = Math.min(Math.round(totalKcal * 0.45), 230);
      it.cal = Math.max(100, riceKcal);
      it.p = Math.min(Math.round(totalP * 0.2), 5);
      it.c = Math.min(Math.round(totalC * 0.65), 50);
      it.f = 1;
      it.fixed = true;
      assignedKcal += it.cal;
      assignedP += it.p;
      assignedC += it.c;
      assignedF += it.f;
      unassignedCount--;
    } else if (/(?:例汤|紫菜蛋汤|清汤|汤)$/.test(s)) {
      it.cal = Math.min(Math.round(totalKcal * 0.08), 45);
      it.p = 2;
      it.c = 3;
      it.f = 2;
      it.fixed = true;
      assignedKcal += it.cal;
      assignedP += it.p;
      assignedC += it.c;
      assignedF += it.f;
      unassignedCount--;
    }
  }

  if (unassignedCount > 0) {
    const remKcal = Math.max(0, totalKcal - assignedKcal);
    const remP = Math.max(0, totalP - assignedP);
    const remC = Math.max(0, totalC - assignedC);
    const remF = Math.max(0, totalF - assignedF);

    let kSum = 0, pSum = 0, cSum = 0, fSum = 0;
    let seen = 0;
    for (const it of items) {
      if (!it.fixed) {
        seen++;
        if (seen === unassignedCount) {
          it.cal = remKcal - kSum;
          it.p = remP - pSum;
          it.c = remC - cSum;
          it.f = remF - fSum;
        } else {
          it.cal = Math.round(remKcal / unassignedCount);
          it.p = Math.round(remP / unassignedCount);
          it.c = Math.round(remC / unassignedCount);
          it.f = Math.round(remF / unassignedCount);
          kSum += it.cal;
          pSum += it.p;
          cSum += it.c;
          fSum += it.f;
        }
      }
    }
  } else {
    const diffK = totalKcal - assignedKcal;
    items[0].cal += diffK;
    items[0].p += (totalP - assignedP);
    items[0].c += (totalC - assignedC);
    items[0].f += (totalF - assignedF);
  }

  return items.map(it => ({
    name: it.name,
    calories: Math.max(0, it.cal),
    protein: Math.max(0, typeof roundMacro === "function" ? roundMacro(it.p) : it.p),
    carbs: Math.max(0, typeof roundMacro === "function" ? roundMacro(it.c) : it.c),
    fat: Math.max(0, typeof roundMacro === "function" ? roundMacro(it.f) : it.f)
  }));
}

/* 「更新于」显示的日期：部署时间 BUILD 的 mm/dd。
   ★ 2026-11-02：这一栏原来直接印 VERSION，而 build.py 从没替换过那个占位符，
     页面上长期是字面量 __STEWARD_VERSION__ —— 用户看到的就是"坏了"。
     现在显示页面内容的时间，完整版本号放进 title，要排查时悬停可见。

   BUILD 有两种形态，必须都认：
     · 本地构建产物：`2026-11-02 16:09`（build.py 按源码 mtime 注入）
     · 线上部署产物：`11-02 16:11`（deploy_tencent.py 发布时改写成 %m-%d %H:%M）
   只认前一种的话，线上永远匹配失败、退回显示版本号。 */
function deployMD() {
  const s = String((typeof BUILD !== "undefined" && BUILD) ? BUILD : "").trim();
  let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);   // 2026-11-02 16:09
  if (m) return m[2] + "/" + m[3];
  m = s.match(/^(\d{2})-(\d{2})/);              // 11-02 16:11
  if (m) return m[1] + "/" + m[2];
  const v = String((typeof VERSION !== "undefined" && VERSION) ? VERSION : "");
  return /^__/.test(v) ? "—" : v;
}

    const calRows = T.map((x) => {

        day: s.day,
        intake: s.intake,
        burn: s.burn,
        bmr: s.bmr,
        active: s.active,
        diff: s.diff,
        recorded: s.recorded

    const calTips = calRows.map((r) => {
      if (!r.recorded) {
        return `<b>${dLabel(r.day)}</b><u>未记录饮食</u>`;
      }
      const stateStr = r.diff < 0 ? `净赤字 -${Math.abs(r.diff)} kcal` : (r.diff > 0 ? `净盈余 +${r.diff} kcal` : `收支持平 0 kcal`);
      return `<b>${dLabel(r.day)}</b><u>${stateStr}</u><i>摄入 ${r.intake} kcal</i><i>消耗 ${r.burn} kcal</i>`;
    });

    const recordedCalRows = calRows.filter(r => r.recorded);
    const avgCalDiff = recordedCalRows.length > 0
      ? Math.round(recordedCalRows.reduce((sum, r) => sum + r.diff, 0) / recordedCalRows.length)
      : 0;
    const avgCalDiffStr = avgCalDiff < 0 ? `均赤字 -${Math.abs(avgCalDiff)} kcal` : (avgCalDiff > 0 ? `均盈余 +${avgCalDiff} kcal` : `持平`);

    let calSummaryTxt = "";
    const curCalRow = calRows.find(r => r.day === curDay) || calRows[calRows.length - 1];
    if (curCalRow && curCalRow.recorded) {

    // ★ 前几天盈亏情况历史流水卡片

            </div>
          `;
        }).join("")}
      </div>
    ` : "";

    const maxCalVal = Math.max.apply(null, recordedCalRows.map(r => Math.abs(r.diff)).concat([500]));
    const calMaxAbs = Math.max(500, Math.ceil(maxCalVal / 100) * 100);
    const stageSum = deep + light + rem;
    const pct = (v) => (stageSum ? Math.round((v / stageSum) * 100) + "%" : "—");
    /* ★ 2026-09-21（用户截图：健康页一整版「0h00 / null bpm / null %」）——

    const isToday = curDay === TODAY;
    // ★ 2026-09-24：小睡也算「有睡眠数据」—— 否则"某天只有小睡"会被误判成没数据。
    const hasSleep = stageSum > 0 || (d.sleepMin || 0) > 0 || d.sleepFrom != null ||

    /* ★ 2026-09-24 小睡（= 无分期的短睡眠，判据见 local_api.api_day）。

  </div>

    </button>
  </div>
</div>`
      : `<div class="empty" style="line-height:1.7">这天没有${what}的手环数据。</div>`);

    // 反馈 8: 运动列表结构化卡片排版
    const renderWorkoutCard = (w) => {
      const line = (typeof workLine === "function") ? workLine(w) : (w.title || String(w));
      if (!line) return "";
      const parts = line.split(/[｜|]/).map((s) => s.trim()).filter(Boolean);
      if (!parts.length) return "";

      let duration = "";
      const durMatch = parts[0].match(/^(.*?)\s*(\d+(?:\.\d+)?\s*(?:分钟|分|h|min|s|秒))(.*)$/);
      if (durMatch) {
        duration = durMatch[2].trim() + (durMatch[3] ? " " + durMatch[3].trim() : "");
      }

      let sportName = (typeof workCN === "function") ? workCN(w) : (durMatch ? durMatch[1].trim() : parts[0]);
      if (!sportName || /[a-zA-Z_]/.test(sportName)) {

      }
      if (!sportName || /[a-zA-Z_]/.test(sportName)) {

    const sleepCardHtml = `

          ${hasSleep ? `

              const avgSleep = poolSleepT.length > 0
                ? Math.round(poolSleepT.reduce((s, x) => s + ((x.sleepMin || 0) + (x.napMin || 0)), 0) / poolSleepT.length)

              return [
                interactiveMetric("m-sleep-tot", hhmm(curSleepTot), napMin > 0 ? "睡眠总时长" : "睡眠时长", `<span style="font-size:18px;letter-spacing:-0.02em">${sDiffStr}</span>`, "较7天均值"),
                interactiveMetric("m-sleep-deep", stageSum ? hhmm(deep) : "—", "深睡 " + pct(deep), pct(deep), (stageSum ? hhmm(deep) : "—") + " 深睡"),
                interactiveMetric("m-sleep-light", stageSum ? hhmm(light) : "—", "浅睡 " + pct(light), pct(light), (stageSum ? hhmm(light) : "—") + " 浅睡"),
                interactiveMetric("m-sleep-rem", stageSum ? hhmm(rem) : "—", "快速眼动 " + pct(rem), pct(rem), (stageSum ? hhmm(rem) : "—") + " REM"),
              ].join("");

              if (napMin > 0) segList.push({ name: "小睡", v: napMin, c: "var(--nap)" });

              return `

                  ${validSegs.map((s, idx) => {

                      <div style="width:${(s.v / totMin * 100).toFixed(2)}%;background:${s.c};height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 3px;box-sizing:border-box;${isLast ? "" : "border-right:1px solid rgba(0,0,0,0.3);"}transition:width 0.3s;position:relative" title="${s.name} ${durVal} (${pctVal}%)">

      ? `<span class="band-cloud-stale-badge" style="display:inline-flex;align-items:center;gap:4px;background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500;margin-left:8px">手机数据未上云 · 最新数据至 ${bandTimeStr}</span>`
      : "";

    const healthHtml = `
      <div class="sec">
        ${secHead("var(--health)", "健康", curDay + bandTxt, staleBadgeHtml)}
        <!-- 能量平衡（卡路里摄入与消耗、就餐流水与补剂） -->

          <div style="margin-bottom:14px;display:flex;align-items:center;flex-wrap:wrap;gap:8px">
            <span style="font-size:12.5px;color:var(--dim);font-weight:600">常用单品:</span>
            ${renderQuickFoodsHtml(d, curDay)}
          </div>

          <!-- 能量收支平衡仪 (TDEE 对冲天平) -->
          ${renderEnergyBalanceHtml(d, curDay)}

          ${(d.diet && d.diet.totalKcal > 0) ? `
          <div class="g4">
            ${(() => {
              const prof = getUserProfile();
              const summary = typeof calculateDayCalorieSummary === "function"
                ? calculateDayCalorieSummary(curDay, d, null, prof)
                : { diff: 0, burn: 0, bmr: 0, active: 0, intake: (d && d.diet && d.diet.totalKcal) || 0, isToday: false };
              const isToday = summary.isToday;
              const kDiff = summary.diff;
              const targetBurn = summary.burn;
              const kDiffStr = kDiff > 0 ? `+${kDiff}<u> kcal</u>` : (kDiff < 0 ? `-${Math.abs(kDiff)}<u> kcal</u>` : `持平`);
              const kDiffLab = isToday

          ${legend}
