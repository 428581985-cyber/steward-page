function closeDietEditModal() {
  dietEditStamp = null;
  dietEditSubIndex = null;
  dietEditAllocated = null;
  const root = document.getElementById("diet-edit-modal-root");
  if (root) root.innerHTML = "";
}

function promptAddNewDishToMeal() {
  const dishName = prompt("请输入要追加的新增单品名称（如：煎蛋、酸奶）：");
  if (!dishName || !dishName.trim()) return;
  const cleanName = dishName.trim();
  const kcalStr = prompt(`请输入「${cleanName}」的大致热量 (kcal，默认 100)：`, "100");
  const cal = Math.max(1, Math.round(Number(kcalStr) || 100));

  if (!dietEditAllocated) {
    const dishEl = document.getElementById("edit-diet-dish");
    const curDish = dishEl ? dishEl.value.trim() : "主菜";
    const calEl = document.getElementById("edit-diet-cal");
    const curCal = calEl ? (Number(calEl.value) || 300) : 300;
    const pEl = document.getElementById("edit-diet-p");
    const cEl = document.getElementById("edit-diet-c");
    const fEl = document.getElementById("edit-diet-f");
    dietEditAllocated = [
      { name: curDish, calories: curCal, protein: Number(pEl ? pEl.value : 0), carbs: Number(cEl ? cEl.value : 0), fat: Number(fEl ? fEl.value : 0) }
    ];
    dietEditSubIndex = 0;
  }

  dietEditAllocated.push({
    name: cleanName,
    calories: cal,
    protein: Math.round(cal * 0.05),
    carbs: Math.round(cal * 0.1),
    fat: Math.round(cal * 0.03)
  });
  if (typeof showToast === "function") showToast(`已追加单品「${cleanName}」，点保存即拆分入库`);
}

async function saveDietEdit() {
  if (!dietEditStamp) return;
  const timeInp = document.getElementById("edit-diet-time");
  const newTime = timeInp ? timeInp.value : null;
  const meal = document.getElementById("edit-diet-meal").value;
  const dish = document.getElementById("edit-diet-dish").value.trim();
  const cal = Number(document.getElementById("edit-diet-cal").value) || 0;
  const priceVal = document.getElementById("edit-diet-price").value.trim();
  const price = priceVal !== "" ? parseFloat(priceVal) : null;
  const p = typeof roundMacro === "function" ? roundMacro(document.getElementById("edit-diet-p").value) : (Number(document.getElementById("edit-diet-p").value) || 0);
  const c = typeof roundMacro === "function" ? roundMacro(document.getElementById("edit-diet-c").value) : (Number(document.getElementById("edit-diet-c").value) || 0);
  const f = typeof roundMacro === "function" ? roundMacro(document.getElementById("edit-diet-f").value) : (Number(document.getElementById("edit-diet-f").value) || 0);

  let newStamp = dietEditStamp;
  let newTimeStr = null;
  if (newTime && /^\d{2}:\d{2}/.test(newTime)) {
    const baseDay = dietEditStamp.includes("T") ? dietEditStamp.split("T")[0] : (CUR_DAY_DATA && CUR_DAY_DATA.day ? CUR_DAY_DATA.day : curDay);
    try {
      const dt = new Date(`${baseDay}T${newTime}:00+08:00`);
      newStamp = !isNaN(dt.getTime()) ? dt.toISOString() : `${baseDay}T${newTime}:00Z`;
    } catch (_) {
      newStamp = `${baseDay}T${newTime}:00Z`;
    }
    newTimeStr = newTime;
  }

  const oldStamp = dietEditStamp;
  const theDay = (CUR_DAY_DATA && CUR_DAY_DATA.day) || curDay;
  const isMultiMode = dietEditAllocated && dietEditAllocated.length > 1;

  if (isMultiMode && dietEditSubIndex != null) {
    // 触发原子化分裂保存：将原复合记录拆分为多条独立记录
    dietEditAllocated[dietEditSubIndex] = {
      name: dish,
      calories: cal,
      protein: p,
      carbs: c,
      fat: f
    };

    const baseMs = new Date(newStamp).getTime();
    const splitItems = dietEditAllocated.map((it, idx) => {
      const itStamp = (idx === 0) ? newStamp : new Date(baseMs - idx * 1000).toISOString();
      const itemUid = "sp_" + Date.now() + "_" + idx + "_" + Math.random().toString(36).slice(2, 8);
      return {
        uid: itemUid,
        stamp: itStamp,
        meal: meal,
        dish: it.name,
        calories: it.calories,
        protein: it.protein,
        carbs: it.carbs,
        fat: it.fat,
        price: (idx === 0 && price != null) ? price : null,
        isMealPrice: idx === 0 && price != null
      };
    });

    // 1. 本地乐观替换原记录为分裂出来的多条单品
    if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals)) {
      CUR_DAY_DATA.diet.meals = CUR_DAY_DATA.diet.meals.filter(x => x.stamp !== oldStamp);
      for (const sit of splitItems) {
        CUR_DAY_DATA.diet.meals.push(sit);
      }
      CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));
      CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.calories || 0), 0);
      CUR_DAY_DATA.diet.macros = {
        protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.protein || 0), 0),
        carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.carbs || 0), 0),
        fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (Number(m.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.fat || 0), 0)
      };
      // 必须写时间戳：normDay 只认 30 秒内的数字，写布尔 true 等于"永久刚改过"，本地旧副本会压死云端
      CUR_DAY_DATA.diet._userModified = Date.now();
      if (typeof markDietModified === "function") markDietModified(theDay);
      if (typeof saveDayDietLocal === "function") saveDayDietLocal(theDay, CUR_DAY_DATA.diet);
      const cc = _dayCache.get(theDay);
      if (cc && cc.data && cc.data.d) {
        cc.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, cc.data);
      }
    }

    closeDietEditModal();
    if (typeof invalidateDayCache === "function") invalidateDayCache(theDay);
    try { await render(); } catch (_) {}

    // 2. 后台原子化分裂入库
    try {
      const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_split", {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          old_stamp: oldStamp,
          day: theDay,
          items: splitItems
        })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (typeof syncDayDietFromCloud === "function") syncDayDietFromCloud(theDay);
    } catch (e) {
      if (typeof showToast === "function") showToast("菜品拆分已存本机，未同步到云端");
    }
    return;
  }

  // 单项常规更新
  const isMealPrice = dietEditBaseNutr ? !!dietEditBaseNutr.isMealPrice : false;
  const note = (dietEditBaseNutr && dietEditBaseNutr.note) || "";

  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals)) {
    const target = CUR_DAY_DATA.diet.meals.find(x => (x.uid && (x.uid === dietEditUid || x.uid === oldStamp)) || x.stamp === oldStamp || (dietEditStamp && x.stamp === dietEditStamp));
    if (target) {
      target.stamp = newStamp;
      if (newTimeStr) target.time = newTimeStr;
      target.meal = meal;
      target.dish = dish;
      target.calories = cal;
      target.price = price;
      target.isMealPrice = isMealPrice;
      target.note = note;
      target.protein = p;
      target.carbs = c;
      target.fat = f;
      if (!target.uid) {
        target.uid = "ed_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      }
      CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));
      CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.calories || 0), 0);
      CUR_DAY_DATA.diet.macros = {
        protein: CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.protein || 0), 0),
        carbs: CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.carbs || 0), 0),
        fat: CUR_DAY_DATA.diet.meals.reduce((sum, m) => sum + (m.fat || 0), 0)
      };
      // 必须写时间戳：normDay 只认 30 秒内的数字，写布尔 true 等于"永久刚改过"，本地旧副本会压死云端
      CUR_DAY_DATA.diet._userModified = Date.now();
      if (typeof markDietModified === "function") markDietModified(theDay);
      if (typeof saveDayDietLocal === "function") saveDayDietLocal(theDay, CUR_DAY_DATA.diet);
      const cc = _dayCache.get(theDay);
      if (cc && cc.data && cc.data.d) {
        cc.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, cc.data);
      }
    }
  }
  closeDietEditModal();
  if (typeof invalidateDayCache === "function") invalidateDayCache(theDay);
  try { await render(); } catch (_) {}

  try {
    const targetItem = (CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals))
      ? CUR_DAY_DATA.diet.meals.find(x => (x.uid && (x.uid === dietEditUid || x.uid === oldStamp)) || x.stamp === newStamp || x.stamp === oldStamp)
      : null;
    const r = await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_edit", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        day: theDay,
        stamp: (dietEditStamp && !dietEditStamp.startsWith("fl_")) ? dietEditStamp : (targetItem && targetItem.stamp ? targetItem.stamp : oldStamp),
        new_stamp: (newStamp !== oldStamp && newStamp !== dietEditStamp) ? newStamp : undefined,
        meal: meal,
        dish: dish,
        calories: cal,
        price: price,
        is_meal_price: isMealPrice,
        note: note,
        protein: p,
        carbs: c,
        fat: f,
        uid: (targetItem && targetItem.uid) || dietEditUid || undefined
      }),
      keepalive: true
    });
    const jj = await r.json().catch(() => null);
    if (!r.ok || (jj && jj.ok === false)) throw new Error((jj && jj.error) || ("HTTP " + r.status));
    if (typeof syncDayDietFromCloud === "function") syncDayDietFromCloud(theDay);
  } catch (e) {
    if (typeof showToast === "function") showToast("修改已存本机，未同步到云端");
  }
}

async function commitPendingDietDelete() {
  if (!window._pendingDietUndo) return;
  const pending = window._pendingDietUndo;
  window._pendingDietUndo = null;
  if (pending.timer) {
    clearTimeout(pending.timer);
    pending.timer = null;
  }
  if (pending.toastEl) {
    pending.toastEl.classList.add("toast-exit");
    const el = pending.toastEl;
    setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 200);
  }
  if (typeof pending.commit === "function") {
    try {
      await pending.commit();
    } catch (e) {
      // 提交在途删除请求容错
    }
  }
}
window.commitPendingDietDelete = commitPendingDietDelete;

if (typeof window !== "undefined" && typeof window.addEventListener === "function" && !window._dietUndoUnloadBound) {
  window._dietUndoUnloadBound = true;
  window.addEventListener("beforeunload", () => {
    if (window._pendingDietUndo && typeof window._pendingDietUndo.commit === "function") {
      window._pendingDietUndo.commit();
      window._pendingDietUndo = null;
    }
  });
}

async function deleteDietItem(stamp, subIndex = null) {
  const theDay = (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day) ? CUR_DAY_DATA.day : curDay;

  const targetMs = new Date(stamp).getTime();
  const m = (CUR_DAY_DATA && CUR_DAY_DATA.diet && Array.isArray(CUR_DAY_DATA.diet.meals))
    ? CUR_DAY_DATA.diet.meals.find(x => (x.uid && x.uid === stamp) || x.stamp === stamp || (!isNaN(targetMs) && new Date(x.stamp).getTime() === targetMs))
    : null;

  if (!m) {
    return;
  }

  const subItems = (typeof splitDishIntoItems === "function") ? splitDishIntoItems(m.dish) : [];

  // 保存删除前的完整餐次快照以备撤回
  const prevMeals = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet.meals));
  const prevTotalKcal = CUR_DAY_DATA.diet.totalKcal;
  const prevMacros = CUR_DAY_DATA.diet.macros ? JSON.parse(JSON.stringify(CUR_DAY_DATA.diet.macros)) : null;
  const prevUserModified = CUR_DAY_DATA.diet._userModified;

  let dishDisplayName = "";
  let commitFn = null;
  let restoreFn = null;

  if (subIndex != null && subItems.length > 1 && typeof estimateSubItemNutrition === "function") {
    // 场景 A：多单品中的单项删除
    const allocated = estimateSubItemNutrition(subItems, m.calories || 0, m.protein || 0, m.carbs || 0, m.fat || 0);
    const targetSub = allocated[subIndex];
    dishDisplayName = targetSub ? targetSub.name : "菜品";

    const remaining = allocated.filter((_, idx) => idx !== subIndex);
    const baseMs = new Date(m.stamp || stamp).getTime();
    const splitItems = remaining.map((it, idx) => ({
      stamp: (idx === 0) ? (m.stamp || stamp) : new Date(baseMs - idx * 1000).toISOString(),
      meal: m.meal,
      dish: it.name,
      calories: it.calories,
      protein: it.protein,
      carbs: it.carbs,
      fat: it.fat,
      price: (idx === 0 && m.price != null) ? m.price : null,
      isMealPrice: idx === 0 && m.price != null
    }));

    CUR_DAY_DATA.diet.meals = CUR_DAY_DATA.diet.meals.filter(x => x.stamp !== (m.stamp || stamp));
    for (const sit of splitItems) CUR_DAY_DATA.diet.meals.push(sit);
    CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));

    commitFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_split", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ old_stamp: m.stamp || stamp, day: theDay, items: splitItems })
        });
      } catch (e) {
        // 后台分裂删除同步容错
      }
    };

    restoreFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_split", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ old_stamp: m.stamp || stamp, day: theDay, items: prevMeals.filter(x => x.meal === m.meal) })
        });
      } catch (e) {
        // 撤回恢复同步容错
      }
    };
  } else {
    // 场景 B：整条就餐记录删除
    dishDisplayName = m.dish || "饮食记录";

    CUR_DAY_DATA.diet.meals = CUR_DAY_DATA.diet.meals.filter(x => {
      if (m.uid && x.uid) return x.uid !== m.uid;
      if (x === m) return false;
      if (x.stamp === stamp || x.stamp === m.stamp) return false;
      if (!isNaN(targetMs) && new Date(x.stamp).getTime() === targetMs) return false;
      return true;
    });

    commitFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=diet_del", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ stamp: m.stamp || stamp, day: theDay })
        });
      } catch (e) {
        // 后台删除请求容错
      }
    };

    restoreFn = async () => {
      try {
        await fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=quick_food_log", {
          method: "POST",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: JSON.stringify({
            day: theDay,
            stamp: m.stamp || stamp,
            dish: m.dish,
            calories: m.calories,
            price: m.price,
            protein: m.protein,
            carbs: m.carbs,
            fat: m.fat,
            meal: m.meal,
            idempotency_key: "undo_" + Date.now(),
            uid: m.uid || ("undo_" + Date.now())
          })
        });
      } catch (e) {
        // 后台撤回恢复请求容错
      }
    };
  }

  // 乐观更新宏量营养素与总热量
  CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.calories || 0), 0);
  CUR_DAY_DATA.diet.macros = {
    protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (Number(x.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.protein || 0), 0),
    carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (Number(x.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.carbs || 0), 0),
    fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (Number(x.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((sum, x) => sum + (x.fat || 0), 0)
  };
  CUR_DAY_DATA.diet._userModified = Date.now();
  const cleanD = (typeof dedupDietObj === "function") ? dedupDietObj(CUR_DAY_DATA.diet) : CUR_DAY_DATA.diet;
  CUR_DAY_DATA.diet = cleanD;

  if (typeof markDietModified === "function") markDietModified(theDay);
  saveDayDietLocal(theDay, cleanD);
  const c = (typeof _dayCache !== "undefined" && _dayCache) ? _dayCache.get(theDay) : null;
  if (c && c.data && c.data.d) {
    c.data.d.diet = JSON.parse(JSON.stringify(cleanD));
    if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, c.data);
  } else if (typeof _dayCache !== "undefined" && _dayCache && typeof _dayCache.set === "function") {
    _dayCache.set(theDay, { data: { ok: true, d: { diet: JSON.parse(JSON.stringify(cleanD)) } }, ts: Date.now() });
  }

  // 立即刷新列表（0ms 命中 _dayCache 内存瞬时重绘，菜品立刻消失）
  await render();

  // 异步在途发起删除请求而不阻塞 UI，撤回浮窗立即可见；撤回时 rollbackFn 会 await commitPromise
  const commitPromise = (typeof commitFn === "function")
    ? Promise.resolve().then(commitFn).catch(() => {})
    : Promise.resolve();

  // 创建 5 秒撤回 Toast 浮窗
  const oldToast = document.getElementById("diet-undo-toast");
  if (oldToast && oldToast.parentNode) oldToast.parentNode.removeChild(oldToast);

  const toast = document.createElement("div");
  toast.id = "diet-undo-toast";
  toast.setAttribute("role", "alert");
  toast.setAttribute("aria-live", "assertive");

  const cleanName = (typeof esc === "function") ? esc(dishDisplayName) : dishDisplayName;
  toast.innerHTML = `
    <div class="diet-toast-msg-wrap">
      <span class="diet-toast-msg-text">已删除「<b>${cleanName}</b>」</span>
    </div>
    <button type="button" class="diet-toast-undo-btn" id="diet-undo-btn">撤回</button>
    <div class="toast-progress-bar"></div>
  `;
  document.body.appendChild(toast);

  // 撤回恢复函数
  const rollbackFn = async () => {
    if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.diet) {
      CUR_DAY_DATA.diet.meals = prevMeals;
      CUR_DAY_DATA.diet.totalKcal = prevTotalKcal;
      CUR_DAY_DATA.diet.macros = prevMacros;
      CUR_DAY_DATA.diet._userModified = Date.now();
      saveDayDietLocal(theDay, CUR_DAY_DATA.diet);
      const cacheObj = (typeof _dayCache !== "undefined" && _dayCache) ? _dayCache.get(theDay) : null;
      if (cacheObj && cacheObj.data && cacheObj.data.d) {
        cacheObj.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(theDay, cacheObj.data);
      }
    }
    await render();
    if (typeof restoreFn === "function") {
      // 等那条删除请求落地再恢复，否则晚到的 diet_del 会把刚恢复的记录又删一次
      await commitPromise;
      await restoreFn();
    }
  };

  const timer = setTimeout(() => {
    if (window._pendingDietUndo && window._pendingDietUndo.timer === timer) {
      window._pendingDietUndo = null;
      if (toast && toast.parentNode) {
        toast.classList.add("toast-exit");
        setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
      }
    }
  }, 5000);

  window._pendingDietUndo = {
    timer: timer,
    toastEl: toast,
    theDay: theDay,
    dishName: dishDisplayName,
    rollback: rollbackFn,
    // 指向已经发出的那条删除请求：commitPendingDietDelete / beforeunload 靠它兜底，
    // 指向同一个 promise 也保证不会重复发一次 diet_del
    commit: () => commitPromise
  };

  const undoBtn = toast.querySelector("#diet-undo-btn");
  if (undoBtn) {
    undoBtn.onclick = async (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      if (!window._pendingDietUndo) return;
      clearTimeout(window._pendingDietUndo.timer);
      window._pendingDietUndo = null;
      toast.classList.add("toast-exit");
      setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
      // 本地回滚为同步操作，网络恢复在后台静默执行，提示立即可见
      rollbackFn().catch(() => {});
      if (typeof showToast === "function") showToast(`已撤回删除「${dishDisplayName}」`);
    };
  }
}

function _mealAddDefaultMeal(day) {
  const today = (typeof TODAY !== "undefined" && TODAY)
    ? TODAY
    : new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  if (day !== today) return "午餐";
  const h = new Date().getHours();
  // 时段划分：4-11 早餐 / 11-16 午餐 / 16-21 晚餐 / 其余夜宵
  if (h < 11) return "早餐";
  if (h < 16) return "午餐";
  if (h < 21) return "晚餐";
  return "夜宵";
}

function applyQuickFoodToMealAdd(idx) {
  const list = (typeof getEffectiveQuickFoods === "function") ? (getEffectiveQuickFoods(CUR_DAY_DATA) || []) : [];
  const q = list[idx];
  if (!q) return;
  const dishEl = document.getElementById("meal-add-dish");
  const calEl = document.getElementById("meal-add-cal");
  const pEl = document.getElementById("meal-add-p");
  const cEl = document.getElementById("meal-add-c");
  const fEl = document.getElementById("meal-add-f");
  const priceEl = document.getElementById("meal-add-price");
  if (dishEl) dishEl.value = `${q.name}${q.spec ? ` (${q.spec})` : ""}`;
  if (calEl) calEl.value = q.calories || 0;
  if (pEl) pEl.value = q.protein || 0;
  if (cEl) cEl.value = q.carbs || 0;
  if (fEl) fEl.value = q.fat || 0;
  if (priceEl) priceEl.value = (q.price != null && !isNaN(q.price)) ? q.price : "";
}

function closeMealAddModal() {

async function saveMealAdd() {
  const day = (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA && CUR_DAY_DATA.day) ? CUR_DAY_DATA.day : curDay;
  const dishEl = document.getElementById("meal-add-dish");
  const mealEl = document.getElementById("meal-add-meal");
  const timeEl = document.getElementById("meal-add-time");
  const calEl = document.getElementById("meal-add-cal");
  const priceEl = document.getElementById("meal-add-price");
  const pEl = document.getElementById("meal-add-p");
  const cEl = document.getElementById("meal-add-c");
  const fEl = document.getElementById("meal-add-f");
  if (!dishEl || !mealEl || !timeEl || !calEl) return;

  const dish = dishEl.value.trim();
  if (!dish) {
    if (typeof showToast === "function") showToast("先写一下吃了什么");
    try { dishEl.focus(); } catch (_) {}
    return;
  }
  const cal = Math.round(Number(calEl.value) || 0);
  if (cal <= 0) {
    if (typeof showToast === "function") showToast("热量填一个大概的数");
    try { calEl.focus(); } catch (_) {}
    return;
  }
  const meal = mealEl.value || "加餐";
  const timeStr = /^\d{2}:\d{2}$/.test(timeEl.value) ? timeEl.value : "12:00";
  const priceVal = priceEl ? String(priceEl.value).trim() : "";
  const price = priceVal !== "" ? parseFloat(priceVal) : null;
  const p = Math.round(Number(pEl.value) || 0);
  const c = Math.round(Number(cEl.value) || 0);
  const f = Math.round(Number(fEl.value) || 0);

  // 时间戳按北京时间落在**当前查看的那一天**（补记历史同样成立）
  const stamp = `${day}T${timeStr}:00+08:00`;

  const saveBtn = document.getElementById("meal-add-save");
  if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = "0.6"; }

  if (typeof invalidateDayCache === "function") invalidateDayCache(day);

  const uniqueUid = "ma_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);

  // 1. 本地乐观更新（0ms 出结果，断网也不丢）
  if (typeof CUR_DAY_DATA !== "undefined" && CUR_DAY_DATA) {
    if (!CUR_DAY_DATA.diet) CUR_DAY_DATA.diet = { totalKcal: 0, macros: { protein: 0, carbs: 0, fat: 0 }, meals: [], supplements: [] };
    if (!Array.isArray(CUR_DAY_DATA.diet.meals)) CUR_DAY_DATA.diet.meals = [];
    if (!CUR_DAY_DATA.diet.macros) CUR_DAY_DATA.diet.macros = { protein: 0, carbs: 0, fat: 0 };
    CUR_DAY_DATA.diet.meals.push({
      uid: uniqueUid,
      stamp: stamp,
      time: timeStr,
      meal: meal,
      dish: dish,
      calories: cal,
      protein: p,
      carbs: c,
      fat: f,
      price: price
    });
    CUR_DAY_DATA.diet.meals.sort((a, b) => String(b.stamp || "").localeCompare(String(a.stamp || "")));
    CUR_DAY_DATA.diet.totalKcal = CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.calories || 0), 0);
    CUR_DAY_DATA.diet.macros = {
      protein: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (Number(m.protein) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.protein || 0), 0),
      carbs: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (Number(m.carbs) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.carbs || 0), 0),
      fat: typeof roundMacro === "function" ? roundMacro(CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (Number(m.fat) || 0), 0)) : CUR_DAY_DATA.diet.meals.reduce((s, m) => s + (m.fat || 0), 0)
    };
    CUR_DAY_DATA.diet._userModified = Date.now();
    if (typeof markDietModified === "function") markDietModified(day);
    if (typeof saveDayDietLocal === "function") saveDayDietLocal(day, CUR_DAY_DATA.diet);

    // 同步刷新当日缓存与开屏快照，确保 render() 渲染最新数据
    try {
      const c = _dayCache.get(day);
      if (c && c.data && c.data.d) {
        c.data.d.diet = JSON.parse(JSON.stringify(CUR_DAY_DATA.diet));
        if (typeof saveBootSnapshot === "function") saveBootSnapshot(day, c.data);
      }
    } catch (_) {}

    if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full)) {
      const tidx = TREND.full.indexOf(day);
      if (tidx >= 0 && Array.isArray(TREND.dietKcal)) TREND.dietKcal[tidx] = CUR_DAY_DATA.diet.totalKcal;
    }
  }

  closeMealAddModal();
  if (typeof showToast === "function") showToast(`已补记 ${meal}：${dish}`);
  try { await render(); } catch (_) {}

  // 2. 后台上报（复用 quick_food_log，meal 显式传，不让服务端按"现在几点"猜；携带幂等键防重）
  const payload = JSON.stringify({
    day: day,
    stamp: stamp,
    meal: meal,
    dish: dish,
    calories: cal,
    price: price,
    protein: p,
    carbs: c,
    fat: f,
    idempotency_key: uniqueUid,
    uid: uniqueUid
  });

  const postMeal = () => fetch(BASE + "/?k=" + encodeURIComponent(KEY) + "&api=quick_food_log", {
    method: "POST",
    headers: { "Content-Type": "text/plain; charset=utf-8" },
    body: payload
  });

  try {
    let r;
    try {
      r = await postMeal();
    } catch (netErr) {
      // 首次上报遭遇网络故障，在幂等键保护下静默安全重试 1 次
      await new Promise(res => setTimeout(res, 800));
      r = await postMeal();
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (typeof invalidateDayCache === "function") invalidateDayCache(day);
    if (typeof syncDayDietFromCloud === "function") syncDayDietFromCloud(day);
  } catch (e) {
    if (typeof showToast === "function") showToast("已存本机，未同步到云端");
  }
}

function closeExportModal() {
  exportModalOpen = false;
  const root = document.getElementById("export-modal-root");
  if (root) root.innerHTML = "";
}

function setExportDatePreset(preset) {
  exportModalPreset = preset;
  const today = (typeof TODAY !== "undefined" && TODAY) 
    ? TODAY 
    : (curDay || new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10));
  exportModalEndDate = today;

  if (preset === "7days") {
    exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 6 * 86400e3).toISOString().slice(0, 10);
  } else if (preset === "30days") {
    exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 29 * 86400e3).toISOString().slice(0, 10);
  } else if (preset === "90days") {
    exportModalStartDate = new Date(new Date(today + "T00:00:00Z").getTime() - 89 * 86400e3).toISOString().slice(0, 10);
  } else if (preset === "month") {
    exportModalStartDate = today.slice(0, 7) + "-01";
  } else if (preset === "all") {
    let earliest = "";
    if (typeof TREND !== "undefined" && TREND && Array.isArray(TREND.full) && TREND.full.length > 0) {
      earliest = TREND.full[0];
    }
    if (!earliest) {
      earliest = new Date(new Date(today + "T00:00:00Z").getTime() - 180 * 86400e3).toISOString().slice(0, 10);
    }
    exportModalStartDate = earliest;
  }

  const sEl = document.getElementById("export-modal-start");
  const eEl = document.getElementById("export-modal-end");
  if (sEl) sEl.value = exportModalStartDate;
  if (eEl) eEl.value = exportModalEndDate;

  const presets = ["all", "7days", "30days", "90days", "month"];
  presets.forEach(p => {
    const btn = document.getElementById(`export-preset-${p}`);
    if (btn) {
      const active = p === preset;
      btn.style.background = active ? "rgba(56,189,248,0.14)" : "rgba(255,255,255,0.035)";
      btn.style.borderColor = active ? "rgba(56,189,248,0.4)" : "rgba(255,255,255,0.08)";
      btn.style.color = active ? "#38bdf8" : "var(--dim)";
      btn.style.fontWeight = active ? "600" : "normal";
    }
  });

  updateExportDateHint();
}

function onExportDateChange() {
  const sEl = document.getElementById("export-modal-start");
  const eEl = document.getElementById("export-modal-end");
  if (sEl) exportModalStartDate = sEl.value;
  if (eEl) exportModalEndDate = eEl.value;
  exportModalPreset = "custom";

  const presets = ["all", "7days", "30days", "90days", "month"];
  presets.forEach(p => {
    const btn = document.getElementById(`export-preset-${p}`);
    if (btn) {
      btn.style.background = "rgba(255,255,255,0.035)";
      btn.style.borderColor = "rgba(255,255,255,0.08)";
      btn.style.color = "var(--dim)";
      btn.style.fontWeight = "normal";
    }
  });

  updateExportDateHint();
}

function updateExportDateHint() {
  const hintEl = document.getElementById("export-modal-range-hint");
  if (!hintEl) return;
  if (!exportModalStartDate || !exportModalEndDate) {
    hintEl.textContent = "请选择起止日期";
    hintEl.style.color = "var(--dim2)";
    return;
  }
  if (exportModalStartDate > exportModalEndDate) {
    hintEl.textContent = "起始日期不能晚于截止日期";
    hintEl.style.color = "var(--alert, #f87171)";
    return;
  }
  const s = new Date(exportModalStartDate + "T00:00:00Z");
  const e = new Date(exportModalEndDate + "T00:00:00Z");
  const days = Math.round((e.getTime() - s.getTime()) / 86400e3) + 1;
  hintEl.textContent = `已选 ${days} 天 (${exportModalStartDate} 至 ${exportModalEndDate})`;
  hintEl.style.color = "var(--dim)";
}

async function triggerModalExport(type) {
  const sEl = document.getElementById("export-modal-start");
  const eEl = document.getElementById("export-modal-end");
  const start = sEl ? sEl.value : exportModalStartDate;
  const end = eEl ? eEl.value : exportModalEndDate;

  if (!start || !end) {
    showToast("请选择起止日期");
    return;
  }
  if (start > end) {
    showToast("起始日期不能晚于截止日期");
    return;
  }

  const btn = document.getElementById(`export-act-btn-${type}`);
  const oldText = btn ? btn.innerHTML : "";
  if (btn) {
    btn.disabled = true;
    btn.style.opacity = "0.7";
    btn.innerHTML = `<span style="font-size:11px">导出中…</span>`;
  }

  try {
    if (type === "json") {
      await exportFullBackupJSON(start, end);
    } else if (type === "diet") {
      await exportDietCSV(start, end);
    } else if (type === "biometrics") {
      await exportBiometricsCSV(start, end);
    } else if (type === "timeline") {
      await exportTimelineCSV(start, end);
    } else if (type === "all") {
      showToast("开始多格式流水导出…");
      await exportFullBackupJSON(start, end);
      await new Promise(r => setTimeout(r, 600));
      await exportDietCSV(start, end);
      await new Promise(r => setTimeout(r, 600));
      await exportBiometricsCSV(start, end);
      await new Promise(r => setTimeout(r, 600));
      await exportTimelineCSV(start, end);
      showToast("全部格式数据导出完成");
    }
  } catch (err) {
    showToast("导出失败: " + (err.message || err));
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.innerHTML = oldText;
    }
  }
}

function showTimelineUnderDetail(item) {
  if (!item) return;
  let root = document.getElementById("timeline-detail-modal-root");

    root = document.createElement("div");
    root.id = "timeline-detail-modal-root";

  let bodyHtml = "";
  const formatHourMin = (hFloat) => {
    if (hFloat == null || isNaN(hFloat)) return "--:--";
    const totalMin = Math.round(Number(hFloat) * 60);
    const mWrap = ((totalMin % 1440) + 1440) % 1440;
    const hh = String(Math.floor(mWrap / 60)).padStart(2, "0");
    const mm = String(mWrap % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  };

  const durStr = (mins) => {
    const m = Math.round(mins || 0);
    const h = Math.floor(m / 60);
    const rem = m % 60;
    if (h > 0 && rem > 0) return `${h}h ${rem}m`;
    if (h > 0) return `${h}h`;
    return `${rem}m`;
  };

  if (item.type === "sleep") {
    const isNap = !!item.isNap;
    const title = isNap ? "小睡记录" : "睡眠分期与详情";
    const fromStr = formatHourMin(item.from);
    const toStr = formatHourMin(item.to);
    const durationMin = item.min || 0;
    const dayData = item.dayData || {};

      const deepMin = dayData.deep || 0;
      const lightMin = dayData.light || 0;
      const remMin = dayData.rem || 0;
      const awakeMin = dayData.awakeMin || 0;
      const tot = (deepMin + lightMin + remMin) || durationMin || 1;
      stages = [
        { label: "深睡眠", min: deepMin, pct: Math.round((deepMin / tot) * 100), color: "#3b82f6" },
        { label: "浅睡眠", min: lightMin, pct: Math.round((lightMin / tot) * 100), color: "#60a5fa" },
        { label: "快速眼动", min: remMin, pct: Math.round((remMin / tot) * 100), color: "#a855f7" },
        { label: "清醒状态", min: awakeMin, pct: Math.round((awakeMin / tot) * 100), color: "#64748b" },
      ];
    }

    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(44,75,176,0.15);border:1px solid rgba(96,165,250,0.25);border-radius:12px">

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

        ${!isNap && stages.length ? `
          <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 14px">
            <div style="font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:10px">睡眠分期分布与占比</div>

              ${stages.filter(st => st.pct > 0 && st.min > 0).map(st => `<div style="width:${st.pct}%;background:${st.color};border-radius:2px" title="${st.label}: ${durStr(st.min)} (${st.pct}%)"></div>`).join("")}
            </div>
            <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:10px">
              ${stages.map(st => `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="width:7px;height:7px;border-radius:50%;background:${st.color}"></span>
                    <span style="color:var(--dim)">${st.label}</span>
                  </div>
                  <span style="color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums">${durStr(st.min)} <em style="font-style:normal;font-size:10.5px;color:var(--dim2)">(${st.pct}%)</em></span>
                </div>
              `).join("")}
            </div>
          </div>
        ` : ""}
      </div>
    `;
  } else if (item.type === "workout") {
    const w = item.w || {};
    const fromStr = formatHourMin(item.from);
    const toStr = formatHourMin(item.to);
    const sec = item.sec || (w.sec || 0);
    const durM = Math.round(sec / 60) || (w.min || 0);
    const day = item.day || "";
    const fullLine = (typeof workLine === "function" ? workLine(w) : "") || "";

    // 1. 运动项目标题动态提取与中文化门禁
    let candidateName = w.name || w.sport_name || w.sport_type || w.workout_type || w.title || w.t || item.title || item.name || item.sport_name || "";
    if (typeof candidateName === "string") {
      candidateName = candidateName.split(/[｜|]/)[0].trim();
      candidateName = candidateName.replace(/\s*\d+\s*(?:分钟|分|mins?|m)?$/i, "").trim();
    }
    let woTitle = (typeof workCN === "function") ? workCN(w) : "";
    if (!woTitle || woTitle === "运动") {
      if (candidateName && typeof translateActivityName === "function") {
        const trans = translateActivityName(candidateName);

    // 2. 活跃消耗热量提取
    let kcal = (typeof w.kcal === "number" && w.kcal > 0) ? w.kcal : ((typeof w.calories === "number" && w.calories > 0) ? w.calories : 0);
    if (!kcal && typeof fullLine === "string") {
      const mk = fullLine.match(/(\d+)\s*kcal/i);

    // 3. 记录明细正向提取：只要心率和里程（如果有的话），彻底消除运动名称、时长与卡路里冗余
    let extractedDist = (w.km != null && Number(w.km) > 0)

    if (!extractedDist && typeof fullLine === "string") {

    } else if (typeof fullLine === "string") {

    }

    let cleanDetailParts = [];
    if (extractedDist) cleanDetailParts.push(extractedDist);

    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(61,214,140,0.12);border:1px solid rgba(61,214,140,0.25);border-radius:12px">
          <div style="width:36px;height:36px;border-radius:10px;background:rgba(61,214,140,0.2);display:flex;align-items:center;justify-content:center;color:#3dd68c;flex:none">
            <!-- 动感矢量高精细跑步者图标 (1.8px 描边, 瑞士国际主义风格, Zero-Emoji) -->

              <circle cx="13" cy="4" r="1"/>

              <path d="M15 21l0-4-4-3 1-6"/>
              <path d="M7 12l3-3 3 1 3 3 3 1"/>
            </svg>
          </div>
          <div style="min-width:0;flex:1">
            <div style="font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-0.2px">${esc(woTitle)}</div>
            <div class="tl-modal-time-sub" style="font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;margin-top:2px">${day ? `${day} · ` : ""}${fromStr} – ${toStr}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:800;color:#3dd68c;font-variant-numeric:tabular-nums">${durStr(durM)}</div>
            <div style="font-size:10.5px;color:var(--dim2)">活动时长</div>
          </div>
        </div>

        <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 14px">
          <div style="font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:10px">运动指标汇总</div>
          <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:10px">
            <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:10px">
              <div style="font-size:11px;color:var(--dim2)">活跃消耗</div>
              <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;color:var(--fg);margin-top:4px;font-variant-numeric:tabular-nums">${kcal > 0 ? `${kcal} <span style="font-size:12px;font-weight:600;color:var(--dim);letter-spacing:0">kcal</span>` : `<span style="font-size:14px;font-weight:600;color:var(--dim)">手环测算中</span>`}</div>
            </div>
            <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:10px">
              <div style="font-size:11px;color:var(--dim2)">记录明细</div>
              <div style="font-size:12.5px;font-weight:500;color:var(--soft);margin-top:4px">${esc(cleanDetail)}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  } else if (item.type === "course") {
    const c = item.course || {};
    const fromStr = formatHourMin(c.from);
    const toStr = formatHourMin(c.to);
    const day = item.day || "";
    const courseName = c.name || "深圳大学课程";
    const loc = c.loc || "教学楼教室";
    const teacher = c.teacher || "任课教师";
    const desc = c.desc || "";

    bodyHtml = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.25);border-radius:12px">
          <div style="width:36px;height:36px;border-radius:10px;background:rgba(168,85,247,0.2);display:flex;align-items:center;justify-content:center;color:#c084fc;flex:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <div style="min-width:0;flex:1">
            <div style="font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-0.2px">${esc(courseName)}</div>
            <div class="tl-modal-time-sub" style="font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;margin-top:2px">${day ? `${day} · ` : ""}${fromStr} – ${toStr}</div>
          </div>
          ${desc ? `
            <div style="text-align:right">
              <span style="display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(168,85,247,0.2);color:#e9d5ff;font-size:11px;font-weight:600">${esc(desc)}</span>
            </div>
          ` : ""}
        </div>

        <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 14px">
          <div style="font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:10px">日程安排与教室位置</div>
          <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:10px">
            <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:10px">
              <div style="font-size:11px;color:var(--dim2)">教室地点</div>
              <div style="font-size:14px;font-weight:600;color:var(--fg);margin-top:3px">${esc(loc)}</div>
            </div>
            <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:10px">
              <div style="font-size:11px;color:var(--dim2)">授课教师</div>
              <div style="font-size:14px;font-weight:600;color:var(--fg);margin-top:3px">${esc(teacher)}</div>
            </div>

        </div>
      </div>
    `;
  }

  root.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(4,6,9,0.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)" onclick="if(event.target===this)closeTimelineUnderModal()">
      <div style="background:var(--panel-surface, #121721);border:1px solid rgba(255,255,255,0.12);border-radius:18px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.1);padding:18px 20px;display:flex;flex-direction:column;gap:14px" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:13px;font-weight:600;color:var(--dim);letter-spacing:0.3px;text-transform:uppercase">日程详情</div>
          <button onclick="closeTimelineUnderModal()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--dim);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all 0.15s" title="关闭">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        ${bodyHtml}
      </div>
    </div>
  `;
}

window.showTimelineUnderDetail = showTimelineUnderDetail;
window.closeTimelineUnderModal = closeTimelineUnderModal;

/* ---------------- 足迹地点命名模态框 (Zero-Emoji Policy) ---------------- */
function openPlaceNameModal({ lat, lon, oldName = "", guess = "" } = {}) {
  let root = document.getElementById("place-name-modal-root");
  if (!root) {
    root = document.createElement("div");
    root.id = "place-name-modal-root";
    document.body.appendChild(root);
  }

  const isRename = !!oldName && oldName.indexOf("未知位置") !== 0 && oldName.indexOf("未命名") !== 0;
  const prefill = isRename ? oldName : (guess && guess !== "其他地点" ? guess : (oldName || ""));
  const quickTags = ["宿舍", "教学楼", "图书馆", "食堂", "健身房"];

  root.innerHTML = `
    <div class="pnm-overlay" style="position:fixed;inset:0;background:rgba(4,6,9,0.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)">
      <div style="background:var(--panel-surface, #121721);border:1px solid rgba(255,255,255,0.12);border-radius:18px;width:100%;max-width:390px;box-shadow:0 24px 64px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.1);padding:20px;display:flex;flex-direction:column;gap:14px;color:var(--fg, #fafafa);box-sizing:border-box" onclick="event.stopPropagation()">
        
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:30px;height:30px;border-radius:8px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);display:flex;align-items:center;justify-content:center;color:#38bdf8;flex:none">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <div>
              <div style="font-size:15px;font-weight:600;color:var(--fg, #fafafa);letter-spacing:-0.2px">地点命名</div>
            </div>
          </div>
          <button class="pnm-close-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--dim,#9ca3af);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all 0.15s" title="取消">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div style="font-size:12px;color:var(--dim2, #71717a);line-height:1.5">
          为该坐标经纬度绑定自定义名称，热力图与足迹将同步更新
        </div>

        <div style="display:flex;flex-direction:column;gap:8px">
          <input type="text" class="pnm-input" maxlength="20" value="${esc(prefill)}" placeholder="输入地点名称，如：宿舍 / 教学楼" autocomplete="off" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:9px 12px;color:var(--fg, #fafafa);font-size:13.5px;outline:none;font-family:inherit;transition:border-color 0.15s" />
          
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">
            <span style="font-size:11px;color:var(--dim2, #71717a)">常用候选：</span>
            ${quickTags.map((tag) => `
              <button type="button" class="pnm-tag-btn" data-tag="${esc(tag)}" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--dim, #a1a1aa);cursor:pointer;transition:all 0.15s;font-family:inherit">${esc(tag)}</button>
            `).join("")}
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)">
          <button type="button" class="pnm-cancel-btn" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 14px;color:var(--dim, #a1a1aa);font-size:12.5px;cursor:pointer;font-family:inherit">取消</button>
          <button type="button" class="pnm-submit-btn" style="background:#2563eb;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:7px 16px;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(37,99,235,0.3)">确认保存</button>
        </div>

      </div>
    </div>
  `;

  const input = root.querySelector(".pnm-input");
  const overlay = root.querySelector(".pnm-overlay");
  const closeBtn = root.querySelector(".pnm-close-btn");
  const cancelBtn = root.querySelector(".pnm-cancel-btn");
  const submitBtn = root.querySelector(".pnm-submit-btn");

  const close = () => {
    root.innerHTML = "";
  };

  const submit = async () => {
    const name = (input.value || "").trim();
    if (!name) {
      if (typeof showToast === "function") showToast("请输入有效的地点名称");
      return;
    }
    close();

    const latNum = Number(lat), lonNum = Number(lon);

    // 1. 查找并继承未命名簇原生属性，剔除未知点并更新 localStorage
    if (typeof PLACE_MEM !== "undefined") {
      const unkIdx = (PLACE_MEM.unknown || []).findIndex((u) => typeof distKm === "function" && distKm(u.lat, u.lon, latNum, lonNum) <= 0.3);
      const unkItem = unkIdx >= 0 ? PLACE_MEM.unknown[unkIdx] : null;
      PLACE_MEM.unknown = (PLACE_MEM.unknown || []).filter((u) => typeof distKm === "function" ? distKm(u.lat, u.lon, latNum, lonNum) > 0.3 : true);

      // 2. 颜色规则继承
      const oldKey = isRename ? placeKeyN(oldName) : (typeof placeKeyC === "function" ? placeKeyC(latNum, lonNum) : "");
      const newKey = typeof placeKeyN === "function" ? placeKeyN(name) : name;
      if (typeof RULES !== "undefined" && RULES && RULES.placeColors && RULES.placeColors[oldKey]) {
        RULES.placeColors[newKey] = RULES.placeColors[oldKey];
      }

      // 3. 乐观更新 named 列表
      const namedList = (PLACE_MEM.named || []).slice();
      const existIdx = namedList.findIndex((m) => m.name === name || (isRename && m.name === oldName) || (typeof distKm === "function" && distKm(m.lat, m.lon, latNum, lonNum) <= 0.3));
      const newNamedObj = {
        name: name,
        lat: latNum,
        lon: lonNum,
        n: (existIdx >= 0 && namedList[existIdx].n) || (unkItem && unkItem.n) || 1,
        first: (existIdx >= 0 && namedList[existIdx].first) || (unkItem && unkItem.first) || null,
        last: (existIdx >= 0 && namedList[existIdx].last) || (unkItem && unkItem.last) || null,
      };
      if (existIdx >= 0) namedList[existIdx] = newNamedObj;
      else namedList.push(newNamedObj);
      PLACE_MEM.named = namedList;
      if (typeof _palSig !== "undefined") _palSig = null;

      try {
        if (typeof PLACES_LS !== "undefined") localStorage.setItem(PLACES_LS, JSON.stringify(PLACE_MEM));
      } catch (e) {}
    }

    // 4. 立即重绘界面与吐司提示
    if (typeof render === "function") render();
    if (typeof showToast === "function") showToast("地点已命名为 " + name);

    // 5. 后台异步上传
    if (typeof savePlace === "function") {
      try {
        await savePlace(name, latNum, lonNum);
      } catch (e) {
        // 地点持久化后台同步容错
      }
    }
  };

  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  closeBtn.onclick = close;
  cancelBtn.onclick = close;
  submitBtn.onclick = submit;

  root.querySelectorAll(".pnm-tag-btn").forEach((tagBtn) => {
    tagBtn.onclick = () => {
      input.value = tagBtn.dataset.tag || "";
      input.focus();
    };
  });

  input.onfocus = () => { input.style.borderColor = "var(--soft, #38bdf8)"; };
  input.onblur = () => { input.style.borderColor = "rgba(255,255,255,0.16)"; };
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Escape") { e.preventDefault(); close(); }
  };

  setTimeout(() => {
    input.focus();
    input.select();
  }, 20);
}

window.openPlaceNameModal = openPlaceNameModal;

/* ---------------- 投色子随机换色全局能力 (Zero-Emoji Policy) ---------------- */
function rollDicePlaceColor(key) {
  if (!key) return null;
  const curColor = typeof placeColor === "function" ? placeColor(key) : null;
  const nextColor = typeof getRandomColor === "function" ? getRandomColor(curColor) : "#38bdf8";
  if (!RULES.placeColors) RULES.placeColors = {};
  RULES.placeColors[key] = nextColor;
  if (typeof _palSig !== "undefined") _palSig = null;
  if (typeof saveRules === "function") saveRules();
  if (typeof showToast === "function") showToast("已投色更新地点配色为 " + nextColor);
  if (typeof render === "function") render();
  return nextColor;
}
window.rollDicePlaceColor = rollDicePlaceColor;

function openColorDiceModal({
  type = "cat",
  key = "",
  name = "",
  title = "修改配色",
  iconSvg = "",
  getCurrentColor = () => "#38bdf8",
  onApplyColor = () => {},
} = {}) {
  let root = document.getElementById("color-dice-modal-root");
  if (!root) {
    root = document.createElement("div");
    root.id = "color-dice-modal-root";
    document.body.appendChild(root);
  }

  let currentColor = (getCurrentColor() || "#38bdf8").toLowerCase();

  const palette = (typeof CURATED_PALETTE !== "undefined" && Array.isArray(CURATED_PALETTE))
    ? CURATED_PALETTE
    : [
        "#38bdf8", "#34d399", "#a855f7", "#fb923c", "#f59e0b", "#f43f5e",
        "#818cf8", "#2dd4bf", "#60a5fa", "#4ade80", "#c084fc", "#f472b6",
        "#22d3ee", "#e879f9", "#f87171", "#fbbf24", "#a3e635", "#14b8a6",

    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2z"/></svg>`;

  root.innerHTML = `
    <div class="cdm-overlay" style="position:fixed;inset:0;background:rgba(4,6,9,0.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)">
      <div style="background:var(--panel-surface, #121721);border:1px solid rgba(255,255,255,0.12);border-radius:18px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.1);padding:20px;display:flex;flex-direction:column;gap:15px;color:var(--fg, #fafafa);box-sizing:border-box" onclick="event.stopPropagation()">
        
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:30px;height:30px;border-radius:8px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);display:flex;align-items:center;justify-content:center;color:#38bdf8;flex:none">
              ${iconSvg || defaultIcon}
            </div>
            <div>
              <div style="font-size:15px;font-weight:600;color:var(--fg, #fafafa);letter-spacing:-0.2px">${esc(title)}</div>
            </div>
          </div>
          <button type="button" class="cdm-close-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--dim,#9ca3af);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all 0.15s" title="关闭">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div style="font-size:12px;color:var(--dim2, #71717a);display:flex;align-items:center;gap:6px">
          <span>当前目标：</span>
          <span style="color:var(--fg, #fafafa);font-weight:600;background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08)">${esc(name || key)}</span>
        </div>

        <!-- 当前配色大卡片预览 -->
        <div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px 14px">
          <div class="cdm-dot-preview" style="width:44px;height:44px;border-radius:50%;background:${currentColor};box-shadow:0 0 18px ${currentColor}55;border:2px solid rgba(255,255,255,0.22);flex:none;transition:all 0.25s"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="font-size:11px;color:var(--dim2, #71717a)">当前配色</div>
            <div class="cdm-hex-label" style="font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:14px;font-weight:600;color:var(--fg, #fafafa);letter-spacing:0.5px">${currentColor}</div>
          </div>
        </div>

        <!-- 优雅大号「投掷新颜色」按钮 -->
        <button type="button" class="cdm-roll-btn" style="background:#2563eb;border:1px solid rgba(255,255,255,0.18);border-radius:10px;padding:10px 16px;color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.35);transition:all 0.15s;font-family:inherit">
          <span class="cdm-dice-icon" style="display:inline-flex;align-items:center;transition:transform 0.25s">
            ${typeof diceSvgHtml === "function" ? diceSvgHtml(16) : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>`}
          </span>
          <span>投掷新颜色</span>
        </button>

        <!-- 调色板快速点选 -->
        <div>
          <div style="font-size:11px;color:var(--dim2, #71717a);margin-bottom:8px">或直接点选预设质感配色：</div>
          <div class="cdm-palette-grid" style="display:grid;grid-template-columns:repeat(8, 1fr);gap:7px">
            ${palette.map((hex) => {
              const isSel = hex.toLowerCase() === currentColor;
              const bShadow = isSel ? ("0 0 8px " + hex) : "none";
              const bScale = isSel ? "scale(1.15)" : "scale(1)";
              const bBorder = isSel ? "2px solid #fff" : "1px solid rgba(255,255,255,0.18)";
              return '<button type="button" class="cdm-swatch" data-hex="' + hex + '" style="width:100%;aspect-ratio:1;border-radius:50%;background:' + hex + ';border:' + bBorder + ';box-shadow:' + bShadow + ';cursor:pointer;padding:0;outline:none;transition:all 0.15s;transform:' + bScale + '" title="' + hex + '"></button>';
            }).join("")}
          </div>
        </div>

        <!-- 底部完成栏 -->
        <div style="display:flex;justify-content:flex-end;margin-top:2px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)">
          <button type="button" class="cdm-finish-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:7px 18px;color:var(--fg, #fafafa);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s">完成</button>
        </div>

      </div>
    </div>
  `;

  const overlay = root.querySelector(".cdm-overlay");
  const closeBtn = root.querySelector(".cdm-close-btn");
  const finishBtn = root.querySelector(".cdm-finish-btn");
  const rollBtn = root.querySelector(".cdm-roll-btn");
  const diceIcon = root.querySelector(".cdm-dice-icon");
  const previewDot = root.querySelector(".cdm-dot-preview");
  const hexLabel = root.querySelector(".cdm-hex-label");
  const swatches = root.querySelectorAll(".cdm-swatch");

  const updateUI = (newHex) => {
    currentColor = newHex.toLowerCase();
    if (previewDot) {
      previewDot.style.background = currentColor;
      previewDot.style.boxShadow = "0 0 18px " + currentColor + "55";
    }
    if (hexLabel) {
      hexLabel.textContent = currentColor;
    }
    swatches.forEach((sw) => {
      const isSel = sw.dataset.hex.toLowerCase() === currentColor;
      sw.style.border = isSel ? "2px solid #fff" : "1px solid rgba(255,255,255,0.18)";
      sw.style.boxShadow = isSel ? "0 0 8px " + currentColor : "none";
      sw.style.transform = isSel ? "scale(1.15)" : "scale(1)";
    });
  };

  const applyColor = async (newHex) => {
    updateUI(newHex);
    try {
      await onApplyColor(newHex);
    } catch (e) {
      // 换色回调异常容错
    }
  };

  rollBtn.onclick = () => {
    if (diceIcon) {
      diceIcon.style.transform = "rotate(180deg) scale(1.2)";
      setTimeout(() => { if (diceIcon) diceIcon.style.transform = "rotate(0deg) scale(1)"; }, 250);
    }
    const next = typeof getRandomColor === "function" ? getRandomColor(currentColor) : palette[Math.floor(Math.random() * palette.length)];
    applyColor(next);
  };

  swatches.forEach((sw) => {
    sw.onclick = () => {
      const hex = sw.dataset.hex;
      if (hex) applyColor(hex);
    };
  });

  const close = () => {
    window.removeEventListener("keydown", onKeyDown);
    root.innerHTML = "";
  };

  const onKeyDown = (e) => {
    if (e.key === "Escape" || e.key === "Enter") {
      e.preventDefault();
      close();
    }
  };
  window.addEventListener("keydown", onKeyDown);

  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  closeBtn.onclick = close;
  finishBtn.onclick = close;
}

function openPlaceColorDiceModal(key, name) {

    getCurrentColor: () => (typeof placeColor === "function" ? placeColor(key) : "#38bdf8"),
