          if (!isNaN(ms) && ms > t) t = ms;
        }
        return t;
      };
      const tA = getScore(a);
      const tB = getScore(b);
      if (tA !== tB) return tB - tA;
      return (b.sec || 0) - (a.sec || 0);

  // 反馈 13, 14, 16: 移除 3 处冗余 em 提示文案

          <span>${esc(c)}</span>
        </span>
        ${c === "其他" ? "" : `<button class="cdel" data-d="${esc(c)}"
          title="删掉「${esc(c)}」，它下面的事件归入「其他」">×</button>`}
      </span>`;
      }).join("")}
      <button class="cadd" id="catadd">+ 新增类别</button>
    </div>
    <div class="cap" style="margin-top:2px"><span><b>应用分类</b></span></div>
    <div class="cat-bar">
      <input type="text" id="catq" placeholder="搜应用名…" value="${esc(catQuery || "")}">
      <span class="cnt">显示 ${rows.length} / ${all.length}</span>
    </div>`}
    <div class="cat-list" id="catlist">
      ${rows.length ? rows.map((x) => {
        const cat = catOf(x.key);
        const off = isNoise(x.key);
        const custom = RULES.cats[x.key] || ruleLookup(RULES.cats, x.key);
        return `<div class="cat-row ${off ? "off" : ""}" data-key="${esc(x.key)}">
          <div class="nm">${esc(x.key)}
            <i>${x.only ? "还没在数据里出现过，改了也先存着"
                        : `${esc(x.src)} · ${dur(x.sec / 60)} · ${x.n} 条`}${custom ? " · 自定义" : ""}</i></div>
          <select data-k="${esc(x.key)}" title="类别">
            ${allCats().map((c) => `<option value="${c}" ${c === cat ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <div class="sw"><button data-h="${esc(x.key)}" class="${off ? "" : "on"}"

/* 某天的使用段（真假模式统一入口） */
function sessOf(day) {
  if (MOCK) return WEEK_SESS[day] || null;
  return (SESS && SESS.sessions && SESS.sessions[day]) || null;
}

const _dayCache = new Map(); // day -> { data, ts }
const _inFlightDays = new Map(); // day -> Promise<data>
const _revalidatingDays = new Set();
const BOOT_SNAP_KEY = "steward.snapshot.v2";

// 启动时从 sessionStorage 预防水合历史已读日期（保持会话期 0ms 命中）
function hydrateDayCacheFromSession() {
  try {
    if (typeof sessionStorage === "undefined") return;
    for (let i = 0; i < sessionStorage.length; i++) {
      const k = sessionStorage.key(i);
      if (k && k.startsWith("steward_day_")) {
        const d = k.slice(12);
        const raw = sessionStorage.getItem(k);
        if (raw) {
          const parsed = JSON.parse(raw);
          // 缓存时间戳解析：使用真实写入时间戳，旧版本格式默认 ts=0 触发后台异步重验
          let data = parsed, ts = 0;
          if (parsed && parsed.data && typeof parsed.ts === "number") {
            data = parsed.data;
            ts = parsed.ts;
          }
          if (data && !_dayCache.has(d)) {
            _dayCache.set(d, { data: data, ts: ts });
          }
        }
      }
    }
  } catch (e) {}
}
hydrateDayCacheFromSession();

function cacheDayData(day, data) {
  if (!day || !data) return;
  const ts = Date.now();
  _dayCache.set(day, { data: data, ts: ts });
  try {
    if (typeof sessionStorage !== "undefined") {
      // 存真实时间戳，刷新后才能判断"是不是该重验了"（见 hydrateDayCacheFromSession 的说明）
      sessionStorage.setItem("steward_day_" + day, JSON.stringify({ data: data, ts: ts }));
    }
  } catch (e) {}
}

/* =========================================================
   StewardIDB: 本地时序大仓库封装 (IndexedDB)
   - 数据库名：steward_idb_v1，表：days (key: day)
   - 异步非阻塞读写，容量达数百 MB，彻底解决 localStorage 5MB 上限与主线程卡顿
   - 优雅降级：若环境禁用/不支持 IDB，透明回退至 localStorage
   ========================================================= */
const StewardIDB = {
  dbName: "steward_idb_v1",
  storeName: "days",
  _db: null,

  async getDB() {
    if (this._db) return this._db;
    if (typeof indexedDB === "undefined") return null;
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(this.dbName, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(this.storeName)) {
            db.createObjectStore(this.storeName, { keyPath: "day" });
          }
        };
        req.onsuccess = (e) => {
          this._db = e.target.result;
          resolve(this._db);
        };
        req.onerror = () => resolve(null);
      } catch (err) {
        resolve(null);
      }
    });
  },

  async get(day) {
    if (!day) return null;
    try {
      const db = await this.getDB();
      if (!db) {
        // 优雅降级回退至 localStorage
        if (typeof localStorage !== "undefined") {
          const raw = localStorage.getItem(HIST_CACHE_PREFIX + day);
          return raw ? JSON.parse(raw) : null;
        }
        return null;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readonly");
          const store = tx.objectStore(this.storeName);
          const req = store.get(day);
          req.onsuccess = () => {
            const res = req.result;
            resolve(res ? (res.data || res) : null);
          };
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    } catch (e) {
      return null;
    }
  },

  /* 读取缓存记录对象，返回包含数据本体与写入时间戳的 { data, ts } 结构 */
  async getRecord(day) {
    if (!day) return null;
    try {
      const db = await this.getDB();
      if (!db) {
        // 优雅降级：localStorage 里存的是裸 JSON（没有 ts）→ ts 记 0，按「过期」处理
        if (typeof localStorage !== "undefined") {
          const raw = localStorage.getItem(HIST_CACHE_PREFIX + day);
          return raw ? { data: JSON.parse(raw), ts: 0 } : null;
        }
        return null;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readonly");
          const store = tx.objectStore(this.storeName);
          const req = store.get(day);
          req.onsuccess = () => {
            const res = req.result;
            if (!res) return resolve(null);
            resolve({
              data: res.data || res,
              ts: typeof res.ts === "number" ? res.ts : 0,   // 老记录没有 ts → 0，自然过期
            });
          };
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    } catch (e) {
      return null;
    }
  },

  async set(day, data) {
    if (!day || !data) return false;
    try {
      const db = await this.getDB();
      if (!db) {
        // 优雅降级回退至 localStorage
        if (typeof localStorage !== "undefined" && typeof saveHistoricalDayCache === "function") {
          saveHistoricalDayCache(day, data);
        }
        return false;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readwrite");
          const store = tx.objectStore(this.storeName);
          const record = { day: day, data: data, ts: Date.now() };
          const req = store.put(record);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    } catch (e) {
      return false;
    }
  },

  async delete(day) {
    if (!day) return false;
    try {
      const db = await this.getDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readwrite");
          const store = tx.objectStore(this.storeName);
          const req = store.delete(day);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    } catch (e) {
      return false;
    }
  },

  async clear() {
    try {
      const db = await this.getDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction([this.storeName], "readwrite");
          const store = tx.objectStore(this.storeName);
          const req = store.clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    } catch (e) {
      return false;
    }
  }
};
if (typeof window !== "undefined") {
  window.StewardIDB = StewardIDB;
}

const HIST_CACHE_PREFIX = "steward.cache.day.";
const HIST_CACHE_MAX_DAYS = 30;

function saveHistoricalDayCache(day, jsonObj) {
  if (!day || !jsonObj) return;
  try {
    if (typeof localStorage === "undefined") return;
    localStorage.setItem(HIST_CACHE_PREFIX + day, JSON.stringify(jsonObj));

    // LRU 清理：收集所有 steward.cache.day. 开头的键，保留最近 30 天，其余淘汰
    const dayKeys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(HIST_CACHE_PREFIX)) {
        dayKeys.push(k.slice(HIST_CACHE_PREFIX.length));
      }
    }
    if (dayKeys.length > HIST_CACHE_MAX_DAYS) {
      dayKeys.sort(); // 升序，最旧的在前面
      const removeCount = dayKeys.length - HIST_CACHE_MAX_DAYS;
      for (let i = 0; i < removeCount; i++) {
        localStorage.removeItem(HIST_CACHE_PREFIX + dayKeys[i]);
      }
    }
  } catch (e) {}
}

function invalidateDayCache(targetDay) {
  if (!targetDay) return;
  if (typeof _dayCache !== "undefined" && _dayCache) {
    _dayCache.delete(targetDay);
  }
  if (typeof StewardIDB !== "undefined" && StewardIDB && StewardIDB.delete) {
    StewardIDB.delete(targetDay).catch(() => {});
  }
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.removeItem(HIST_CACHE_PREFIX + targetDay);
    }
    if (typeof sessionStorage !== "undefined") {
      sessionStorage.removeItem("steward_day_" + targetDay);
    }
  } catch (e) {}
}
if (typeof window !== "undefined") {
  window.invalidateDayCache = invalidateDayCache;
}

function hasCachedDay(day) {
  if (MOCK) return true;
  return _dayCache.has(day);
}

function prefetchDay(day) {
  if (!day || MOCK || SHARE) return;
  if (_dayCache.has(day) || _inFlightDays.has(day)) return;
  getDay(day, false).catch(() => {});
}

/* 核心：预加载目标日期的相邻日期（前一天、后一天） */
function prefetchAdjacentDays(targetDay) {
  if (!targetDay || !Array.isArray(DAYS) || !DAYS.length || MOCK || SHARE) return;
  const idx = DAYS.indexOf(targetDay);
  if (idx === -1) return;

  const toFetch = [];
  // 前一天（历史方向）
  if (idx > 0) toFetch.push(DAYS[idx - 1]);
  // 后一天（未来方向）
  if (idx < DAYS.length - 1) toFetch.push(DAYS[idx + 1]);

  const runner = () => {
    toFetch.forEach(d => prefetchDay(d));
  };
  if (typeof requestIdleCallback === "function") {
    requestIdleCallback(runner, { timeout: 2500 });
  } else {
    setTimeout(runner, 250);
  }
}

function saveBootSnapshot(day, dayData) {
  try {
    if (!day || !dayData) return;
    // 仅针对当天保存启动快照，避免被预加载的历史日期覆盖冷启动入口
    if (typeof TODAY !== "undefined" && day !== TODAY) return;
    const snap = {
      day: day,
      dayData: dayData,
      trend: TREND,
      ts: Date.now()
    };
    localStorage.setItem(BOOT_SNAP_KEY, JSON.stringify(snap));
  } catch (e) {}
}

function loadBootSnapshot() {
  try {
    const raw = localStorage.getItem(BOOT_SNAP_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

async function bgRevalidateDay(day) {
  if (_revalidatingDays.has(day) || MOCK) return;
  _revalidatingDays.add(day);
  try {
    // forceFresh：绕开 IDB 与静态首屏，直接问云端 —— 否则会读到同一份旧快照，白跑一圈
    const res = await fetchDayData(day, { forceFresh: true });
    if (res) {
      cacheDayData(day, res);
      if (day === TODAY) saveBootSnapshot(day, res);
      if (curDay === day) {
        CUR_DAY_DATA = res.d;
        render();
      }
    }
  } catch (e) {
  } finally {
    _revalidatingDays.delete(day);
  }
}

async function getDay(day, force = false) {
  if (MOCK) {
    const i = DAYS.indexOf(day);
    return {
      d: MOCK_DAYS[i] || MOCK_DAYS[MOCK_DAYS.length - 1],
      ses: SESSIONS[day] || null, notes: MOCK_NOTES[day] || null,
      flow: MOCK_FLOW[day] || null, notifies: NOTIFIES[day] || null,
      report: MOCK_REPORT[day] || null, traces: null,
    };
  }

  // 1. 优先命中本地内存缓存：0ms 直出
  const cached = _dayCache.get(day);
  const now = Date.now();
  if (cached && !force) {
    const yest = (typeof YESTERDAY !== "undefined" && YESTERDAY)
      ? YESTERDAY
      : (typeof DAYS !== "undefined" && Array.isArray(DAYS) && DAYS.length >= 2)
        ? DAYS[DAYS.length - 2]
        : new Date(Date.now() + 8 * 3600e3 - 86400e3).toISOString().slice(0, 10);
    /* SWR 策略：缓存过期后台静默重验（历史日 TTL 6 小时，当天 90 秒） */
    const HISTORY_TTL = 6 * 3600e3;
    if ((day === TODAY && (now - cached.ts > 90000)) ||
        day === yest ||
        (now - cached.ts > HISTORY_TTL)) {
      bgRevalidateDay(day);
    }
    // 如果切到首页且是历史日期之前没拉过 report，后台静默拉取 report 并补齐
    if (tab === "home" && day !== TODAY && !cached.data.report && !SHARE) {
      fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "report", d: day }), { cache: "no-store" })
        .then(r => r.ok ? r.json() : null)
        .then(j2 => {
          if (j2 && j2.report && j2.report.body) {
            cached.data.report = j2.report;
            if (tab === "home" && curDay === day) render();
          }
        }).catch(() => {});
    }
    return cached.data;
  }

  // 2. 复用后台预加载或正在进行的请求，防止重复发包
  if (_inFlightDays.has(day)) {
    return _inFlightDays.get(day);
  }

  const p = (async () => {
    try {
      const res = await fetchDayData(day, force ? { forceFresh: true } : {});
      cacheDayData(day, res);
      if (day === TODAY) saveBootSnapshot(day, res);
      return res;
    } finally {
      _inFlightDays.delete(day);
    }
  })();

  _inFlightDays.set(day, p);
  return p;
}

async function fetchDayData(day, opt = {}) {
  // P2/P3 缓存体系：严格收窄绝对不可变缓存范围至 2 天前（day < YESTERDAY）
  // 昨天（day === YESTERDAY）晚间可能新增运动或睡眠，绝不可完全阻断向云端校验：
  // 1. 若带 opt.forceFresh，无条件击穿本地 IDB 与内存缓存，直取云端最新数据；
  // 2. 若不带 opt.forceFresh 且本地命中 IDB，先以缓存秒开直出，同时在后台静默发起一次云端重验（SWR），
  //    彻底消除前日晚间新增运动（如乒乓球、跑步）被旧快照死锁的问题。
  const yest = (typeof YESTERDAY !== "undefined" && YESTERDAY)
    ? YESTERDAY
    : (typeof DAYS !== "undefined" && Array.isArray(DAYS) && DAYS.length >= 2)
      ? DAYS[DAYS.length - 2]
      : new Date(Date.now() + 8 * 3600e3 - 86400e3).toISOString().slice(0, 10);
  const isImmutableHistory = Boolean(day && yest && day < yest);
  const isYesterday = Boolean(day && yest && day === yest);

  if (!opt.forceFresh) {
    try {
      /* 命中 IDB 时带出真实写入时间戳，用于 TTL 过期校验 */
      let cachedJson = null, idbTs = 0;
      if (typeof StewardIDB !== "undefined" && StewardIDB.get) {
        if (typeof StewardIDB.getRecord === "function") {
          const rec = await StewardIDB.getRecord(day);
          if (rec) { cachedJson = rec.data; idbTs = rec.ts || 0; }
        } else {
          cachedJson = await StewardIDB.get(day);
        }
      }
      if (cachedJson && typeof cachedJson === "object") {
        const dObj = cachedJson.d ? cachedJson.d : (typeof normDay === "function" ? normDay(cachedJson) : cachedJson);
        const resData = {
          d: dObj,
          ses: cachedJson.ses || cachedJson.sessions || null,
          notes: cachedJson.notes || null,
          flow: cachedJson.flow || null,
          notifies: (cachedJson.notifies || []).filter((n) => typeof isNoise === "function" ? !isNoise(n.app) : true),
          report: cachedJson.report || null,
          traces: cachedJson.traces || [],
        };
        _dayCache.set(day, { data: resData, ts: idbTs });

        // 缓存重验策略：历史日、昨日或当天缓存过期（>90s）时触发后台静默重验
        const isToday = Boolean(day && typeof TODAY !== "undefined" && day === TODAY);
        const staleToday = isToday && (Date.now() - idbTs > 90000);
        if ((isYesterday || isImmutableHistory || staleToday) &&
            typeof bgRevalidateDay === "function" && !_revalidatingDays.has(day)) {
          setTimeout(() => bgRevalidateDay(day), 50);
        }

        return resData;
      }
    } catch (e) {}
  }

  const q = new URLSearchParams({ k: KEY, api: "day", d: day });
  const needReport = SHARE || (tab === "home" && day !== TODAY);
  const pReport = !needReport ? null
    : SHARE
      ? apiGet(new URLSearchParams({ k: KEY, api: "report", d: day })).catch(() => null)
      : fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "report", d: day }), { cache: "no-store" })
          .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // 当天实时饮食流水需与云端对齐；历史日期饮食已固化在静态数据中
  const pDiet = (SHARE || day !== TODAY) ? null
    : fetch(BASE + "/?" + new URLSearchParams({ k: KEY, api: "diet", d: day }), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null)).catch(() => null);

  // 三级降级策略：静态文件极速出首屏 -> 云端实时 API 对齐 -> 本地快照兜底
  let j = null;
  let seededFromStatic = false;
  if (!opt.forceFresh && typeof USE_STATIC !== "undefined" && USE_STATIC && typeof STATIC_BASE !== "undefined" && STATIC_BASE) {
    try {
      const rs = await Promise.race([
        fetch(STATIC_BASE + "/day/" + day + ".json", { cache: "default" }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("静态首屏 2.5s 未返回")), 2500)),
      ]);
      if (rs && rs.ok) {
        j = await rs.json();
        seededFromStatic = true;
      }
    } catch (e) {}
  }
  if (!j) {
    try {
      j = await Promise.race([
        apiGet(q, opt),
        new Promise((_, rej) => setTimeout(() => rej(new Error("day 读取超时 12000ms")), 12000)),
      ]);
    } catch (err) {}
  }
  if (!j && STATIC_BASE) {
    try {
      const r = await fetch(STATIC_BASE + "/day/" + day + ".json", { cache: "default" });
      if (r.ok) {
        j = await r.json();
      }
    } catch (e) {}
  }
  if (!j) {
    const cached = _dayCache.get(day);
    if (cached && cached.data) return cached.data;
    const snap = loadBootSnapshot();
    if (snap && snap.d && (!snap.d.day || snap.d.day === day)) return snap;
    throw new Error("day 取数失败（云端、静态层与本地均不可用）");
  }
  if (j.error) throw new Error(j.error);

  // 成功获取数据后异步存入 IDB 时序大仓库，若环境不支持透明回退至 localStorage
  if (typeof StewardIDB !== "undefined" && StewardIDB.set) {
    StewardIDB.set(day, j).catch(() => {});
  }
  if (isImmutableHistory) {
    saveHistoricalDayCache(day, j);
  }

  let stored = null;
  if (pReport) {
    try {
      // 竞态 250ms：若日报已就绪则一起带回，若迟滞则转入后台静默补齐，绝不拖累主数据秒级呈现
      const j2 = await Promise.race([
        pReport,
        new Promise(resolve => setTimeout(() => resolve(null), 250))
      ]);
      if (j2 && j2.report && j2.report.body) {
        stored = j2.report;
      } else {
        // 后台静默等待其到达并补充挂载至缓存
        pReport.then(rj => {
          if (rj && rj.report && rj.report.body) {
            const entry = _dayCache.get(day);
            if (entry && entry.data) {
              entry.data.report = rj.report;
              if (curDay === day && tab === "home" && typeof render === "function") render();
            }
          }
        }).catch(() => {});
      }
    } catch (e) { /* 没有已存日报是正常情况 */ }
  }

  const dObj = normDay(j);
  if (pDiet) {
    try {
      const jd = await Promise.race([
        pDiet,
        new Promise(resolve => setTimeout(() => resolve(null), 250))

      sleeps: (curObj && curObj.sleeps) || [],
      workouts: (curObj && curObj.workouts) || [],
      wake: (curObj && curObj.wake) || null,
    });
  }

  // 连续自然日对齐（终点锚定在 curDay，往前严格回溯 n-1 天，确保即使数据断档也能稳定输出 n 个格位）
  const rowMap = new Map();
  rows.forEach((r) => rowMap.set(r.day, r));

  const endDay = curDay || todayKey;
  const res = [];
  const baseTime = new Date(endDay + "T12:00:00Z").getTime();
  for (let i = n - 1; i >= 0; i--) {
    const dStr = new Date(baseTime - i * 86400000).toISOString().slice(0, 10);
    if (rowMap.has(dStr)) {
      res.push(rowMap.get(dStr));
    } else {
      res.push({
        day: dStr,
        wk: (typeof isHolidayDay === "function" ? isHolidayDay(dStr) : ([0, 6].indexOf(new Date(dStr + "T00:00:00Z").getUTCDay()) >= 0)),
        sleepMin: 0,
        napMin: 0,
        awakeMin: 0,
        deep: 0,
        light: 0,
        rem: 0,
        pcMin: 0,
        steps: 0,
        notify: 0,
        resting: 0,
        dietKcal: 0,
        activeBurn: 0,
        sleepFrom: null,
        sleepTo: null,
        weight: null,
        bodyFat: null,
        sleeps: [],
        workouts: [],
        wake: null,
      });
    }
  }
  return res;
}

function parseIcsToCourseMap(icsText) {
  if (!icsText) return null;
  const map = {};
  const events = icsText.split("BEGIN:VEVENT").slice(1);
  events.forEach((evText) => {
    const summaryM = evText.match(/SUMMARY:(.*)/);
    const dtstartM = evText.match(/DTSTART.*?:(\d{8}T\d{6})/);
    const dtendM = evText.match(/DTEND.*?:(\d{8}T\d{6})/);
    const locM = evText.match(/LOCATION:(.*)/);
    if (!summaryM || !dtstartM || !dtendM) return;
    const name = summaryM[1].trim();
    const stStr = dtstartM[1];
    const etStr = dtendM[1];
    const loc = locM ? locM[1].trim() : "";
    
    const day = stStr.slice(0, 4) + "-" + stStr.slice(4, 6) + "-" + stStr.slice(6, 8);
    const sh = parseInt(stStr.slice(9, 11), 10) + parseInt(stStr.slice(11, 13), 10) / 60;
    const eh = parseInt(etStr.slice(9, 11), 10) + parseInt(etStr.slice(11, 13), 10) / 60;
    
    // 节假日跳过检查
    if (typeof isHoliday === "function" && isHoliday(day)) return;

    if (!map[day]) map[day] = [];
    const isDup = map[day].some((ex) =>
      ex.name === name && Math.abs(ex.from - sh) < 0.05 && Math.abs(ex.to - eh) < 0.05
    );
    if (!isDup) {
      map[day].push({
        name: name,
        shortName: name.replace(/[（\(].*|[\[【].*/g, "").slice(0, 2),
        from: sh,
        to: eh,
        loc: loc
      });
    }
  });
  return map;
}

/* ------------------ 位置聚类（足迹） ------------------ */
function distKm(aLat, aLon, bLat, bLon) {
  const R = 6371, k = Math.PI / 180;
  const dLat = (bLat - aLat) * k, dLon = (bLon - aLon) * k;
  const x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(aLat * k) * Math.cos(bLat * k) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
/* ------------------ 聚类与轨迹持久内存缓存 (0ms 瞬间直出) ------------------ */
const _clusterCache = new Map();
const _tracesCache = {};                 // day -> [trace, …]
const _weekTracesCache = new Map();       // "day1,day2,..." -> traces[][]
const _inFlightTraces = new Map();        // day -> Promise

function _makeClusterKey(traces, radiusKm) {
  if (!traces || !traces.length) return "";
  const len = traces.length;
  const p0 = traces[0];
  const pm = traces[Math.floor(len / 2)];
  const p1 = traces[len - 1];
  const k0 = p0 ? `${(p0.lat || 0).toFixed(4)},${(p0.lon || 0).toFixed(4)},${p0.t || p0.h || ""}` : "";
  const km = pm ? `${(pm.lat || 0).toFixed(4)},${(pm.lon || 0).toFixed(4)},${pm.t || pm.h || ""}` : "";
  const k1 = p1 ? `${(p1.lat || 0).toFixed(4)},${(p1.lon || 0).toFixed(4)},${p1.t || p1.h || ""}` : "";
  return `${len}:${radiusKm}:${k0}:${km}:${k1}`;
}

function clusterTraces(traces, radiusKm) {
  if (!traces || !traces.length) return [];
  const key = _makeClusterKey(traces, radiusKm);
  if (key && _clusterCache.has(key)) {
    return _clusterCache.get(key);
  }
  const cs = [];
  traces.forEach((p) => {
    let hit = null;
    for (const c of cs) { if (distKm(c.lat, c.lon, p.lat, p.lon) <= radiusKm) { hit = c; break; } }
    if (hit) {
      hit.lat = (hit.lat * hit.n + p.lat) / (hit.n + 1);
      hit.lon = (hit.lon * hit.n + p.lon) / (hit.n + 1);
      hit.n++; hit.pts.push(p);
    } else {
      cs.push({ lat: p.lat, lon: p.lon, n: 1, pts: [p] });
    }
  });
  const res = cs.sort((a, b) => b.n - a.n);
  if (key) {
    if (_clusterCache.size >= 100) {
      const firstKey = _clusterCache.keys().next().value;
      _clusterCache.delete(firstKey);
    }
    _clusterCache.set(key, res);
  }
  return res;
}

/* 当天轨迹的**唯一权威来源**：和日视图同源（日视图 traces 来自 getDay → _dayCache，
   那边有 90s SWR 后台重验）。周视图若自己另存一份，两条缓存必然各存一份、各自过期 ——
   用户看到的「同一天日/周不一致、周视图更新更迟」就是这么来的。
   _tracesCache 只当兜底（纯周视图、日视图尚未载入时）。 */
function todayTracesLive() {
  if (typeof _dayCache !== "undefined" && _dayCache && _dayCache.has(TODAY)) {
    const c = _dayCache.get(TODAY);
    if (c && c.data && Array.isArray(c.data.traces)) return c.data.traces;
  }
  return _tracesCache[TODAY];
}

/* 一周 7 天的位置轨迹（按天与按周双层内存缓存 + SWR 极速回显） */
async function weekTraces(days) {
  if (!Array.isArray(days) || !days.length) return [];
  const weekKey = days.join(",");
  const todayIdx = days.indexOf(TODAY);   // 本周是否含今天（-1 = 纯历史周）

  // 1. 检查周级持久内存缓存：历史日复用缓存，当天动态读取 _dayCache 最新实时轨迹。
  //    若历史日缓存存在异常空洞，不直接命中，回落至异步重验流程。
  if (_weekTracesCache.has(weekKey)) {
    const cached = _weekTracesCache.get(weekKey);
    const holeAt = cached.findIndex((t, i) =>
      i !== todayIdx && days[i] <= TODAY && (!Array.isArray(t) || t.length === 0));
    if (holeAt < 0) {
      if (todayIdx < 0) return cached;
      const live = todayTracesLive();
      if (!Array.isArray(live)) return cached;
      const out = cached.slice();
      out[todayIdx] = live;
      return out;
    }
    // 有空行，落入下方重新获取
  }

  // 2. 同步全命中检测：若 7 天全部存在于 _tracesCache 或 _dayCache，0ms 纯内存同步直出！
  let allHit = true;
  for (const day of days) {
    if (day > TODAY) {
      _tracesCache[day] = [];
    } else if (day === TODAY) {
      // 当天以 _dayCache 为准（日视图同源），拿到就同步过来 —— 别让两条缓存分叉
      const live = todayTracesLive();
      if (Array.isArray(live)) _tracesCache[day] = live;
      else allHit = false;
    } else if (_tracesCache[day] === undefined) {
      if (typeof _dayCache !== "undefined" && _dayCache.has(day)) {
        const c = _dayCache.get(day);
        // 仅在 _dayCache 存在非空 traces 时同步至周级缓存，避免缺省空数组污染
        if (c && c.data && Array.isArray(c.data.traces) && c.data.traces.length) {
          _tracesCache[day] = c.data.traces;
        } else {
          allHit = false;
        }
      } else {
        allHit = false;
      }
    }
  }

  if (allHit) {
    const res = days.map((day) => _tracesCache[day] || []);
    _weekTracesCache.set(weekKey, res);
    return res;
  }

  // 3. 异步并发获取缺失日期，当天数据支持 SWR 乐观直出
  await Promise.all(days.map(async (day) => {
    if (day > TODAY) { _tracesCache[day] = []; return; }
    if (_tracesCache[day] && day !== TODAY) return;
    // 如果当天已在 _tracesCache 中，先复用，后台静默刷新
    if (_tracesCache[day] && day === TODAY) {
      if (!_inFlightTraces.has(day)) {
        const p = apiGet(new URLSearchParams({ k: KEY, api: "day", d: day }))
          .then((j) => { if (j && Array.isArray(j.traces)) _tracesCache[day] = j.traces; })
          .catch(() => {})
          .finally(() => _inFlightTraces.delete(day));
        _inFlightTraces.set(day, p);
      }
      return;
    }
    // 未缓存日期：发起请求或复用现有 inFlight Promise
    if (_inFlightTraces.has(day)) {
      await _inFlightTraces.get(day);
      return;
    }
    const p = (async () => {
      try {
        const j = await apiGet(new URLSearchParams({ k: KEY, api: "day", d: day }));
        // 仅在后端明确返回数组时落入缓存，异常或未定义时保持未缓存状态
        if (j && Array.isArray(j.traces)) _tracesCache[day] = j.traces;
        else delete _tracesCache[day];
      } catch (e) {
        // 请求失败时清除缓存槽位，允许后续轮次重试
        delete _tracesCache[day];
      }
    })();
    _inFlightTraces.set(day, p);
    await p;
    _inFlightTraces.delete(day);
  }));

  const res = days.map((day) => (day === TODAY ? (todayTracesLive() || []) : (_tracesCache[day] || [])));
  _weekTracesCache.set(weekKey, res);
  return res;
}
function guessPlaceName(c) {
  const night = c.pts.filter((p) => p.h < 6 || p.h >= 23).length / c.n;
  const noon = c.pts.filter((p) => p.h >= 11 && p.h < 13).length / c.n;
  const dayT = c.pts.filter((p) => p.h >= 8 && p.h < 18).length / c.n;
  if (night > 0.3) return "宿舍";
  if (noon > 0.28) return "食堂";
  if (dayT > 0.55) return "教学楼 / 图书馆";
  return "其他地点";
}

      PLACE_MEM = j;

    }
  } catch (e) {
    if (!PLACE_MEM.named.length) {                 // 本次会话还没拿到过 → 读本机缓存
      try {
        const t = localStorage.getItem(PLACES_LS);
        if (t) {
          const j2 = JSON.parse(t);

            PLACE_MEM = j2;
          }
        }
      } catch (e2) { /* 缓存坏了就当没有 */ }
    }
  }
  return PLACE_MEM;
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;

  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to255 = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
  return `#${to255(f(0))}${to255(f(8))}${to255(f(4))}`;
}

/* ===== 地点配色入口：按地点坐标与首次出现时间稳定分配色槽，优先保留用户自定义颜色 ===== */
let _palSig = null, _palMap = null;
/* 排序键：按地点首次出现时间升序排序，无记录者置后，保证新地点仅在末尾追加色槽 */
function placeAgeKey(first, key) {
  const s = String(first || "");
  const m = s.match(/^(\d{2})-(\d{2})/);
  if (!m) return "\uffff" + key;
  let year = "";
  const cd = typeof curDay === "string" ? curDay : "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(cd)) {
    const curY = Number(cd.slice(0, 4)), curM = Number(cd.slice(5, 7));
    year = (Number(m[1]) > curM ? curY - 1 : curY) + "-";   // 月份比"现在"大 ⇒ 是去年
  }
  return year + m[1] + "-" + m[2] + s.slice(5);
}
function placePalette() {
  /* 参与配色的"地点全集" = 全部已命名 + 全部 n>=2 的未命名簇（排除与已命名重叠的）。
     颜色槽位严格按「首次出现时间 + 物理坐标」排序，排位与颜色保持恒定 */
  const named = PLACE_MEM.named || [];
  // 过滤掉与已命名重叠的未命名簇（<= 0.3km），防止同一地点被计入两次导致色槽错位
  const unk = (PLACE_MEM.unknown || []).filter((u) => u.n >= 2 && !named.some((m) => distKm(m.lat, m.lon, u.lat, u.lon) <= 0.3));
  const items = [];
  named.forEach((m) => {
    const k = placeKeyN(m.name);
    const cid = (isFinite(m.lat) && isFinite(m.lon)) ? placeKeyC(m.lat, m.lon) : k;
    items.push({ key: k, cid: cid, age: placeAgeKey(m.first, cid) });
  });
  unk.forEach((u) => {
    const cid = placeKeyC(u.lat, u.lon);
    items.push({ key: cid, cid: cid, age: placeAgeKey(u.first, cid) });
  });
  const custom = (RULES && RULES.placeColors) || {};
  const sig = items.map((x) => x.key + "|" + x.age + "|" + (custom[x.key] || custom[x.cid] || "")).join(";");
  if (sig === _palSig && _palMap) return _palMap;
  // 核心：次级排序使用恒定不变的物理坐标标识 cid，无论怎么改名，排位 pos 绝对不动
  items.sort((a, b) => (a.age < b.age ? -1 : a.age > b.age ? 1 : (a.cid < b.cid ? -1 : 1)));
  const taken = new Set();
  items.forEach((x) => {
    const c = custom[x.key] || (x.cid && custom[x.cid]);
    if (c) taken.add(c);
  });
  const map = {};
  items.forEach((x, pos) => {
    const userColor = custom[x.key] || (x.cid && custom[x.cid]);
    if (userColor) {
      map[x.key] = userColor;
      if (x.cid) map[x.cid] = userColor;
      return;
    }
    let color = null;
    for (let k = 0; k < PLACE_COLORS.length; k++) {
      if (!taken.has(PLACE_COLORS[k])) { color = PLACE_COLORS[k]; break; }
    }
    // 色板耗尽：基于黄金角动态生成互不相同的高辨识度颜色，杜绝撞色
    if (!color) {

        if (!taken.has(cand)) { color = cand; break; }

      if (!color) color = hslToHex(hue, 75, 68);
    }
    taken.add(color);
    map[x.key] = color;
    if (x.cid) map[x.cid] = color; // 双向映射：按名字或按坐标查都能拿到完全相同的颜色
  });
  _palSig = sig; _palMap = map;
  return map;
}

  //    处理方式和碎片一致：短的交给邻居（保持时间轴连续），
  //    但**长的直接留空档** —— 一段 20 分钟的"荣耀桌面"如果被并进旁边的微信，

  //    「微信 → 桌面(3秒) → 微信」这种情况，桌面会把两段微信隔开；
  //    先把它丢掉，两段微信才相邻，才能在下一步合并成一段。
  //    注意：碎片的时间不能凭空扔 —— 一天里几十个 1–3 分钟的脉冲，

      last.sec += s.sec;

    } else {
      out.push({ a: s.a, b: s.b, app: s.app, sec: s.sec });

    const tags = [];    // 左边那条竖栏里的项目名（见 .gv-tag）

    /* 睡眠段绘制：支持跨 0 点睡眠分割与日间多段小睡渲染 */
    /* _tlItems 条目注册与 LRU 淘汰机制（上限 240），防止跨视图渲染时发生内存泄漏或引用悬空 */
    const TL_ITEMS_MAX = 240;
    if (typeof window !== "undefined" && !window._tlItems) window._tlItems = new Map();
    const regItem = (payload) => {
      const id = "tli_" + Math.random().toString(36).slice(2, 9);
      if (typeof window !== "undefined" && window._tlItems) {
        const m = window._tlItems;
        m.set(id, payload);
        while (m.size > TL_ITEMS_MAX) {
          const oldest = m.keys().next();
          if (oldest.done) break;
          m.delete(oldest.value);
        }
      }
      return id;
    };

    if (layerOn("sleep")) {
      // 1. 唤醒日在本列 (colDay) 的睡眠段（包含晨起睡眠与日间小睡，过滤掉跨夜前夜部分）
      const SS = (x.sleeps && x.sleeps.length)
        ? x.sleeps
        : (x.sleepMin > 0 ? [{ from: x.sleepFrom, to: x.sleepTo, min: x.sleepMin, nap: false }] : []);
      SS.forEach((S) => {
        const isNap = !!S.nap;
        const lab = isNap ? "小睡" : "睡眠";
        const cls = isNap ? "sl nap" : "sl";
        const itemId = regItem({
          type: "sleep",
          day: colDay,
          isNap: isNap,
          from: S.from,
          to: S.to,
          min: S.min,
          raw: S,
          dayData: x,
        });
        sleepSpans(S.from, S.to, S.min).forEach((sg) => {
          // 跨夜边界切片：crossEve 属于前夜部分，由前一日深夜渲染
          if (sg.crossEve) return;
          const P = place(sg.a, sg.b);
          if (!P) return;
          under.push(`<span class="gv-blk ${cls}" data-key="${colDay}_sleep_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S.min)} · ${hm(S.from)}–${hm(S.to)}"></span>`);
          tags.push(`<span class="gv-tag ${cls}" data-key="${colDay}_tag_sleep_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S.min)} · ${hm(S.from)}–${hm(S.to)}"><span>${lab}</span></span>`);
        });
      });

      // 2. 本列 (colDay) 深夜入睡段（跨 0 点睡眠从当天 22:xx 睡到次日醒来，其前夜切片精确落入本列底部）
      const nextDayStr = getNextDayStr(colDay);
      const nextSleeps = getSleepsForDay(nextDayStr, days);
      nextSleeps.forEach((S_next) => {
        if (!S_next) return;
        const isNap = !!S_next.nap;
        const lab = isNap ? "小睡" : "睡眠";
        const cls = isNap ? "sl nap" : "sl";
        const itemId = regItem({
          type: "sleep",
          day: colDay,
          isNap: isNap,
          from: S_next.from,
          to: S_next.to,
          min: S_next.min,
          raw: S_next,
          dayData: x,
        });
        sleepSpans(S_next.from, S_next.to, S_next.min).forEach((sg) => {
          // 仅将跨夜前夜部分（crossEve，如 22:xx~24:00）作为本列深夜睡眠渲染
          if (!sg.crossEve) return;
          const P = place(sg.a, sg.b);
          if (!P) return;
          under.push(`<span class="gv-blk ${cls}" data-key="${colDay}_sleep_eve_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S_next.min)} · ${hm(S_next.from)}–${hm(S_next.to)}"></span>`);
          tags.push(`<span class="gv-tag ${cls}" data-key="${colDay}_tag_sleep_eve_${sg.a}_${sg.b}_${cls.replace(/\s+/g, '_')}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
            title="${lab} ${hhmm(S_next.min)} · ${hm(S_next.from)}–${hm(S_next.to)}"><span>${lab}</span></span>`);
        });
      });
    }
    // 运动（手环记的）：有 t0 才画
    if (layerOn("workout")) (x.workouts || []).forEach((w) => {
      const a = (w.h != null) ? Number(w.h) : tsHour(w.t0);
      if (a == null || isNaN(a)) return;
      const sec = Number(w.sec) || 0;
      const b = Math.min(24, a + sec / 3600);
      if (b <= a) return;
      const P = place(a, b);
      if (!P) return;
      const itemId = regItem({
        type: "workout",
        day: colDay,
        from: a,
        to: b,
        sec: sec,
        w: w,
        dayData: x,
      });
      under.push(`<span class="gv-blk wk" data-key="${colDay}_workout_${a}_${b}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="${esc(workLine(w))} · ${hm(a)}–${hm(b)}"></span>`);
      tags.push(`<span class="gv-tag wk" data-key="${colDay}_tag_workout_${a}_${b}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="${esc(workLine(w))} · ${hm(a)}–${hm(b)}"><span>${esc(workCN(w))}</span></span>`);
    });

    // 上课（课表日程）：与睡眠、运动同一层级，作为底色层渲染
    // 遇到法定节假日自动跳过（放假不上课）
    if (layerOn("course")) (getCoursesForDay(x.day) || []).forEach((c) => {
      const P = place(c.from, c.to);
      if (!P) return;
      const tag = c.shortName || "上课";
      const itemId = regItem({
        type: "course",
        day: colDay,
        course: c,
        dayData: x,
      });
      under.push(`<span class="gv-blk cs" data-key="${colDay}_course_${c.from}_${c.to}_${esc(c.name)}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="上课: ${esc(c.name)} · ${hm(c.from)}–${hm(c.to)} @ ${esc(c.loc)} (${esc(c.teacher || '')})"></span>`);
      tags.push(`<span class="gv-tag cs" data-key="${colDay}_tag_course_${c.from}_${c.to}_${esc(c.name)}" data-tid="${itemId}" style="top:${P.top};height:${P.h};cursor:pointer"
        title="上课: ${esc(c.name)} · ${hm(c.from)}–${hm(c.to)} @ ${esc(c.loc)} (${esc(c.teacher || '')})"><span>${esc(tag)}</span></span>`);
    });

    /* 返回值 = 这块**真的画出来了没有**（调用方用它决定要不要把这块算进
       "已画的块"参与后续覆盖判定 —— 见下面 drawn 那段）。
       `cvd` = 被覆盖深度（压着它的块数），>0 时右缘按 `min(深度×8px, 18%)` 缩进
       —— 用 margin-right 而不是改 right：宽屏手机块的 right 是 `calc(50%+1px)`，
       内联 right 会把左右分栏整个破坏；margin-right 对两种定位方式都安全。 */
    const pushApp = (s, ph, ov, cvd) => {
      const cat = catOf(s.app);
      if (!layerOn("app:" + cat)) return false;           // 图例里点掉了这个类别
      /* 绘制门槛与有效性判定 */
      if (!keep(s)) return false;
      const P = place(s.a, s.b);
      if (!P) return false;
      // 文本高度门槛判定：落地高度满足最小像素（默认 14px）时呈现应用名，避免文字溢出色块
      const pxH = parseFloat(P.h) / 100 * H;
      const showTxt = pxH >= (o.namePx || 14) - 0.5;   // 减 0.5 容掉百分比四舍五入的零头
      // 色块仅展示应用名称，起止时刻通过悬停 title 与点击详情弹层查看
      blk.push(`<span class="gv-blk ${ph ? "ph" : ""}${ov ? " ov" : ""}${RAW ? " rt" : ""}" data-key="${colDay}_app_${ph ? 'ph' : 'pc'}_${s.a}_${s.b}_${esc(s.app)}" style="top:${P.top};height:${P.h};background:${appColor(s.app)}${cvd ? `;margin-right:min(${cvd * 8}px, 18%)` : ""}"
        data-app="${esc(s.app)}" data-dev="${ph ? "手机" : "电脑"}"
        data-ta="${hm(s.a)}" data-tb="${hm(s.b)}" data-span="${esc(segSpan(s))}"
        title="${blkTitle(ph ? "手机" : "电脑", s)}"
        >${showTxt ? `<span>${esc(shortApp(s.app))}</span>` : ""}</span>`);
      return true;
    };
    // 覆盖判定：重叠超过 1 分钟（OV_EPS）视为有效重合
    const keep = (s) => true;
    const OV_EPS = 1 / 60;
    const ovl = (x, y) => Math.min(x.b, y.b) - Math.max(x.a, y.a) > OV_EPS;
    const pcL = refineSegs(seg.pc, 120).filter(keep);
    const phL = refineSegs(seg.phone, 180).filter(keep);
    /* 多设备色块平权排序：按开始时间升序排列，后开始的色块在上层；与已绘制色块重叠时添加 .ov 半透明高亮 */
    const drawList = pcL.map((s) => ({ s: s, ph: false }))
      .concat(phL.map((s) => ({ s: s, ph: true })))
      .sort((x, y) => x.s.a - y.s.a);
    const drawn = [];
    /* 连续覆盖深度缩进与分栏判定：窄屏跨设备阶梯缩进，宽屏分栏独立判定 */
    const survives = (s) => layerOn("app:" + catOf(s.app)) && keep(s) && !!place(s.a, s.b);
    const isNarrow = typeof window !== "undefined" && window.innerWidth <= 700;
    const sameLane = (a, b) => isNarrow || (a.ph === b.ph);
    const depth = drawList.map((it, i) =>
      drawList.slice(i + 1).filter((o) => survives(o.s) && sameLane(it, o) && ovl(it.s, o.s)).length);
    drawList.forEach((it, i) => {
      const ov = drawn.some((o) => sameLane(it, o) && ovl(it.s, o.s));   // 宽屏分栏下仅同设备才计覆盖，窄屏合并才跨设备计
      if (pushApp(it.s, it.ph, ov, depth[i])) drawn.push(it);
    });

    // tags 也要排好：同列里多个项目名若都挤在同一段，重叠就看不清。
    // 按 top 排一遍，短的在前（长条在后 = 长条被压住时还能看见短的那个开头）。
    tags.sort((p, q) => p.length - q.length);
    // 项目名栏跟着一起位移：底色 / app 色块都用 CSS 变量 --tagname 让出了左边，
    // 关掉名字栏时把它归零，整列立刻恢复满宽（周视图就靠这个）。
    const tn = showTags ? "" : " style=\"--tagname:0px\"";

    // 当前时间指示红线（仅在当前日期列渲染，遵循极简纯粹设计，无文字气泡）
    let nowIndicatorHTML = "";
    if (o.indicator !== false && isTodayCol) {
      const curH = Math.max(0, Math.min(24, getNowHourFloat()));
      const topPct = (curH / 24) * 100;
      const timeStr = getNowTimeStr();
      nowIndicatorHTML = `<div class="gv-now-line" style="top:${topPct.toFixed(3)}%" title="当前时间 ${timeStr}"><span class="gv-now-dot"></span></div>`;
    }

    const animCls = isEnteringWeek ? (idx === targetColIdx ? " gv-col-expand-day" : " gv-col-slide-exit") : "";
    return `<div class="gv-col ${isWk ? "wk" : ""} ${isTodayCol ? "today" : ""}${animCls}"${tn} data-day="${esc(colDay)}">${showTags ? tags.join("") : ""}${under.join("")}${blk.join("")}${nowIndicatorHTML}</div>`;
  }).join("");
  /* 时间刻度计算：步长按可用高度 H 自适应，排布舒适无重叠 */
  const wideTick = true;
  const step = H >= 1900 ? 1 : H >= 1150 ? 2 : H >= 760 ? 3 : H >= 520 ? 4 : H >= 340 ? 6 : 12;
  const floors = [0.5, 1, 2, 3, 4, 6];
  const minHalf = H >= 2000 ? 240 : H >= 1400 ? 300 : H >= 900 ? 450 : 900;
  const useHalf = floors.indexOf(step) >= 0 && H / step >= minHalf;
  const ticks = [];
  for (let h = 0; h <= 24; h += step) ticks.push(h);
  if (useHalf) for (let h = 0; h <= 24; h += step) {
    if (h + step / 2 < 24) ticks.push(h + step / 2);
  }
  if (ticks.indexOf(24) < 0) ticks.push(24);
  const hours = ticks.sort((a, b) => a - b).map((h) => {
    const half = !Number.isInteger(h);
    const label = String(Math.floor(h)).padStart(2, "0") + ":" + (half ? "30" : "00");
    return `<span class="${half ? "hf" : ""}" style="top:${(h / 24 * 100).toFixed(2)}%">${label}</span>`;
  }).join("");
  // 每一列下面再标一行「手机｜电脑」，说明左半边和右半边分别是谁
  const split = `<div class="gv-split" style="grid-template-columns:repeat(${N},1fr)">` +
    days.map((x, idx) => {
      const colDay = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
      const animCls = isEnteringWeek ? ` class="${idx === targetColIdx ? "split-expand-day" : "split-slide-exit"}"` : "";
      return `<span${animCls} data-day="${esc(colDay)}"><i>手机</i><i>电脑</i></span>`;
    }).join("") + "</div>";
  return `<div class="gv" style="--gvh:${H}px">
    <div></div>
    <div class="gv-head" style="grid-template-columns:repeat(${N},1fr)">${heads}</div>
    <div></div>
    ${split}
    <div class="gv-hours">${hours}</div>
    <div class="gv-grid" style="grid-template-columns:repeat(${N},1fr)">${cols}</div>
  </div>`;
}
/* 某一天的全部记录项（月视图 + 弹层共用）。时间点 = 开始时间
   与时间线保持一致的 15 分钟展示门槛，保证列表与图形呈现口径统一。 */
const DAY_MIN_SEC = 15 * 60;      // 与时间线 15 分钟门槛同源
function dayItems(day) {
  const d = series(30).find((x) => x.day === day) || MOCK_DAYS.find((x) => x.day === day);
  if (!d) return [];
  const seg = sessOf(day) || { pc: [], phone: [] };
  const out = [];
  if (d.sleepMin > 0)
    out.push({ t: "夜间", k: "睡眠", c: "#2c4bb0",
      m: `昨夜睡眠 ${hhmm(d.sleepMin)}${d.wake ? " · 睡到 " + hm(d.wake) : ""}` });
  // 小睡单独记录，判据使用 napMin
  const napList = (d.sleeps || []).filter((s) => s.nap);
  if ((d.napMin || 0) > 0)
    out.push({ t: "小睡", k: "小睡", c: "#4a6dc4",
      m: `小睡 ${hhmm(d.napMin)}${napList.length
        ? " · " + napList.map((s) => hm(s.from) + "–" + hm(s.to)).join("、") : ""}` });
  const keep = (s) => (s.b - s.a) * 3600 >= DAY_MIN_SEC;   // < 15 分钟不列（同时间线）
  refineSegs(seg.pc, 120).filter(keep).forEach((s) => out.push({ t: hm(s.a), k: shortApp(s.app), c: appColor(s.app),
    m: `电脑 · ${hm(s.a)}–${hm(s.b)}（${segSpan(s)}）` }));
  refineSegs(seg.phone, 180).filter(keep).forEach((s) => out.push({ t: hm(s.a), k: shortApp(s.app), c: appColor(s.app),
    m: `手机 · ${hm(s.a)}–${hm(s.b)}（${segSpan(s)}）` }));
  (d.workouts || []).forEach((w) => out.push({ t: "运动", k: workLabel(w), c: "#3dd68c",
    m: workLine(w) }));
  return out;
}
/* 某一天各类别总时长（秒），按时长降序排列，月视图使用。
   所有已知类别均展示（未使用的记为 0m），排除睡眠与兜底的其他分类。 */
function dayCatSecs(day) {
  const s = sessOf(day);
  if (!s) return [];
  const acc = {};
  let any = 0;          // 这天到底有没有"真记录"（非噪音、非其他）
  [].concat(s.pc || [], s.phone || []).forEach((x) => {
    if (!x || !x.app || isNoise(x.app)) return;
    const sec = Math.max(0, (x.sec != null) ? x.sec : (x.b - x.a) * 3600);
    const c = catOf(x.app);
    if (c === "睡眠" || c === "其他") return;
    acc[c] = (acc[c] || 0) + sec;
    any += sec;
  });
  // 当日无有效记录时返回空数组，由月视图展示空态分支
  if (!(any > 0) && !Object.keys(acc).length) return [];
  // 已知类别按时长降序排列，时长为 0 的按名称排序
  const names = allCats().filter((c) => c !== "其他" && c !== "睡眠");
  const rows = names.map((c) => [c, acc[c] || 0]);
  return rows.sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]));
}

/* 类别占比环形图数据统计：汇总多日各类别总时长，过滤噪音、排除睡眠/其他类别。 */
function pieCatSecs(dayList) {
  const acc = {};
  let total = 0;
  dayList.forEach((day) => {
    const s = sessOf(day);
    if (!s) return;
    [].concat(s.pc || [], s.phone || []).forEach((x) => {
      if (!x || !x.app || isNoise(x.app)) return;
      const sec = Math.max(0, (x.sec != null) ? x.sec : (x.b - x.a) * 3600);
      const c = catOf(x.app);
      if (c === "睡眠" || c === "其他") return;
      acc[c] = (acc[c] || 0) + sec;
      total += sec;
    });
  });
  const rows = Object.entries(acc).filter((p) => p[1] > 0).sort((a, b) => b[1] - a[1]);
  return { rows: rows, total: total };
}
/* 下钻：某类别下各 App 的时长。通过 showName 统一跨设备应用映射并解决重名冲突。 */
function pieAppSecs(dayList, cat) {
  const acc = {};       // key = 原始app + "\u0001" + dev
  dayList.forEach((day) => {
    const s = sessOf(day);
    if (!s) return;
    const walk = (arr, dev) => [].concat(arr || []).forEach((x) => {
      if (!x || !x.app || isNoise(x.app)) return;
      if (catOf(x.app) !== cat) return;
      const sec = Math.max(0, (x.sec != null) ? x.sec : (x.b - x.a) * 3600);
      if (sec > 0) {
        const k = x.app + "\u0001" + dev;
        acc[k] = (acc[k] || 0) + sec;
      }
    });
    walk(s.pc, "电脑");
    walk(s.phone, "手机");
  });
  // 冲突检测按显示名：同名出现在两台设备则增加后缀
  const byLabel = {};
  Object.keys(acc).forEach((k) => {
    const label = showName(k.split("\u0001")[0]);
    byLabel[label] = (byLabel[label] || 0) + 1;
  });
  return Object.entries(acc)
    .map(([k, sec]) => {
      const [app, dev] = k.split("\u0001");
      const label = showName(app);
      // raws 保留原始 app 和设备映射，供下钻详情查看与分类编辑
      const raws = [];
      Object.keys(acc).forEach((k2) => {
        const [a2, d2] = k2.split("\u0001");
        if (showName(a2) === label) raws.push({ app: a2, dev: d2 });
      });
      return [byLabel[label] > 1 ? label + "（" + dev + "）" : label, sec, raws];
    })
    .sort((a, b) => b[1] - a[1]);
}

/* 收集原始键（app+设备）在给定日期内的使用时段明细，返回按日期与时刻升序排列的时段列表。 */
function spansForRaws(days, raws) {
  const out = [];
  (days || []).forEach((d) => {
    const s = sessOf(d);
    if (!s) return;
    (raws || []).forEach(({ app, dev }) => {
      const k = dev === "电脑" ? "pc" : "phone";
      refineSegs(s[k] || [], k === "pc" ? 120 : 180).forEach((seg) => {
        if (seg.app !== app) return;
        const spanMin = Math.max(0, (seg.b - seg.a) * 60);
        out.push({ day: d, dev: dev, ta: hm(seg.a), tb: hm(seg.b),
          span: dur(Math.round((seg.sec != null ? seg.sec : spanMin * 60) / 60)) });
      });
    });
  });
  out.sort((x, y) => (x.day + x.ta).localeCompare(y.day + y.ta));
  return out;
}

/* 环形图卡片（含下钻条形图）。drill = 当前下钻的类别名或 null。 */
let pieDrill = null;

function pieCardHTML(dayList) {
  const { rows, total } = pieCatSecs(dayList);
  if (!(total > 0)) return "";
  const P2 = (n) => String(n).padStart(2, "0");
  const spanTxt = dayList.length > 1
    ? `最近 ${dayList.length} 天 · 共 ${dur(total / 60)}`
    : `共 ${dur(total / 60)}`;
  const R_OUT = 110, R_IN = 66;
  // 中弧半径（内嵌文字的行走线）：外 110 内 66，两行走 98 / 80
  const R1 = 98, R2 = 80;
  const CX = 120, CY = 120;
  const rad = (a) => (a - 90) * Math.PI / 180;          // 0° 指向 12 点
  const pt = (r, a) => [CX + r * Math.cos(rad(a)), CY + r * Math.sin(rad(a))];
  // 环带扇形 path（外弧顺时针 + 内弧逆时针）
  const slice = (a0, a1) => {
    const [x0, y0] = pt(R_OUT, a0), [x1, y1] = pt(R_OUT, a1);
    const [x2, y2] = pt(R_IN, a1), [x3, y3] = pt(R_IN, a0);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${R_OUT} ${R_OUT} 0 ${large} 1 `
         + `${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} `
         + `A${R_IN} ${R_IN} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
  };
  // 中弧 path（textPath 的行走线）：只走到扇形弧的 88%，留边防溢出
  const midArc = (a0, a1, r) => {
    const pad = (a1 - a0) * 0.06;
    const [x0, y0] = pt(r, a0 + pad), [x1, y1] = pt(r, a1 - pad);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 `
         + `${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  // 内嵌阈值按**弧长**算：中弧一周长 ≈ 2π×98 ≈ 616px，每字（中文）≈ 11px。
  // 名称行需要 名称字数×11 + "xx% · xxm" ≈ 55px，且两行都要放得下。
  const embedMin = (cat) => {
    const need = shortApp(cat).length * 11 + 58 + 20;   // +20 弧两端留边
    return need / (2 * Math.PI * R1) * 360;             // 换算成角度
  };
  const NO_MIN = 9;                                     // 序号也要 ~9° 才放得下
  let a = 0, idx = 0;
  const slices = [], legendRows = [], arcs = [], labels = [];
  rows.forEach(([cat, sec]) => {
    if (!layerOn("app:" + cat)) return;                 // 图例隐藏的类：不画，但分母含它
    const deg = sec / total * 360;
    const a0 = a, a1 = a + deg; a = a1;
    idx += 1;
    const color = catColor(cat);
    const pct = Math.round(sec / total * 100);
    const dimCls = pieDrill ? (pieDrill === cat ? "" : " pl-dim") : "";
    slices.push(`<g class="pl-seg${dimCls}" data-cat="${esc(cat)}">
      <path d="${slice(a0, a1)}" fill="${color}"
        stroke="rgba(0,0,0,.35)" stroke-width="1"></path></g>`);
    // 内嵌（两行 textPath）或序号（中点水平数字）或省略
    const mid = (a0 + a1) / 2;
    if (deg >= embedMin(cat)) {
      arcs.push(`<path id="pa${idx}" d="${midArc(a0, a1, R1)}" fill="none"></path>`
              + `<path id="pb${idx}" d="${midArc(a0, a1, R2)}" fill="none"></path>`);
      labels.push(`<text font-size="11.5" fill="rgba(255,255,255,.95)" font-weight="600"><textPath`
        + ` href="#pa${idx}" startOffset="50%" text-anchor="middle">${esc(shortApp(cat))}</textPath></text>`
        + `<text font-size="10" fill="rgba(255,255,255,.75)"><textPath`
        + ` href="#pb${idx}" startOffset="50%" text-anchor="middle">${pct}% · ${dur(sec / 60)}</textPath></text>`);
    } else if (deg >= NO_MIN) {
      const [tx, ty] = pt((R_IN + R_OUT) / 2, mid);
      labels.push(`<text x="${tx.toFixed(1)}" y="${(ty + 3.5).toFixed(1)}" text-anchor="middle"`
        + ` font-size="10.5" fill="rgba(255,255,255,.95)" font-weight="600">${idx}</text>`);
    }
    legendRows.push(`<div class="pl-row" data-cat="${esc(cat)}">
      <span class="no">${deg >= embedMin(cat) ? "" : (deg >= NO_MIN ? idx : "")}</span>
      <i style="background:${color}"></i><span class="nm">${esc(cat)}</span>
      <span class="pct">${pct}%</span><span class="tm">${dur(sec / 60)}</span></div>`);
  });
  // 下钻：Top 8 + 其他合并。条形宽度相对最大者（排名图比相对总数好读）。
  let drillHTML = "";
  if (pieDrill) {
    const apps = pieAppSecs(dayList, pieDrill);
    const top = apps.slice(0, 8);
    const rest = apps.slice(8);
    const restSec = rest.reduce((s, p) => s + p[1], 0);
    if (rest.length) top.push(["其他 " + rest.length + " 个应用", restSec]);
    const maxSec = top.length ? top[0][1] : 0;
    const catSec = apps.reduce((s, p) => s + p[1], 0);
    const bars = top.map(([name, sec, raws]) => {
      const w = Math.max(6, Math.round(sec / (maxSec || 1) * 100));
      // 下钻条形图应用名称，由 fixDrillNames 实测宽度决定布局；data-raw 携带原始键 JSON 数据
      return `<div class="pd-row" data-raw='${esc(JSON.stringify(raws || null))}' title="点看使用时段与设置"><div class="track"><div class="bar" style="width:${w}%"></div>
        <span class="pd-nm">${esc(shortApp(name))}</span></div>
        <span class="tm">${dur(sec / 60)}</span></div>`;
    }).join("");
    drillHTML = `<div class="pie-drill">
      <div class="pd-cap"><span>${esc(pieDrill)} · 合计 ${dur(catSec / 60)}</span></div>
      ${bars || `<div class="empty">这段没有「${esc(pieDrill)}」类别的应用记录。</div>`}
    </div>`;
  }
  const centerTxt = pieDrill
    ? `<g class="pie-center-btn" data-pieback="1">
         <rect x="${CX - 46}" y="${CY - 12}" width="92" height="24" rx="6"></rect>
         <text x="${CX}" y="${CY + 4}" text-anchor="middle">‹ 返回总览</text></g>`
    : `<text x="${CX}" y="${CY - 4}" text-anchor="middle" font-size="11"
         fill="var(--dim2)">手机 + 电脑</text>
       <text x="${CX}" y="${CY + 14}" text-anchor="middle" font-size="13"
         fill="var(--fg)" font-weight="600">${dur(total / 60)}</text>`;
  return `<div class="card" id="piecard">
    <div class="cap"><span><b>类别占比</b></span>
      <em>${esc(spanTxt)}</em></div>
    <div class="pie-wrap">
      <svg width="${CX * 2}" height="${CY * 2}" viewBox="0 0 ${CX * 2} ${CY * 2}" role="img"
        aria-label="类别时长占比">
        <defs>${arcs.join("")}</defs>
        ${slices.join("")}
        ${labels.join("")}
        ${centerTxt}
      </svg>
      ${pieDrill ? drillHTML : `<div class="pie-legend">${legendRows.join("")}</div>`}
    </div>
  </div>`;
}

/* =========================================================
   时间线 30 天月视图（v0.42.0 重构为横向堆叠条形图）：
   类似健康板块趋势图，但柱形图横向放置。
   ① 30 天垂直排布，每天一行；
   ② 左侧日期标签（宽约 85px）：展示如 "10/24 六"，区分工作日/周末，今日高亮；
   ③ 中间横向堆叠柱槽位（自适应宽度，带刻度参考背景）：
      - 柱宽按当天总时长与 30 天中最大总时长比例缩放（totalSec / maxSec * 100%）；
      - 同一天同一类的合并：调用 dayCatSecs(day) 累加；
      - 分类从左到右顺序严格固定为 FIXED_ORDER（跨天垂直对齐，杜绝乱跳）；
      - 各分类切片采用 catColor(cat)，带悬浮 Tooltip；
   ④ 右侧总时长标签（宽约 50px，右对齐）：等宽数字展示当天总时长（如 "7h39m"，无记录显示 "-"）；
   ⑤ 顶部图例栏：固定顺序展示分类名称与色点；
   ⑥ 点击任意一行触发 openDay(day) 打开当日详情。
   ========================================================= */
const TIMELINE_FIXED_CAT_ORDER = [
  "工作", "学习", "社交", "视频", "游戏", "阅读", "工具", "系统", "浏览器", "其他"
];

function monthView(rows) {
  if (!rows || !rows.length) return "";

  // 1. 预先计算每天各分类总时长，并找出 30 天中的最大单日总时长 maxSec
  const dayStats = rows.map((x) => {
    const dayStr = (typeof x === "object" && x) ? (x.day || x.d || x.date || "") : String(x || "");
    const cats = (typeof dayCatSecs === "function") ? dayCatSecs(dayStr) : [];
    
    // 合并同分类时长到 map 中
    const catMap = {};
    cats.forEach(([c, sec]) => {
      if (sec > 0) catMap[c] = (catMap[c] || 0) + sec;
    });

    const activePairs = Object.entries(catMap);
    const totalSec = activePairs.reduce((acc, [, s]) => acc + s, 0);

    return {
      dayStr,
      catMap,
      totalSec,
      rowObj: x
    };
  });

  // 最大总时长，若全都为 0 则兜底 8 小时 (28800 秒)
  const maxDaySec = Math.max(...dayStats.map((d) => d.totalSec), 0) || (8 * 3600);

  // 2. 统计这 30 天中出现过的分类，保持固定顺序展示在图例中
  const appearedCats = new Set();
  dayStats.forEach((d) => {
    Object.keys(d.catMap).forEach((c) => appearedCats.add(c));
  });

  const legendCats = TIMELINE_FIXED_CAT_ORDER.filter((c) => appearedCats.has(c));
  Array.from(appearedCats).forEach((c) => {
    if (!TIMELINE_FIXED_CAT_ORDER.includes(c)) legendCats.push(c);
  });
  const displayLegendCats = legendCats.length ? legendCats : TIMELINE_FIXED_CAT_ORDER.slice(0, 6);

  const legendHTML = `<div class="mv-hbar-legend">
    ${displayLegendCats.map((c) => {
      const color = (typeof catColor === "function") ? catColor(c) : "#38bdf8";
      return `<span class="mv-hbar-lg-item"><i style="background:${color}"></i><span>${esc(c)}</span></span>`;
    }).join("")}
  </div>`;

  // 3. 构建 30 天每天一行的横向条形图
  const WD_NAMES = ["日", "一", "二", "三", "四", "五", "六"];

  const rowsHTML = dayStats.map((d) => {
    const dayStr = d.dayStr;
    const dateObj = new Date(dayStr + "T00:00:00Z");
    const dow = dateObj.getUTCDay();
    const dowName = WD_NAMES[dow] || "";
    const isWk = (dow === 0 || dow === 6);
    const work = (typeof isWorkday === "function") ? isWorkday(dayStr) : !isWk;
    const isToday = (typeof isDayToday === "function" && isDayToday(dayStr)) || dayStr === TODAY;

    // 日期展示如 "10/24 六"
    const mmdd = dayStr.length >= 10 ? `${dayStr.slice(5, 7)}/${dayStr.slice(8, 10)}` : dayStr;
    const dateLabel = `${mmdd} ${dowName}`;

    // 当日堆叠条形：按 TIMELINE_FIXED_CAT_ORDER 严格从左到右排列
    const sortedCatsForDay = [];
    TIMELINE_FIXED_CAT_ORDER.forEach((c) => {
      if (d.catMap[c] > 0) {
        sortedCatsForDay.push([c, d.catMap[c]]);
      }
    });
    Object.keys(d.catMap).forEach((c) => {
      if (!TIMELINE_FIXED_CAT_ORDER.includes(c) && d.catMap[c] > 0) {
        sortedCatsForDay.push([c, d.catMap[c]]);
      }
    });

    // 条形的总宽度按该日总时长占 30 天中最大时长的百分比缩放
    const barWidthPct = d.totalSec > 0 ? Math.min(100, Math.max(1, (d.totalSec / maxDaySec) * 100)) : 0;

    // 各分类切片宽度占该条形总宽度的百分比
    let segsHTML = "";
    if (d.totalSec > 0) {
      segsHTML = sortedCatsForDay.map(([c, sec]) => {
        const segPct = (sec / d.totalSec) * 100;
        const color = (typeof catColor === "function") ? catColor(c) : "#38bdf8";
        const durText = (typeof dur === "function") ? dur(sec / 60) : `${Math.round(sec / 60)}m`;
        return `<span class="mv-hbar-seg" style="width:${segPct.toFixed(2)}%;background:${color};" title="${esc(c)} ${durText}"></span>`;
      }).join("");
    }

    let durText = "0h";
    if (d.totalSec > 0) {
      const m = Math.round(d.totalSec / 60);
      if (m > 0) {
        durText = (typeof dur === "function") ? dur(m) : `${Math.floor(m / 60)}h${m % 60 ? String(m % 60).padStart(2, "0") : ""}`;
      }
    }

    const tipDetail = sortedCatsForDay.length
      ? sortedCatsForDay.map(([c, s]) => `${c} ${(typeof dur === "function") ? dur(s / 60) : Math.round(s/60)+"m"}`).join(" · ")
      : "无活动记录";
    const rowTitle = `${esc(dayStr)} ${dowName}${d.totalSec > 0 ? " · 总计 " + durText : ""} (${tipDetail})`;

    return `<div class="mv-hbar-row ${isToday ? 'today' : (work ? 'workday' : 'weekend')}" data-day="${esc(dayStr)}" title="${rowTitle}" onclick="if(typeof openDay==='function')openDay('${esc(dayStr)}')">
      <div class="mv-hbar-meta">
        <span class="mv-hbar-date">${dateLabel}</span>
        <span class="mv-hbar-dur">${durText}</span>
      </div>
      <div class="mv-hbar-track">
        <div class="mv-hbar-bar" style="width: ${barWidthPct.toFixed(2)}%">
          ${segsHTML}
        </div>
      </div>
    </div>`;
  }).join("");

  return `<div class="mv-wrap"><div class="mv-hbar-chart">
    ${legendHTML}
    <div class="mv-hbar-axis mv-hbar-header">
      <div class="mv-hbar-header-spacer"></div>
      <div class="mv-hbar-ticks">
        <span>0h</span>
        <span>${(maxDaySec / 3600 * 0.25).toFixed(1).replace(/\.0$/, "")}h</span>
        <span>${(maxDaySec / 3600 * 0.5).toFixed(1).replace(/\.0$/, "")}h</span>
        <span>${(maxDaySec / 3600 * 0.75).toFixed(1).replace(/\.0$/, "")}h</span>
        <span>${(maxDaySec / 3600).toFixed(1).replace(/\.0$/, "")}h</span>
      </div>
    </div>
    <div class="mv-hbar-body">
      ${rowsHTML}
    </div>
  </div></div>`;
}
/* 常去地点：合并展示已命名地点与聚类未命名地点（n>=2），单次路过折叠展示。 */
let fpShowPass = false;        // 「另有 N 个路过地点」是否展开
/* 可见的 unknown 簇（n>=2 且未隐藏），按首次出现时间升序排序，编号固定在 __idx 属性上。 */
function fpUnknownList() {
  const unk = (PLACE_MEM.unknown || []).filter((u) => u.n >= 2 && !isPlaceHidden(u.lat, u.lon) && !isPlaceNamed(u.lat, u.lon));
  unk.sort((a, b) => String(a.first || "").localeCompare(String(b.first || "")));
  unk.forEach((u, i) => { u.__idx = i; });     // 唯一编号来源
  return unk;
}
/* 汇总当日在指定坐标 300m 内的采样点为时间段（默认间隔 >45 分钟分段），单采样点显示精确时刻。 */
function placeStaysToday(traces, lat, lon, gapMin) {
  gapMin = gapMin || 45;
  const pts = (traces || [])
    .filter((t) => distKm(lat, lon, t.lat, t.lon) <= 0.3 && isFinite(t.h))
    .slice()
    .sort((a, b) => a.h - b.h);
  const out = [];
  let cur = null;
  for (const p of pts) {
    if (cur && p.h * 60 - cur.endMin <= gapMin) { cur.endMin = p.h * 60; cur.n++; }
    else { if (cur) out.push(cur); cur = { startMin: p.h * 60, endMin: p.h * 60, n: 1 }; }
  }
  if (cur) out.push(cur);
  return out.map((s) => (s.n === 1
    ? hm(s.startMin / 60) + " 在"
    : hm(s.startMin / 60) + "–" + hm(s.endMin / 60)));
}
/* 提取 24 小时热力格子的颜色与地点信息：以每个小时内停留时间最长的采样点确定代表地点。 */
function hourCellsOf(traces, cl, clColor) {
  // 取 300m 范围内距离最近的聚类簇颜色
  const colorAt = (tr) => {
    let bi = -1, bd = null;
    for (let i = 0; i < cl.length; i++) {
      const d = distKm(cl[i].lat, cl[i].lon, tr.lat, tr.lon);
      if (d <= 0.3 && (bd === null || d < bd)) { bi = i; bd = d; }
    }
    return bi < 0 ? "#3a4453" : clColor[bi];
  };

  const placeNameAt = (tr) => {
    if (tr.lat != null && tr.lon != null) {
      const g = gAt(tr.lat, tr.lon);
      if (g && g.nm) return g.nm;
    }
    if (tr.name) return tr.name;
    let bi = -1, bd = null;
    for (let i = 0; i < cl.length; i++) {
      const d = distKm(cl[i].lat, cl[i].lon, tr.lat, tr.lon);
      if (d <= 0.3 && (bd === null || d < bd)) { bi = i; bd = d; }
    }
    if (bi >= 0 && cl[bi]) {
      const gc = gAt(cl[bi].lat, cl[bi].lon);
      if (gc && gc.nm) return gc.nm;
      if (cl[bi].name) return cl[bi].name;
      const guess = guessPlaceName(cl[bi]);
      if (guess) return guess;
    }
    return tr.guess || "其他地点";
  };

  return Array.from({ length: 24 }, (_, h) => {
    const idx = [];
    for (let i = 0; i < (traces || []).length; i++) {
      if (Math.floor(traces[i].h) === h) idx.push(i);
    }
    let lead = null, leadW = -1;
    const places = [];
    for (let k = 0; k < idx.length; k++) {
      const cur = traces[idx[k]];
      const nxt = traces[idx[k] + 1];
      const gap = nxt ? (nxt.h - cur.h) * 60 : 10;   // 分钟；末点兜底 10 分钟
      if (gap > leadW) { leadW = gap; lead = cur; }
      const nm = placeNameAt(cur);
      if (nm && !places.includes(nm)) places.push(nm);
    }
    const color = lead ? colorAt(lead) : "#1a2029";
    // 仅当该小时存在地点记录时生成悬浮提示
    const tipHtml = places.length > 0
      ? `<div class="fp-tip-places">${places.map((p) => `<div class="fp-tip-item">${esc(p)}</div>`).join("")}</div>`
      : "";
    return { color: color, places: places, tipHtml: tipHtml };
  });
}

/* 统计热力格子中出现过的非灰色地点颜色集合。 */
function colorsInCells(cells) {
  const s = new Set();
  (cells || []).forEach((c) => { if (c && c.color && c.color !== "#1a2029") s.add(c.color); });
  return s;
}

/* 计算给定日期所在周的周一日期（UTC 规范）。 */
function mondayOf(day) {
  const d = new Date(day + "T00:00:00Z");
  const back = (d.getUTCDay() + 6) % 7;          // 周一=0 … 周日=6
  return new Date(d.getTime() - back * 86400e3).toISOString().slice(0, 10);
}
function weekDaysOf(day) {
  const mon = new Date(mondayOf(day) + "T00:00:00Z");
  return Array.from({ length: 7 }, (_, i) =>
    new Date(mon.getTime() + i * 86400e3).toISOString().slice(0, 10));
}

/* 一周 7 天的位置轨迹（按天按周双层内存缓存 + SWR 极速回显，详见 04_footprint_core.js weekTraces） */

/* 根据经纬度匹配全局地点：300m 范围内按最近距离匹配已命名或未知聚类簇，若距离相同则已命名优先。 */
function gAt(lat, lon) {
  let best = null, bd = null, bi = 0, bestIsNamed = false;
  const named = PLACE_MEM.named || [];
  for (let i = 0; i < named.length; i++) {
    const d = distKm(lat, lon, named[i].lat, named[i].lon);
    if (d <= 0.3 && (bd === null || d < bd)) { best = named[i]; bd = d; bi = i; bestIsNamed = true; }
  }
  const unk = fpUnknownList();
  for (let i = 0; i < unk.length; i++) {
    const d = distKm(lat, lon, unk[i].lat, unk[i].lon);
    if (d <= 0.3 && (bd === null || d < bd)) { best = unk[i]; bd = d; bi = i; bestIsNamed = false; }
  }
  if (!best) return null;
  return bestIsNamed
    ? { k: placeKeyN(best.name), nm: best.name, i: bi }
    : {
        // 编号读取 fpUnknownList 固定的 __idx
        k: placeKeyC(best.lat, best.lon),
        nm: "未知位置 " + ((best.__idx === undefined ? bi : best.__idx) + 1),
        i: named.length + (best.__idx === undefined ? bi : best.__idx),
      };
}
/* 渲染单行地点（包含名称、时段、累计时长与操作按钮）。 */
function fpRow(o) {
  const sub = [];
  if (o.stays && o.stays.length) {
    sub.push(`今天 <b class="fp-hm">${o.stays.slice(0, 3).map(esc).join("、")}</b>`
      + (o.stays.length > 3 ? `<i> 等 ${o.stays.length} 段</i>` : ""));
  }
  if (o.cum !== null && o.cum !== undefined) sub.push("累计约 " + dur(o.cum));
  if (o.first) {
    const s = String(o.first);
    const m = s.match(/(\d{2}-\d{2})/);
    const dStr = m ? m[1] : (s.length >= 10 && s[4] === "-" ? s.slice(5, 10) : s.slice(0, 5));
    sub.push(dStr + " 起");
  }
  return `<div class="fp-pl ${o.dim ? "fp-dim" : ""}"><i style="background:${o.color}"></i>
    <div class="fp-mid">
      <div class="fp-t ${o.un ? "un" : ""}" ${o.un ? `style="cursor:pointer" data-la="${o.lat}" data-lo="${o.lon}" data-nm="${esc(o.nm)}" data-guess="${esc(o.guess || "")}" title="点击命名此地点"` : ""}>${esc(o.nm)}</div>

/* 路过地点聚合与去重：过滤瞬时无信息漂移点，按时间排序并对连续同名路过地点进行合并。 */
function aggregatePassedPlaces(passedList) {
  if (!passedList || !passedList.length) return [];

  // 1. 过滤极短且没有信息量的瞬时漂移点
  const filtered = passedList.filter((u) => {
    if (isPlaceHidden(u.lat, u.lon)) return true; // 用户主动标记忘掉的点予以保留
    const guess = (u.guess || "").trim();
    if (u.n <= 1 && (!guess || guess === "其他地点" || guess === "路过地点")) {
      return false; // 过滤无信息量漂移点
    }
    return true;
  });

  if (!filtered.length) return [];

  // 2. 按时间升序排序（保证连续路过的时序性）
  const sorted = filtered.slice().sort((a, b) => {
    return String(a.first || a.last || "").localeCompare(String(b.first || b.last || ""));
  });

  // 3. 连续相同地点合并聚类（Consecutive Merge / Debounce）
  const merged = [];
  for (const u of sorted) {
    const rawName = u.guess || "路过地点";
    const prev = merged[merged.length - 1];

    // 如果与上一项名称相同，或者距离极近 (<= 300m) 且名称一致：进行合并
    if (prev && prev.rawName === rawName) {
      prev.count = (prev.count || 1) + 1;
      prev.n = (prev.n || 1) + (u.n || 1);
      prev.cum = (prev.cum || 0) + (u.n || 1) * 15;
      if (u.last) prev.last = u.last;
      if (!prev.first && u.first) prev.first = u.first;
      prev.lat = (prev.lat + u.lat) / 2;
      prev.lon = (prev.lon + u.lon) / 2;
      continue;
    }

    merged.push({
      ...u,
      rawName: rawName,
      count: 1,
      cum: (u.n || 1) * 15,
    });
  }

  // 4. 格式化输出为最终渲染对象
  return merged.map((m) => {
    const nm = m.count > 1 ? `${m.rawName} × ${m.count}次` : m.rawName;
    return {
      nm: nm,
      lat: m.lat,
      lon: m.lon,
      un: true,
      dim: true,
      plain: true,
      stays: null,
      cum: m.cum,
      first: m.first,
      last: m.last,
      guess: "",
      count: m.count,
      key: placeKeyC(m.lat, m.lon),
      color: "#3a4453",
    };
  });
}

function myPlacesCard(traces, validKeys, validColors) {
  if (validKeys && !(validKeys instanceof Set) && typeof validKeys === "object" && validColors === undefined) {
    validColors = validKeys;
    validKeys = null;
  }
  const named = PLACE_MEM.named || [], unkAll = PLACE_MEM.unknown || [];
  const unk = fpUnknownList();
  // 优先按地点身份 Key 过滤，兜底按 validColors
  const keep = (key, color) => {
    if (validKeys && validKeys.size) return validKeys.has(key);
    if (validColors && validColors.size) return validColors.has(color);
    return true;
  };
  // 折叠区：只路过 1 次的 + 被忘掉的（展示出来是为了让你知道「忘掉」生效了）
  const passed = unkAll.filter((u) => u.n < 2 || isPlaceHidden(u.lat, u.lon));
  const mergedPassed = aggregatePassedPlaces(passed);
  if (!named.length && !unk.length && !mergedPassed.length) {
    return `<div class="card"><div class="cap"><span><b>常去地点</b></span></div>
      <div class="empty" style="font-size:11.5px;line-height:1.7">
        还没有地点记录。位置每 15 分钟采一次，攒够数据后这里会列出你去过的地方。</div></div>`;
  }
  // 取色统一通过 placeColor(key) 查询坐标调色板映射
  const namedRows = named.map((m, i) => ({

    cum: m.n > 0 ? m.n * 15 : null, first: m.first,
    guess: "", key: placeKeyN(m.name), color: placeColor(placeKeyN(m.name), i),
  })).filter((o) => keep(o.key, o.color)).map((o) => fpRow(o));

  const unkAllValid = unk.map((u) => {
    const cid = placeKeyC(u.lat, u.lon);
    return { u: u, cid: cid };
  }).filter((x) => {
    const g = gAt(x.u.lat, x.u.lon);
    return !!g && g.k === x.cid;
  });

  const unkRows = unkAllValid.filter((x) => {
    const col = placeColor(x.cid, named.length + x.u.__idx);
    if (validColors && validColors.size && !validColors.has(col)) return false;
    if (validKeys && validKeys.size && !validKeys.has(x.cid)) return false;
    if (!validColors && !validKeys && (!traces || !traces.length)) return false;
    if (traces && traces.length) {

      if (!stays || stays.length === 0) return false;
    }
    return keep(x.cid, col);

    const u = x.u;
    return fpRow({
      nm: "未知位置 " + (u.__idx + 1), lat: u.lat, lon: u.lon, un: true,
      stays: traces ? placeStaysToday(traces, u.lat, u.lon) : null,
      cum: u.n * 15, first: u.first, guess: u.guess,
      key: x.cid, color: placeColor(x.cid, named.length + u.__idx),
    });
  });

  const passRows = fpShowPass ? mergedPassed.map((o) => fpRow(o)).join("") : "";
  const hidden = (validKeys || validColors)
    ? (named.length + unk.length - namedRows.length - unkRows.length) : 0;

  return `<div class="card">
    <div class="cap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
      <span><b>常去地点</b></span>
      <em>${namedRows.length} 个已命名 · ${unkRows.length} 个待确认</em>
    </div>
    ${namedRows.length || unkRows.length ? `<div class="fp-places">${namedRows.join("")}${unkRows.join("")}</div>`
      : `<div class="empty" style="font-size:11.5px;line-height:1.7">
          上面这张图里没有已命名的地点（${hidden} 个地点这次没出现）。</div>`}

    ${passRows}
    ${mergedPassed.length ? `
      <button class="fp-pass" type="button" aria-expanded="${fpShowPass}">
        <svg class="fp-pass-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="transform:${fpShowPass ? 'rotate(180deg)' : 'none'}"><path d="M6 9.5l6 6 6-6z"/></svg>
        <span>${fpShowPass ? "收起" : "另有"} ${mergedPassed.length} 个路过地点</span>
      </button>` : ""}
  </div>`;
}

  const gridEl = gvEl ? gvEl.querySelector(".gv-grid") : document.querySelector(".gv-grid");

/* =========================================================
   双阶段视口焦点锚定算法 (Dual-Phase Viewport Anchor Locking)
   ========================================================= */

function captureViewportAnchor() {
  const scrollY = (typeof window !== "undefined")
    ? Math.max(0, window.scrollY || document.documentElement.scrollTop || 0)
    : 0;
  if (scrollY <= 20) {
    return { isAtTop: true };
  }

  const vH = (typeof window !== "undefined" && window.innerHeight) ? window.innerHeight : 800;
  const focusY = vH * 0.38;

  const candidates = (typeof document !== "undefined")
    ? Array.from(document.querySelectorAll("#view .card, #view > .sec, #view .sec, #catcard, #piecard, #view .gv-wrap, #view .gv"))
    : [];
  if (!candidates.length) {
    return { isAtTop: false, scrollY, offsetY: null };
  }

  let bestEl = null;
  let bestScore = -Infinity;

  for (const el of candidates) {
    if (typeof el.getBoundingClientRect !== "function") continue;
    const rect = el.getBoundingClientRect();
    if (rect.height < 15 || rect.width < 15) continue;

    const visibleTop = Math.max(0, rect.top);
    const visibleBottom = Math.min(vH, rect.bottom);
    const visibleHeight = Math.max(0, visibleBottom - visibleTop);
    if (visibleHeight <= 0) continue;

    let score = 0;
    const spansFocus = rect.top <= focusY && rect.bottom >= focusY;
    if (spansFocus) {
      score += 100000;
      // 叶子卡片 (.card) 相比外部大容器 (.sec) 具有更高的锚定精度
      if (el.classList && el.classList.contains("card")) score += 20000;
      const dist = Math.abs(rect.top - focusY);
      score -= dist;
    } else {
      score += visibleHeight * 10;
      const center = (rect.top + rect.bottom) / 2;
      score -= Math.abs(center - focusY);
    }

    if (score > bestScore) {
      bestScore = score;
      bestEl = el;
    }
  }

  if (!bestEl) {
    return { isAtTop: false, scrollY, offsetY: null };
  }

  const rect = bestEl.getBoundingClientRect();
  const info = {
    isAtTop: false,
    offsetY: rect.top,
    id: bestEl.id || null,
    capText: null,
    h2Text: null,
    className: bestEl.className || null,
    indexInParent: Array.from(bestEl.parentNode ? bestEl.parentNode.children : []).indexOf(bestEl),
    parentSelector: bestEl.parentElement ? (bestEl.parentElement.id ? "#" + bestEl.parentElement.id : (bestEl.parentElement.className ? "." + String(bestEl.parentElement.className).trim().split(" ")[0] : null)) : null
  };

function restoreViewportAnchor(anchor) {
  if (!anchor || typeof window === "undefined") return;

  const doRestore = () => {
    if (anchor.isAtTop) {
      window.scrollTo({ top: 0, behavior: "instant" });
      if (typeof _lastScrollY !== "undefined") {
        _lastScrollY = 0;
        _accumDown = 0;
        _accumUp = 0;
      }
      return;
    }

    let targetEl = null;
    // 1. 优先按唯一 ID 匹配 (#catcard, #piecard 等)
    if (anchor.id) {
      targetEl = document.getElementById(anchor.id);
    }

    // 2. 按卡片标题语义匹配（如 "饮食与能量"、"睡眠"、"核心指标概览"）
    if (!targetEl && anchor.capText) {
      const caps = document.querySelectorAll("#view .card .cap b, #view .cap span b");
      for (const b of caps) {
        if (b.textContent && b.textContent.trim() === anchor.capText) {
          targetEl = b.closest(".card") || b;
          break;
        }
      }
    }

    // 3. 按大板块 h2 标题语义匹配（如 "健康"、"AI 助手"、"生活规律与因果洞察"）
    if (!targetEl && anchor.h2Text) {
      const h2s = document.querySelectorAll("#view .sec-h h2, #view h2");
      for (const h of h2s) {
        if (h.textContent && h.textContent.trim() === anchor.h2Text) {
          targetEl = h.closest(".sec") || h.closest(".card") || h;
          break;
        }
      }
    }

    // 4. 兜底：按 DOM 结构相对位置匹配
    if (!targetEl && anchor.parentSelector && anchor.indexInParent >= 0) {
      const parent = document.querySelector(anchor.parentSelector);
      if (parent && parent.children[anchor.indexInParent]) {
        targetEl = parent.children[anchor.indexInParent];
      }
    }

    if (targetEl && typeof anchor.offsetY === "number" && typeof targetEl.getBoundingClientRect === "function") {
      const newRect = targetEl.getBoundingClientRect();
      const diff = newRect.top - anchor.offsetY;
      if (Math.abs(diff) > 1) {
        window.scrollBy({ top: diff, behavior: "instant" });
      }
      if (typeof _lastScrollY !== "undefined") {
        _lastScrollY = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
        _accumDown = 0;
        _accumUp = 0;
      }
    }
  };

  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(() => {
      doRestore();
      requestAnimationFrame(() => {
        doRestore();
      });
    });
  } else {
    doRestore();
  }
}

  if (isNaN(age) || age < 10) age = 18;
  
  // Mifflin-St Jeor 国际公认标准公式
  const w = Number(prof.weight) || 85;
